// ---------- Verificar órdenes (lista de órdenes de la herramienta de Tigo) ----------
// Se pega la lista tal como sale de la página de Tigo (columnas separadas por tab):
// N.° de orden · Tipo · Estado · Nombre · Cédula · Fecha de creación · Fecha de cierre.
// Los clientes se comparan POR NOMBRE contra los de la app.
const VERIF_ORDENES_KEY = "antichurn_verif_ordenes";
// Órdenes de estos tipos son clientes de Hogar (en minúsculas).
const ORDENES_TIPOS_VERIFICABLES = ["hogar"];
// Órdenes de estos tipos son Clientes Móvil (se comparan contra la lista de móviles).
const ORDENES_TIPOS_MOVIL = ["match digital", "convergente puro"];
// Estados que significan "ya ingresada en Tigo, todavía no instalada" (en minúsculas).
// "Propuesta enviada" a propósito NO está aquí: todavía no es una orden ingresada.
const ORDENES_ESTADOS_EN_PROCESO = ["procesando", "agendar visita"];

function leerVerifOrdenesGuardado() {
  const base = { modo: "precierre", texto: "", aplicado: null, descartados: [], seccion: null };
  try {
    const raw = localStorage.getItem(VERIF_ORDENES_KEY);
    if (!raw) return base;
    const g = JSON.parse(raw);
    return {
      modo: g.modo === "ordenes" ? "ordenes" : "precierre",
      texto: typeof g.texto === "string" ? g.texto : "",
      aplicado: typeof g.aplicado === "string" ? g.aplicado : null,
      descartados: Array.isArray(g.descartados) ? g.descartados : [],
      seccion: g.seccion === "movil" || g.seccion === "hogar" ? g.seccion : null,
    };
  } catch (e) {
    return base;
  }
}

// Minúsculas, sin tildes ni signos y sin espacios de más: "Nuñez  López" = "nunez lopez".
function normalizarNombreOrden(s) {
  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Tigo muestra las fechas como MM/DD/YYYY. La app las guarda como YYYY-MM-DD.
function fechaTigoAISO(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || "").trim());
  if (!m) return "";
  return m[3] + "-" + m[1].padStart(2, "0") + "-" + m[2].padStart(2, "0");
}

function distanciaTexto(a, b) {
  if (a === b) return 0;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

// Formato del celular: cada orden viene en varias líneas ("No. Orden: …", "Tipo: …",
// "Estado: …", "Cliente: …", "ID: …", "Creado: …", "Fin: …"). Se convierte a las mismas
// filas que el formato de la PC.
function leerOrdenesTigoCelular(texto) {
  const filas = [];
  let actual = null;
  const cerrar = () => {
    if (actual && actual.orden) filas.push(actual);
    actual = null;
  };
  String(texto || "").split(/\r?\n/).forEach((linea) => {
    const m = /^\s*([^:]+?)\s*:\s*(.*?)\s*$/.exec(linea);
    if (!m) return;
    const campo = m[1].toLowerCase().replace(/\./g, "").trim();
    const valor = m[2];
    if (campo === "no orden" || campo === "n orden" || campo === "orden") {
      cerrar();
      actual = { orden: valor.replace(/\D/g, ""), tipo: "", estado: "", nombre: "", cedula: "", creada: "", fin: "" };
      return;
    }
    if (!actual) return;
    if (campo === "tipo") actual.tipo = valor;
    else if (campo === "estado") actual.estado = valor;
    else if (campo === "cliente") actual.nombre = valor;
    else if (campo === "id") actual.cedula = valor;
    else if (campo === "creado") actual.creada = fechaTigoAISO(valor);
    else if (campo === "fin") actual.fin = fechaTigoAISO(valor);
  });
  cerrar();
  return { filas, ignoradas: 0 };
}

function leerOrdenesTigo(texto) {
  if (/no\.?\s*orden\s*:/i.test(String(texto || ""))) return leerOrdenesTigoCelular(texto);
  const filas = [];
  let ignoradas = 0;
  String(texto || "").split(/\r?\n/).forEach((linea) => {
    if (!linea.trim()) return;
    let cols = linea.split("\t").map((c) => c.trim());
    if (cols.length < 5) cols = linea.trim().split(/\s{2,}/).map((c) => c.trim());
    if (cols.length < 5 || !/^\d+$/.test(cols[0])) {
      ignoradas++;
      return;
    }
    filas.push({
      orden: cols[0],
      tipo: cols[1] || "",
      estado: cols[2] || "",
      nombre: cols[3] || "",
      cedula: cols[4] || "",
      creada: fechaTigoAISO(cols[5]),
      fin: fechaTigoAISO(cols[6]),
    });
  });
  return { filas, ignoradas };
}

function claseEstadoOrden(estado) {
  const e = normalizarNombreOrden(estado);
  if (e.includes("completad")) return "completada";
  if (ORDENES_ESTADOS_EN_PROCESO.includes(e)) return "proceso";
  return "otro";
}

// "Orden cancelada" (aparte de claseEstadoOrden a propósito: los móviles siguen como estaban).
function esOrdenCancelada(estado) {
  return normalizarNombreOrden(estado).includes("cancelad");
}

// Un cliente de la app con nombre casi igual (error de dedo) o que contiene todos los
// nombres/apellidos del otro. Solo sirve para avisar: nunca se une nada automáticamente.
function buscarClienteParecido(key, clientes) {
  const largos = (s) => s.split(" ").filter((t) => t.length > 2);
  const tk = largos(key);
  for (const c of clientes) {
    const ck = normalizarNombreOrden(c.nombre);
    if (!ck || ck === key) continue;
    if (key.length >= 10 && Math.abs(ck.length - key.length) <= 2 && distanciaTexto(ck, key) <= 2) return c;
    const tc = largos(ck);
    const corto = tk.length <= tc.length ? tk : tc;
    const largo = tk.length <= tc.length ? tc : tk;
    if (corto.length >= 2 && corto.every((t) => largo.includes(t))) return c;
  }
  return null;
}

function compararOrdenes(clientes, texto, descartados, convergencias) {
  const { filas, ignoradas } = leerOrdenesTigo(texto);
  const porNombre = new Map();
  clientes.forEach((c) => {
    const k = normalizarNombreOrden(c.nombre);
    if (k && !porNombre.has(k)) porNombre.set(k, c);
  });
  const moviles = convergencias || [];
  const porNombreMovil = new Map();
  moviles.forEach((c) => {
    const k = normalizarNombreOrden(c.nombre);
    if (k && !porNombreMovil.has(k)) porNombreMovil.set(k, c);
  });
  const r = {
    total: filas.length,
    ignoradas,
    repetidas: 0,
    faltan: [],
    procesoFaltan: [],
    fechaDistinta: [],
    pendientesInstalados: [],
    canceladas: [],
    alertas: [],
    posibles: [],
    bien: [],
    noVerificadas: [],
    movil: { faltan: [], proceso: [], fechaDistinta: [], alertas: [], posibles: [], bien: [] },
  };
  // Nombres de Hogar que tienen al menos una orden completada o en proceso: si además
  // tienen una cancelada, esa cancelada no se avisa (ya hay otra orden vigente).
  const hogarVigentes = new Set();
  filas.forEach((f) => {
    if (!ORDENES_TIPOS_VERIFICABLES.includes(normalizarNombreOrden(f.tipo))) return;
    if (claseEstadoOrden(f.estado) !== "otro") hogarVigentes.add(normalizarNombreOrden(f.nombre));
  });
  const vistos = new Set();
  filas.forEach((f) => {
    const tipoNorm = normalizarNombreOrden(f.tipo);
    const clase = claseEstadoOrden(f.estado);
    const key = normalizarNombreOrden(f.nombre);

    // Órdenes móviles (MATCH DIGITAL / CONVERGENTE PURO): se comparan contra Clientes Móvil.
    // "Completada" cuenta como completada (aunque Tigo la rechace después, no se puede saber).
    if (ORDENES_TIPOS_MOVIL.includes(tipoNorm)) {
      if (clase === "otro" || !key) {
        r.noVerificadas.push(f);
        return;
      }
      const claveM = "m|" + key + "|" + clase;
      if (vistos.has(claveM)) {
        r.repetidas++;
        return;
      }
      vistos.add(claveM);
      const m = porNombreMovil.get(key);
      if (!m) {
        const parecidoM = descartados.has("m:" + key) ? null : buscarClienteParecido(key, moviles);
        if (parecidoM) {
          r.movil.posibles.push({ fila: f, cliente: parecidoM, key: "m:" + key });
          return;
        }
        (clase === "completada" ? r.movil.faltan : r.movil.proceso).push(f);
        return;
      }
      if (clase === "completada") {
        if (f.fin && fechaActivacionMovil(m) !== f.fin) r.movil.fechaDistinta.push({ fila: f, cliente: m });
        else r.movil.bien.push({ fila: f, cliente: m });
      } else {
        r.movil.alertas.push({ fila: f, cliente: m });
      }
      return;
    }

    const tipoOk = ORDENES_TIPOS_VERIFICABLES.includes(tipoNorm);
    // Hogar cancelada en Tigo: solo se avisa si el cliente está en la app, no está ya
    // cancelado/penalizado allá, y ese nombre no tiene otra orden vigente en la lista.
    if (tipoOk && key && esOrdenCancelada(f.estado)) {
      const cc = porNombre.get(key);
      const claveC = key + "|cancelada";
      if (cc && !cc.cancelado && !cc.penalizado && !hogarVigentes.has(key)) {
        if (vistos.has(claveC)) {
          r.repetidas++;
        } else {
          vistos.add(claveC);
          r.canceladas.push({ fila: f, cliente: cc });
        }
      } else {
        r.noVerificadas.push(f);
      }
      return;
    }
    if (!tipoOk || clase === "otro" || !key) {
      r.noVerificadas.push(f);
      return;
    }
    const clave = key + "|" + clase;
    if (vistos.has(clave)) {
      r.repetidas++;
      return;
    }
    vistos.add(clave);
    const c = porNombre.get(key);
    if (!c) {
      const parecido = descartados.has(key) ? null : buscarClienteParecido(key, clientes);
      if (parecido) {
        r.posibles.push({ fila: f, cliente: parecido, key });
        return;
      }
      (clase === "completada" ? r.faltan : r.procesoFaltan).push(f);
      return;
    }
    if (clase === "completada") {
      if (!c.fechaInstalacion) r.pendientesInstalados.push({ fila: f, cliente: c });
      else if (f.fin && c.fechaInstalacion !== f.fin) r.fechaDistinta.push({ fila: f, cliente: c });
      else r.bien.push({ fila: f, cliente: c });
    } else {
      if (c.fechaInstalacion) r.alertas.push({ fila: f, cliente: c });
      else r.bien.push({ fila: f, cliente: c });
    }
  });
  return r;
}

function BotonCopiarOrden({ texto, label, vacio }) {
  const [ok, setOk] = useState(false);
  async function copiar(e) {
    e.stopPropagation();
    if (!texto) return;
    const res = await copiarTextoPrecierre(String(texto));
    if (res) {
      setOk(true);
      setTimeout(() => setOk(false), 1500);
    }
  }
  return (
    <button
      onClick={copiar}
      disabled={!texto}
      className="font-bold px-4 disabled:opacity-40"
      style={{ color: "#001E62", border: "1px solid #DFE5EF", background: "#FFFFFF", height: 44, borderRadius: 12, fontSize: 13 }}
    >
      {!texto ? vacio || "Sin dato" : ok ? "✓ Copiado" : label}
    </button>
  );
}

function confirmarCambioFechaOrden(cliente, nueva, esMovil) {
  const actual = esMovil ? fechaActivacionMovil(cliente) : cliente.fechaInstalacion;
  const antes = actual ? fmtFechaDia(actual) : "pendiente (sin fecha)";
  return window.confirm(
    "¿Cambiar la fecha de " + (esMovil ? "activación" : "instalación") + " de " + cliente.nombre + "?\n\nAntes: " + antes + "\nAhora: " + fmtFechaDia(nueva)

function FilaFechaDistinta({ fila, cliente, color, onCambiarFecha, movil }) {

  const [valor, setValor] = useState(fechaApp || "");
  function aplicar(nueva) {
    if (!nueva) return;
    if (confirmarCambioFechaOrden(cliente, nueva, movil)) onCambiarFecha(cliente.id, nueva);
  }
  const estiloBoton = { color: "#001E62", border: "1px solid #DFE5EF", background: "#FFFFFF", height: 44, borderRadius: 12, fontSize: 13 };

  return (
    <FilaOrden
      color={color}
      nombre={cliente.nombre}
      sub={"Tu app: " + fmtFechaDia(fechaApp) + " · Tigo: " + fmtFechaDia(fila.fin)}
    >
      {movil ? (
        <BotonCopiarOrden texto={fila.cedula} label="Copiar cédula" />

            className="font-bold px-4 text-white disabled:opacity-40"

          <button
            onClick={() => aplicar(fila.fin)}
            className="font-bold px-4 text-white"
            style={estiloPrimario}

            Usar la de Tigo

        </>
      )}

// Días que lleva una orden en proceso, según la fecha de creación que trae Tigo.
function textoDiasEnProceso(f) {
  if (!f.creada) return "";
  const d = Math.max(0, -daysFromToday(f.creada));
  if (d === 0) return "ingresada hoy";
  if (d === 1) return "1 día en proceso";
  return d + " días en proceso";
}

function VerificarOrdenes({ clientes, convergencias, verif, setVerif, onAgregar, onAbrirCliente, onAbrirMovil, onCambiarFecha, onAgregarMovil, onCambiarFechaMovil, onCorregirNombre }) {
  const [editando, setEditando] = useState(!verif.aplicado);
  const [grupo, setGrupo] = useState(null);
  const [verNoVerif, setVerNoVerif] = useState(false);
  const descartados = useMemo(() => new Set(verif.descartados || []), [verif.descartados]);
  const resultado = useMemo(
    () => (verif.aplicado ? compararOrdenes(clientes, verif.aplicado, descartados, convergencias || []) : null),
    [clientes, convergencias, verif.aplicado, descartados]
  );

  function verificar() {
    setVerif((v) => ({ ...v, aplicado: v.texto, descartados: v.descartados || [] }));
    setEditando(false);
    setGrupo(null);

  function limpiar() {
    setVerif((v) => ({ ...v, texto: "", aplicado: null, descartados: [], seccion: null }));
    setEditando(true);
    setGrupo(null);
  }
  function descartarParecido(key) {
    setVerif((v) => ({ ...v, descartados: [...(v.descartados || []), key] }));
  }
  function seleccionar(sec, key) {
    setVerif((v) => ({ ...v, seccion: sec }));
    setGrupo(key);
  }

  const estiloBoton = { color: "#001E62", border: "1px solid #DFE5EF", background: "#FFFFFF", height: 44, borderRadius: 12, fontSize: 13 };
  const estiloPrimarioOrden = { background: "#001E62", height: 44, borderRadius: 12, fontSize: 13 };
  const m = resultado ? resultado.movil : null;
  const cH = resultado
    ? {
        faltan: resultado.faltan.length,
        procesoFaltan: resultado.procesoFaltan.length,
        fechaDistinta: resultado.fechaDistinta.length,
        pendientesInstalados: resultado.pendientesInstalados.length,
        canceladas: resultado.canceladas.length,
        alertas: resultado.alertas.length,
        posibles: resultado.posibles.length,
        bien: resultado.bien.length,
      }
    : {};
  const cM = m
    ? {
        faltan: m.faltan.length,
        fechaDistinta: m.fechaDistinta.length,
        alertas: m.alertas.length,
        posibles: m.posibles.length,
        proceso: m.proceso.length,
        bien: m.bien.length,
      }
    : {};
  const pendH = resultado ? cH.faltan + cH.procesoFaltan + cH.fechaDistinta + cH.pendientesInstalados + cH.canceladas + cH.alertas + cH.posibles : 0;
  // En Móvil, "En proceso" es solo informativo y no cuenta como algo por resolver.
  const pendM = m ? cM.faltan + cM.fechaDistinta + cM.alertas + cM.posibles : 0;

  const seccionActiva = verif.seccion === "movil" || verif.seccion === "hogar" ? verif.seccion : pendH === 0 && pendM > 0 ? "movil" : "hogar";
  const esMovil = seccionActiva === "movil";

  const primero = ordenPrimero.find((k) => conteos[k] > 0) || "bien";
  const activo = grupo && grupos.some((x) => x.key === grupo) ? grupo : primero;
  const g = grupos.find((x) => x.key === activo);
  const estiloSeccion = (sel) => ({
    flex: 1,
    height: 44,
    border: 0,
    borderRadius: 11,

      </p>

          <div className="bg-white rounded-xl border p-4 flex flex-col gap-3 mb-3" style={{ borderColor: "#DFE5EF" }}>
            <textarea
              value={verif.texto}
              onChange={(e) => { const v = e.target.value; setVerif((s) => ({ ...s, texto: v })); }}
              rows={8}
              placeholder="Pega aquí las órdenes de Tigo…"

            {[["hogar", "🏠 Hogar", pendH], ["movil", "📱 Móvil", pendM]].map(([sec, titulo, pend]) => (
              <button

              >
                Marcar todos como instalados ({resultado.pendientesInstalados.filter((x) => x.fila.fin).length})
              </button>
            )}
            {!esMovil && activo === "pendientesInstalados" &&
              resultado.pendientesInstalados.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={fila.fin ? "Tigo lo instaló el " + fmtFechaDia(fila.fin) : "Tigo no trae fecha de cierre"}
                >
                  <BotonCopiarOrden texto={cliente.numeroSuscriptor} label="Copiar suscriptor" vacio="Sin suscriptor" />
                  <button
                    onClick={() => { if (confirmarCambioFechaOrden(cliente, fila.fin)) onCambiarFecha(cliente.id, fila.fin); }}
                    disabled={!fila.fin}
                    className="font-bold px-4 text-white disabled:opacity-40"
                    style={estiloPrimarioOrden}
                  >
                    Marcar como instalado
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "canceladas" &&
              resultado.canceladas.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Tigo: " + fila.estado + " · en tu app " + (cliente.fechaInstalacion ? "instalado el " + fmtFechaDia(cliente.fechaInstalacion) : "pendiente de instalación")}
                >
                  <BotonCopiarOrden texto={cliente.numeroSuscriptor} label="Copiar suscriptor" vacio="Sin suscriptor" />
                  <button onClick={() => onAbrirCliente(cliente)} className="font-bold px-4" style={estiloBoton}>
                    Abrir cliente
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "alertas" &&
              resultado.alertas.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Tigo: " + fila.estado + " · en tu app instalado el " + fmtFechaDia(cliente.fechaInstalacion)}
                >
                  <BotonCopiarOrden texto={cliente.numeroSuscriptor} label="Copiar suscriptor" vacio="Sin suscriptor" />
                  <button onClick={() => onAbrirCliente(cliente)} className="font-bold px-4" style={estiloBoton}>
                    Abrir cliente
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "posibles" &&
              resultado.posibles.map(({ fila, cliente, key }) => (
                <FilaOrden
                  key={fila.orden}
                  color={g.color}
                  nombre={fila.nombre}
                  sub={"Parecido en tu app: " + cliente.nombre + (cliente.fechaInstalacion ? " · instalado " + fmtFechaDia(cliente.fechaInstalacion) : " · pendiente")}
                >
                  <button onClick={() => onCorregirNombre && onCorregirNombre(cliente.id, fila.nombre, false)} className="font-bold px-4 text-white" style={estiloPrimarioOrden}>
                    ✅ Es el mismo
                  </button>
                  <button onClick={() => onAbrirCliente(cliente)} className="font-bold px-4" style={estiloBoton}>
                    Abrir cliente
                  </button>
                  <button onClick={() => descartarParecido(key)} className="font-bold px-4" style={estiloBoton}>
                    No es el mismo
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "bien" &&
              resultado.bien.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={cliente.fechaInstalacion ? "Instalado " + fmtFechaDia(cliente.fechaInstalacion) : "Pendiente · " + fila.estado}
                  onClickNombre={() => onAbrirCliente(cliente)}
                />
              ))}

            {/* ---------- MÓVIL ---------- */}
            {esMovil && activo === "faltan" &&
              m.faltan.map((f) => (
                <FilaOrden
                  key={f.orden}
                  color={g.color}
                  nombre={f.nombre}
                  sub={f.tipo + " · cédula " + f.cedula + (f.fin ? " · completada " + fmtFechaDia(f.fin) : "")}
                >
                  <BotonCopiarOrden texto={f.cedula} label="Copiar cédula" />
                  <button
                    onClick={() => onAgregarMovil(f.nombre, f.fin)}
                    className="font-bold px-4 text-white"
                    style={estiloPrimarioOrden}
                  >
                    + Agregar
                  </button>
                </FilaOrden>
              ))}

            {esMovil && activo === "fechaDistinta" &&
              m.fechaDistinta.map(({ fila, cliente }) => (
                <FilaFechaDistinta key={cliente.id + fila.orden} fila={fila} cliente={cliente} color={g.color} onCambiarFecha={onCambiarFechaMovil} movil />
              ))}

            {esMovil && activo === "alertas" &&
              m.alertas.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Tigo: " + fila.estado + " · en tu app activada el " + fmtFechaDia(fechaActivacionMovil(cliente))}
                >
                  <BotonCopiarOrden texto={fila.cedula} label="Copiar cédula" />
                </FilaOrden>
              ))}

            {esMovil && activo === "posibles" &&
              m.posibles.map(({ fila, cliente, key }) => (
                <FilaOrden
                  key={fila.orden}
                  color={g.color}
                  nombre={fila.nombre}
                  sub={"Parecido en tus Clientes Móvil: " + cliente.nombre + " · activada " + fmtFechaDia(fechaActivacionMovil(cliente))}
                >
                  <button onClick={() => onCorregirNombre && onCorregirNombre(cliente.id, fila.nombre, true)} className="font-bold px-4 text-white" style={estiloPrimarioOrden}>
                    ✅ Es el mismo
                  </button>
                  <button onClick={() => onAbrirMovil && onAbrirMovil(cliente.id)} className="font-bold px-4" style={estiloBoton}>
                    Abrir cliente
                  </button>
                  <button onClick={() => descartarParecido(key)} className="font-bold px-4" style={estiloBoton}>
                    No es el mismo
                  </button>
                </FilaOrden>
              ))}

            {esMovil && activo === "proceso" &&
              [...m.proceso]
                .sort((a, b) => (a.creada || "9999").localeCompare(b.creada || "9999"))
                .map((f) => (
                  <FilaOrden
                    key={f.orden}
                    color={g.color}
                    nombre={f.nombre}
                    sub={[f.tipo, f.estado, textoDiasEnProceso(f)].filter(Boolean).join(" · ") + " · cédula " + f.cedula}
                  >
                    <BotonCopiarOrden texto={f.cedula} label="Copiar cédula" />
                  </FilaOrden>
                ))}

            {esMovil && activo === "bien" &&
              m.bien.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Activada " + fmtFechaDia(fechaActivacionMovil(cliente))}
                  onClickNombre={() => onAbrirMovil && onAbrirMovil(cliente.id)}
                />
              ))}
          </div>
        </div>
      )}
    </div>
  );
}

function FormularioCliente({ form, setForm, onSubmit, editing, editingId, onCancel, clientes = [], onAbrirExistente }) {
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const inputClass = "w-full px-3 py-2 rounded-md border text-sm outline-none focus:ring-2";
  const inputStyle = { borderColor: "#DFE5EF" };
  const lockedStyle = { borderColor: "#DFE5EF", background: "#F3F4F6", color: "#5A6680", cursor: "not-allowed" };
  const [diasProrrateo, setDiasProrrateo] = useState(null);
  const [infoAbierta, setInfoAbierta] = useState(false);

  // Aviso en vivo (mientras escribes) si ese N° de suscriptor ya pertenece a otro
  // cliente — antes esto solo se avisaba al final, al tocar Guardar.
  const suscriptorDuplicado = useMemo(() => {
    const num = (form.numeroSuscriptor || "").trim();
    if (!num) return null;
    return clientes.find((c) => c.id !== editingId && (c.numeroSuscriptor || "").trim() === num) || null;
  }, [clientes, editingId, form.numeroSuscriptor]);

  const telefonoDuplicado = useMemo(() => {
    const t = (form.telefono || "").replace(/\D/g, "");
    if (t.length < 6) return null;
    return clientes.find((c) => c.id !== editingId && (c.telefono || "").replace(/\D/g, "") === t) || null;
  }, [clientes, editingId, form.telefono]);

  // Montos mensuales más usados para el plan que se está seleccionando ahora mismo.
  // Primero intenta con match exacto (tipo + velocidad + TV), y si no hay suficientes
  // datos, va ampliando el filtro (tipo + velocidad, y luego solo tipo de plan).
  const montosSugeridos = useMemo(() => {
    if (!form.planTipo) return [];
    const contar = (lista) => {
      const conteo = new Map();
      lista.forEach((c) => {
        const m = Number(c.montoMensual);
        if (!m) return;
        conteo.set(m, (conteo.get(m) || 0) + 1);
      });
      return [...conteo.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([monto]) => monto);
    };

    const porTipo = clientes.filter((c) => c.planTipo === form.planTipo);
    if (form.velocidad) {
      const porVelocidad = porTipo.filter((c) => c.velocidad === form.velocidad);
      const base =
        form.planTipo === "DOBLE" && form.planTV
          ? porVelocidad.filter((c) => c.planTV === form.planTV)
          : porVelocidad;
      if (base.length >= 2) return contar(base);
      if (porVelocidad.length > 0) return contar(porVelocidad);
    }
    return contar(porTipo);
  }, [clientes, form.planTipo, form.velocidad, form.planTV]);

  function calcularAuto() {
    const r = calcularPrimeraFactura(form.fechaInstalacion, parseInt(form.cicloFacturacion, 10), form.montoMensual);
    if (!r) return;
    const totalPrimeraFactura = +((Number(form.montoMensual) || 0) + (Number(r.monto1raFactura) || 0)).toFixed(2);
    setForm((f) => ({ ...f, fecha1raFactura: r.fecha1raFactura, monto1raFactura: totalPrimeraFactura }));
    setDiasProrrateo(r.dias);
  }

  useEffect(() => {
    if (!form.fechaInstalacion || !form.cicloFacturacion || form.montoMensual === "" || form.montoMensual == null) return;
    calcularAuto();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form.fechaInstalacion, form.cicloFacturacion, form.montoMensual]);

  return (
    <div className="max-w-2xl">
      <div className="flex items-center gap-2 mb-1">
        <h1 className="text-2xl font-semibold">{editing ? "Editar cliente" : "Nuevo cliente"}</h1>
        <button
          type="button"
          onClick={() => setInfoAbierta((v) => !v)}
          className="rounded-full text-xs font-bold flex items-center justify-center"
          style={ { width: 26, height: 26, background: "#E3EDFA", color: "#0072CE" } }
          aria-label="Información"
        >
          i
        </button>
      </div>
      {infoAbierta && (
        <p className="text-sm mb-4 rounded-lg p-3" style={ { color: "#001E62", background: "#EAF0FB" } }>
          Se hace seguimiento a las primeras 4 facturas. Las fechas de la 2da, 3ra y 4ta se calculan con el día del Ciclo de Facturación. Todos los campos son obligatorios.
        </p>
      )}
      <form onSubmit={onSubmit} className="flex flex-col gap-3 pb-24">
        {!editing && (
          <PegarOrdenTigo
            clientes={clientes}
            onAbrirExistente={onAbrirExistente}
            etiqueta="Pegar texto de Tigo para llenar la ficha"
            onAplicar={(d) =>
              setForm((f) => ({
                ...f,
                nombre: f.nombre || d.nombre,
                numeroSuscriptor: f.numeroSuscriptor || d.suscriptor,
                fechaInstalacion: "",
                instalacionProgramada: d.fecha,
                franjaInstalacion: d.franja || "",
                tecnologia: d.tecnologia || f.tecnologia || "",
                observaciones: aplicarBloqueObservaciones(f.observaciones, bloqueObservacionTigo(d)),
              }))
            }
          />
        )}
        <SeccionFormulario titulo="Datos del cliente">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Número de suscriptor *">
              <input required value={form.numeroSuscriptor} onChange={set("numeroSuscriptor")} className={inputClass} style={ { ...inputStyle, ...(suscriptorDuplicado ? { borderColor: "#B45309" } : {}) } } />
              {suscriptorDuplicado && (
                <p className="text-xs mt-1" style={ { color: "#B45309" } }>
                  ⚠️ Ese número ya pertenece a {suscriptorDuplicado.nombre}
                </p>
              )}
            </Field>
            <Field label="Teléfono *">
              <input required value={form.telefono} onChange={set("telefono")} className={inputClass} style={ { ...inputStyle, ...(telefonoDuplicado ? { borderColor: "#B45309" } : {}) } } />
              {telefonoDuplicado && (
                <p className="text-xs mt-1" style={ { color: "#B45309" } }>
                  ⚠️ Ese teléfono ya pertenece a {telefonoDuplicado.nombre}
                </p>
              )}
            </Field>
            <div className="col-span-2">
              <Field label="Nombre y apellido *">
                <input required value={form.nombre} onChange={set("nombre")} className={inputClass} style={inputStyle} />
              </Field>
            </div>
            <div
              className="col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 rounded-md"
              style={ (form.estadoCliente === "cancelado" || form.estadoCliente === "penalizado") ? { background: "#F3F6FB", padding: "12px" } : {} }
            >
              <Field label="Estado del cliente">
                <select value={form.estadoCliente || "activo"} onChange={set("estadoCliente")} className={inputClass} style={inputStyle}>
                  {ESTADOS_CLIENTE.map((e) => <option key={e.value} value={e.value}>{e.label}</option>)}
                </select>
              </Field>
              {form.estadoCliente === "cancelado" && (
                <>
                  <Field label="Fecha de cancelación">
                    <input type="date" value={form.fechaCancelacion || ""} onChange={set("fechaCancelacion")} className={inputClass} style={inputStyle} />
                  </Field>
                  <Field label="Motivo de cancelación">
                    <select value={form.motivoCancelacion || "voluntaria"} onChange={set("motivoCancelacion")} className={inputClass} style={inputStyle}>
                      <option value="voluntaria">Cancelación voluntaria</option>
                      <option value="falta_pago">Falta de pago</option>
                    </select>
                  </Field>
                </>
              )}
              {form.estadoCliente === "penalizado" && (
                <Field label="Motivo de la penalización (opcional)">
                  <input type="text" value={form.motivoPenalizacion || ""} onChange={set("motivoPenalizacion")} className={inputClass} style={inputStyle} />
                </Field>
              )}
              {(form.estadoCliente === "cancelado" || form.estadoCliente === "penalizado") && (
                <p className="text-xs sm:col-span-2" style={ { color: "#5A6680" } }>
                  {form.estadoCliente === "penalizado"
                    ? "Este cliente no cuenta para meta, comisión ni mensajes."
                    : "Si no pagó su 1ra factura, no cuenta para meta ni comisión. Se detienen sus mensajes."}
                </p>
              )}
            </div>
          </div>
        </SeccionFormulario>

        <SeccionFormulario titulo="Plan y facturación">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Ciclo de facturación *">
              <select required value={form.cicloFacturacion} onChange={set("cicloFacturacion")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {CICLOS.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
              </select>
            </Field>
            <Field label="Tipo de plan *">
              <select
                required
                value={form.planTipo}
                onChange={(e) => setForm((f) => ({ ...f, planTipo: e.target.value, planTV: e.target.value === "SINGLE" ? "" : f.planTV }))}
                className={inputClass}
                style={inputStyle}
              >
                <option value="">Seleccionar…</option>
                {TIPOS_PLAN.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
            <div className="col-span-2">
              <Field label="Fecha de instalación">
                <input
                  type="date"
                  value={form.fechaInstalacion || form.instalacionProgramada || ""}
                  onChange={(e) => {
                    const v = e.target.value;
                    const campoFecha = e.target;
                    // Cierra el calendario del celular apenas se elige el día.
                    if (v) setTimeout(() => { try { campoFecha.blur(); } catch (err) {} }, 0);
                    const hoyF = fechaLocalISO(new Date());
                    // Fecha futura = instalación programada (sigue pendiente). Hoy o antes = ya instalado.
                    if (v && v > hoyF) setForm((f) => ({ ...f, fechaInstalacion: "", instalacionProgramada: v }));
                    else setForm((f) => ({ ...f, fechaInstalacion: v, instalacionProgramada: "", franjaInstalacion: "" }));
                  } }
                  className={inputClass}
                  style={inputStyle}
                />
                {!form.fechaInstalacion && form.instalacionProgramada && (
                  <div className="mt-2">
                    <div className="flex gap-2">
                      {FRANJAS_INSTALACION.map((fr) => {
                        const sel = form.franjaInstalacion === fr;
                        return (
                          <button
                            key={fr}
                            type="button"
                            onClick={() => setForm((f) => ({ ...f, franjaInstalacion: f.franjaInstalacion === fr ? "" : fr }))}
                            className="flex-1 text-sm font-medium px-2 py-2.5 rounded-md"
                            style={ sel ? { background: "#001E62", color: "#fff", border: "1px solid #001E62" } : { background: "#fff", color: "#001E62", border: "1px solid #C9D3E6" } }
                          >
                            {sel ? "✓ " : ""}{franjaCorta(fr)}
                          </button>
                        );
                      })}
                    </div>
                    <p className="text-xs mt-1.5" style={ { color: "#001E62" } }>
                      📅 Se guardará como instalación programada: <strong>{fmtFechaDia(form.instalacionProgramada)}</strong>{form.franjaInstalacion ? " · " + franjaCorta(form.franjaInstalacion) : ""}. Sigue pendiente de instalación hasta que lo confirmes.
                    </p>
                  </div>
                )}
                {!form.fechaInstalacion && !form.instalacionProgramada && (
                  <p className="text-xs mt-1.5" style={ { color: "#5A6680" } }>Todavía sin fecha · Pendiente de instalación</p>
                )}
                {(form.fechaInstalacion || form.instalacionProgramada) && (
                  <button
                    type="button"
                    className="text-xs mt-1.5 underline"
                    style={ { color: "#5A6680" } }
                    onClick={() => setForm((f) => ({ ...f, fechaInstalacion: "", instalacionProgramada: "", franjaInstalacion: "" }))}
                  >
                    Quitar fecha
                  </button>
                )}
              </Field>
            </div>
            <Field label="Velocidad *">
              <select required value={form.velocidad} onChange={set("velocidad")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {VELOCIDADES.map((v) => <option key={v} value={v}>{v}</option>)}
              </select>
            </Field>
            <Field label="Tecnología">
              <select value={form.tecnologia || ""} onChange={set("tecnologia")} className={inputClass} style={inputStyle}>
                <option value="">Sin definir</option>
                <option value="FTTH">FTTH (fibra)</option>
                <option value="HFC">HFC (coaxial)</option>
              </select>
            </Field>
            <Field label="Monto mensual recurrente *">
              <input required type="number" step="0.01" value={form.montoMensual} onChange={set("montoMensual")} className={inputClass} style={inputStyle} />
            </Field>
            {montosSugeridos.length > 0 && (
              <div className="col-span-2 flex flex-wrap items-center gap-1.5">
                <span className="text-xs" style={ { color: "#5A6680" } }>Sugeridos:</span>
                {montosSugeridos.map((m) => (
                  <button
                    key={m}
                    type="button"
                    onClick={() => setForm((f) => ({ ...f, montoMensual: String(m) }))}
                    className="text-xs font-medium px-3 py-1 rounded-full border"
                    style={
                      Number(form.montoMensual) === m
                        ? { background: "#001E62", color: "#fff", borderColor: "#001E62" }
                        : { background: "#F3F6FB", color: "#374151", borderColor: "#DFE5EF" }
                    }
                  >
                    {fmtMonto(m)}
                  </button>
                ))}
              </div>
            )}
            {form.planTipo === "DOBLE" && (
              <div className="col-span-2">
                <Field label="Plan de TV *">
                  <select required value={form.planTV} onChange={set("planTV")} className={inputClass} style={inputStyle}>
                    <option value="">Seleccionar…</option>
                    {TIPOS_TV.map((t) => <option key={t} value={t}>{t}</option>)}
                  </select>
                </Field>
              </div>
            )}
          </div>

          <div className="rounded-lg p-3 mt-4" style={ { background: "#EAF0FB" } }>
            <div className="flex items-start justify-between gap-2">
              <div>
                <div className="text-xs font-semibold" style={ { color: "#001E62" } }>
                  Fecha y monto de la 1ra factura (recurrente + prorrateo)
                </div>
                <div className="text-xs mt-0.5" style={ { color: "#5A6680" } }>
                  {diasProrrateo != null
                    ? `Calculado automáticamente: ${diasProrrateo} día${diasProrrateo !== 1 ? "s" : ""} de prorrateo`
                    : "Se calcula solo al completar fecha de instalación + ciclo + monto mensual"}
                </div>
              </div>
              <button
                type="button"
                onClick={calcularAuto}
                disabled={!form.fechaInstalacion || !form.cicloFacturacion || !form.montoMensual}
                className="text-base rounded-md text-white disabled:opacity-40 shrink-0"
                style={ { background: "#001E62", width: 40, height: 40 } }
                title="Recalcular por si editaste algo manualmente"
                aria-label="Recalcular"
              >
                🔄
              </button>
            </div>
            {diasProrrateo != null && Number(form.montoMensual) > 0 && Number(form.monto1raFactura) > 0 && (
              <div className="text-sm font-semibold mt-2" style={ { color: "#001E62" } }>
                Prorrateo ({diasProrrateo} día{diasProrrateo !== 1 ? "s" : ""}) {fmtMonto(Math.max(0, Number(form.monto1raFactura) - Number(form.montoMensual)))} + Mensualidad {fmtMonto(Number(form.montoMensual))}
              </div>
            )}
            <div className="grid grid-cols-2 gap-3 mt-3">
              <Field label="Fecha 1ra factura (automática)">
                <input disabled type="date" value={form.fecha1raFactura} className={inputClass} style={lockedStyle} />
              </Field>
              <Field label="Monto 1ra factura (recurrente + prorrateo)">
                <input type="number" step="0.01" value={form.monto1raFactura} onChange={set("monto1raFactura")} className={inputClass} style={inputStyle} />
              </Field>
            </div>
          </div>
        </SeccionFormulario>

        <SeccionFormulario titulo="Observaciones" defaultOpen={false}>
          <Field label="Observaciones">
            <textarea value={form.observaciones} onChange={set("observaciones")} rows={3} className={inputClass} style={inputStyle} />
          </Field>
        </SeccionFormulario>

        <div className="flex gap-2 fixed bottom-0 left-0 right-0 z-20 px-4 py-3 bg-white border-t md:left-56" style={ { borderColor: "#DFE5EF", boxShadow: "0 -4px 16px rgba(0,30,98,0.08)" } }>
          <button type="submit" className="flex-1 text-sm font-bold px-4 py-3 rounded-md text-white" style={ { background: "#001E62" } }>
            {editing ? "Guardar cambios" : "Registrar cliente"}
          </button>
          <button type="button" onClick={onCancel} className="flex-1 text-sm font-bold px-4 py-3 rounded-md border-2" style={ { borderColor: "#001E62", color: "#001E62" } }>
            Cancelar
          </button>
        </div>
      </form>
    </div>
  );
}

function SeccionFormulario({ titulo, defaultOpen = true, children }) {
  const [abierta, setAbierta] = useState(defaultOpen);
  return (
    <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
      <button
        type="button"
        onClick={() => setAbierta((v) => !v)}
        className="w-full flex items-center justify-between px-5 py-3 text-left"
      >
        <span className="text-sm font-semibold" style={ { color: "#001E62" } }>{titulo}</span>
        <span className="text-xs" style={ { color: "#9CA3AF" } }>{abierta ? "▲" : "▼"}</span>
      </button>
      {abierta && (
        <div className="px-5 pb-5 pt-1 border-t" style={ { borderColor: "#F0F0EF" } }>
          {children}
        </div>
      )}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-xs font-medium" style={ { color: "#5A6680" } }>
        {typeof label === "string" && label.endsWith(" *") ? (<React.Fragment>{label.slice(0, -2)} <span style={ { color: "#B45309", fontWeight: 700 } }>*</span></React.Fragment>) : label}
      </span>
      {children}
    </label>
  );
}

// Confirmación al marcar/desmarcar una factura como pagada. En la 1ra factura de un
// cliente de prorrateo alto pregunta QUÉ pagó: PAGO PARCIAL (completó su primer mes:
// cuenta para la comisión y siguen los recordatorios del saldo) o PAGO FACTURA
// COMPLETA. Si ya tiene saldo pendiente, la confirmación es "saldo pagado".
function ConfirmarFacturaModal({ nombre, n, nuevoEstado, permiteParcial, saldoPendiente, onCancel, onConfirm }) {
  const pagar = nuevoEstado === "pagada";
  const elegir = pagar && n === 1 && !!permiteParcial && !saldoPendiente;
  const saldo = pagar && n === 1 && !!saldoPendiente;
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg p-6 max-w-sm w-full">
        <h3 className="font-semibold mb-2 flex items-center gap-2" style={ { color: "#001E62" } }>
          <span aria-hidden="true">{pagar ? "✓" : "↩"}</span>
          {elegir ? `¿Qué pagó ${nombre}?` : saldo ? "¿Pagó el saldo?" : pagar ? "¿Marcar como pagada?" : "¿Desmarcar como pagada?"}
        </h3>
        {elegir ? (
          <div className="flex flex-col gap-2 mb-4">
            <button
              onClick={() => onConfirm({ parcial: true })}
              className="text-left px-3 py-2.5 rounded-md border-2"
              style={ { borderColor: "#001E62", color: "#001E62", background: "white" } }
            >
              <div className="text-sm font-bold">PAGO PARCIAL</div>
              <div className="text-xs mt-0.5" style={ { color: "#5A6680" } }>
                Completó su primer mes. Cuenta para tu comisión y siguen los recordatorios del saldo.
              </div>
            </button>
            <button
              onClick={() => onConfirm({ parcial: false })}
              className="text-left px-3 py-2.5 rounded-md border-2"
              style={ { borderColor: "#001E62", color: "white", background: "#001E62" } }
            >
              <div className="text-sm font-bold">PAGO FACTURA COMPLETA</div>
              <div className="text-xs mt-0.5" style={ { color: "#B9C4E0" } }>
                Pagó toda la factura. Cuenta para tu comisión y se apagan los recordatorios.
              </div>
            </button>
          </div>
        ) : (
          <p className="text-sm mb-5" style={ { color: "#5A6680" } }>
            {saldo
              ? `El saldo de la ${ORDINAL[n]} factura de ${nombre} se va a marcar como pagado y se apagan los recordatorios.`
              : pagar
              ? `La ${ORDINAL[n]} factura de ${nombre} se va a marcar como pagada.`
              : `La ${ORDINAL[n]} factura de ${nombre} va a volver a quedar como no pagada.`}
          </p>
        )}
        <div className="flex gap-2 justify-end">
          <button onClick={onCancel} className="text-sm px-3 py-1.5 rounded-md border" style={ { borderColor: "#DFE5EF" } }>Cancelar</button>
          {!elegir && (
            <button
              onClick={() => onConfirm({})}
              className="text-sm px-3 py-1.5 rounded-md text-white"
              style={ { background: pagar ? "#0072CE" : "#001E62" } }
            >
              {saldo ? "Sí, saldo pagado" : pagar ? "Sí, pagada" : "Sí, desmarcar"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

          </button>
          <button onClick={onImportarClick} className={rowClass} style={rowStyle}>

        </div>
        <button

          Cerrar sesión
        </button>
      </div>

  );

// Cuando un error pasa DENTRO del render de React, el navegador a veces solo
// reporta "Script error." sin detalle (por cómo Babel ejecuta el código). Este
// capturador recibe el error real directamente de React y sí puede mostrarlo completo.
class CapturadorErrores extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    try {
      mostrarErrorEnPantalla(
        (error && error.message ? error.message : String(error)) +
          '\n\nDónde:\n' +
          (info && info.componentStack ? info.componentStack.trim().split('\n').slice(0, 4).join('\n') : '?') +
          (error && error.stack ? '\n\nDetalle técnico:\n' + error.stack.split('\n').slice(0, 6).join('\n') : '')
      );
    } catch (e) {}
  }
  render() {
    if (this.state.error) return null;
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CapturadorErrores><App /></CapturadorErrores>);
</script>
