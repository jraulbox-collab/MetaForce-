const GRUPOS_MOVIL = [
  { key: "faltan", label: "Te faltan", pista: "Completadas en Tigo y no están en tus Clientes Móvil.", color: "#C23B3B", bg: "#FBEAEA", borde: "#F3C6C6" },
  { key: "fechaDistinta", label: "Fecha distinta", pista: "La fecha de activación de tu app no es la de Tigo.", color: "#C2761F", bg: "#FFF6EC", borde: "#F5D9B8" },
  { key: "alertas", label: "Alertas", pista: "Las tienes en tu app, pero en Tigo siguen en proceso.", color: "#8A3FA8", bg: "#F6EEFA", borde: "#E0C9EC" },
  { key: "posibles", label: "Posibles coincidencias", pista: "No hay nombre igual, pero hay uno parecido en tus Clientes Móvil.", color: "#6B7280", bg: "#F3F4F6", borde: "#D1D5DB" },
  { key: "proceso", label: "En proceso", pista: "Todavía en proceso en Tigo. Solo informativo: se agregan cuando salgan completadas.", color: "#B8791F", bg: "#FFFBF2", borde: "#F3E3C3" },
  { key: "bien", label: "Todo bien", pista: "Nombre y fecha coinciden.", color: "#0F766E", bg: "#EAF6F4", borde: "#B7E0DA" },
];

function BotonCopiarOrden({ texto, label, vacio }) {
  const [ok, setOk] = useState(false);
  async function copiar(e) {
    e.stopPropagation();
    if (!texto) return;
    const res = await copiarTextoPrecierre(String(texto));
    if (res) {
      setOk(true);
      setTimeout(() => setOk(false), 1500);
    }
  }
  return (
    <button
      onClick={copiar}
      disabled={!texto}
      className="text-xs font-medium px-2.5 py-1 rounded-md disabled:opacity-40"
      style={{ color: "#001E62", border: "1px solid #D1D5DB" }}
    >
      {!texto ? vacio || "Sin dato" : ok ? "✓ Copiado" : label}
    </button>
  );
}

function FilaOrden({ color, nombre, sub, children, onClickNombre }) {
  return (
    <div className="py-2.5 border-b border-gray-100 last:border-0">
      <div className="flex items-start gap-2.5">
        <span className="shrink-0 rounded-full" style={{ width: 8, height: 8, background: color, marginTop: 6 }} />
        <div className="min-w-0 flex-1">
          {onClickNombre ? (
            <button type="button" onClick={onClickNombre} className="text-sm font-medium break-words text-left underline" style={{ color: "#001E62" }}>
              {nombre} ›
            </button>
          ) : (
            <div className="text-sm font-medium break-words">{nombre}</div>
          )}
          {sub && <div className="text-xs" style={{ color: "#6B7280" }}>{sub}</div>}
        </div>
      </div>
      {children && <div className="flex flex-wrap items-center gap-2 mt-2" style={{ marginLeft: 18 }}>{children}</div>}
    </div>
  );
}

function confirmarCambioFechaOrden(cliente, nueva, esMovil) {
  const actual = esMovil ? fechaActivacionMovil(cliente) : cliente.fechaInstalacion;
  const antes = actual ? fmtFecha(actual) : "pendiente (sin fecha)";
  return window.confirm(
    "¿Cambiar la fecha de " + (esMovil ? "activación" : "instalación") + " de " + cliente.nombre + "?\n\nAntes: " + antes + "\nAhora: " + fmtFecha(nueva)
  );
}

function FilaFechaDistinta({ fila, cliente, color, onCambiarFecha, movil }) {
  const fechaApp = movil ? fechaActivacionMovil(cliente) : cliente.fechaInstalacion;
  const [editando, setEditando] = useState(false);
  const [valor, setValor] = useState(fechaApp || "");
  function aplicar(nueva) {
    if (!nueva) return;
    if (confirmarCambioFechaOrden(cliente, nueva, movil)) onCambiarFecha(cliente.id, nueva);
  }
  const estiloBoton = { color: "#001E62", border: "1px solid #D1D5DB" };
  return (
    <FilaOrden
      color={color}
      nombre={cliente.nombre}
      sub={"Tu app: " + fmtFecha(fechaApp) + " · Tigo: " + fmtFecha(fila.fin)}
    >
      {movil ? (
        <BotonCopiarOrden texto={fila.cedula} label="Copiar cédula" />
      ) : (
        <BotonCopiarOrden texto={cliente.numeroSuscriptor} label="Copiar suscriptor" vacio="Sin suscriptor" />
      )}
      {editando ? (
        <>
          <input
            type="date"
            value={valor}
            onChange={(e) => setValor(e.target.value)}
            className="text-xs px-2 py-1 rounded-md border"
            style={{ borderColor: "#D1D5DB" }}
          />
          <button
            onClick={() => aplicar(valor)}
            disabled={!valor}
            className="text-xs font-medium px-2.5 py-1 rounded-md text-white disabled:opacity-40"
            style={{ background: "#001E62" }}
          >
            Guardar
          </button>
          <button onClick={() => setEditando(false)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
            Cancelar
          </button>
        </>
      ) : (
        <>
          <button onClick={() => setEditando(true)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
            Editar fecha
          </button>
          <button
            onClick={() => aplicar(fila.fin)}
            className="text-xs font-medium px-2.5 py-1 rounded-md text-white"
            style={{ background: "#001E62" }}
          >
            Usar la de Tigo
          </button>
        </>
      )}
    </FilaOrden>
  );
}

// Días que lleva una orden en proceso, según la fecha de creación que trae Tigo.
function textoDiasEnProceso(f) {
  if (!f.creada) return "";
  const d = Math.max(0, -daysFromToday(f.creada));
  if (d === 0) return "ingresada hoy";
  if (d === 1) return "1 día en proceso";
  return d + " días en proceso";
}

function VerificarOrdenes({ clientes, convergencias, verif, setVerif, onAgregar, onAbrirCliente, onAbrirMovil, onCambiarFecha, onAgregarMovil, onCambiarFechaMovil }) {
  const [editando, setEditando] = useState(!verif.aplicado);
  const [grupo, setGrupo] = useState(null);
  const [verNoVerif, setVerNoVerif] = useState(false);
  const descartados = useMemo(() => new Set(verif.descartados || []), [verif.descartados]);
  const resultado = useMemo(
    () => (verif.aplicado ? compararOrdenes(clientes, verif.aplicado, descartados, convergencias || []) : null),
    [clientes, convergencias, verif.aplicado, descartados]
  );

  function verificar() {
    setVerif((v) => ({ ...v, aplicado: v.texto, descartados: [] }));
    setEditando(false);
    setGrupo(null);
  }
  function limpiar() {
    setVerif((v) => ({ ...v, texto: "", aplicado: null, descartados: [], seccion: null }));
    setEditando(true);
    setGrupo(null);
  }
  function descartarParecido(key) {
    setVerif((v) => ({ ...v, descartados: [...(v.descartados || []), key] }));
  }
  function seleccionar(sec, key) {
    setVerif((v) => ({ ...v, seccion: sec }));
    setGrupo(key);
  }

  const estiloBoton = { color: "#001E62", border: "1px solid #D1D5DB" };
  const m = resultado ? resultado.movil : null;
  const cH = resultado
    ? {
        faltan: resultado.faltan.length,
        procesoFaltan: resultado.procesoFaltan.length,
        fechaDistinta: resultado.fechaDistinta.length,
        pendientesInstalados: resultado.pendientesInstalados.length,
        alertas: resultado.alertas.length,
        posibles: resultado.posibles.length,
        bien: resultado.bien.length,
      }
    : {};
  const cM = m
    ? {
        faltan: m.faltan.length,
        fechaDistinta: m.fechaDistinta.length,
        alertas: m.alertas.length,
        posibles: m.posibles.length,
        proceso: m.proceso.length,
        bien: m.bien.length,
      }
    : {};
  const pendH = resultado ? cH.faltan + cH.procesoFaltan + cH.fechaDistinta + cH.pendientesInstalados + cH.alertas + cH.posibles : 0;
  // En Móvil, "En proceso" es solo informativo y no cuenta como algo por resolver.
  const pendM = m ? cM.faltan + cM.fechaDistinta + cM.alertas + cM.posibles : 0;

  const seccionActiva = verif.seccion === "movil" || verif.seccion === "hogar" ? verif.seccion : pendH === 0 && pendM > 0 ? "movil" : "hogar";
  const esMovil = seccionActiva === "movil";
  const grupos = esMovil ? GRUPOS_MOVIL : GRUPOS_ORDENES;
  const conteos = esMovil ? cM : cH;
  const ordenPrimero = esMovil
    ? ["faltan", "fechaDistinta", "alertas", "posibles", "proceso"]
    : ["faltan", "procesoFaltan", "fechaDistinta", "pendientesInstalados", "alertas", "posibles"];
  const primero = ordenPrimero.find((k) => conteos[k] > 0) || "bien";
  const activo = grupo && grupos.some((x) => x.key === grupo) ? grupo : primero;
  const g = grupos.find((x) => x.key === activo);
  const estiloSeccion = (sel) => ({
    background: sel ? "#001E62" : "#FFFFFF",
    color: sel ? "#FFFFFF" : "#374151",
    border: "1px solid " + (sel ? "#001E62" : "#D1D5DB"),
  });

  return (
    <div>
      <h1 className="text-2xl font-semibold mb-1">Verificar órdenes</h1>
      <p className="text-sm mb-4" style={{ color: "#6B7280" }}>
        Pega las órdenes de la herramienta de Tigo, desde la PC (filas con todas las columnas) o desde el celular (tal como salen). Se comparan por nombre con tus clientes.
      </p>

      {editando ? (
        <div className="mb-4">
          <textarea
            value={verif.texto}
            onChange={(e) => { const v = e.target.value; setVerif((s) => ({ ...s, texto: v })); }}
            rows={8}
            placeholder="Pega aquí las órdenes de Tigo…"
            className="w-full px-3 py-2 rounded-md border text-sm outline-none mb-3 font-mono"
            style={{ borderColor: "#D1D5DB" }}
          />
          <div className="flex items-center gap-2">
            <button
              onClick={verificar}
              disabled={!verif.texto.trim()}
              className="text-sm font-medium px-4 py-2 rounded-md text-white disabled:opacity-40"
              style={{ background: "#001E62" }}
            >
              Verificar órdenes
            </button>
            {verif.aplicado && (
              <button onClick={() => setEditando(false)} className="text-sm font-medium px-3 py-2 rounded-md" style={{ color: "#6B7280", border: "1px solid #D1D5DB" }}>
                Cancelar
              </button>
            )}
          </div>
        </div>
      ) : (
        <div className="flex items-center justify-between gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2 mb-4">
          <span className="text-xs min-w-0 truncate" style={{ color: "#6B7280" }}>
            {resultado ? resultado.total : 0} órdenes leídas
          </span>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={() => setEditando(true)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
              Editar
            </button>
            <button onClick={limpiar} className="text-xs font-medium px-2.5 py-1 rounded-md" style={{ color: "#C23B3B", border: "1px solid #D1D5DB" }}>
              Limpiar
            </button>
          </div>
        </div>
      )}

      {!editando && resultado && resultado.total === 0 && (
        <p className="text-sm rounded-lg border p-4" style={{ borderColor: "#F3E3C3", background: "#FFFBF2", color: "#7A4E0E" }}>
          No encontré órdenes en lo que pegaste. Copia las filas desde la página de Tigo con todas las columnas
          (orden, tipo, estado, nombre, cédula y fechas).
        </p>
      )}

      {!editando && resultado && resultado.total > 0 && (
        <div className="flex flex-col gap-3">
          <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
            <div className="text-sm font-semibold" style={{ color: pendH + pendM === 0 ? "#0F766E" : "#374151" }}>
              {pendH + pendM === 0 ? "✅ Todo cuadra" : pendH + pendM + (pendH + pendM === 1 ? " cosa por resolver" : " cosas por resolver")}
            </div>
            <div className="text-xs mt-1" style={{ color: "#6B7280" }}>
              <span style={pendH > 0 ? { color: "#B45309", fontWeight: 700 } : undefined}>🏠 Hogar: {pendH === 0 ? "✅ cuadra" : pendH}</span>
              {" · "}
              <span style={pendM > 0 ? { color: "#B45309", fontWeight: 700 } : undefined}>📱 Móvil: {pendM === 0 ? "✅ cuadra" : pendM}</span>
            </div>
            {(resultado.repetidas > 0 || resultado.ignoradas > 0 || resultado.noVerificadas.length > 0) && (
              <p className="text-xs mt-1" style={{ color: "#6B7280" }}>
                {[
                  resultado.repetidas > 0 ? resultado.repetidas + " repetidas se contaron una vez" : null,
                  resultado.ignoradas > 0 ? resultado.ignoradas + " líneas no se pudieron leer" : null,
                  resultado.noVerificadas.length > 0 ? resultado.noVerificadas.length + " órdenes no se verifican" : null,
                ].filter(Boolean).join(" · ")}
              </p>
            )}
            {resultado.noVerificadas.length > 0 && (
              <div className="mt-1">
                <button onClick={() => setVerNoVerif((v) => !v)} className="text-xs font-medium" style={{ color: "#001E62" }}>
                  {verNoVerif ? "Ocultar las que no se verifican" : "Ver las que no se verifican"}
                </button>
                {verNoVerif && (
                  <ul className="text-xs mt-1" style={{ color: "#6B7280" }}>
                    {resultado.noVerificadas.map((f) => (
                      <li key={f.orden}>{f.nombre} · {f.tipo} · {f.estado}</li>
                    ))}
                  </ul>
                )}
              </div>
            )}
          </div>

          {[["hogar", "🏠 Hogar", GRUPOS_ORDENES, cH, pendH, ["bien"]], ["movil", "📱 Móvil", GRUPOS_MOVIL, cM, pendM, ["proceso", "bien"]]].map(([sec, titulo, lista, cont, pend, tranquilos]) => (
            <div key={sec}>
              <div className="text-xs font-bold mb-1.5" style={{ color: pend > 0 ? "#B45309" : "#6B7280" }}>
                {titulo}{pend > 0 ? " · " + pend + " por resolver" : " · ✅ cuadra"}
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                {lista.filter((x) => !tranquilos.includes(x.key) && cont[x.key] > 0).map((x) => {
                  const sel = seccionActiva === sec && activo === x.key;
                  return (
                    <button
                      key={x.key}
                      onClick={() => seleccionar(sec, x.key)}
                      aria-pressed={sel}
                      className="text-left rounded-lg px-3 py-2.5"
                      style={{
                        background: x.bg,
                        border: sel ? "2px solid " + x.color : "1px solid " + x.borde,
                        padding: sel ? "9.5px 11.5px" : undefined,
                      }}
                    >
                      <div className="text-2xl font-mono font-semibold leading-tight" style={{ color: x.color }}>{cont[x.key]}</div>
                      <div className="text-xs" style={{ color: x.color }}>{x.label}</div>
                    </button>
                  );
                })}
              </div>
              {lista.some((x) => tranquilos.includes(x.key) && cont[x.key] > 0) && (
                <div className="flex flex-wrap items-center gap-2 mt-2 rounded-lg border border-gray-200 bg-white px-3 py-2">
                  {lista.filter((x) => tranquilos.includes(x.key) && cont[x.key] > 0).map((x) => {
                    const sel = seccionActiva === sec && activo === x.key;
                    return (
                      <button
                        key={x.key}
                        onClick={() => seleccionar(sec, x.key)}
                        aria-pressed={sel}
                        className="text-xs font-medium px-2.5 py-1 rounded-full"
                        style={{
                          background: sel ? "#001E62" : "#F3F4F6",
                          color: sel ? "#FFFFFF" : "#374151",
                          border: "1px solid " + (sel ? "#001E62" : "#E5E7EB"),
                        }}
                      >
                        {cont[x.key]} {x.label.toLowerCase()} ›
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          ))}

          <div className="bg-white rounded-lg border border-gray-200 shadow-sm px-4 pt-3 pb-1">
            <div className="mb-1">
              <div className="text-sm font-semibold" style={{ color: g.color }}>{g.label} ({conteos[g.key]})</div>
              <div className="text-xs" style={{ color: "#6B7280" }}>{g.pista}</div>
            </div>

            {conteos[g.key] === 0 && <p className="text-sm py-3" style={{ color: "#0F766E" }}>✅ Ninguno.</p>}

            {/* ---------- HOGAR ---------- */}
            {!esMovil && activo === "faltan" &&
              resultado.faltan.map((f) => (
                <FilaOrden
                  key={f.orden}
                  color={g.color}
                  nombre={f.nombre}
                  sub={"Cédula " + f.cedula + (f.fin ? " · instalada " + fmtFecha(f.fin) : "")}
                >
                  <BotonCopiarOrden texto={f.cedula} label="Copiar cédula" />
                  <button
                    onClick={() => onAgregar(f.nombre, f.fin)}
                    className="text-xs font-medium px-3 py-1 rounded-md text-white"
                    style={{ background: "#001E62" }}
                  >
                    + Agregar
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "procesoFaltan" &&
              resultado.procesoFaltan.map((f) => (
                <FilaOrden key={f.orden} color={g.color} nombre={f.nombre} sub={f.estado + " · cédula " + f.cedula}>
                  <BotonCopiarOrden texto={f.cedula} label="Copiar cédula" />
                  <button
                    onClick={() => onAgregar(f.nombre, "")}
                    className="text-xs font-medium px-3 py-1 rounded-md text-white"
                    style={{ background: "#001E62" }}
                  >
                    + Agregar (pendiente)
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "fechaDistinta" &&
              resultado.fechaDistinta.map(({ fila, cliente }) => (
                <FilaFechaDistinta key={cliente.id + fila.orden} fila={fila} cliente={cliente} color={g.color} onCambiarFecha={onCambiarFecha} />
              ))}

            {!esMovil && activo === "pendientesInstalados" &&
              resultado.pendientesInstalados.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={fila.fin ? "Tigo lo instaló el " + fmtFecha(fila.fin) : "Tigo no trae fecha de cierre"}
                >
                  <BotonCopiarOrden texto={cliente.numeroSuscriptor} label="Copiar suscriptor" vacio="Sin suscriptor" />
                  <button
                    onClick={() => { if (confirmarCambioFechaOrden(cliente, fila.fin)) onCambiarFecha(cliente.id, fila.fin); }}
                    disabled={!fila.fin}
                    className="text-xs font-medium px-3 py-1 rounded-md text-white disabled:opacity-40"
                    style={{ background: "#001E62" }}
                  >
                    Marcar como instalado
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "alertas" &&
              resultado.alertas.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Tigo: " + fila.estado + " · en tu app instalado el " + fmtFecha(cliente.fechaInstalacion)}
                >
                  <BotonCopiarOrden texto={cliente.numeroSuscriptor} label="Copiar suscriptor" vacio="Sin suscriptor" />
                  <button onClick={() => onAbrirCliente(cliente)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
                    Abrir cliente
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "posibles" &&
              resultado.posibles.map(({ fila, cliente, key }) => (
                <FilaOrden
                  key={fila.orden}
                  color={g.color}
                  nombre={fila.nombre}
                  sub={"Parecido en tu app: " + cliente.nombre + (cliente.fechaInstalacion ? " · instalado " + fmtFecha(cliente.fechaInstalacion) : " · pendiente")}
                >
                  <button onClick={() => onAbrirCliente(cliente)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
                    Abrir cliente
                  </button>
                  <button onClick={() => descartarParecido(key)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
                    No es el mismo
                  </button>
                </FilaOrden>
              ))}

            {!esMovil && activo === "bien" &&
              resultado.bien.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={cliente.fechaInstalacion ? "Instalado " + fmtFecha(cliente.fechaInstalacion) : "Pendiente · " + fila.estado}
                  onClickNombre={() => onAbrirCliente(cliente)}
                />
              ))}

            {/* ---------- MÓVIL ---------- */}
            {esMovil && activo === "faltan" &&
              m.faltan.map((f) => (
                <FilaOrden
                  key={f.orden}
                  color={g.color}
                  nombre={f.nombre}
                  sub={f.tipo + " · cédula " + f.cedula + (f.fin ? " · completada " + fmtFecha(f.fin) : "")}
                >
                  <BotonCopiarOrden texto={f.cedula} label="Copiar cédula" />
                  <button
                    onClick={() => onAgregarMovil(f.nombre, f.fin)}
                    className="text-xs font-medium px-3 py-1 rounded-md text-white"
                    style={{ background: "#001E62" }}
                  >
                    + Agregar
                  </button>
                </FilaOrden>
              ))}

            {esMovil && activo === "fechaDistinta" &&
              m.fechaDistinta.map(({ fila, cliente }) => (
                <FilaFechaDistinta key={cliente.id + fila.orden} fila={fila} cliente={cliente} color={g.color} onCambiarFecha={onCambiarFechaMovil} movil />
              ))}

            {esMovil && activo === "alertas" &&
              m.alertas.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Tigo: " + fila.estado + " · en tu app activada el " + fmtFecha(fechaActivacionMovil(cliente))}
                >
                  <BotonCopiarOrden texto={fila.cedula} label="Copiar cédula" />
                </FilaOrden>
              ))}

            {esMovil && activo === "posibles" &&
              m.posibles.map(({ fila, cliente, key }) => (
                <FilaOrden
                  key={fila.orden}
                  color={g.color}
                  nombre={fila.nombre}
                  sub={"Parecido en tus Clientes Móvil: " + cliente.nombre + " · activada " + fmtFecha(fechaActivacionMovil(cliente))}
                >
                  <button onClick={() => descartarParecido(key)} className="text-xs font-medium px-2.5 py-1 rounded-md" style={estiloBoton}>
                    No es el mismo
                  </button>
                </FilaOrden>
              ))}

            {esMovil && activo === "proceso" &&
              [...m.proceso]
                .sort((a, b) => (a.creada || "9999").localeCompare(b.creada || "9999"))
                .map((f) => (
                  <FilaOrden
                    key={f.orden}
                    color={g.color}
                    nombre={f.nombre}
                    sub={[f.tipo, f.estado, textoDiasEnProceso(f)].filter(Boolean).join(" · ") + " · cédula " + f.cedula}
                  >
                    <BotonCopiarOrden texto={f.cedula} label="Copiar cédula" />
                  </FilaOrden>
                ))}

            {esMovil && activo === "bien" &&
              m.bien.map(({ fila, cliente }) => (
                <FilaOrden
                  key={cliente.id + fila.orden}
                  color={g.color}
                  nombre={cliente.nombre}
                  sub={"Activada " + fmtFecha(fechaActivacionMovil(cliente))}
                  onClickNombre={() => onAbrirMovil && onAbrirMovil(cliente.id)}
                />
              ))}
          </div>
        </div>
      )}
    </div>
  );
}

function FormularioCliente({ form, setForm, onSubmit, editing, editingId, onCancel, clientes = [] }) {
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const inputClass = "w-full px-3 py-2 rounded-md border text-sm outline-none focus:ring-2";
  const inputStyle = { borderColor: "#D1D5DB" };
  const lockedStyle = { borderColor: "#D1D5DB", background: "#F3F4F6", color: "#6B7280", cursor: "not-allowed" };
  const [diasProrrateo, setDiasProrrateo] = useState(null);

  // Aviso en vivo (mientras escribes) si ese N° de suscriptor ya pertenece a otro
  // cliente — antes esto solo se avisaba al final, al tocar Guardar.
  const suscriptorDuplicado = useMemo(() => {
    const num = (form.numeroSuscriptor || "").trim();
    if (!num) return null;
    return clientes.find((c) => c.id !== editingId && (c.numeroSuscriptor || "").trim() === num) || null;
  }, [clientes, editingId, form.numeroSuscriptor]);

  // Montos mensuales más usados para el plan que se está seleccionando ahora mismo.
  // Primero intenta con match exacto (tipo + velocidad + TV), y si no hay suficientes
  // datos, va ampliando el filtro (tipo + velocidad, y luego solo tipo de plan).
  const montosSugeridos = useMemo(() => {
    if (!form.planTipo) return [];
    const contar = (lista) => {
      const conteo = new Map();
      lista.forEach((c) => {
        const m = Number(c.montoMensual);
        if (!m) return;
        conteo.set(m, (conteo.get(m) || 0) + 1);
      });
      return [...conteo.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([monto]) => monto);
    };

    const porTipo = clientes.filter((c) => c.planTipo === form.planTipo);
    if (form.velocidad) {
      const porVelocidad = porTipo.filter((c) => c.velocidad === form.velocidad);
      const base =
        form.planTipo === "DOBLE" && form.planTV
          ? porVelocidad.filter((c) => c.planTV === form.planTV)
          : porVelocidad;
      if (base.length >= 2) return contar(base);
      if (porVelocidad.length > 0) return contar(porVelocidad);
    }
    return contar(porTipo);
  }, [clientes, form.planTipo, form.velocidad, form.planTV]);

  function calcularAuto() {
    const r = calcularPrimeraFactura(form.fechaInstalacion, parseInt(form.cicloFacturacion, 10), form.montoMensual);
    if (!r) return;
    const totalPrimeraFactura = +((Number(form.montoMensual) || 0) + (Number(r.monto1raFactura) || 0)).toFixed(2);
    setForm((f) => ({ ...f, fecha1raFactura: r.fecha1raFactura, monto1raFactura: totalPrimeraFactura }));
    setDiasProrrateo(r.dias);
  }

  useEffect(() => {
    if (!form.fechaInstalacion || !form.cicloFacturacion || form.montoMensual === "" || form.montoMensual == null) return;
    calcularAuto();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form.fechaInstalacion, form.cicloFacturacion, form.montoMensual]);

  return (
    <div className="max-w-2xl">
      <h1 className="text-2xl font-semibold mb-1">{editing ? "Editar cliente" : "Nuevo cliente"}</h1>
      <p className="text-sm mb-6" style={ { color: "#6B7280" } }>
        Se hace seguimiento a las primeras 4 facturas. Las fechas de la 2da, 3ra y 4ta se calculan con el día del Ciclo de Facturación. Todos los campos son obligatorios.
      </p>
      <form onSubmit={onSubmit} className="flex flex-col gap-3">
        <SeccionFormulario titulo="Datos del cliente">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <Field label="Número de suscriptor *">
              <input required value={form.numeroSuscriptor} onChange={set("numeroSuscriptor")} className={inputClass} style={ { ...inputStyle, ...(suscriptorDuplicado ? { borderColor: "#C23B3B" } : {}) } } />
              {suscriptorDuplicado && (
                <p className="text-xs mt-1" style={ { color: "#C23B3B" } }>
                  ⚠️ Ese número ya pertenece a {suscriptorDuplicado.nombre}
                </p>
              )}
            </Field>
            <Field label="Nombre y apellido *">
              <input required value={form.nombre} onChange={set("nombre")} className={inputClass} style={inputStyle} />
            </Field>
            <Field label="Teléfono *">
              <input required value={form.telefono} onChange={set("telefono")} className={inputClass} style={inputStyle} />
            </Field>
            <div
              className="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 rounded-md"
              style={ (form.estadoCliente === "cancelado" || form.estadoCliente === "penalizado") ? { background: "#F4F6FA", padding: "12px" } : {} }
            >
              <Field label="Estado del cliente">
                <select value={form.estadoCliente || "activo"} onChange={set("estadoCliente")} className={inputClass} style={inputStyle}>
                  {ESTADOS_CLIENTE.map((e) => <option key={e.value} value={e.value}>{e.label}</option>)}
                </select>
              </Field>
              {form.estadoCliente === "cancelado" && (
                <>
                  <Field label="Fecha de cancelación">
                    <input type="date" value={form.fechaCancelacion || ""} onChange={set("fechaCancelacion")} className={inputClass} style={inputStyle} />
                  </Field>
                  <Field label="Motivo de cancelación">
                    <select value={form.motivoCancelacion || "voluntaria"} onChange={set("motivoCancelacion")} className={inputClass} style={inputStyle}>
                      <option value="voluntaria">Cancelación voluntaria</option>
                      <option value="falta_pago">Falta de pago</option>
                    </select>
                  </Field>
                </>
              )}
              {form.estadoCliente === "penalizado" && (
                <Field label="Motivo de la penalización (opcional)">
                  <input type="text" value={form.motivoPenalizacion || ""} onChange={set("motivoPenalizacion")} className={inputClass} style={inputStyle} />
                </Field>
              )}
              {(form.estadoCliente === "cancelado" || form.estadoCliente === "penalizado") && (
                <p className="text-xs sm:col-span-2" style={ { color: "#6B7280" } }>
                  {form.estadoCliente === "penalizado"
                    ? "Este cliente no cuenta para meta, comisión ni mensajes."
                    : "Si no pagó su 1ra factura, no cuenta para meta ni comisión. Se detienen sus mensajes."}
                </p>
              )}
            </div>
          </div>
        </SeccionFormulario>

        <SeccionFormulario titulo="Plan y facturación">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <Field label="Ciclo de facturación *">
              <select required value={form.cicloFacturacion} onChange={set("cicloFacturacion")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {CICLOS.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
              </select>
            </Field>
            <Field label="Fecha de instalación">
              <input
                type="date"
                value={form.fechaInstalacion}
                onChange={set("fechaInstalacion")}
                disabled={!form.fechaInstalacion}
                required={!!form.fechaInstalacion}
                className={inputClass}
                style={!form.fechaInstalacion ? lockedStyle : inputStyle}
              />
              <label className="flex items-center gap-2 mt-1.5 text-xs" style={ { color: "#6B7280" } }>
                <input
                  type="checkbox"
                  checked={!form.fechaInstalacion}
                  onChange={(e) =>
                    setForm((f) => ({ ...f, fechaInstalacion: e.target.checked ? "" : fechaLocalISO(new Date()) }))
                  }
                />
                Pendiente de instalación (todavía no tiene fecha)
              </label>
            </Field>
            <Field label="Tipo de plan *">
              <select
                required
                value={form.planTipo}
                onChange={(e) => setForm((f) => ({ ...f, planTipo: e.target.value, planTV: e.target.value === "SINGLE" ? "" : f.planTV }))}
                className={inputClass}
                style={inputStyle}
              >
                <option value="">Seleccionar…</option>
                {TIPOS_PLAN.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
            <Field label="Velocidad *">
              <select required value={form.velocidad} onChange={set("velocidad")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {VELOCIDADES.map((v) => <option key={v} value={v}>{v}</option>)}
              </select>
            </Field>
            {form.planTipo === "DOBLE" && (
              <Field label="Plan de TV *">
                <select required value={form.planTV} onChange={set("planTV")} className={inputClass} style={inputStyle}>
                  <option value="">Seleccionar…</option>
                  {TIPOS_TV.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </Field>
            )}
            <Field label="Monto mensual recurrente *">
              <input required type="number" step="0.01" value={form.montoMensual} onChange={set("montoMensual")} className={inputClass} style={inputStyle} />
              {montosSugeridos.length > 0 && (
                <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                  <span className="text-xs" style={ { color: "#9CA3AF" } }>Sugeridos:</span>
                  {montosSugeridos.map((m) => (
                    <button
                      key={m}
                      type="button"
                      onClick={() => setForm((f) => ({ ...f, montoMensual: String(m) }))}
                      className="text-xs font-medium px-2 py-0.5 rounded-full border"
                      style={
                        Number(form.montoMensual) === m
                          ? { background: "#001E62", color: "#fff", borderColor: "#001E62" }
                          : { background: "#F4F6FA", color: "#374151", borderColor: "#D1D5DB" }
                      }
                    >
                      {fmtMonto(m)}
                    </button>
                  ))}
                </div>
              )}
            </Field>
          </div>

          <div className="rounded-md p-3 flex items-center justify-between mt-4" style={ { background: "#F4F6FA" } }>
            <div>
              <div className="text-xs font-medium" style={ { color: "#374151" } }>
                Fecha y monto de la 1ra factura (recurrente + prorrateo)
              </div>
              <div className="text-xs mt-0.5" style={ { color: "#9CA3AF" } }>
                {diasProrrateo != null
                  ? `Calculado automáticamente: ${diasProrrateo} día${diasProrrateo !== 1 ? "s" : ""} de prorrateo`
                  : "Se calcula solo al completar fecha de instalación + ciclo + monto mensual"}
              </div>
            </div>
            <button
              type="button"
              onClick={calcularAuto}
              disabled={!form.fechaInstalacion || !form.cicloFacturacion || !form.montoMensual}
              className="text-xs font-medium px-3 py-1.5 rounded-md text-white disabled:opacity-40"
              style={ { background: "#001E62" } }
              title="Recalcular por si editaste algo manualmente"
            >
              🔄 Recalcular
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <Field label="Fecha 1ra factura (automática)">
              <input disabled type="date" value={form.fecha1raFactura} className={inputClass} style={lockedStyle} />
            </Field>
            <Field label="Monto 1ra factura (recurrente + prorrateo)">
              <input type="number" step="0.01" value={form.monto1raFactura} onChange={set("monto1raFactura")} className={inputClass} style={inputStyle} />
            </Field>
          </div>
        </SeccionFormulario>

        <SeccionFormulario titulo="Observaciones" defaultOpen={false}>
          <Field label="Observaciones">
            <textarea value={form.observaciones} onChange={set("observaciones")} rows={3} className={inputClass} style={inputStyle} />
          </Field>
        </SeccionFormulario>

        <div className="flex gap-2 pt-2">
          <button type="submit" className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>
            {editing ? "Guardar cambios" : "Registrar cliente"}
          </button>
          <button type="button" onClick={onCancel} className="text-sm font-medium px-4 py-2 rounded-md border" style={ { borderColor: "#D1D5DB" } }>
            Cancelar
          </button>
        </div>
      </form>
    </div>
  );
}

        <div className="px-5 pb-5 pt-1 border-t" style={ { borderColor: "#F0F0EF" } }>

}

// Confirmación al marcar/desmarcar una factura como pagada. En la 1ra factura de un
// cliente de prorrateo alto pregunta QUÉ pagó: PAGO PARCIAL (completó su primer mes:
// cuenta para la comisión y siguen los recordatorios del saldo) o PAGO FACTURA
// COMPLETA. Si ya tiene saldo pendiente, la confirmación es "saldo pagado".
function ConfirmarFacturaModal({ nombre, n, nuevoEstado, permiteParcial, saldoPendiente, onCancel, onConfirm }) {
  const pagar = nuevoEstado === "pagada";
  const elegir = pagar && n === 1 && !!permiteParcial && !saldoPendiente;
  const saldo = pagar && n === 1 && !!saldoPendiente;
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg p-6 max-w-sm w-full">
        <h3 className="font-semibold mb-2 flex items-center gap-2" style={ { color: "#001E62" } }>
          <span aria-hidden="true">{pagar ? "✓" : "↩"}</span>
          {elegir ? `¿Qué pagó ${nombre}?` : saldo ? "¿Pagó el saldo?" : pagar ? "¿Marcar como pagada?" : "¿Desmarcar como pagada?"}
        </h3>
        {elegir ? (
          <div className="flex flex-col gap-2 mb-4">
            <button
              onClick={() => onConfirm({ parcial: true })}
              className="text-left px-3 py-2.5 rounded-md border-2"
              style={ { borderColor: "#001E62", color: "#001E62", background: "white" } }
            >
              <div className="text-sm font-bold">PAGO PARCIAL</div>
              <div className="text-xs mt-0.5" style={ { color: "#6B7280" } }>
                Completó su primer mes. Cuenta para tu comisión y siguen los recordatorios del saldo.
              </div>
            </button>
            <button
              onClick={() => onConfirm({ parcial: false })}
              className="text-left px-3 py-2.5 rounded-md border-2"
              style={ { borderColor: "#001E62", color: "white", background: "#001E62" } }
            >
              <div className="text-sm font-bold">PAGO FACTURA COMPLETA</div>
              <div className="text-xs mt-0.5" style={ { color: "#B9C4E0" } }>
                Pagó toda la factura. Cuenta para tu comisión y se apagan los recordatorios.
              </div>
            </button>
          </div>
        ) : (
          <p className="text-sm mb-5" style={ { color: "#6B7280" } }>
            {saldo
              ? `El saldo de la ${ORDINAL[n]} factura de ${nombre} se va a marcar como pagado y se apagan los recordatorios.`
              : pagar
              ? `La ${ORDINAL[n]} factura de ${nombre} se va a marcar como pagada.`
              : `La ${ORDINAL[n]} factura de ${nombre} va a volver a quedar como no pagada.`}
          </p>
        )}
        <div className="flex gap-2 justify-end">
          <button onClick={onCancel} className="text-sm px-3 py-1.5 rounded-md border" style={ { borderColor: "#D1D5DB" } }>Cancelar</button>
          {!elegir && (
            <button
              onClick={() => onConfirm({})}
              className="text-sm px-3 py-1.5 rounded-md text-white"
              style={ { background: pagar ? "#0F766E" : "#001E62" } }
            >
              {saldo ? "Sí, saldo pagado" : pagar ? "Sí, pagada" : "Sí, desmarcar"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

          <label className="text-xs" style={ { color: "#6B7280" } } title="A partir de qué % de prorrateo se envía el aviso D+3">

          </label>
          <input
            type="number"
            min="0"
            max="100"
            value={umbralProrrateo}
            onChange={(e) => setUmbralProrrateo(e.target.value === "" ? "" : Number(e.target.value))}
            className="w-16 px-2 py-1 rounded-md border text-sm outline-none"

        <button
          onClick={onCerrarSesion}
          className="text-sm text-left underline pt-2"
          style={ { color: "#C23B3B" } }
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  );
}

// Cuando un error pasa DENTRO del render de React, el navegador a veces solo
// reporta "Script error." sin detalle (por cómo Babel ejecuta el código). Este
// capturador recibe el error real directamente de React y sí puede mostrarlo completo.
class CapturadorErrores extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    try {
      mostrarErrorEnPantalla(
        (error && error.message ? error.message : String(error)) +
          '\n\nDónde:\n' +
          (info && info.componentStack ? info.componentStack.trim().split('\n').slice(0, 4).join('\n') : '?') +
          (error && error.stack ? '\n\nDetalle técnico:\n' + error.stack.split('\n').slice(0, 6).join('\n') : '')
      );
    } catch (e) {}
  }
  render() {
    if (this.state.error) return null;
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CapturadorErrores><App /></CapturadorErrores>);
</script>
</body>
</html>
