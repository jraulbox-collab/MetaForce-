<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Conexión a Supabase ----------
const SUPABASE_URL = "https://byudndybtvpozhytmxgw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5dWRuZHlidHZwb3poeXRteGd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODc0NDIsImV4cCI6MjA5OTM2MzQ0Mn0.94KZqhFex0iEc0-bpmv5oVh5net66Dgu6Xf3NMvedYk";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Almacenamiento en la nube (reemplaza window.storage / localStorage) ----------
const storage = {
  async get(key) {
    try {
      const { data, error } = await supabaseClient
        .from("kv_store")
        .select("value")
        .eq("key", key)
        .maybeSingle();
      if (error) throw error;
      if (!data) return null;
      return { key, value: data.value, shared: true };
    } catch (e) {
      console.error("Error leyendo de Supabase:", e);
      return null;
    }
  },
  async set(key, value) {
    try {
      const { error } = await supabaseClient
        .from("kv_store")
        .upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value, shared: true };
    } catch (e) {
      console.error("Error guardando en Supabase:", e);
      return null;
    }
  },
};

// ---------- Sincronización segura entre celular y computadora ----------
// Antes, cada guardado reemplazaba TODA la lista de la nube con lo que tenía esa pantalla:
// si una pantalla tenía datos viejos (por ejemplo la computadora con la app abierta desde
// ayer), al guardar pisaba lo que se hizo en el celular (marcas de "enviado", clientes...).
// Ahora cada guardado hace esto:
//   1) Lee lo que hay en la nube.
//   2) Mezcla por cliente y por campo SOLO lo que cambiaste en esta pantalla, tomando como
//      referencia la última versión sincronizada (mezcla de 3 vías). Lo que no tocaste aquí
//      se queda como está en la nube.
//   3) Guarda solo si nadie guardó entremedio ("compare-and-swap" con updated_at); si alguien
//      guardó, vuelve a leer y mezclar.
//   4) Si falla, reintenta solo (y avisa "Error al guardar" hasta lograrlo).
const jsonDe = (v) => JSON.stringify(v);

function dispositivoActual() {
  const ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  if (/iPhone|iPad|iPod/i.test(ua)) return "iphone";
  if (/Android/i.test(ua)) return "android";
  return "computadora";
}

// Mezcla de 3 vías de listas de objetos con "id": base = última versión sincronizada,
// local = lo que hay en esta pantalla, remoto = lo que hay en la nube ahora.
function mezclarListasPorId(base, local, remoto, nuevosAlPrincipio) {
  const mapa = (arr) => {
    const m = new Map();
    (Array.isArray(arr) ? arr : []).forEach((x) => { if (x && x.id != null) m.set(x.id, x); });
    return m;
  };
  const mB = mapa(base);
  const mL = mapa(local);
  const resultado = [];
  const usados = new Set();
  (Array.isArray(remoto) ? remoto : []).forEach((r) => {
    if (!r || r.id == null) { resultado.push(r); return; }
    usados.add(r.id);
    const l = mL.get(r.id);
    const b = mB.get(r.id);
    if (!l) {
      // No está aquí: si estaba en lo sincronizado, lo borraste en esta pantalla; si no, lo
      // agregaron en otro lado y se conserva.
      if (b) return;
      resultado.push(r);
      return;
    }
    if (!b) { resultado.push({ ...r, ...l }); return; }
    // No lo tocaste en esta pantalla: manda lo que hay en la nube.
    if (jsonDe(l) === jsonDe(b)) { resultado.push(r); return; }
    // Lo tocaste aquí: solo se aplican los campos que cambiaste.
    const f = { ...r };
    new Set([...Object.keys(l), ...Object.keys(b)]).forEach((k) => {
      if (jsonDe(l[k]) === jsonDe(b[k])) return;
      if (k in l) f[k] = l[k];
      else delete f[k];
    });
    resultado.push(f);
  });
  const nuevos = [];
  (Array.isArray(local) ? local : []).forEach((l) => {
    if (!l || l.id == null || usados.has(l.id)) return;
    // Estaba en lo sincronizado y ya no está en la nube: lo borraron en otro lado.
    if (mB.has(l.id)) return;
    nuevos.push(l);
  });
  return nuevosAlPrincipio ? [...nuevos, ...resultado] : [...resultado, ...nuevos];
}

function crearSincronizador(key, { nuevosAlPrincipio = false } = {}) {
  const s = {
    key,
    cargado: false,
    base: null,
    baseJSON: null,
    guardando: false,
    pendiente: false,
    fallos: 0,
    timerReintento: null,
    getLocal: () => [],
    alFusionar: null,
    alEstado: null,
    alExito: null,
  };

  async function leerNube() {
    const { data, error } = await supabaseClient
      .from("kv_store")
      .select("value, updated_at")
      .eq("key", key)
      .maybeSingle();
    if (error) throw error;
    if (!data) return { lista: null, actualizadoEn: null };
    let lista;
    try { lista = JSON.parse(data.value); } catch (e) { throw new Error("Los datos de la nube no se pudieron leer (" + key + ")"); }
    if (!Array.isArray(lista)) throw new Error("Los datos de la nube no tienen el formato esperado (" + key + ")");
    return { lista, actualizadoEn: data.updated_at };
  }

  // Devuelve true si guardó, false si alguien guardó entremedio (hay que volver a mezclar).
  async function escribirNube(lista, actualizadoEnPrevio) {
    const valor = jsonDe(lista);
    const ahora = new Date().toISOString();
    if (actualizadoEnPrevio == null) {
      const { error } = await supabaseClient.from("kv_store").insert({ key, value: valor, updated_at: ahora });
      if (error) {
        if (error.code === "23505") return false;
        throw error;
      }
      return true;
    }
    const { data, error } = await supabaseClient
      .from("kv_store")
      .update({ value: valor, updated_at: ahora })
      .eq("key", key)
      .eq("updated_at", actualizadoEnPrevio)
      .select("updated_at");
    if (error) throw error;
    return !!(data && data.length > 0);
  }

  function avisar(estado) {
    if (s.alEstado) s.alEstado(estado);
  }

  s.cargar = async function cargar() {
    try {
      const { lista } = await leerNube();
      s.cargado = true;
      s.base = lista || [];
      s.baseJSON = jsonDe(s.base);
      return { ok: true, lista };
    } catch (e) {
      console.error("Error leyendo de Supabase:", key, e);
      return { ok: false, lista: null };
    }
  };

  function programarReintento() {
    if (s.timerReintento) return;
    const espera = Math.min(60000, 3000 * Math.pow(2, Math.min(s.fallos, 5)));
    s.timerReintento = setTimeout(() => {
      s.timerReintento = null;
      s.sincronizar();
    }, espera);
  }

  s.sincronizar = async function sincronizar() {
    if (s.guardando) { s.pendiente = true; return; }
    s.guardando = true;
    try {
      let soloCarga = false;
      if (!s.cargado) {
        const r = await s.cargar();
        if (!r.ok) throw new Error("No se pudo leer la nube todavía");
        // Datos que llegan tarde (la app se abrió sin conexión): se mezclan con lo que ya hubiera
        // aquí y, como la pantalla cambia, el guardado se vuelve a disparar solo si hace falta.
        if (r.lista && s.alFusionar) s.alFusionar(r.lista, []);
        soloCarga = true;
        if (!r.lista) s.pendiente = true;
      }
      let intentos = 0;
      while (!soloCarga) {
        const local = s.getLocal();
        const { lista: remoto, actualizadoEn } = await leerNube();
        const fusionada = remoto === null ? local : mezclarListasPorId(s.base, local, remoto, nuevosAlPrincipio);
        const jsonFus = jsonDe(fusionada);
        if (remoto === null || jsonFus !== jsonDe(remoto)) {
          avisar("guardando");
          const ok = await escribirNube(fusionada, actualizadoEn);
          if (!ok) {
            intentos += 1;
            if (intentos >= 6) throw new Error("Demasiados guardados al mismo tiempo (" + key + ")");
            continue;
          }
        }
        s.base = fusionada;
        s.baseJSON = jsonFus;
        // Si la mezcla trajo cambios hechos en otro lado, esta pantalla los adopta (sin pisar
        // lo que hayas tocado mientras tanto).
        if (jsonFus !== jsonDe(local) && s.alFusionar) s.alFusionar(fusionada, local);
        break;
      }
      s.fallos = 0;
      avisar("guardado");
      if (s.alExito) s.alExito();
    } catch (e) {
      console.error("Error guardando en Supabase:", key, e);
      s.fallos += 1;
      avisar("error");
      programarReintento();
    } finally {
      s.guardando = false;
      if (s.pendiente) {
        s.pendiente = false;
        s.sincronizar();
      }
    }
  };

  return s;
}

// Lista de objetos con "id" que vive en la nube y se mantiene sincronizada.
// Devuelve [lista, setLista, sincronizador, cargada].
function useListaNube(key, { nuevosAlPrincipio = false, alEstado = null, alExito = null, alFusionarExtra = null } = {}) {
  const [lista, setLista] = useState([]);
  const [cargada, setCargada] = useState(false);
  const listaRef = useRef(lista);
  listaRef.current = lista;
  const refSync = useRef(null);
  if (refSync.current === null) refSync.current = crearSincronizador(key, { nuevosAlPrincipio });
  const sync = refSync.current;
  sync.getLocal = () => listaRef.current;
  sync.alEstado = alEstado;
  sync.alExito = alExito;
  sync.alFusionar = (fusionada, snapshot) => {
    if (alFusionarExtra) alFusionarExtra(fusionada, snapshot);

  useEffect(() => {

// falta borrar nada). Solo se hace si ya se leyeron los datos de la nube y no están vacíos.
async function respaldoDiario(obtenerDatos) {
  try {
    const hoy = fechaLocalISO(new Date());
    if (localStorage.getItem("antichurn_respaldo") === hoy) return;
    const { clientes, convergencias } = obtenerDatos();
    if (!Array.isArray(clientes) || clientes.length === 0) return;
    const clave = "respaldo-clientes-" + (Math.floor(Date.now() / 86400000) % 14);
    const { data, error } = await supabaseClient.from("kv_store").select("updated_at").eq("key", clave).maybeSingle();
    if (error) throw error;
    if (data && fechaLocalISO(data.updated_at) === hoy) {
      localStorage.setItem("antichurn_respaldo", hoy);
      return;
    }
    const r = await storage.set(clave, JSON.stringify({ fecha: hoy, clientes, convergencias }));
    if (r) localStorage.setItem("antichurn_respaldo", hoy);
  } catch (e) {
    console.error("No se pudo hacer la copia diaria:", e);
  }
}

function camposEstadoCliente(form, previo) {

  if (estadoCliente === "cancelado") {
    out.cancelado = true;

    out.motivoCancelacion = motivoCancelacion || "voluntaria";
    out.penalizado = false;

    out.penalizado = false;
    out.motivoPenalizacion = "";

}

// Limpia el teléfono para WhatsApp.
// - Si empieza con "+", ya trae su código de país (ej. +1 859…, +507 6…): se usa tal cual.
// - Si no, se asume Panamá y se le antepone 507 (salvo que ya empiece con 507).
function telefonoWhatsapp(telefono) {
  const texto = (telefono || "").trim();
  const digits = texto.replace(/\D/g, "");
  if (texto.startsWith("+")) return digits;
  if (digits.startsWith("507")) return digits;

}

function calcularPrimeraFactura(fechaInstalacion, cicloDia, montoMensual) {
  if (!fechaInstalacion || !cicloDia) return null;
  const dt = new Date(fechaInstalacion + "T00:00:00");
  const day = dt.getDate();
  let year = dt.getFullYear();
  let month = dt.getMonth();
  if (day >= cicloDia) {
    month += 1;
    if (month > 11) { month = 0; year += 1; }
  }
  const lastDay = daysInMonth(year, month);
  const diaFactura = Math.min(cicloDia, lastDay);
  const fecha1raFactura = toISO(new Date(year, month, diaFactura));
  const dias = Math.round((new Date(fecha1raFactura + "T00:00:00") - dt) / 86400000);
  const monto = montoMensual ? +((Number(montoMensual) * dias) / 30).toFixed(2) : "";
  return { fecha1raFactura, monto1raFactura: monto, dias };
}

// El cliente sigue "pendiente de instalación" (sin fechaInstalacion) hasta que se instala;
// mientras tanto la fecha y el horario que da Tigo se guardan aparte, así no se mueve
// ninguna factura ni comisión antes de tiempo.
const DIAS_LARGOS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const FRANJAS_INSTALACION = ["8:00 AM a 12:00 PM", "1:00 PM a 4:00 PM"];
const MARCA_BLOQUE_TIGO = "Datos de la orden Tigo:";

function fmtFechaInstalacionLarga(iso) {
  const [y, m, d] = String(iso || "").slice(0, 10).split("-").map(Number);
  if (!y || !m || !d) return "";
  return `${DIAS_LARGOS[new Date(y, m - 1, d).getDay()]} ${d} de ${MESES[m - 1]}`;
}
// Muestra el horario siempre igual: "8:00 AM - 12:00 PM" y "1:00 PM - 4:00 PM".
function franjaCorta(franja) {
  const m = String(franja || "").match(/(\d{1,2}):(\d{2})\s*([AP])M\s*(?:a|-|–|al?)\s*(\d{1,2}):(\d{2})\s*([AP])M/i);
  if (!m) return String(franja || "");
  const f = (h, mm, ap) => `${parseInt(h, 10)}:${mm} ${ap.toUpperCase()}M`;
  return `${f(m[1], m[2], m[3])} - ${f(m[4], m[5], m[6])}`;
}
// Hora de inicio en formato 24 h, para ordenar mañana antes que tarde.
function horaInicioFranja(franja) {
  const m = String(franja || "").match(/(\d{1,2}):(\d{2})\s*([AP])M/i);
  if (!m) return 99;
  let h = parseInt(m[1], 10) % 12;
  if (m[3].toUpperCase() === "P") h += 12;
  return h + parseInt(m[2], 10) / 60;
}
// Nombres en MAYÚSCULAS de Tigo -> "Los Santos", "Bda Rosales".
function tituloEs(s) {
  const chicas = ["de", "del", "y"];
  return String(s || "")
    .trim()
    .toLocaleLowerCase("es")
    .split(/\s+/)
    .map((p, i) => (i > 0 && chicas.includes(p) ? p : p.charAt(0).toLocaleUpperCase("es") + p.slice(1)))
    .join(" ");
}

// Lee el texto que Tigo da para la instalación (fecha MM/DD/AAAA, horario y datos del cliente).
function leerOrdenInstalacionTigo(texto) {
  let t = String(texto || "").replace(/\r/g, "");
  const etiquetas = [
    "Fecha seleccionada",
    "D[ií]a de la cita(?: actual)?\\s*:",
    "Intervalo de tiempo\\s*:",
    "Tipo de tarea",
    "ID\\s*-\\s*Sales\\s*Forces?\\s*WO",
    "Seleccionar hora",
    "Nombre del cliente\\s*:",
    "Suscript\\w*\\s*:",
    "N[úu]mero de cuenta\\s*:",
    "Distrito\\s*:",
    "Corregim\\w*\\s*:",
    "Barrio\\s*:",
    "Direcci[óo]n de la calle[^:\\n]*:",
    "Informaci[óo]n de direcci[óo]n adicional\\s*:",
    "Preferencia de Contacto Voz 1\\s*:",
    "Preferencia de Contacto Voz 2\\s*:",
    "Preferencia de Contacto Correo\\s*:",
  ];
  // Si el texto llegó sin saltos de línea, se separa cada dato por su etiqueta.
  t = t.replace(new RegExp("(" + etiquetas.join("|") + ")", "gi"), "\n$1");
  const tomar = (re) => {
    const m = t.match(re);
    return m ? m[1].trim() : "";
  };
  // Texto 1: "Fecha seleccionada" con el mes primero (MM/DD/AAAA).
  // Texto 2: "Dia de la cita actual" con el día primero (DD/MM/AAAA).
  const mf = t.match(/Fecha seleccionada\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i);
  const mc = t.match(/D[ií]a de la cita(?: actual)?\s*:[ \t]*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  let fecha = "";
  if (mf) fecha = fechaTigoAISO(mf[1]);
  else if (mc) fecha = fechaTigoAISO(`${mc[2]}/${mc[1]}/${mc[3]}`);
  if (!fecha) {
    const mg = t.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
    if (mg) fecha = fechaTigoAISO(mg[1]);
  }
  if (fecha) {
    const [y, m, d] = fecha.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) fecha = "";
  }
  const franjas = [];
  // Acepta "8:00 AM a 12:00 PM" y también "01:00pm-04:00pm".
  const reFranja = /(\d{1,2}):(\d{2})\s*([AP])\.?M\.?\s*(?:a|-|–|—)\s*(\d{1,2}):(\d{2})\s*([AP])\.?M\.?/gi;
  let mm;
  while ((mm = reFranja.exec(t)) !== null) {
    const f = `${parseInt(mm[1], 10)}:${mm[2]} ${mm[3].toUpperCase()}M a ${parseInt(mm[4], 10)}:${mm[5]} ${mm[6].toUpperCase()}M`;
    if (!franjas.includes(f)) franjas.push(f);
  }
  return {
    fecha,
    franjas,
    nombre: tomar(/Nombre del cliente\s*:[ \t]*([^\n]*)/i),
    suscriptor: tomar(/Suscript\w*\s*:[ \t]*(\d+)/i),
    cuenta: tomar(/N[úu]mero de cuenta\s*:[ \t]*(\d+)/i),
    distrito: tomar(/Distrito\s*:[ \t]*([^\n]*)/i),
    corregimiento: tomar(/Corregim\w*\s*:[ \t]*([^\n]*)/i),
    barrio: tomar(/Barrio\s*:[ \t]*([^\n]*)/i),
    direccion: tomar(/Direcci[óo]n de la calle[^:\n]*:[ \t]*([^\n]*)/i),
    direccionAdicional: tomar(/Informaci[óo]n de direcci[óo]n adicional\s*:[ \t]*([^\n]*)/i),
    voz1: tomar(/Preferencia de Contacto Voz 1\s*:[ \t]*([^\n]*)/i),
    voz2: tomar(/Preferencia de Contacto Voz 2\s*:[ \t]*([^\n]*)/i),
    correo: tomar(/Preferencia de Contacto Correo\s*:[ \t]*([^\s]*)/i).toLowerCase(),
    tecnologia: leerTecnologiaTigo(t),
  };
}
// FTTH (fibra) o HFC (coaxial): viene en "ID de Servicio", en el subtipo o en el tipo de orden.
function leerTecnologiaTigo(t) {
  const m =
    String(t || "").match(/ID de Servicio\s*:[ \t]*(FTTH|HFC)\b/i) ||
    String(t || "").match(/Subtipo de orden\s*:[ \t]*[^\n]*?(FTTH|HFC)/i) ||
    String(t || "").match(/Tipo de orden\s*:[ \t]*I?(FTTH|HFC)\b/i);
  return m ? m[1].toUpperCase() : "";
}

// Bloque de texto que se guarda en Observaciones (los datos que no tienen campo propio en la ficha).
function bloqueObservacionTigo(d) {
  const lineas = [MARCA_BLOQUE_TIGO];
  if (d.cuenta) lineas.push(`• Número de cuenta: ${d.cuenta}`);
  if (d.barrio) lineas.push(`• Barrio: ${tituloEs(d.barrio)}`);
  if (d.voz1) lineas.push(`• Teléfono de contacto 1: ${d.voz1}`);
  if (d.voz2) lineas.push(`• Teléfono de contacto 2: ${d.voz2}`);
  if (d.correo) lineas.push(`• Correo: ${d.correo}`);
  if (d.direccion) lineas.push(`• Dirección: ${d.direccion}`);
  if (d.direccionAdicional) lineas.push(`• Dirección adicional: ${d.direccionAdicional}`);
  const zona = [d.distrito, d.corregimiento].filter(Boolean).join(" · ");
  if (zona) lineas.push(`• Zona: ${zona}`);
  return lineas.join("\n");
}
// Pone el bloque al final de Observaciones; si ya había uno de otra orden, lo reemplaza.
function aplicarBloqueObservaciones(obs, bloque) {
  const re = new RegExp("\\n*" + MARCA_BLOQUE_TIGO + "(?:\\n•[^\\n]*)*", "g");
  const sin = String(obs || "").replace(re, "").trim();
  return sin ? sin + "\n\n" + bloque : bloque;
}
// Lee de vuelta los datos del bloque (para armar el mensaje y los avisos).
function leerBloqueTigo(obs) {
  const texto = String(obs || "");
  const get = (etiqueta) => {
    const m = texto.match(new RegExp("•\\s*" + etiqueta + ":[ \\t]*([^\\n]*)", "i"));
    return m ? m[1].trim() : "";
  };
  return {
    cuenta: get("Número de cuenta"),
    barrio: get("Barrio"),
    voz1: get("Teléfono de contacto 1"),
    voz2: get("Teléfono de contacto 2"),
    correo: get("Correo"),
  };
}
// Plan como lo entiende el cliente (sin "SINGLE/DOBLE").
function planParaCliente(c) {
  if (!c.planTipo || !c.velocidad) return "";
  const tec = c.tecnologia ? ` · ${c.tecnologia}` : "";
  if (c.planTipo === "DOBLE") return `Internet ${c.velocidad} + TV${c.planTV ? " " + c.planTV : ""}${tec}`;
  return `Internet ${c.velocidad}${tec}`;
}

// Clientes pendientes con instalación programada, separados en hoy, mañana y vencidas.
function instalacionesPorAvisar(clientes) {
  const hoy = fechaLocalISO(new Date());
  const manana = addDays(hoy, 1);
  const g = { hoy: [], manana: [], vencidas: [], total: 0 };
  (clientes || []).forEach((c) => {
    if (c.fechaInstalacion || !c.instalacionProgramada || c.cancelado || c.penalizado) return;
    const f = c.instalacionProgramada;
    if (f === hoy) g.hoy.push(c);
    else if (f === manana) g.manana.push(c);
    else if (f < hoy) g.vencidas.push(c);
  });
  const porHora = (a, b) => horaInicioFranja(a.franjaInstalacion) - horaInicioFranja(b.franjaInstalacion);
  g.hoy.sort(porHora);
  g.manana.sort(porHora);
  g.vencidas.sort((a, b) => String(a.instalacionProgramada).localeCompare(String(b.instalacionProgramada)) || porHora(a, b));
  g.total = g.hoy.length + g.manana.length + g.vencidas.length;
  return g;
}

// Frase de vencimiento calculada según los días reales que faltan hoy
// (no un número fijo), con casos especiales para "vence hoy" y atrasos.
function fraseVencimiento(dias) {
  if (dias > 0) return `vence en ${dias} día${dias !== 1 ? "s" : ""}`;
  if (dias === 0) return "vence hoy";
  const atraso = Math.abs(dias);
  return `venció hace ${atraso} día${atraso !== 1 ? "s" : ""}`;
}

// Mensajes preventivos para clientes de prorrateo alto instalados desde septiembre
// 2026 en adelante: en vez de esperar a que exista la factura real (con el número
// grande de prorrateo + mensualidad), se le pide completar el resto de su primer
// mes en una fecha de QUINCENA (día 15 o 30) — sin mencionar montos, la factura
// oficial de Tigo ni su fecha de vencimiento.
const DIAS_SEMANA = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
// "viernes 30 de octubre"
function fmtFechaConDia(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-").map(Number);
  return `${DIAS_SEMANA[new Date(y, m - 1, d).getDay()]} ${d} de ${MESES[m - 1]}`;
}
// Quincenas (día 15 y día 30, o el último día si el mes es más corto) de `meses`
// meses seguidos desde el mes de `desdeISO`. Si caen en fin de semana, se corren
// al viernes anterior. Los feriados no se consideran.
function quincenasDesde(desdeISO, meses) {
  const [y0, m0] = desdeISO.split("-").map(Number);
  const out = [];
  for (let i = 0; i < meses; i++) {
    const total = (m0 - 1) + i;
    const y = y0 + Math.floor(total / 12);
    const m = (total % 12) + 1;
    const ultimo = Math.min(30, daysInMonth(y, m - 1));
    [15, ultimo].forEach((d) => {
      const dt = new Date(y, m - 1, d);
      while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate() - 1);
      out.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`);
    });
  }
  return out.sort();
}
// Fecha de pago que se le pide al cliente: la ÚLTIMA quincena anterior a la fecha en
// que sale su 1ra factura y que quede al menos 10 días después de la instalación.
// Si no hay ninguna, la primera quincena que quede a 10 días o más de la instalación.
function fechaPagoQuincena(c) {
  if (!c.fechaInstalacion) return null;
  const minimo = addDays(c.fechaInstalacion, 10);
  const quincenas = quincenasDesde(c.fechaInstalacion, 4).filter((q) => q >= minimo);
  if (c.fecha1raFactura) {
    const antes = quincenas.filter((q) => q < c.fecha1raFactura);
    if (antes.length) return antes[antes.length - 1];
  }
  return quincenas.length ? quincenas[0] : null;
}
function textoToque1(c) {

function textoToque2(c) {

    : dias > 1 ? `Le recuerdo que el *${dia}*, con la quincena, es un buen día para completar el pago de su primer mes y dejar su cuenta al día.`
    : `Le recuerdo completar el pago restante de su primer mes para dejar su cuenta al día.`;
  return `Hola ${nombre}, le habla José Severino de Tigo Panamá, sobre su *servicio residencial*.

${frase}

Puede pagar con su número de suscriptor *${c.numeroSuscriptor}*. Una vez realizado, compárteme el comprobante para confirmar que ingresó correctamente. Quedo atento.`;

const TIPOS_ALERTA = [

  { type: "toque1", tag: "👋", corto: "Bienvenida", label: "Bienvenida (pedir abono)", color: "#0072CE", bg: "#E3EDFA" },
  { type: "toque2", tag: "🔔", corto: "Pedir abono", label: "Recordatorio de abono", color: "#0072CE", bg: "#E3EDFA" },
];

// Cliente de "prorrateo alto": instalado desde el 1 de septiembre de 2026 y cuyo
// prorrateo de la 1ra factura es igual o mayor al umbral configurado (por defecto 25 %).
// A estos clientes se les mandan los mensajes de abono (bienvenida y recordatorio) y,
// al marcar su 1ra factura como pagada, pueden quedar en PAGO PARCIAL.
function esProrrateoAlto(cliente, umbralProrrateo) {
  const cicloDia = parseInt(cliente.cicloFacturacion, 10) || null;
  if (!(cicloDia && cliente.montoMensual && cliente.fechaInstalacion >= "2026-09-01")) return false;
  const r = calcularPrimeraFactura(cliente.fechaInstalacion, cicloDia, cliente.montoMensual);
  if (!r || !(Number(r.monto1raFactura) > 0)) return false;
  const pct = (Number(r.monto1raFactura) / Number(cliente.montoMensual)) * 100;
  return pct >= Number(umbralProrrateo ?? 25);
}

function calcularFacturas(cliente, umbralProrrateo) {
  if (!cliente.fechaInstalacion || cliente.penalizado) return [];
  const cicloDia = parseInt(cliente.cicloFacturacion, 10) || null;
  const facturas = [];
  for (let n = 1; n <= 4; n++) {
    const generada =
      n === 1
        ? cliente.fecha1raFactura
        : cicloDia
        ? addMonthsKeepDay(cliente.fecha1raFactura, n - 1, cicloDia)
        : addDays(cliente.fecha1raFactura, 30 * (n - 1));
    const siguienteGenerada = cicloDia
      ? addMonthsKeepDay(generada, 1, cicloDia)
      : addDays(generada, 30);
    const vencimiento = addDays(siguienteGenerada, -1);
    // Solo la 1ra factura (la que decide si el cliente cuenta para tu comisión)
    // mantiene los 3 avisos completos. De la 2da en adelante, con el aviso de
    // 3 días antes alcanza — ya no hace falta la insistencia de D+1 y 15 días.
    const tiposParaEstaFactura = cliente.cancelado ? [] : n === 1 ? MILESTONE_TYPES : MILESTONE_TYPES.filter((mt) => mt.type === "t3");
    const milestones = tiposParaEstaFactura.map((mt) => {
      const key = `f${n}_${mt.type}`;
      const triggerDate =
        mt.type === "d1" ? addDays(generada, 1) :
        mt.type === "t15" ? addDays(vencimiento, -15) :
        addDays(vencimiento, -3);
      const enviado = !!cliente[key];
      const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
      const texto = mt.getTexto({ ...cliente, _venc: vencimiento, plan: planLabelMensaje(cliente) }, n);
      return { ...mt, key, n, triggerDate, enviado, pendienteHoy, texto };
    });

    // Solo para la 1ra factura, de clientes instalados desde septiembre 2026 en
    // adelante: si el prorrateo es igual o mayor al umbral configurado, se agregan
    // dos avisos preventivos (Toque 1 a los 2 días de la instalación, Toque 2 el día
    // ANTES de la fecha de quincena de pago) para que adelante el abono antes de que
    // exista la factura real con el número grande.
    if (n === 1 && !cliente.cancelado && esProrrateoAlto(cliente, umbralProrrateo)) {
        {
          [
            { type: "toque1", tag: "👋", label: "Bienvenida (pedir abono)", getFecha: (cl) => addDays(cl.fechaInstalacion, 2), key: "aviso_toque1", getTexto: textoToque1 },
            { type: "toque2", tag: "🔔", label: "Recordatorio de abono", getFecha: (cl) => { const fp = fechaPagoQuincena(cl); return fp ? addDays(fp, -1) : addDays(cl.fechaInstalacion, 25); }, key: "aviso_toque2", getTexto: textoToque2 },
          ].forEach((t) => {
            const triggerDate = t.getFecha(cliente);
            const enviado = !!cliente[t.key];
            const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
            const texto = t.getTexto(cliente);
            milestones.push({
              type: t.type,
              tag: t.tag,
              label: t.label,
              color: "#0072CE",
              bg: "#E3EDFA",
              key: t.key,
              n,
              triggerDate,
              enviado,
              pendienteHoy,
              texto,
            });
          });
        }
    }

    facturas.push({ n, generada, vencimiento, milestones });
  }
  return facturas;
}

function facturaActual(facturas) {
  if (!facturas.length) return null;
  for (let i = facturas.length - 1; i >= 0; i--) {
    if (daysFromToday(facturas[i].generada) <= 0) return facturas[i];
  }
  return facturas[0];
}

// ---------- Selector de rango de fechas en un solo campo (calendario único) ----------
// Usa flatpickr en modo "range": el usuario abre un solo calendario y elige
// primero la fecha inicial y luego la final, sin tener que usar dos campos separados.
function RangoFechasInput({ desde, hasta, onChange, className, style, placeholder = "Seleccionar rango de fechas" }) {
  const inputRef = useRef(null);
  const fpRef = useRef(null);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange;

  useEffect(() => {
    if (!inputRef.current || !window.flatpickr) return;
    fpRef.current = window.flatpickr(inputRef.current, {
      mode: "range",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d/m/Y",
      locale: window.flatpickr.l10ns && window.flatpickr.l10ns.es ? "es" : undefined,
      defaultDate: [desde, hasta].filter(Boolean),
      onChange: (selectedDates) => {
        if (selectedDates.length === 2) {
          onChangeRef.current(fechaLocalISO(selectedDates[0]), fechaLocalISO(selectedDates[1]));
        } else if (selectedDates.length === 0) {
          onChangeRef.current("", "");
        }
      },
    });
    return () => {
      if (fpRef.current) fpRef.current.destroy();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Mantiene el calendario sincronizado si el rango cambia desde afuera (ej. botón "Limpiar").
  useEffect(() => {
    if (fpRef.current) {
      fpRef.current.setDate([desde, hasta].filter(Boolean), false);
    }
  }, [desde, hasta]);

  return (
    <input
      ref={inputRef}
      type="text"
      readOnly
      placeholder={placeholder}
      className={className || "px-3 py-2 rounded-md border text-sm outline-none cursor-pointer"}
      style={style || { borderColor: "#DFE5EF" } }
    />
  );
}

      },
    });
    return () => { if (fpRef.current) fpRef.current.destroy(); };

        className="rounded-full px-3 py-1.5 text-xs font-bold border whitespace-nowrap"
        style={ activo ? { background: "#001E62", color: "#fff", borderColor: "#001E62" } : { background: "#fff", color: "#001E62", borderColor: "#DFE5EF" } }
      >
        📅{activo ? " " + corto(desde) + (hasta && hasta !== desde ? " – " + corto(hasta) : "") : ""}

      {activo && (
        <button
          type="button"
          onClick={() => onChangeRef.current("", "")}
          aria-label="Quitar rango de fechas"
          title="Quitar rango de fechas"
          className="ml-1 text-xs font-bold px-1.5"
          style={ { color: "#001E62" } }
        >✕</button>
      )}
    </span>
  );
}

// ---------- Componente principal ----------
// Resumen de facturas ya emitidas (hasta hoy) y cuántas de esas están pagadas.
function facturasResumen(c) {
  const generadas = (c.facturas || []).filter((f) => daysFromToday(f.generada) <= 0);
  const pagadas = generadas.filter((f) => c[`f${f.n}_estado`] === "pagada");
  return { emitidas: generadas.length, pagadas: pagadas.length };
}

const CAMPOS_EXPORTAR = [
  ["suscriptor", "N° Suscriptor"],
  ["nombre", "Nombre del cliente"],
  ["instalacion", "Fecha de instalación"],
  ["facturasEmitidas", "Facturas emitidas"],
  ["facturasPagadas", "Facturas pagadas hasta la fecha"],
  ["telefono", "Teléfono"],
  ["plan", "Plan"],
  ["monto", "Monto mensual"],
];

// "ISRAEL NORIEGA MENDOZA" -> "Israel Noriega Mendoza" (de, del, la, los... quedan en minúscula).
const PARTICULAS_NOMBRE = ["de", "del", "la", "las", "los", "y"];
function nombreLegible(s) {
  return String(s || "")
    .trim()
    .toLowerCase()
    .split(/\s+/)
    .filter(Boolean)
    .map((p, i) => (i > 0 && PARTICULAS_NOMBRE.includes(p) ? p : p.charAt(0).toUpperCase() + p.slice(1)))
    .join(" ");
}

// "DOBLE 300 Megas + COMBO PACK" -> "Doble 300 + Combo"; "SINGLE 150 Megas" -> "Single 150".
function planCorto(c) {
  if (!c.planTipo || !c.velocidad) return "";
  const tipo = c.planTipo === "SINGLE" ? "Single" : "Doble";
  const vel = String(c.velocidad).replace(/\s*megas?/i, "").trim();
  let tv = "";
  if (c.planTipo === "DOBLE" && c.planTV) {
    tv = /combo/i.test(c.planTV) ? "Combo" : nombreLegible(c.planTV).replace(/^Tv\b/, "TV");
  }
  return `${tipo} ${vel}${tv ? " + " + tv : ""}`;
}

function enRangoFechas(fecha, desde, hasta) {
  if (!fecha) return false;
  if (desde && fecha < desde) return false;
  if (hasta && fecha > hasta) return false;
  return true;
}

function ExportarModal({ clientes, clientesMovil, onCerrar }) {
  const [desde, setDesde] = useState("");
  const [hasta, setHasta] = useState("");
  const [incluirHogar, setIncluirHogar] = useState(true);
  const [incluirMovil, setIncluirMovil] = useState(true);
  const [incluirPendientes, setIncluirPendientes] = useState(false);
  const [campos, setCampos] = useState({
    suscriptor: true,
    nombre: true,
    instalacion: true,
    facturasEmitidas: false,
    facturasPagadas: false,
    telefono: false,
    plan: true,
    monto: true,
  });
  const [copiado, setCopiado] = useState(false);

  // Hogar: clientes ya instalados dentro del rango.
  const hogar = useMemo(() => {
    return clientes
      .filter((c) => enRangoFechas(c.fechaInstalacion, desde, hasta))
      .sort((a, b) => a.fechaInstalacion.localeCompare(b.fechaInstalacion))
      .map((c) => {
        const r = facturasResumen(c);
        const monto = Number(c.montoMensual);
        return {
          tipo: "hogar",
          fecha: c.fechaInstalacion,
          nombre: c.nombre || "",
          suscriptor: c.numeroSuscriptor || "",
          telefono: c.telefono || "",
          planCsv: planLabel(c),
          planCorto: planCorto(c),
          monto: c.montoMensual !== "" && c.montoMensual != null && !isNaN(monto) ? monto : null,
          emitidas: r.emitidas,
          pagadas: r.pagadas,
        };
      });
  }, [clientes, desde, hasta]);

  // Pendientes de instalación (Hogar sin fecha de instalación): no dependen del rango de fechas.
  const pendientes = useMemo(() => {
    return clientes
      .filter((c) => !c.fechaInstalacion)
      .sort((a, b) => String(a.creadoEn || "").localeCompare(String(b.creadoEn || "")))
      .map((c) => {
        const monto = Number(c.montoMensual);
        return {
          tipo: "pendiente",
          fecha: "",
          nombre: c.nombre || "",
          suscriptor: c.numeroSuscriptor || "",
          telefono: c.telefono || "",
          planCsv: planLabel(c),
          planCorto: planCorto(c),
          monto: c.montoMensual !== "" && c.montoMensual != null && !isNaN(monto) ? monto : null,
          emitidas: "",
          pagadas: "",
        };
      });
  }, [clientes]);

  // Móvil: por fecha de activación. No tienen N° de suscriptor: su "línea" es el teléfono del contrato.
  const movil = useMemo(() => {
    return (clientesMovil || [])
      .map((c) => ({ c, fecha: fechaActivacionMovil(c) }))
      .filter((x) => enRangoFechas(x.fecha, desde, hasta))
      .sort((a, b) => a.fecha.localeCompare(b.fecha))
      .map(({ c, fecha }) => {
        const etiqueta = etiquetaTipoMovil(tipoClienteMovil(c));
        return {
          tipo: "movil",
          fecha,
          nombre: c.nombre || "",
          suscriptor: c.telefono || "",
          telefono: c.telefono || "",
          planCsv: etiqueta,
          planCorto: etiqueta,
          monto: c.montoPlan != null && c.montoPlan !== "" && !isNaN(Number(c.montoPlan)) ? Number(c.montoPlan) : null,
          emitidas: "",
          pagadas: "",
        };
      });
  }, [clientesMovil, desde, hasta]);

  const seleccion = [
    ...(incluirHogar ? hogar : []),
    ...(incluirPendientes ? pendientes : []),
    ...(incluirMovil ? movil : []),
  ];
  const hayCampos = CAMPOS_EXPORTAR.some(([key]) => campos[key]);
  const labelCampo = (key, label) => {
    if (key === "suscriptor" && incluirMovil) return "N° Suscriptor / línea";
    if (key === "instalacion" && incluirMovil) return "Fecha de instalación / activación";
    return label;
  };

  // ---- Texto para WhatsApp ----
  function construirTexto() {
    const dinero = (n) => `$${n.toFixed(2)}`;
    const linea = (it) => {
      const p = [];
      if (campos.nombre) p.push(nombreLegible(it.nombre) || "Sin nombre");
      if (campos.suscriptor && it.suscriptor) p.push(it.suscriptor);
      if (campos.telefono && it.telefono && !(campos.suscriptor && it.tipo === "movil")) p.push(it.telefono);
      if (campos.plan && it.planCorto) p.push(it.planCorto);
      if (it.tipo === "hogar") {
        if (campos.facturasEmitidas && campos.facturasPagadas) {
          p.push(`${it.pagadas}/${it.emitidas} facturas pagadas`);
        } else if (campos.facturasEmitidas) {
          p.push(`${it.emitidas} factura${it.emitidas === 1 ? "" : "s"} emitida${it.emitidas === 1 ? "" : "s"}`);
        } else if (campos.facturasPagadas) {
          p.push(`${it.pagadas} factura${it.pagadas === 1 ? "" : "s"} pagada${it.pagadas === 1 ? "" : "s"}`);
        }
      }
      if (campos.monto && it.monto != null) p.push(dinero(it.monto));
      return "• " + p.join(" · ");
    };
    const seccion = (titulo, nombreTotal, lista, sinFecha) => {
      let out = `*${titulo} (${lista.length})*\n`;
      let dia = null;
      lista.forEach((it) => {
        if (!sinFecha && campos.instalacion && it.fecha !== dia) {
          dia = it.fecha;
          out += `${fmtFechaDia(it.fecha)}\n`;
        }
        out += linea(it) + "\n";
      });
      if (campos.monto) {
        const suma = lista.reduce((s, it) => s + (it.monto || 0), 0);
        if (suma > 0) out += `Total ${nombreTotal}: ${dinero(suma)}\n`;
      }
      return out.trimEnd();
    };
    const soloPendientes = incluirPendientes && !incluirHogar && !incluirMovil;
    const rango = soloPendientes
      ? ""
      : desde && hasta
        ? `${fmtFecha(desde)} – ${fmtFecha(hasta)}`
        : desde ? `desde ${fmtFecha(desde)}` : hasta ? `hasta ${fmtFecha(hasta)}` : "";
    const titulo = soloPendientes
      ? "Pendientes de instalación"
      : incluirHogar && incluirMovil
        ? "Instalaciones y activaciones"
        : incluirMovil ? "Activaciones móvil" : "Instalaciones";
    const bloques = [];
    if (incluirHogar && hogar.length) bloques.push(seccion("HOGAR", "Hogar", hogar));
    if (incluirPendientes && pendientes.length) bloques.push(seccion("PENDIENTES DE INSTALACIÓN", "por instalar", pendientes, true));
    if (incluirMovil && movil.length) bloques.push(seccion("MÓVIL", "Móvil", movil));
    return `*${titulo}${rango ? " " + rango : ""}*\n\n${bloques.join("\n\n")}`;
  }

  // ---- Tabla para CSV ----
  function construirTabla() {
    const activos = CAMPOS_EXPORTAR.filter(([key]) => campos[key]);
    const conTipo = incluirMovil || incluirPendientes;
    const encabezado = [...(conTipo ? ["Tipo"] : []), ...activos.map(([key, label]) => labelCampo(key, label))];
    const filas = seleccion.map((it) => [
      ...(conTipo ? [it.tipo === "movil" ? "Móvil" : it.tipo === "pendiente" ? "Pendiente de instalación" : "Hogar"] : []),
      ...activos.map(([key]) => {
        switch (key) {
          case "suscriptor": return it.suscriptor;
          case "nombre": return it.nombre;
          case "instalacion": return it.fecha ? fmtFechaNum(it.fecha) : "";
          case "facturasEmitidas": return it.emitidas;
          case "facturasPagadas": return it.pagadas;
          case "telefono": return it.telefono;
          case "plan": return it.planCsv;
          case "monto": return it.monto != null ? it.monto : "";
          default: return "";
        }
      }),
    ]);
    return { encabezado, filas };
  }

  function descargarCSV() {
    const { encabezado, filas } = construirTabla();
    const csv = [encabezado, ...filas]
      .map((fila) => fila.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `suscriptores_instalados_${desde || "inicio"}_a_${hasta || "hoy"}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function copiarTexto() {
    navigator.clipboard?.writeText(construirTexto()).catch(() => {});
    setCopiado(true);
    setTimeout(() => setCopiado(false), 1500);
  }

  const sinDatos = seleccion.length === 0 || !hayCampos;
  const textoVista = seleccion.length && hayCampos ? construirTexto() : "";
  const lineasVista = textoVista ? textoVista.split("\n") : [];
  const LIMITE_VISTA = 12;
  const vistaPrevia = lineasVista.length > LIMITE_VISTA
    ? lineasVista.slice(0, LIMITE_VISTA).join("\n") + `\n… y ${lineasVista.length - LIMITE_VISTA} líneas más`
    : textoVista;

  const chipTipo = (activo, onClick, texto) => (
    <button
      type="button"
      onClick={onClick}
      className="text-sm font-medium px-4 rounded-full border"
      style={ activo
        ? { background: "#001E62", borderColor: "#001E62", color: "white", minHeight: 40 }
        : { background: "white", borderColor: "#DFE5EF", color: "#374151", minHeight: 40 } }
    >
      {texto}
    </button>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={ { background: "rgba(0,0,0,0.45)" } }>
      <div className="bg-white rounded-lg shadow-lg w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold" style={ { color: "#001E62" } }>⬇️ Exportar suscriptores</h3>
          <button onClick={onCerrar} className="text-sm px-2" style={ { color: "#5A6680" } }>✕</button>
        </div>

        <div className="mb-4">
          <label className="text-xs font-medium block mb-1.5" style={ { color: "#5A6680" } }>
            Rango de fecha de instalación
          </label>
          <RangoFechasInput
            desde={desde}
            hasta={hasta}
            onChange={(d, h) => { setDesde(d); setHasta(h); } }
            className="w-full px-3 py-2 rounded-md border text-sm outline-none cursor-pointer"
          />
        </div>

        <div className="mb-4">
          <label className="text-xs font-medium block mb-2" style={ { color: "#5A6680" } }>Qué clientes incluir</label>
          <div className="flex gap-2 flex-wrap">
            {chipTipo(incluirHogar, () => setIncluirHogar((v) => !v), `Hogar (${hogar.length})`)}
            {chipTipo(incluirMovil, () => setIncluirMovil((v) => !v), `Móvil (${movil.length})`)}
            {chipTipo(incluirPendientes, () => setIncluirPendientes((v) => !v), `Pendientes de instalación (${pendientes.length})`)}
          </div>
        </div>

        <div className="mb-4">
          <label className="text-xs font-medium block mb-2" style={ { color: "#5A6680" } }>Qué datos mostrar</label>
          <div className="grid grid-cols-2 gap-x-3 gap-y-1.5">
            {CAMPOS_EXPORTAR.map(([key, label]) => (
              <label key={key} className="flex items-center gap-2 text-sm">
                <input
                  type="checkbox"
                  checked={!!campos[key]}
                  onChange={(e) => setCampos((prev) => ({ ...prev, [key]: e.target.checked }))}
                />
                {labelCampo(key, label)}
              </label>
            ))}
          </div>
        </div>

        <p className="text-xs mb-3" style={ { color: "#9CA3AF" } }>
          {desde || hasta ? "Solo los de ese rango." : "No elegiste rango: se incluyen todos."}
          {" "}Los móviles cuentan por su fecha de activación. Los pendientes de instalación no dependen del rango.
        </p>

        {vistaPrevia ? (
          <div className="mb-4">
            <label className="text-xs font-medium block mb-1.5" style={ { color: "#5A6680" } }>Así se verá al enviarlo</label>
            <div
              className="rounded-md border p-3 text-xs"
              style={ { borderColor: "#DFE5EF", background: "#F7F9FC", color: "#1F2937", whiteSpace: "pre-wrap", lineHeight: 1.55 } }
            >
              {vistaPrevia}
            </div>
          </div>
        ) : (
          <p className="text-xs mb-4" style={ { color: "#9CA3AF" } }>
            {!incluirHogar && !incluirMovil && !incluirPendientes
              ? "Elige al menos un tipo de cliente."
              : !hayCampos ? "Elige al menos un dato para mostrar." : "No hay clientes en ese rango."}
          </p>
        )}

        <div className="flex gap-2">
          <button
            onClick={copiarTexto}
            disabled={sinDatos}
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md text-white disabled:opacity-40"
            style={ { background: "#001E62" } }
          >
            {copiado ? "✓ Copiado" : "📋 Copiar para WhatsApp"}
          </button>
          <button
            onClick={descargarCSV}
            disabled={sinDatos}
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md border disabled:opacity-40"
            style={ { borderColor: "#DFE5EF", color: "#374151" } }
          >
            ⬇️ Descargar CSV
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [autenticado, setAutenticado] = useState(() => {
    try {
      return localStorage.getItem("antichurn_auth") === "1";
    } catch (e) {
      return false;
    }
  });
  // Estado de guardado visible para el usuario: "guardando" mientras hay una escritura en
  // curso hacia Supabase, "guardado" cuando terminó bien, "error" si falló (se reintenta solo).
  // Se combina con si el celular/navegador está sin conexión. Junta el estado de cada lista.
  const [estadoGuardado, setEstadoGuardado] = useState("guardado");
  const estadosNubeRef = useRef({});
  const reportarEstadoNube = (clave) => (estado) => {
    estadosNubeRef.current[clave] = estado;
    const vals = Object.values(estadosNubeRef.current);
    setEstadoGuardado(vals.includes("error") ? "error" : vals.includes("guardando") ? "guardando" : "guardado");
  };
  const depurarDiarioRef = useRef(() => {});
  const aplicarDiarioRef = useRef(() => {});
  const registrarFusionRef = useRef(() => {});
  const opcionesNube = (clave, extra = {}) => ({
    alEstado: reportarEstadoNube(clave),
    alExito: () => depurarDiarioRef.current(),
    alFusionarExtra: (fusionada, snapshot) => registrarFusionRef.current(clave, fusionada, snapshot),
    ...extra,
  });
  const [clientes, setClientes, syncClientes, loaded] = useListaNube("clientes-churn", opcionesNube("clientes"));
  const [convergencias, setConvergencias, syncConv, convergenciasLoaded] = useListaNube("convergencias-churn", opcionesNube("convergencias"));
  const [eliminados, setEliminados, syncElim, eliminadosLoaded] = useListaNube("clientes-eliminados", opcionesNube("eliminados"));
  const [historialCambios, setHistorialCambios, syncHist, historialCambiosLoaded] = useListaNube("historial-cambios-churn", opcionesNube("historial", { nuevosAlPrincipio: true }));
  // Bitácora de envíos: cada marca de "enviado" (y cada vez que otro dispositivo trae cambios)
  // queda anotada con fecha y dispositivo, para poder rastrear cualquier desajuste.
  const [envios, setEnvios, syncEnvios] = useListaNube("envios-churn", opcionesNube("envios", { nuevosAlPrincipio: true }));
  function registrarEnvio(datos) {
    setEnvios((prev) => [{ id: uid(), fecha: new Date().toISOString(), dispositivo: dispositivoActual(), ...datos }, ...prev].slice(0, 600));
  }
  registrarFusionRef.current = (clave, fusionada, snapshot) => {
    try {
      if (clave === "envios" || clave === "historial" || !snapshot || snapshot.length === 0) return;
      const m = new Map(snapshot.map((x) => [x.id, jsonDe(x)]));
      let cambios = 0;
      fusionada.forEach((x) => {
        if (m.get(x.id) !== jsonDe(x)) cambios += 1;
        m.delete(x.id);
      });
      cambios += m.size;
      if (cambios > 0) registrarEnvio({ tipo: "fusion", lista: clave, cambios, origen: "sync" });
    } catch (e) {}
  };
  const periodoActualApp = periodoComision(fechaLocalISO(new Date()));
  const [seccionMensajes, setSeccionMensajes] = useState(() => {
    try { return localStorage.getItem("antichurn_seccion_mensajes") === "ventas" ? "ventas" : "cobros"; } catch (e) { return "cobros"; }
  });
  useEffect(() => {
    try { localStorage.setItem("antichurn_seccion_mensajes", seccionMensajes); } catch (e) {}
  }, [seccionMensajes]);
  function aplicarCambioVenta(vmActual, k, cambio) {
    const vm = { ...(vmActual || {}) };
    if (cambio === null) delete vm[k];
    else {
      const nuevo = { ...(vm[k] || {}), ...cambio };
      Object.keys(nuevo).forEach((x) => { if (nuevo[x] === undefined) delete nuevo[x]; });
      vm[k] = nuevo;
    }
    return vm;
  }
  function cambiarVentaMsg(idCliente, k, cambio) {
    const mov = convergencias.find((m) => m.id === idCliente);

  function useGuardadoSerie(key) {
    const guardandoRef = useRef(false);
    const pendienteRef = useRef(null);
    return useRef(async function persist(valor) {
      if (guardandoRef.current) {
        pendienteRef.current = valor;
        return;
      }
      guardandoRef.current = true;
      try {
        await storage.set(key, valor);
      } catch (e) {}
      guardandoRef.current = false;
      if (pendienteRef.current !== null) {
        const siguiente = pendienteRef.current;
        pendienteRef.current = null;
        persist(siguiente);

    }).current;

  function aplicarDatosTigo(lista) {

    const porId = new Map(lista.map((u) => [u.id, u]));

  // Desde el precierre: iguala el plan (Single/Doble, velocidad, TV) al que activó Tigo.
  // La mensualidad no cambia sola: se propone la más común entre tus clientes con ese plan.
  function corregirPlanDesdePrecierre(clienteId, plan) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes || !plan || (plan.tipo !== "SINGLE" && plan.tipo !== "DOBLE")) return;
    const mismos = clientes
      .filter((c) => c.id !== clienteId && c.planTipo === plan.tipo && String(c.velocidad || "").trim() === plan.velocidad && (plan.tipo === "SINGLE" || String(c.planTV || "").trim() === plan.tv))
      .map((c) => Number(c.montoMensual))
      .filter((m) => m > 0);
    const cuenta = {};
    mismos.forEach((m) => { cuenta[m] = (cuenta[m] || 0) + 1; });
    const masComun = Object.entries(cuenta).sort((x, y) => y[1] - x[1])[0];
    const montoNuevo = masComun ? Number(masComun[0]) : antes.montoMensual;
    const textoAntes = `${planCorto(antes) || "—"} · ${antes.montoMensual !== "" && antes.montoMensual != null ? fmtMonto(antes.montoMensual) : "sin monto"}`;
    const textoAhora = `${planTigoTexto(plan)} · ${montoNuevo !== "" && montoNuevo != null ? fmtMonto(montoNuevo) : "sin monto"}`;
    const nota = masComun ? "\n\n(La mensualidad es la más común entre tus clientes con ese plan. Puedes ajustarla en Editar.)" : "\n\nLa mensualidad no cambia. Revísala en Editar si hace falta.";
    if (!window.confirm("¿Corregir el plan de " + antes.nombre + "?\n\nAntes: " + textoAntes + "\nAhora (Tigo): " + textoAhora + nota)) return;
    let despues = { ...antes, planTipo: plan.tipo, velocidad: plan.velocidad, planTV: plan.tipo === "DOBLE" ? plan.tv : "", montoMensual: montoNuevo };
    if (antes.fechaInstalacion && antes.cicloFacturacion && montoNuevo !== "" && montoNuevo != null) {
      const r = calcularPrimeraFactura(antes.fechaInstalacion, parseInt(antes.cicloFacturacion, 10), montoNuevo);
