        despues = { ...despues, fecha1raFactura: r.fecha1raFactura, monto1raFactura: total };
      }
    }
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: clienteId });
  }

  function abrirClienteDesdePrecierre(c) {
    setOrigenFormulario("precierre");
    startEdit(c);
  }

  // Desde "Verificar órdenes": abre el formulario con el nombre ya puesto.
  // Si la orden ya está instalada trae la fecha de Tigo; si no, queda marcado como
  // "Pendiente de instalación" (fecha vacía), igual que cuando lo haces a mano.
  function irANuevoDesdeOrden(nombre, fechaInstalacionISO) {
    setForm({ ...emptyForm(), nombre: nombre || "", fechaInstalacion: fechaInstalacionISO || "" });
    setEditingId(null);
    setOrigenFormulario("precierre");
    navegarA("nuevo");
  }

  // Desde "Verificar órdenes": cambia solo la fecha de instalación de un cliente.
  // Si el cliente ya tiene ciclo y monto, recalcula la 1ra factura igual que el formulario.
  function cambiarFechaInstalacionDesdeOrden(clienteId, fechaISO) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes || !fechaISO) return;
    let despues = { ...antes, fechaInstalacion: fechaISO, instalacionProgramada: "", franjaInstalacion: "" };
    const r = calcularPrimeraFactura(fechaISO, parseInt(antes.cicloFacturacion, 10), antes.montoMensual);
    if (r && antes.montoMensual !== "" && antes.montoMensual != null) {
      const total = +((Number(antes.montoMensual) || 0) + (Number(r.monto1raFactura) || 0)).toFixed(2);
      despues = { ...despues, fecha1raFactura: r.fecha1raFactura, monto1raFactura: total };
    }
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: clienteId });
  }

  // Desde "Verificar órdenes" (móviles): abre Clientes Móvil con el formulario de nuevo
  // cliente ya con el nombre y la fecha de activación de Tigo. Al guardar vuelve al Precierre.
  function irANuevoMovilDesdeOrden(nombre, fechaISO) {
    navegarA("clientes");
    setSaltarAMes({
      subVista: "movil",
      abrirForm: true,
      prefill: { nombre: nombre || "", fecha: fechaISO || "" },
      token: Date.now(),
    });
  }

  // Desde "Verificar órdenes" (móviles): abre ese cliente móvil ya en edición. Al guardar vuelve al Precierre.
  function abrirMovilDesdeOrden(id) {
    if (!id) return;
    navegarA("clientes");
    setSaltarAMes({ subVista: "movil", abrirForm: true, prefill: { editarId: id }, token: Date.now() });
  }

  // Desde "Verificar órdenes" (móviles): cambia solo la fecha de activación (queda en el Historial).
  function corregirNombreDesdeOrden(id, nombre, esMovil) {
    const nuevo = String(nombre || "").trim();
    if (!id || !nuevo) return;
    if (esMovil) {
      editarConvergencia(id, { nombre: nuevo });
      return;
    }
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = { ...antes, nombre: nuevo };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: id });
  }
  function cambiarFechaActivacionMovilDesdeOrden(id, fechaISO) {
    if (!id || !fechaISO) return;
    editarConvergencia(id, { fechaActivacion: fechaISO });
  }

  function cambiarUmbralProrrateo(nuevoValor) {
    const valorAnterior = umbralProrrateo;
    setUmbralProrrateo(nuevoValor);
    const valorNum = nuevoValor === "" ? "" : Number(nuevoValor);
    if (String(valorAnterior ?? "") !== String(valorNum ?? "") && valorNum !== "") {
      registrarCambio({
        entidad: "config",
        tipo: "editar",
        etiqueta: "Umbral de prorrateo",
        antes: { campo: "umbralProrrateo", valor: valorAnterior },
        despues: { campo: "umbralProrrateo", valor: valorNum },
        cambios: [{ campo: "umbralProrrateo", label: "Umbral de prorrateo", anterior: `${valorAnterior}%`, nuevo: `${valorNum}%` }],
        refId: "umbralProrrateo",
      });
    }
  }

  function actualizarMeta(mes, campo, valor) {
    const nuevoValor = valor === "" ? undefined : Number(valor);
    const actualPrev = typeof metas[mes] === "object" && metas[mes] !== null ? metas[mes] : {};
    const valorAnterior = actualPrev[campo];
    setMetas((prev) => {
      const actual = typeof prev[mes] === "object" && prev[mes] !== null ? prev[mes] : {};
      return { ...prev, [mes]: { ...actual, [campo]: nuevoValor } };
    });
    if (String(valorAnterior ?? "") !== String(nuevoValor ?? "")) {
      const CAMPOS_META = {
        dinero: "Meta de ingresos",
        arpu: "Meta de ARPU",
        clientes: "Meta de clientes",
        clientesHogar: "Meta de clientes hogar",
        clientesMovil: "Meta de clientes móvil",
      };
      registrarCambio({
        entidad: "meta",
        tipo: "editar",
        etiqueta: `${CAMPOS_META[campo] || campo} · ${mesLabel(mes)}`,
        antes: { mes, campo, valor: valorAnterior },
        despues: { mes, campo, valor: nuevoValor },
        cambios: [{ campo, label: CAMPOS_META[campo] || campo, anterior: valorAnterior, nuevo: nuevoValor }],
        refId: `${mes}-${campo}`,
      });
    }
  }

  // Cliente Móvil (Plan Pospago, Convergencia o FULL TIGO). "fullTigo" se guarda además
  // de "tipo" por compatibilidad con la fórmula de comisión anterior a octubre 2026.
  // "extra" trae las dos casillas del esquema nuevo: esPortabilidad y f1_estado ("pagada" o "").
  function agregarConvergencia(nombre, telefono, tipoCliente, montoPlan, fechaActivacion, extra) {
    const pagada = !!extra && extra.f1_estado === "pagada";
    const nueva = {
      ...(extra && extra.datos ? extra.datos : {}),
      id: uid(),
      nombre,
      telefono,
      whatsapp: extra && extra.whatsapp ? extra.whatsapp : "",
      tipo: tipoCliente,
      fullTigo: tipoCliente === "fulltigo",
      montoPlan: montoPlan ? Number(montoPlan) || 0 : null,
      fechaActivacion: fechaActivacion || fechaLocalISO(new Date()),
      esPortabilidad: !!extra && !!extra.esPortabilidad,
      cicloManual: extra && extra.cicloManual ? Number(extra.cicloManual) : null,
      f1_estado: pagada ? "pagada" : "",
      ...(pagada ? { f1_pagadaEn: new Date().toISOString() } : {}),
      creadoEn: new Date().toISOString(),
    };
    setConvergencias((prev) => [...prev, nueva]);
    registrarCambio({ entidad: "convergencia", tipo: "crear", etiqueta: nombre, despues: nueva, cambios: [], refId: nueva.id });
  }

  function editarConvergencia(id, datos) {
    const antes = convergencias.find((c) => c.id === id);
    const normalizados = datos.tipo ? { ...datos, fullTigo: datos.tipo === "fulltigo" } : datos;
    const despues = antes ? { ...antes, ...normalizados } : null;
    setConvergencias((prev) => prev.map((c) => (c.id === id ? { ...c, ...normalizados } : c)));
    if (antes && despues) {
      const cambios = [];
      if (String(antes.nombre ?? "") !== String(despues.nombre ?? ""))
        cambios.push({ campo: "nombre", label: "Nombre", anterior: antes.nombre, nuevo: despues.nombre });
      if (String(antes.telefono ?? "") !== String(despues.telefono ?? ""))
        cambios.push({ campo: "telefono", label: "Teléfono", anterior: antes.telefono, nuevo: despues.telefono });
      if (String(tipoClienteMovil(antes)) !== String(tipoClienteMovil(despues)))
        cambios.push({
          campo: "tipo",
          label: "Tipo",
          anterior: etiquetaTipoMovil(tipoClienteMovil(antes)),
          nuevo: etiquetaTipoMovil(tipoClienteMovil(despues)),
        });
      if (String(antes.montoPlan ?? "") !== String(despues.montoPlan ?? ""))
        cambios.push({ campo: "montoPlan", label: "Monto del plan", anterior: antes.montoPlan, nuevo: despues.montoPlan });
      if (String(fechaActivacionMovil(antes)) !== String(fechaActivacionMovil(despues)))
        cambios.push({
          campo: "fechaActivacion",
          label: "Fecha de activación",
          anterior: fechaActivacionMovil(antes),
          nuevo: fechaActivacionMovil(despues),
        });
      if (!!antes.esPortabilidad !== !!despues.esPortabilidad)
        cambios.push({
          campo: "esPortabilidad",
          label: "Es portabilidad",
          anterior: antes.esPortabilidad ? "sí" : "no",
          nuevo: despues.esPortabilidad ? "sí" : "no",
        });
      if ((antes.f1_estado === "pagada") !== (despues.f1_estado === "pagada"))
        cambios.push({
          campo: "f1_estado",
          label: "1ra factura",
          anterior: etiquetaEstadoFactura(antes.f1_estado),
          nuevo: etiquetaEstadoFactura(despues.f1_estado),
        });
      if (cambios.length > 0) {
        registrarCambio({ entidad: "convergencia", tipo: "editar", etiqueta: despues.nombre, antes, despues, cambios, refId: id });
      }
    }
  }

  function eliminarConvergencia(id) {
    const convergencia = convergencias.find((c) => c.id === id);
    setConvergencias((prev) => prev.filter((c) => c.id !== id));
    if (convergencia) {
      registrarCambio({ entidad: "convergencia", tipo: "eliminar", etiqueta: convergencia.nombre, antes: convergencia, cambios: [], refId: id });
    }
  }

  // Aplica un cambio a la lista de clientes, guardando el estado anterior
  // en el historial para poder deshacerlo.
  function actualizarClientes(updater) {
    setHistorial((h) => [...h, clientes].slice(-20));
    setClientes(updater);
  }

  function deshacerUltimaAccion() {
    setHistorial((h) => {
      if (h.length === 0) return h;
      const anterior = h[h.length - 1];
      setClientes(anterior);
      return h.slice(0, -1);
    });
  }

  // Registra una entrada en la bitácora de cambios.
  // entidad: "cliente" | "convergencia" | "meta" | "factura" | "config"
  // tipo: "crear" | "editar" | "eliminar" | "recuperar"
  // etiqueta: texto que identifica el registro afectado (nombre del cliente, mes de la meta, etc.)
  // antes/despues: snapshot completo para poder revertir. cambios: lista opcional ya calculada de {campo,label,anterior,nuevo}
  function registrarCambio({ entidad, tipo, etiqueta, antes, despues, cambios, refId }) {
    const listaCambios = cambios !== undefined ? cambios : entidad === "cliente" && tipo === "editar" ? diffCliente(antes, despues) : [];
    if (tipo === "editar" && listaCambios.length === 0) return; // nada realmente cambió
    const id = refId ?? (despues && despues.id) ?? (antes && antes.id) ?? null;
    setHistorialCambios((prev) =>
      [
        {
          id: uid(),
          entidad,
          tipo,
          etiqueta,
          refId: id,
          fecha: new Date().toISOString(),
          cambios: listaCambios,
          snapshotAntes: antes ?? null,
          snapshotDespues: despues ?? null,
          deshecho: false,
        },
        ...prev,
      ].slice(0, 400)
    );
  }

  // Revierte una entrada puntual de la bitácora (no depende de que sea la última acción).
  function deshacerCambio(entryId) {
    setHistorialCambios((prev) => {
      const entry = prev.find((h) => h.id === entryId);
      if (!entry || entry.deshecho) return prev;

      if (entry.entidad === "cliente") {
        if (entry.tipo === "crear") {
          actualizarClientes((cs) => cs.filter((c) => c.id !== entry.refId));
        } else if (entry.tipo === "eliminar") {
          if (entry.snapshotAntes) {
            actualizarClientes((cs) => (cs.some((c) => c.id === entry.refId) ? cs : [...cs, entry.snapshotAntes]));
          }
          setEliminados((els) => els.filter((c) => c.id !== entry.refId));
        } else if (entry.tipo === "editar") {
          if (entry.snapshotAntes) {
            actualizarClientes((cs) => cs.map((c) => (c.id === entry.refId ? entry.snapshotAntes : c)));
          }
        } else if (entry.tipo === "recuperar") {
          // Deshacer una recuperación = volver a eliminar ese cliente.
          const cliente = clientes.find((c) => c.id === entry.refId);
          actualizarClientes((cs) => cs.filter((c) => c.id !== entry.refId));
          if (cliente) setEliminados((els) => [...els, { ...cliente, eliminadoEn: new Date().toISOString() }]);
        }
      } else if (entry.entidad === "convergencia") {
        if (entry.tipo === "crear") {
          setConvergencias((prev2) => prev2.filter((c) => c.id !== entry.refId));
        } else if (entry.tipo === "eliminar") {
          if (entry.snapshotAntes) {
            setConvergencias((prev2) => (prev2.some((c) => c.id === entry.refId) ? prev2 : [...prev2, entry.snapshotAntes]));
          }
        } else if (entry.tipo === "editar") {
          if (entry.snapshotAntes) {
            setConvergencias((prev2) => prev2.map((c) => (c.id === entry.refId ? entry.snapshotAntes : c)));
          }
        }
      } else if (entry.entidad === "meta") {
        if (entry.snapshotAntes) {
          const { mes, campo, valor } = entry.snapshotAntes;
          setMetas((prev2) => {
            const actual = typeof prev2[mes] === "object" && prev2[mes] !== null ? prev2[mes] : {};
            return { ...prev2, [mes]: { ...actual, [campo]: valor } };
          });
        }
      } else if (entry.entidad === "factura") {
        if (entry.snapshotAntes) {
          actualizarClientes((cs) => cs.map((c) => (c.id === entry.refId ? entry.snapshotAntes : c)));
        }
      } else if (entry.entidad === "config") {
        if (entry.snapshotAntes && entry.snapshotAntes.campo === "umbralProrrateo") {
          setUmbralProrrateo(entry.snapshotAntes.valor);
        }
      }

      return prev.map((h) => (h.id === entryId ? { ...h, deshecho: true } : h));
    });
  }

  function handleSubmit(e) {
    e.preventDefault();
    const obligatorios = [
      form.numeroSuscriptor,
      form.nombre,
      form.telefono,
      form.cicloFacturacion,
      form.planTipo,
      form.velocidad,
      form.montoMensual,
    ];
    if (form.planTipo === "DOBLE") obligatorios.push(form.planTV);
    if (obligatorios.some((v) => !String(v ?? "").trim())) return;

    const otros = clientes.filter((c) => c.id !== editingId);
    const numSusc = form.numeroSuscriptor.trim();
    const nombreNorm = form.nombre.trim().toLowerCase();
    const telDigits = form.telefono.replace(/\D/g, "");
    const duplicado = otros.find(
      (c) =>
        (c.numeroSuscriptor || "").trim() === numSusc ||
        (c.nombre || "").trim().toLowerCase() === nombreNorm ||
        (c.telefono || "").replace(/\D/g, "") === telDigits
    );
    if (duplicado) {
      const campo =
        (duplicado.numeroSuscriptor || "").trim() === numSusc
          ? "número de suscriptor"
          : (duplicado.nombre || "").trim().toLowerCase() === nombreNorm
          ? "nombre"
          : "teléfono";
      const continuar = window.confirm(
        `Ya existe un cliente con el mismo ${campo}: ${duplicado.nombre} (suscriptor ${duplicado.numeroSuscriptor || "—"}).\n\n¿Quieres guardar este cliente de todas formas?`
      );
      if (!continuar) return;
    }

    if (editingId) {
      const antes = clientes.find((c) => c.id === editingId);
      const camposForm = camposEstadoCliente({ ...form, numeroSuscriptor: (form.numeroSuscriptor || "").trim() }, antes);
      const despues = antes ? { ...antes, ...camposForm } : null;
      actualizarClientes((prev) => prev.map((c) => (c.id === editingId ? { ...c, ...camposForm } : c)));
      if (antes && despues) {
        registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: editingId });
      }
    } else {
      const nuevo = { id: uid(), ...camposEstadoCliente({ ...form, numeroSuscriptor: (form.numeroSuscriptor || "").trim() }, null), abonoInicial: form.fechaInstalacion ? true : false, creadoEn: new Date().toISOString() };
      actualizarClientes((prev) => [...prev, nuevo]);
      registrarCambio({ entidad: "cliente", tipo: "crear", etiqueta: nuevo.nombre, despues: nuevo, cambios: [], refId: nuevo.id });
    }
    resetForm();
    volverA(origenFormulario === "precierre" || origenFormulario === "detalle" ? origenFormulario : "clientes");
  }

  function startEdit(c) {
    setForm({
      nombre: c.nombre,
      numeroSuscriptor: c.numeroSuscriptor,
      telefono: c.telefono,
      cicloFacturacion: c.cicloFacturacion,
      planTipo: c.planTipo,
      velocidad: c.velocidad,
      planTV: c.planTV,
      tecnologia: c.tecnologia || "",
      cuentaTigo: c.cuentaTigo || "",
      montoMensual: c.montoMensual,
      fechaInstalacion: c.fechaInstalacion,
      instalacionProgramada: c.instalacionProgramada || "",
      franjaInstalacion: c.franjaInstalacion || "",
      fecha1raFactura: c.fecha1raFactura,
      monto1raFactura: c.monto1raFactura,
      estadoPago: c.estadoPago,
      estadoCliente: c.penalizado ? "penalizado" : c.cancelado ? "cancelado" : "activo",
      fechaCancelacion: c.fechaCancelacion || "",
      motivoCancelacion: c.motivoCancelacion || "",
      motivoPenalizacion: c.motivoPenalizacion || "",
      observaciones: c.observaciones,
    });
    setEditingId(c.id);
    setOrigenFormulario(tab === "detalle" ? "detalle" : tab === "precierre" ? "precierre" : "clientes");
    navegarA("nuevo");
  }

  // Marca/desmarca un aviso desde la ficha del cliente (interruptor).
  function toggleMilestone(clienteId, key) {
    const actual = clientes.find((c) => c.id === clienteId);
    const quedaMarcado = actual ? !actual[key] : true;
    if (!quedaMarcado) diarioQuitar(clienteId, key); // si lo desmarcas a propósito, el diario no lo vuelve a marcar
    registrarEnvio({ tipo: quedaMarcado ? "marcar" : "desmarcar", clienteId, nombre: actual ? actual.nombre : "", key, origen: "ficha" });
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? { ...c, [key]: !c[key] } : c)));
  }

  // Marca un recordatorio de Hogar como ENVIADO desde Cobros (lista o envío en cadena). Siempre
  // deja el aviso marcado (nunca lo desmarca, aunque se toque dos veces), lo anota en el diario
  // local ANTES de que la app salte a WhatsApp, y queda en la bitácora de envíos.
  function marcarEnviadoSeguro(clienteId, key, origen) {
    const actual = clientes.find((c) => c.id === clienteId);
    diarioAgregar({ t: "h", id: clienteId, key });
    registrarEnvio({ tipo: "marcar", clienteId, nombre: actual ? actual.nombre : "", key, origen: origen || "lista" });
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId && !c[key] ? { ...c, [key]: true } : c)));
  }

  // Igual, para recordatorios de Clientes Móvil.
  function marcarMovilEnviadoSeguro(id, key, origen) {
    const actual = convergencias.find((c) => c.id === id);
    diarioAgregar({ t: "m", id, key: `aviso_${key}` });
    registrarEnvio({ tipo: "marcar", clienteId: id, nombre: actual ? actual.nombre : "", key: `aviso_${key}`, origen: origen || "lista", movil: true });
    editarConvergencia(id, { [`aviso_${key}`]: true });
  }

  // Vuelve a aplicar las marcas del diario que todavía no figuran en lo sincronizado con la nube
  // (por ejemplo, si el guardado se cortó al saltar a WhatsApp).
  function aplicarDiario() {
    const ops = diarioLeer().filter((o) => Date.now() - o.ts < DIARIO_VIGENCIA_MS);
    if (!ops.length) return;
    const h = ops.filter((o) => o.t === "h");
    const m = ops.filter((o) => o.t === "m");
    const aplicarA = (setter, lista) => {
      if (!lista.length) return;
      setter((prev) => {
        let cambio = false;
        const sig = prev.map((c) => {
          const pend = lista.filter((o) => o.id === c.id && !c[o.key]);
          if (!pend.length) return c;
          cambio = true;
          const n = { ...c };
          pend.forEach((o) => { n[o.key] = true; });
          return n;
        });
        return cambio ? sig : prev;
      });
    };
    if (loaded) aplicarA(setClientes, h);
    if (convergenciasLoaded) aplicarA(setConvergencias, m);
  }

  // Quita del diario las marcas que ya quedaron guardadas en la nube.
  depurarDiarioRef.current = function depurarDiario() {
    if (!syncClientes.base || !syncConv.base) return;
    const mc = new Map(syncClientes.base.map((c) => [c.id, c]));
    const mm = new Map(syncConv.base.map((c) => [c.id, c]));
    const vigentes = diarioLeer().filter((o) => {
      if (Date.now() - o.ts > DIARIO_VIGENCIA_MS) return false;
      const it = (o.t === "h" ? mc : mm).get(o.id);
      return !!it && !it[o.key];
    });
    diarioGuardar(vigentes);
  };
  aplicarDiarioRef.current = aplicarDiario;

  // Al abrir la app, reaplica las marcas del diario que no llegaron a la nube.
  useEffect(() => {
    if (loaded && convergenciasLoaded) aplicarDiario();
  }, [loaded, convergenciasLoaded]);

  // Al volver a la app (desde WhatsApp, otra pestaña, otra ventana, o al recuperar internet)
  // y cada minuto mientras está a la vista, se revisa la nube: si el otro dispositivo (celular o
  // computadora) hizo cambios, esta pantalla los trae sin pisar lo que tú hayas tocado aquí.
  useEffect(() => {
    let ultima = 0;
    let ultimaHist = Date.now();
    function revisarNube(completo) {
      if (typeof document !== "undefined" && document.visibilityState === "hidden") return;
      const ahora = Date.now();
      if (completo) {
        if (ahora - ultima < 4000) return;
        ultima = ahora;
        aplicarDiarioRef.current();
      }
      [syncClientes, syncConv, syncElim].forEach((x) => x.sincronizar());
      if (completo) {
        syncEnvios.sincronizar();
        if (ahora - ultimaHist > 60000) {
          ultimaHist = ahora;
          syncHist.sincronizar();
        }
      }
    }
    const alVolver = () => revisarNube(true);
    document.addEventListener("visibilitychange", alVolver);
    window.addEventListener("focus", alVolver);
    window.addEventListener("pageshow", alVolver);
    window.addEventListener("online", alVolver);
    const t = setInterval(() => revisarNube(false), 60000);
    return () => {
      document.removeEventListener("visibilitychange", alVolver);
      window.removeEventListener("focus", alVolver);
      window.removeEventListener("pageshow", alVolver);
      window.removeEventListener("online", alVolver);
      clearInterval(t);
    };
  }, []);

  // Copia de seguridad diaria (se guardan las últimas 14 en la nube, una por día, rotando).
  useEffect(() => {
    if (!loaded || !convergenciasLoaded || !syncClientes.cargado) return;
    const t = setTimeout(() => {
      respaldoDiario(() => ({ clientes: syncClientes.getLocal(), convergencias: syncConv.getLocal() }));
    }, 8000);
    return () => clearTimeout(t);
  }, [loaded, convergenciasLoaded]);

  function marcarFacturaPagada(clienteId, n) {
    const antes = clientes.find((c) => c.id === clienteId);
    actualizarClientes((prev) =>
      prev.map((c) =>
        c.id === clienteId
          ? { ...c, [`f${n}_d1`]: true, [`f${n}_t15`]: true, [`f${n}_t3`]: true, [`f${n}_estado`]: "pagada" }
          : c
      )
    );
    if (antes) {
      const despues = { ...antes, [`f${n}_d1`]: true, [`f${n}_t15`]: true, [`f${n}_t3`]: true, [`f${n}_estado`]: "pagada" };
      const anteriorLabel = etiquetaEstadoFactura(antes[`f${n}_estado`]);
      if (anteriorLabel !== "pagada") {
        registrarCambio({
          entidad: "factura",
          tipo: "editar",
          etiqueta: `Factura ${n} de ${antes.nombre}`,
          antes,
          despues,
          cambios: [{ campo: `f${n}_estado`, label: `Estado factura ${n}`, anterior: anteriorLabel, nuevo: "pagada" }],
          refId: clienteId,
        });
      }
    }
  }

  // Cambia el estado de pago de una factura puntual: "pagada" o "" (no pagada).
  // Al marcar como pagada, silencia sus 3 avisos; al desmarcar, los reactiva por si
  // corresponde que sigan recordándole al cliente.
  // Excepción, solo para la 1ra factura de clientes de prorrateo alto: con
  // opciones.parcial queda "pagada" (cuenta para la comisión) pero con saldo pendiente
  // (f1_saldoPendiente) y SUS AVISOS NO SE SILENCIAN, para seguir cobrando el saldo.
  // Cuando el cliente paga el saldo se vuelve a llamar sin parcial: ahí sí se silencian.
  function actualizarEstadoFactura(clienteId, n, nuevoEstado, opciones = {}) {
    const antes = clientes.find((c) => c.id === clienteId);
    // Al marcarla como pagada se anota sola el día y la hora (sin editar nada);
    // al desmarcarla, esa fecha se borra.
    const ahoraISO = new Date().toISOString();
    const parcial = nuevoEstado === "pagada" && n === 1 && !!(opciones && opciones.parcial);
    const marcarEnviado = nuevoEstado === "pagada" && !parcial;
    const aplicar = (c) => {
      const yaPagada = c[`f${n}_estado`] === "pagada" && c[`f${n}_pagadaEn`];
      const nuevo = {
        ...c,
        [`f${n}_estado`]: nuevoEstado,
        [`f${n}_pagadaEn`]: nuevoEstado === "pagada" ? (yaPagada ? c[`f${n}_pagadaEn`] : ahoraISO) : "",
        [`f${n}_d1`]: parcial ? !!c[`f${n}_d1`] : marcarEnviado,
        [`f${n}_t15`]: parcial ? !!c[`f${n}_t15`] : marcarEnviado,
        [`f${n}_t3`]: parcial ? !!c[`f${n}_t3`] : marcarEnviado,
      };
      if (n === 1) {
        nuevo.f1_saldoPendiente = parcial;
        // La 1ra factura pagada (parcial o completa) ya cubre lo que pedían los
        // mensajes de abono (bienvenida y recordatorio): dejan de salir.
        if (nuevoEstado === "pagada") {
          nuevo.aviso_toque1 = true;
          nuevo.aviso_toque2 = true;
        }
      }
      return nuevo;
    };
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? aplicar(c) : c)));
    if (antes) {
      const despues = aplicar(antes);
      const etiqueta = (c) =>
        n === 1 && c.f1_estado === "pagada" && c.f1_saldoPendiente ? "pagada (pago parcial)" : etiquetaEstadoFactura(c[`f${n}_estado`]);
      const anteriorLabel = etiqueta(antes);
      const nuevoLabel = etiqueta(despues);
      if (anteriorLabel !== nuevoLabel) {
        registrarCambio({
          entidad: "factura",
          tipo: "editar",
          etiqueta: `Factura ${n} de ${antes.nombre}`,
          antes,
          despues,
          cambios: [{ campo: `f${n}_estado`, label: `Estado factura ${n}`, anterior: anteriorLabel, nuevo: nuevoLabel }],
          refId: clienteId,
        });
      }
    }
  }

  function deleteClient(id) {
    const cliente = clientes.find((c) => c.id === id);
    actualizarClientes((prev) => prev.filter((c) => c.id !== id));
    if (cliente) {
      setEliminados((prev) => [...prev, { ...cliente, eliminadoEn: new Date().toISOString() }]);
      registrarCambio({ entidad: "cliente", tipo: "eliminar", etiqueta: cliente.nombre, antes: cliente, cambios: [], refId: id });
    }
    setConfirmDelete(null);
  }

  function cancelarCliente(id, fecha, motivo) {
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = { ...antes, cancelado: true, fechaCancelacion: fecha, motivoCancelacion: motivo };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: antes.nombre, antes, despues, refId: id });
  }

  // Marca o desmarca un cliente como penalizado (no cuenta para nada). Motivo opcional.
  function penalizarCliente(id, penalizado, motivo) {
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = penalizado
      ? { ...antes, penalizado: true, motivoPenalizacion: (motivo || "").trim(), fechaPenalizacion: fechaLocalISO(new Date()) }
      : { ...antes, penalizado: false, motivoPenalizacion: "", fechaPenalizacion: "" };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({
      entidad: "cliente",
      tipo: "editar",
      etiqueta: antes.nombre,
      antes,
      despues,
      cambios: [{ campo: "penalizado", label: "Penalizado", anterior: antes.penalizado ? "Sí" : "No", nuevo: penalizado ? "Sí" : "No" }],
      refId: id,
    });
  }

  function descancelarCliente(id) {
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = { ...antes, cancelado: false, fechaCancelacion: "", motivoCancelacion: "" };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: antes.nombre, antes, despues, refId: id });
  }

  // Confirma un rescate del simulador del Dashboard: marca la 1ra factura de cada
  // cliente elegido como pagada (esto ya deja su propio registro en el Historial,
  // como cualquier factura marcada), y además guarda un resumen del rescate en sí
  // (cuánto se cubrió y cuánto subió tu comisión), para tener un
  // registro de si en general te ha convenido usar esto o no.
  function confirmarRescate(periodoKey, clientesSeleccionados, montoInvertido, ganancia) {
    clientesSeleccionados.forEach((c) => {
      if (convergencias.some((x) => x.id === c.id)) {
        editarConvergencia(c.id, { f1_estado: "pagada", f1_pagadaEn: new Date().toISOString() });
        return;
      }
      // Lo que cubre el rescate es la mitad pendiente del primer mes: en un cliente de
      // prorrateo alto eso equivale a un PAGO PARCIAL (queda saldo de la factura por cobrar).
      const cliente = clientes.find((x) => x.id === c.id) || c;
      actualizarEstadoFactura(c.id, 1, "pagada", { parcial: esProrrateoAlto(cliente, umbralProrrateo) });
    });
    registrarCambio({
      entidad: "rescate",
      tipo: "rescate",
      etiqueta: `Pendientes regularizados en ${mesLabel(periodoKey)} (${clientesSeleccionados.length} cliente${clientesSeleccionados.length === 1 ? "" : "s"})`,
      despues: {
        periodo: periodoKey,
        clientes: clientesSeleccionados.map((c) => c.nombre).join(", "),
        monto: montoInvertido,
        ganancia,
      },
      cambios: [
        { campo: "monto", label: "Pendiente regularizado", anterior: "", nuevo: fmtMonto(montoInvertido) },
        { campo: "ganancia", label: "Impacto en comisión", anterior: "", nuevo: fmtMonto(ganancia) },
        { campo: "clientes", label: "Clientes", anterior: "", nuevo: clientesSeleccionados.map((c) => c.nombre).join(", ") },
      ],
      refId: uid(),
    });
  }

  function recuperarCliente(id) {
    const cliente = eliminados.find((c) => c.id === id);
    if (!cliente) return;
    setEliminados((prev) => prev.filter((c) => c.id !== id));
    const { eliminadoEn, ...resto } = cliente;
    actualizarClientes((prev) => [...prev, resto]);
    registrarCambio({ entidad: "cliente", tipo: "recuperar", etiqueta: resto.nombre, despues: resto, cambios: [], refId: id });
  }

  function copyMessage(cliente, milestone) {
    navigator.clipboard?.writeText(milestone.texto).catch(() => {});
    setCopiedKey(cliente.id + milestone.key);
    setTimeout(() => setCopiedKey(null), 1500);
  }

  function copySuscriptor(cliente) {
    navigator.clipboard?.writeText(cliente.numeroSuscriptor || "").catch(() => {});
    setCopiedSubKey(cliente.id);
    setTimeout(() => setCopiedSubKey(null), 1500);
  }

  // Guarda en un cliente existente lo que viene en el texto de Tigo: fecha y horario de
  // instalación (sigue pendiente de instalación) y los datos extra en Observaciones.
  function guardarOrdenInstalacion(clienteId, d) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes || !d || !d.fecha) return;
    const despues = {
      ...antes,
      instalacionProgramada: d.fecha,
      franjaInstalacion: d.franja || "",
      ...(d.fecha !== antes.instalacionProgramada ? { instalacionEnviadaEn: "" } : {}),
      tecnologia: d.tecnologia || antes.tecnologia || "",
      observaciones: aplicarBloqueObservaciones(antes.observaciones, bloqueObservacionTigo(d)),
    };
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: clienteId });
  }

  // Cambia solo la fecha y el horario de una instalación programada (desde el Dashboard).
  function reprogramarInstalacion(clienteId, fechaISO, franja) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes || !fechaISO) return;
    const despues = { ...antes, instalacionProgramada: fechaISO, franjaInstalacion: franja || "", ...(fechaISO !== antes.instalacionProgramada ? { instalacionEnviadaEn: "" } : {}) };
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: clienteId });
  }

  // Marca (o quita la marca de) el abono inicial de un cliente Hogar. Siempre pide confirmación.
  function marcarAbonoInicial(clienteId, recibido) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes) return;
    const quien = antes.nombre || antes.numeroSuscriptor || "este cliente";
    const ok = window.confirm(recibido ? `¿Confirmas que ${quien} ya hizo su abono?` : `¿Quitar la marca de abono a ${quien}?`);
    if (!ok) return;
    const despues = { ...antes, abonoInicial: recibido, abonoFecha: recibido ? new Date().toISOString() : "" };
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: clienteId });
  }

  // Marca (o quita la marca de) que ya se le envió al cliente el mensaje con la info de su instalación.
  function marcarInstalacionEnviada(clienteId, enviado) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes) return;
    const despues = { ...antes, instalacionEnviadaEn: enviado ? new Date().toISOString() : "" };
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: clienteId });
  }
  // Abre WhatsApp con el mensaje de instalación y deja pendiente la pregunta "¿Lo enviaste?".
  function enviarInfoInstalacion(cliente) {
    try { window.sessionStorage.setItem("mf-pregunta-inst", cliente.id); } catch (e) {}
    setPreguntaInst(cliente.id);
    window.location.href = whatsappLink(cliente, { texto: textoInstalacion(cliente) });
  }
  function responderPreguntaInst(enviado) {
    if (enviado && preguntaInst) marcarInstalacionEnviada(preguntaInst, true);
    try { window.sessionStorage.removeItem("mf-pregunta-inst"); } catch (e) {}
    setPreguntaInst(null);
  }

  function copiarMensajeInstalacion(cliente) {
    navigator.clipboard?.writeText(textoInstalacion(cliente)).catch(() => {});
    setCopiedKey(cliente.id + "instalacion");
    setTimeout(() => setCopiedKey(null), 1500);
  }

  function exportarRespaldo() {
    const blob = new Blob([JSON.stringify(clientes, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `metaforce-respaldo-${fechaLocalISO(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importarRespaldo(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const importados = JSON.parse(reader.result);
        if (!Array.isArray(importados)) {
          alert("El archivo no tiene el formato esperado.");
          return;
        }
        actualizarClientes((prev) => {
          const idsExistentes = new Set(prev.map((c) => c.id));
          const nuevos = importados.filter((c) => c && c.id && !idsExistentes.has(c.id));
          alert(`Se importaron ${nuevos.length} cliente(s) nuevo(s) de ${importados.length} en el archivo.`);
          return [...prev, ...nuevos];
        });
      } catch (err) {
        alert("No se pudo leer el archivo. Verifica que sea un respaldo válido (.json).");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const navItems = [
    { key: "dashboard", label: "Dashboard", icon: "chart" },
    { key: "clientes", label: "Clientes", icon: "users" },
    { key: "alertas", label: "Mensajes", icon: "cash", badge: stats.alHoy },
    { key: "precierre", label: "Precierre", icon: "receipt" },
    { key: "historial", label: "Historial", icon: "clock" },
  ];

  // Barra inferior del celular: se esconde al bajar, reaparece al subir un poco, y se oculta en el formulario de cliente.
  const barraOculta = tab === "nuevo";
  const [barraEscondida, setBarraEscondida] = useState(false);
  const avisoGuardado = !enLinea
    ? "Sin conexión — se guardará al reconectar"
    : estadoGuardado === "error"
    ? "Error al guardar — revisa tu conexión"
    : "";
  const barraFuera = barraOculta || barraEscondida;
  const bottomFab = barraFuera ? (avisoGuardado ? 72 : 24) : (avisoGuardado ? 150 : 86);
  function tocarPestana(key) {
    if (tab === key) {
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (key === "dashboard") setPeriodoDash(periodoActualApp);
    setTab(key);
  }
  // ---- Barra de abajo que se esconde al bajar y vuelve al subir; deslizar de lado cambia de pestaña ----
  const [slide, setSlide] = useState(null);
  const ORDEN_SWIPE = ["dashboard", "clientes", "alertas", "precierre"];
  const deslizarRef = useRef(null);
  deslizarRef.current = (dir) => {
    const i = ORDEN_SWIPE.indexOf(tab);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= ORDEN_SWIPE.length) return;
    const destino = ORDEN_SWIPE[j];
    if (destino === "dashboard") setPeriodoDash(periodoActualApp);
    setSlide(dir > 0 ? "der" : "izq");
    setTimeout(() => setSlide(null), 320);
    // Cambiar de pestaña con el dedo no agrega pasos al historial: "atrás" sigue llevando a donde ibas.
    navPop.current = true;
    try { window.history.replaceState({ mf: true, tab: destino, clienteDetalleId: null, origenDetalle: "clientes" }, ""); } catch (e) {}
    setTab(destino);
  };
  useEffect(() => {
    let ultimo = window.scrollY;
    function alScroll() {
      const y = window.scrollY;
      const d = y - ultimo;
      if (Math.abs(d) < 6) return;
      ultimo = y;
      if (y < 60 || d < 0) setBarraEscondida(false);
      else setBarraEscondida(true);
    }
    window.addEventListener("scroll", alScroll, { passive: true });
    return () => window.removeEventListener("scroll", alScroll);
  }, []);
  useEffect(() => { setBarraEscondida(false); }, [tab]);
  useEffect(() => {
    let sx = 0, sy = 0, t0 = 0, ok = false;
    function conMovimientoLateral(el) {
      while (el && el !== document.body) {
        if (el.nodeType === 1) {
          if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || (el.dataset && el.dataset.noSwipe !== undefined)) return true;
          const cs = window.getComputedStyle(el);
          if ((cs.overflowX === "auto" || cs.overflowX === "scroll") && el.scrollWidth > el.clientWidth + 2) return true;
        }
        el = el.parentElement;
      }
      return false;
    }
    function alTocar(e) {
      ok = false;
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      if (t.clientX < 25 || t.clientX > window.innerWidth - 25) return; // el borde es del gesto de atrás de Safari
      if (document.querySelector(".fixed.inset-0")) return; // hay una ventana abierta
      if (window.visualViewport && window.visualViewport.scale > 1.01) return;
      if (conMovimientoLateral(e.target)) return;
      sx = t.clientX; sy = t.clientY; t0 = Date.now(); ok = true;
    }
    function alSoltar(e) {
      if (!ok) return;
      ok = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      if (Math.abs(dx) < 80 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - t0 > 900) return;
      if (deslizarRef.current) deslizarRef.current(dx < 0 ? 1 : -1);
    }
    window.addEventListener("touchstart", alTocar, { passive: true });
    window.addEventListener("touchend", alSoltar, { passive: true });
    return () => { window.removeEventListener("touchstart", alTocar); window.removeEventListener("touchend", alSoltar); };
  }, []);
  // Botón de actualizar: vuelve a cargar la app (trae la versión más nueva y vuelve a leer
  // tus datos de Supabase). Si se está guardando algo, espera a que termine antes de recargar.
  function refrescarApp() {
    if (refrescando || !enLinea) return;
    setRefrescando(true);
    let intentos = 0;
    const t = setInterval(() => {
      intentos += 1;
      const ocupado = [syncClientes, syncConv, syncElim, syncHist, syncEnvios].some((x) => x.guardando);
      if (!ocupado || intentos > 20) {
        clearInterval(t);
        // Se agrega un número a la dirección para saltarse la versión guardada del celular.
        window.location.replace(window.location.pathname + "?v=" + Date.now());
      }
    }, 300);
  }

  if (!autenticado) {
    return (
      <LoginScreen
        onSuccess={() => {
          try {
            localStorage.setItem("antichurn_auth", "1");
          } catch (e) {}
          setAutenticado(true);
        } }
      />
    );
  }

  return (
    <div className="min-h-screen flex flex-col md:flex-row font-sans" style={ { background: "#F3F6FB", color: "#001E62" } }>
      <div
        className={
          "md:hidden flex items-center gap-2 px-4 py-2 absolute top-0 left-0 right-0 z-30"
        }
        style={ { background: "#001E62" } }
      >
        <button onClick={() => { setPeriodoDash(periodoActualApp); setTab("dashboard"); }} className="flex items-center gap-2" aria-label="Inicio">
          <div className="rounded-lg flex items-center justify-center font-extrabold" style={ { width: 30, height: 30, background: "#fff", color: "#001E62", fontSize: 14, letterSpacing: "-0.02em" } }>MF</div>
          {tab !== "dashboard" && <span className="text-white font-semibold tracking-wide text-lg">MetaForce CRM</span>}
        </button>
        {tab === "dashboard" && (
          <div className="relative flex-1 min-w-0" style={ { height: 40 } }>
            <div style={ { lineHeight: 1.1, pointerEvents: "none" } }>
              <div style={ { fontSize: 10, letterSpacing: "0.08em", fontWeight: 600, color: "#A9B8D6" } }>METAFORCE CRM</div>
              <div className="text-white font-bold truncate" style={ { fontSize: 18 } }>
                {mesLabel(periodoDash)} ▾{periodoDash === periodoActualApp && <span style={ { fontSize: 12, fontWeight: 500, color: "#A9B8D6" } }> · actual</span>}
              </div>
            </div>
            <select
              value={periodoDash}
              onChange={(e) => setPeriodoDash(e.target.value)}
              aria-label="Período de ventas"
              className="absolute inset-0 w-full h-full"
              style={ { opacity: 0, fontSize: 16 } }
            >
              {Array.from({ length: 24 }, (_, i) => sumarMesClave(periodoActualApp, -i)).map((key) => (
                <option key={key} value={key}>{mesLabel(key)}{key === periodoActualApp ? " (actual)" : ""}</option>
              ))}
            </select>
          </div>
        )}
        {tab === "dashboard" && (
          <div className="flex items-center shrink-0" style={ { gap: 2 } }>
            <button type="button" onClick={() => setPeriodoDash((p) => sumarMesClave(p, -1))} aria-label="Período anterior" className="flex items-center justify-center rounded-full" style={ { width: 32, height: 40, color: "#fff", background: "transparent", border: 0, fontSize: 24 } }>‹</button>
            <button type="button" onClick={() => setPeriodoDash((p) => sumarMesClave(p, 1))} disabled={periodoDash === periodoActualApp} aria-label="Período siguiente" className="flex items-center justify-center rounded-full" style={ { width: 32, height: 40, color: "#fff", background: "transparent", border: 0, fontSize: 24, opacity: periodoDash === periodoActualApp ? 0.3 : 1 } }>›</button>
            <button
              type="button"
              onClick={() => setModoOrdenDash((v) => !v)}
              aria-label="Ordenar tarjetas"

// Colores de las barras según el ritmo. Solo azules y ámbar (nunca rojo/verde: se confunden
// con daltonismo) y siempre con un símbolo + palabra además del color.
function estiloBarra(valor, meta, proyectado) {
  if (meta && valor >= meta) return { fill: "#001E62", track: "#D6DEEF", texto: "#001E62", tag: null };
  if (proyectado == null || !meta) return { fill: "#0072CE", track: "#E3EDFA", texto: "#001E62", tag: null };
  const r = proyectado / meta;
  if (r >= 1) return { fill: "#0072CE", track: "#D6E8F8", texto: "#0072CE", tag: "✓ vas en camino" };
  if (r >= 0.8) return { fill: "#D97706", track: "#FCE9C6", texto: "#B45309", tag: "◐ vas cerca" };
  return { fill: "#92400E", track: "#F4D9B0", texto: "#92400E", tag: "⚠ vas lejos" };
}
function BarraMeta({ valor, meta, proyectado, formato }) {
  const fmt = formato || ((x) => x);
  const pct = meta ? (valor / meta) * 100 : 0;
  const e = estiloBarra(valor, meta, proyectado);
  const falta = meta - valor;
  return (
    <React.Fragment>
      <p className="text-sm mb-2" style={ { color: "#374151" } }>
        <span className="font-semibold">{fmt(valor)}</span> de <span className="font-semibold">{fmt(meta)}</span> ·{" "}
        {falta > 0 ? (
          <React.Fragment>faltan <span className="font-bold" style={ { color: e.texto } }>{fmt(falta)}</span></React.Fragment>
        ) : (
          <span className="font-bold" style={ { color: e.texto } }>{falta === 0 ? "✓ meta cumplida" : `✓ meta superada +${fmt(-falta)}`}</span>
        )}
      </p>
      <div className="w-full h-2.5 rounded-full" style={ { background: e.track } }>
        <div className="h-2.5 rounded-full" style={ { width: `${Math.min(100, pct)}%`, background: e.fill } } />
      </div>
      {e.tag && <div className="text-[11px] font-semibold mt-1.5" style={ { color: e.texto } }>{e.tag}</div>}
    </React.Fragment>
  );
}

// Simulador de comisión (esquema nuevo): suma clientes Hogar y Móvil hipotéticos a los
// reales del período y muestra cuánto subiría la comisión. No guarda nada.
// Consejo "¿qué me conviene vender?": prueba con la fórmula real una venta más de Hogar y una de
// Móvil (con el plan promedio del período, sin bono de portabilidad) y compara cuánto sube cada una.
// "falta" dice cuántos clientes de cada tipo harían falta para subir al siguiente tramo; "tope" es
// true cuando ya se está en el último tramo de la tabla (140%), donde solo cuentan los ingresos.
function consejoVenta(base, defecto) {
  const r = (h, m) => calcularComisionNueva({
    clientesHogar: base.clientesHogar + h,
    metaClientesHogar: base.metaHogar,
    clientesMovil: base.clientesMovil + m,
    metaClientesMovil: base.metaMovil,
    ingresosDelPeriodo: base.ingresos + h * defecto.hogar + m * defecto.movil,
    metaIngresos: base.metaIngresos,
    cantidadBonoMovil: base.bonos,
    cantidadBonoPendiente: 0,
  });
  const ahora = r(0, 0);
  if (!ahora.completo || ahora.pctClientesPonderado == null) return null;
  const gH = r(1, 0).total - ahora.total;
  const gM = r(0, 1).total - ahora.total;
  const pct = ahora.pctClientesPonderado;
  const sig = TABLA_POSICION_NUEVA.find((t) => t.min > pct + 1e-9);
  // Cuántos clientes de cada tipo hacen falta para cruzar al siguiente escalón de base, y cuánto
  // se gana al cruzarlo. La comisión sube por escalones, no por cada venta.
  const hastaEscalon = (esHogar) => {
    if (!sig) return null;
    for (let n = 1; n <= 60; n++) {
      const x = esHogar ? r(n, 0) : r(0, n);
      if (x.montoBase > ahora.montoBase) return { n, gana: x.total - ahora.total };
    }
    return null;
  };
  const eH = hastaEscalon(true);
  const eM = hastaEscalon(false);
  const falta = sig ? { min: sig.min, monto: sig.monto, hogar: eH ? eH.n : null, movil: eM ? eM.n : null, ganaHogar: eH ? eH.gana : 0, ganaMovil: eM ? eM.gana : 0 } : null;
  const mejor = Math.abs(gH - gM) < 0.5 ? null : gM > gH ? "movil" : "hogar";
  return { gH, gM, mejor, falta, tope: !sig, pct, cruzaH: !!(eH && eH.n === 1), cruzaM: !!(eM && eM.n === 1) };
}
// Línea corta del consejo (para las tarjetas). Devuelve null si no hay nada útil que decir.
function textoConsejoVenta(c) {
  if (!c) return null;
  if (c.tope) return "💡 Ya estás en el tope de clientes (140%). Ahora solo cuentan los ingresos: vende planes de más valor.";
  const f = c.falta;
  if (!f) return null;
  if (c.cruzaH || c.cruzaM) {
    const hogar = c.cruzaH && (!c.cruzaM || f.ganaHogar >= f.ganaMovil);
    const g = hogar ? f.ganaHogar : f.ganaMovil;
    return `💡 1 ${hogar ? "🏠 Hogar" : "📱 Móvil"} más y subes de escalón: +${fmtMiles(g, 0)}`;
  }
  const opciones = [];
  if (f.hogar) opciones.push({ n: f.hogar, tipo: "🏠 Hogar", g: f.ganaHogar });
  if (f.movil) opciones.push({ n: f.movil, tipo: "📱 Móvil", g: f.ganaMovil });
  if (!opciones.length) return null;
  opciones.sort((x, y) => x.n - y.n || y.g - x.g);
  const o = opciones[0];
  return `💡 A ${o.n} ${o.tipo} del siguiente escalón: +${fmtMiles(o.g, 0)}`;
}

// Simulador de comisión en pantalla completa. Suma clientes Hogar y Móvil que todavía no
// tienes y muestra al instante cuánto cambiaría tu comisión. No guarda nada: parte siempre de
// los números reales de hoy. "Más opciones" trae: cobrar una cantidad, cierre a tu ritmo,
// escalera, cálculo, portabilidad y precios, y comparar dos ideas (A y B).
function SimuladorComisionModal({ periodoKey, base, defecto, ritmo, onClose }) {
  const [st, setSt] = useState(() => ({ slot: "A", A: { h: 0, m: 0, p: 0 }, B: { h: 0, m: 0, p: 0 }, ph: defecto.hogar, pm: defecto.movil, target: null, mas: false, sec: null }));
  const g = (patch) => setSt((prev) => ({ ...prev, ...patch }));

  // Atrás del navegador/gesto del iPhone cierra el simulador y deja el Dashboard como estaba.
  useEffect(() => {
    try { window.history.pushState({ ...(window.history.state || {}), sim: true }, ""); } catch (e) {}
    function onPop() { onClose(); }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  function cerrar() {
    try { window.history.back(); } catch (e) { onClose(); }
  }

  const calc = (s) => calcularComisionNueva({
    clientesHogar: base.clientesHogar + s.h,
    metaClientesHogar: base.metaHogar,
    clientesMovil: base.clientesMovil + s.m,
    metaClientesMovil: base.metaMovil,
    ingresosDelPeriodo: base.ingresos + s.h * st.ph + s.m * st.pm,
    metaIngresos: base.metaIngresos,
    cantidadBonoMovil: base.bonos + s.p,
    cantidadBonoPendiente: 0,
  });
  const slot = st.slot;
  const s = st[slot];
  const cero = { h: 0, m: 0, p: 0 };
  const ahora = calc(cero);
  const sim = calc(s);
  const dif = sim.total - ahora.total;
  const mons = (n) => (n < 0 ? "−" : "+") + fmtMiles(Math.abs(n), 0);

  function cambiar(campo, d) {
    const nuevo = { ...s, [campo]: Math.max(0, s[campo] + d) };
    if (nuevo.p > nuevo.m) nuevo.p = nuevo.m;
    g({ [slot]: nuevo });
  }
  const hastaEscalon = (hogar) => {
    for (let n = 1; n <= 60; n++) {
      const x = calc(hogar ? { ...s, h: s.h + n } : { ...s, m: s.m + n });
      if (x.montoBase > sim.montoBase) return { n, gana: x.total - sim.total };
    }
    return null;
  };
  const eH = hastaEscalon(true);
  const eM = hastaEscalon(false);
  const topeMonto = TABLA_POSICION_NUEVA[TABLA_POSICION_NUEVA.length - 1].monto;
  const tope = sim.montoBase >= topeMonto;
  let consejoLinea = "";
  let atajo = null;
  if (tope) {
    consejoLinea = "Ya estás en el tope de clientes (140%). Ahora solo cuentan los ingresos: vende planes de más valor.";
  } else {
    const cruzaH = eH && eH.n === 1;
    const cruzaM = eM && eM.n === 1;
    if (cruzaH || cruzaM) {
      const hogar = cruzaH && (!cruzaM || eH.gana >= eM.gana);
      consejoLinea = "1 " + (hogar ? "Hogar" : "Móvil") + " más y subes de escalón: " + mons(hogar ? eH.gana : eM.gana) + ".";
    } else {
      let o = null;
      if (eH && (!eM || eH.n <= eM.n)) o = { n: eH.n, t: "Hogar", g: eH.gana };
      else if (eM) o = { n: eM.n, t: "Móvil", g: eM.gana };
      consejoLinea = o ? "Estás a " + o.n + " " + o.t + " del siguiente escalón: " + mons(o.g) + "." : "";
    }
    let opc = null;
    if (eH && (!eM || eH.n < eM.n || (eH.n === eM.n && eH.gana >= eM.gana))) opc = { hogar: true, n: eH.n };
    else if (eM) opc = { hogar: false, n: eM.n };
    if (opc) atajo = { txt: "Sumar " + opc.n + (opc.hogar ? " Hogar" : " Móvil") + " y subir de escalón", ir: () => cambiar(opc.hogar ? "h" : "m", opc.n) };
  }

  const C = { navy: "#001E62", mu: "#5A6680", bd: "#DFE5EF", cell: "#E3EDFA", page: "#F3F6FB" };
  const tarjeta = { background: "#fff", border: "1px solid " + C.bd, borderRadius: 16, padding: "12px 14px", display: "flex", alignItems: "center", gap: 12 };
  const btnMenos = { width: 44, height: 44, borderRadius: 12, border: "2px solid " + C.bd, background: C.page, color: C.navy, fontSize: 24, fontWeight: 700, lineHeight: 1, padding: 0 };
  const btnMas = { width: 48, height: 48, borderRadius: 12, border: 0, background: C.navy, color: "#fff", fontSize: 26, fontWeight: 700, lineHeight: 1, padding: 0 };
  const btnChico = { width: 44, height: 44, borderRadius: 12, border: "2px solid " + C.bd, background: C.page, color: C.navy, fontSize: 20, fontWeight: 700, padding: 0 };
  const icoCaja = { width: 40, height: 40, borderRadius: 12, background: C.cell, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: C.navy };
  const num = { fontVariantNumeric: "tabular-nums" };

  // ---- Secciones de "Más opciones" ----
  const seccion = (key, titulo, contenido) => (
    <div key={key} style={ { background: "#fff", border: "1px solid " + C.bd, borderRadius: 14, padding: "2px 14px" } }>
      <button type="button" onClick={() => g({ sec: st.sec === key ? null : key })} aria-expanded={st.sec === key} style={ { width: "100%", minHeight: 48, background: "transparent", border: 0, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, color: C.navy, fontSize: 14, fontWeight: 700, padding: 0, textAlign: "left" } }>
        <span>{titulo}</span><span style={ { fontSize: 18, color: C.mu } }>{st.sec === key ? "−" : "+"}</span>
      </button>
      {st.sec === key && contenido}
    </div>
  );
  const ajusteFila = (titulo, sub, valor, onMenos, onMas, etMenos, etMas) => (
    <div style={ { display: "flex", alignItems: "center", gap: 8 } }>
      <div style={ { flex: 1, fontSize: 13, fontWeight: 600, lineHeight: 1.3 } }>{titulo}{sub && <div style={ { color: C.mu, fontWeight: 500, fontSize: 11 } }>{sub}</div>}</div>
      <button type="button" onClick={onMenos} aria-label={etMenos} style={btnChico}>−</button>
      <div style={ { minWidth: 40, textAlign: "center", fontWeight: 800, ...num } }>{valor}</div>
      <button type="button" onClick={onMas} aria-label={etMas} style={btnChico}>+</button>
    </div>
  );

  // Meta: combinaciones más cortas de Hogar y Móvil para llegar a una cantidad.
  const T = st.target != null ? st.target : Math.ceil((ahora.total + 150) / 50) * 50;
  let combos = [];
  let objTitulo;
  let objSub;
  if (st.sec === "meta") {
    if (T <= ahora.total + 0.5) {
      objTitulo = "¡Ya lo logras!";
      objSub = "Hoy llevas " + fmtMiles(ahora.total, 0) + ". Sube la cantidad para ver qué falta.";
    } else {
      const lista = [];
      for (let h = 0; h <= 12; h++) {
        for (let m = 0; m <= 12; m++) {
          if (calc({ h, m, p: 0 }).total >= T) { lista.push({ h, m }); break; }
        }
      }
      const filtradas = lista.filter((a) => !lista.some((b) => b !== a && b.h <= a.h && b.m <= a.m && (b.h < a.h || b.m < a.m)));
      filtradas.sort((a, b) => (a.h + a.m) - (b.h + b.m));
      combos = filtradas.slice(0, 3).map((c) => ({ ...c, total: calc({ h: c.h, m: c.m, p: 0 }).total }));
      objTitulo = combos.length ? "Para llegar a " + fmtMiles(T, 0) + " puedes vender:" : "Esa cantidad está muy lejos";
      objSub = combos.length ? "Las combinaciones más cortas, con tus planes promedio." : "Baja la cantidad un poco.";
    }
  }
  // Ritmo: cómo cierras el mes si sigues al paso de hoy.
  const transc = ritmo && ritmo.transcurridos > 0 ? ritmo.transcurridos : 0;
  const rem = ritmo ? Math.max(0, ritmo.total - ritmo.transcurridos) : 0;
  const addH = transc ? Math.round((base.clientesHogar / transc) * rem) : 0;
  const addM = transc ? Math.round((base.clientesMovil / transc) * rem) : 0;
  const proy = calc({ h: addH, m: addM, p: 0 });
  const ritDif = proy.total - ahora.total;
  // Escalera
  const posEsc = (v) => Math.max(0, Math.min(100, ((v - MINIMO_COBRO) / (145 - MINIMO_COBRO)) * 100));
  const abrev = (v) => (v < 1000 ? "$" + v : "$" + String(+(v / 1000).toFixed(2)) + "k");
  const pcA = ahora.pctClientesPonderado;
  const pcS = sim.pctClientesPonderado;
  const ajTxt = sim.ajusteIngreso === "acelerador" ? " (acelerador +10 pts)" : sim.ajusteIngreso === "desacelerador" ? " (desacelerador)" : "";
  const filaCalc = (k, v) => (
    <div key={k} style={ { display: "flex", justifyContent: "space-between", gap: 10, padding: "7px 0", borderTop: "1px solid #EEF1F6", fontSize: 13 } }>
      <span style={ { color: "#374151", minWidth: 0 } }>{k}</span><b style={ { textAlign: "right", flexShrink: 0, ...num } }>{v}</b>
    </div>
  );
  const dA = calc(st.A).total - ahora.total;
  const dB = calc(st.B).total - ahora.total;
  const slotBtn = (id, dd) => (
    <button key={id} type="button" onClick={() => g({ slot: id })} aria-pressed={slot === id} style={ { flex: 1, minHeight: 44, padding: "0 10px", borderRadius: 12, fontSize: 13, fontWeight: 800, border: "2px solid " + C.navy, background: slot === id ? C.navy : "#fff", color: slot === id ? "#fff" : C.navy } }>
      Idea {id} · {mons(dd)}
    </button>
  );

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex flex-col font-sans" style={ { background: C.page, color: C.navy } }>
      <div style={ { flex: "none", background: "#fff", padding: "calc(12px + env(safe-area-inset-top)) 16px 10px", display: "flex", alignItems: "center", gap: 10, borderBottom: "1px solid " + C.bd } }>
        <button type="button" onClick={cerrar} aria-label="Volver al Dashboard" style={ { width: 44, height: 44, border: 0, background: C.page, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", color: C.navy } }>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div style={ { flex: 1, minWidth: 0 } }>
          <div style={ { fontSize: 17, fontWeight: 800, lineHeight: 1.2 } }>Simulador de comisión</div>
          <div style={ { fontSize: 12, color: C.mu, marginTop: 2 } }>{mesLabel(periodoKey)} · cobras en {mesLabel(sumarMesClave(periodoKey, 2)).split(" ")[0].toLowerCase()}</div>
        </div>
      </div>

      <div style={ { flex: "none", background: C.navy, color: "#fff", padding: "12px 16px" } }>
        <div style={ { display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 8 } }>
          <div>
            <div style={ { fontSize: 11, fontWeight: 600, opacity: 0.8 } }>Ahora</div>
            <div style={ { fontSize: 22, fontWeight: 700, lineHeight: 1.1, ...num } }>{fmtMiles(ahora.total, 0)}</div>
          </div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={ { marginBottom: 4, opacity: 0.8 } }><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          <div style={ { textAlign: "right" } }>
            <div style={ { fontSize: 11, fontWeight: 600, opacity: 0.8 } }>Con tu simulación</div>
            <div style={ { fontSize: 30, fontWeight: 800, lineHeight: 1.05, ...num } }>{fmtMiles(sim.total, 0)}</div>
          </div>
        </div>
        <div style={ { marginTop: 8, display: "inline-flex", alignItems: "center", gap: 6, background: "#fff", color: C.navy, borderRadius: 999, padding: "5px 12px", fontSize: 13, fontWeight: 800 } }>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={dif > 0.5 ? "M12 19V5M5 12l7-7 7 7" : dif < -0.5 ? "M12 5v14M5 12l7 7 7-7" : "M5 12h14"} /></svg>
          {Math.abs(dif) < 0.5 ? "Sin cambio todavía" : (dif > 0 ? "Subirías " : "Bajarías ") + fmtMiles(Math.abs(dif), 0)}
        </div>
      </div>

      <div style={ { flex: 1, minHeight: 0, overflowY: "auto", padding: "12px 12px calc(28px + env(safe-area-inset-bottom))", display: "flex", flexDirection: "column", gap: 10 } }>
        <div style={tarjeta}>
          <div style={icoCaja}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" /></svg></div>
          <div style={ { flex: 1, minWidth: 0 } }>
            <div style={ { fontSize: 15, fontWeight: 800 } }>Hogar</div>
            <div style={ { fontSize: 12, color: C.mu, marginTop: 2 } }>Llevas {base.clientesHogar} de {base.metaHogar}{s.h ? " → " + (base.clientesHogar + s.h) + " (" + Math.round(sim.pctHogar) + "%)" : " (" + Math.round(ahora.pctHogar) + "%)"}</div>
          </div>
          <div style={ { display: "flex", alignItems: "center", gap: 6, flexShrink: 0 } }>
            <button type="button" onClick={() => cambiar("h", -1)} aria-label="Quitar un Hogar" style={btnMenos}>−</button>
            <div style={ { minWidth: 28, textAlign: "center", fontSize: 24, fontWeight: 800 } }>{s.h}</div>
            <button type="button" onClick={() => cambiar("h", 1)} aria-label="Agregar un Hogar" style={btnMas}>+</button>
          </div>
        </div>

        <div style={tarjeta}>
          <div style={icoCaja}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M11 18.5h2" /></svg></div>
          <div style={ { flex: 1, minWidth: 0 } }>
            <div style={ { fontSize: 15, fontWeight: 800 } }>Móvil</div>
            <div style={ { fontSize: 12, color: C.mu, marginTop: 2 } }>Llevas {base.clientesMovil} de {base.metaMovil}{s.m ? " → " + (base.clientesMovil + s.m) + " (" + Math.round(sim.pctMovil) + "%)" : " (" + Math.round(ahora.pctMovil) + "%)"}</div>
          </div>
          <div style={ { display: "flex", alignItems: "center", gap: 6, flexShrink: 0 } }>
            <button type="button" onClick={() => cambiar("m", -1)} aria-label="Quitar un Móvil" style={btnMenos}>−</button>
            <div style={ { minWidth: 28, textAlign: "center", fontSize: 24, fontWeight: 800 } }>{s.m}</div>
            <button type="button" onClick={() => cambiar("m", 1)} aria-label="Agregar un Móvil" style={btnMas}>+</button>
          </div>
        </div>

        {consejoLinea && (
          <div style={ { background: C.cell, border: "1px solid #C9DBF3", borderRadius: 16, padding: 14 } }>
            <div style={ { display: "flex", alignItems: "center", gap: 8 } }>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={ { flexShrink: 0 } }><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" /></svg>
              <div style={ { fontSize: 12, fontWeight: 700, color: "#374151" } }>{s.h || s.m ? "Con lo que simulas, lo que sigue" : "Lo que más te conviene vender"}</div>
            </div>
            <div style={ { marginTop: 6, fontSize: 16, fontWeight: 800, lineHeight: 1.35 } }>{consejoLinea}</div>
            {atajo && (
              <button type="button" onClick={atajo.ir} style={ { marginTop: 12, minHeight: 48, width: "100%", borderRadius: 12, border: 0, background: C.navy, color: "#fff", fontSize: 14, fontWeight: 800 } }>{atajo.txt}</button>
            )}
          </div>
        )}

        {(s.h > 0 || s.m > 0 || s.p > 0) && (
          <button type="button" onClick={() => g({ [slot]: cero })} style={ { minHeight: 44, borderRadius: 12, border: "2px solid " + C.bd, background: "#fff", color: C.mu, fontSize: 13, fontWeight: 700 } }>Limpiar lo que simulé</button>
        )}

        <button type="button" onClick={() => g({ mas: !st.mas, sec: null })} aria-expanded={st.mas} style={ { minHeight: 48, borderRadius: 12, border: "2px solid " + C.navy, background: "#fff", color: C.navy, fontSize: 14, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 } }>
          {st.mas ? "Menos opciones" : "Más opciones"}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={st.mas ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"} /></svg>
        </button>

        {st.mas && (
          <div style={ { display: "flex", flexDirection: "column", gap: 8 } }>
            {seccion("meta", "Quiero cobrar una cantidad", (
              <div style={ { padding: "2px 0 14px" } }>
                <div style={ { fontSize: 12, color: C.mu, lineHeight: 1.35 } }>Elige cuánto y te digo qué te falta vender.</div>
                <div style={ { display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginTop: 10 } }>
                  <button type="button" onClick={() => g({ target: Math.max(500, T - 50) })} aria-label="Bajar la meta $50" style={ { ...btnMenos, width: 48, height: 48 } }>−</button>
                  <div style={ { minWidth: 110, textAlign: "center", fontSize: 30, fontWeight: 800, ...num } }>{fmtMiles(T, 0)}</div>
                  <button type="button" onClick={() => g({ target: T + 50 })} aria-label="Subir la meta $50" style={ { ...btnMas, fontSize: 24 } }>+</button>
                </div>
                <div style={ { marginTop: 12, fontSize: 14, fontWeight: 800 } }>{objTitulo}</div>
                <div style={ { fontSize: 12, color: C.mu, marginTop: 2, lineHeight: 1.35 } }>{objSub}</div>
                {combos.map((c) => (
                  <div key={c.h + "-" + c.m} style={ { display: "flex", alignItems: "center", gap: 10, borderTop: "1px solid #EEF1F6", marginTop: 10, paddingTop: 10 } }>
                    <div style={ { flex: 1, minWidth: 0 } }>
                      <div style={ { fontSize: 15, fontWeight: 800 } }>{[c.h ? c.h + " Hogar" : null, c.m ? c.m + " Móvil" : null].filter(Boolean).join(" y ")}</div>
                      <div style={ { fontSize: 12, color: C.mu, marginTop: 2 } }>Cobrarías {fmtMiles(c.total, 0)}</div>
                    </div>
                    <button type="button" onClick={() => g({ [slot]: { h: c.h, m: c.m, p: 0 }, sec: null, mas: false })} style={ { minHeight: 44, padding: "0 14px", borderRadius: 12, border: "2px solid " + C.navy, background: "#fff", color: C.navy, fontSize: 13, fontWeight: 800 } }>Probar</button>
                  </div>
                ))}
              </div>
            ))}

            {seccion("ritmo", "Cómo cierro el mes a mi ritmo", (
              <div style={ { padding: "2px 0 14px" } }>
                {transc ? (
                  <React.Fragment>
                    <div style={ { fontSize: 12, color: C.mu, lineHeight: 1.4 } }>Llevas {ritmo.transcurridos} de {ritmo.total} días de venta. Te quedan {rem}.</div>
                    <div style={ { fontSize: 13, fontWeight: 700, marginTop: 10, lineHeight: 1.4 } }>Cerrarías con {base.clientesHogar + addH} Hogar y {base.clientesMovil + addM} Móvil.</div>
                    <div style={ { fontSize: 24, fontWeight: 800, marginTop: 6, ...num } }>{fmtMiles(proy.total, 0)}</div>
                    <div style={ { fontSize: 12, color: C.mu, marginTop: 2, lineHeight: 1.35 } }>{ritDif >= 0.5 ? mons(ritDif) + " más que hoy (" + fmtMiles(ahora.total, 0) + ")." : "Igual que hoy (" + fmtMiles(ahora.total, 0) + ")."}</div>
                    <button type="button" onClick={() => g({ [slot]: { h: addH, m: addM, p: 0 }, sec: null, mas: false })} style={ { marginTop: 12, minHeight: 46, width: "100%", borderRadius: 12, border: "2px solid " + C.navy, background: "#fff", color: C.navy, fontSize: 13, fontWeight: 800 } }>Probar esto arriba</button>
                    <div style={ { fontSize: 11, color: C.mu, marginTop: 8, lineHeight: 1.35 } }>Es un estimado con tu ritmo de hoy, no una promesa.</div>
                  </React.Fragment>
                ) : (
                  <div style={ { fontSize: 12, color: C.mu, lineHeight: 1.4 } }>Aún no hay días de venta para estimar tu ritmo.</div>
                )}
              </div>
            ))}

            {seccion("escalera", "Ver la escalera de escalones", (
              <div style={ { paddingBottom: 14 } }>
                <div style={ { position: "relative", height: 78, margin: "4px 10px 0" } }>
                  <div style={ { position: "absolute", left: 0, right: 0, top: 34, height: 8, borderRadius: 4, background: C.bd } } />
                  <div style={ { position: "absolute", left: 0, top: 34, height: 8, borderRadius: 4, background: "repeating-linear-gradient(135deg,#0072CE 0 3px,#BFD8F2 3px 6px)", width: Math.max(posEsc(pcS), posEsc(pcA)) + "%" } } />
                  <div style={ { position: "absolute", left: 0, top: 34, height: 8, borderRadius: 4, background: C.navy, width: posEsc(pcA) + "%" } } />
                  {TABLA_POSICION_NUEVA.map((t) => (
                    <div key={t.min} style={ { position: "absolute", top: 6, width: 44, marginLeft: -22, textAlign: "center", left: posEsc(t.min) + "%" } }>
                      <div style={ { fontSize: 10, fontWeight: 700, color: C.mu, height: 14, lineHeight: "14px" } }>{t.min}</div>
                      <div style={ { width: 14, height: 14, boxSizing: "border-box", borderRadius: "50%", margin: "6px auto 0", border: "2px solid " + C.navy, background: pcS + 1e-9 >= t.min ? C.navy : "#fff" } } />
                      <div style={ { fontSize: 10, fontWeight: 700, color: C.navy, marginTop: 4 } }>{abrev(t.monto)}</div>
                    </div>
                  ))}
                </div>
                <div style={ { display: "flex", flexWrap: "wrap", gap: "6px 14px", marginTop: 6, fontSize: 11, fontWeight: 600, color: "#374151" } }>
                  <div style={ { display: "flex", alignItems: "center", gap: 6 } }><span style={ { width: 16, height: 8, borderRadius: 4, background: C.navy, display: "inline-block" } } />Hoy {pcA.toFixed(1)}%</div>
                  <div style={ { display: "flex", alignItems: "center", gap: 6 } }><span style={ { width: 16, height: 8, borderRadius: 4, background: "repeating-linear-gradient(135deg,#0072CE 0 3px,#BFD8F2 3px 6px)", display: "inline-block" } } />Simulado {pcS.toFixed(1)}%</div>
                </div>
                <div style={ { fontSize: 11, color: C.mu, marginTop: 6 } }>Arriba el % de clientes, abajo la base que cobras.</div>
              </div>
            ))}

            {seccion("calculo", "Cómo sale el cálculo", (
              <div style={ { paddingBottom: 10 } }>
                {filaCalc("Clientes (65% Hogar + 35% Móvil)", pcA.toFixed(1) + "% → " + pcS.toFixed(1) + "%")}
                {filaCalc("Base por escalón", fmtMiles(ahora.montoBase, 0) + " → " + fmtMiles(sim.montoBase, 0))}
                {filaCalc("Ingresos vs meta de " + fmtMiles(base.metaIngresos, 0), Math.round(ahora.pctIngreso) + "% → " + Math.round(sim.pctIngreso) + "%")}
                {filaCalc("Factor de ingresos" + ajTxt, "×" + ahora.factorAcelerador.toFixed(2) + " → ×" + sim.factorAcelerador.toFixed(2))}
                {filaCalc("Bono portabilidad (" + (base.bonos + s.p) + " × $" + BONO_POR_CONVERGENCIA + ")", fmtMiles(ahora.bonoConvergencias, 0) + " → " + fmtMiles(sim.bonoConvergencias, 0))}
                {filaCalc("Total", fmtMiles(ahora.total, 0) + " → " + fmtMiles(sim.total, 0))}
              </div>
            ))}

            {seccion("ajustes", "Portabilidad y precios de planes", (
              <div style={ { display: "flex", flexDirection: "column", gap: 8, padding: "2px 0 14px" } }>
                {ajusteFila("Móvil con portabilidad", "de los " + s.m + " que simulas · bono $" + BONO_POR_CONVERGENCIA + " c/u", s.p, () => cambiar("p", -1), () => { if (s.p < s.m) cambiar("p", 1); }, "Quitar una portabilidad", "Agregar una portabilidad")}
                {ajusteFila("Plan Hogar", null, fmtMiles(st.ph, 0), () => g({ ph: Math.max(1, st.ph - 1) }), () => g({ ph: st.ph + 1 }), "Bajar plan Hogar", "Subir plan Hogar")}
                {ajusteFila("Plan Móvil", null, fmtMiles(st.pm, 0), () => g({ pm: Math.max(1, st.pm - 1) }), () => g({ pm: st.pm + 1 }), "Bajar plan Móvil", "Subir plan Móvil")}
                <div style={ { fontSize: 11, color: C.mu, lineHeight: 1.35 } }>Los planes empiezan en el promedio de tus ventas de este período.</div>
              </div>
            ))}

            {seccion("escen", "Comparar dos ideas (A y B)", (
              <div style={ { padding: "2px 0 14px" } }>
                <div style={ { fontSize: 12, color: C.mu, lineHeight: 1.4 } }>Elige A o B y cambia los contadores de arriba. Cada uno guarda lo suyo.</div>
                <div style={ { display: "flex", gap: 8, marginTop: 10 } }>{slotBtn("A", dA)}{slotBtn("B", dB)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>,
    document.body
  );
}

function MiniStat({ valor, label, color, onClick }) {
  return (
    <button
      onClick={onClick}
      className="bg-white rounded-lg border border-gray-200 shadow-sm px-3 py-3 text-left hover:border-gray-300 transition-colors"
    >
      <div className="text-xl font-mono font-semibold" style={ { color } }>{valor}</div>
      <div className="text-[11px] mt-0.5 leading-tight" style={ { color: "#5A6680" } }>{label}</div>
    </button>
  );
}

// Input de meta que solo confirma el cambio (y por lo tanto solo registra en la
// bitácora) al presionar Enter, salir del campo, o tocar el botón ✓ — no en cada
// tecla que se escribe, para no llenar el historial de cambios intermedios.
function MetaInput({ valor, onConfirmar, width, step }) {
  const [editando, setEditando] = useState(false);
  const [valorLocal, setValorLocal] = useState(valor ?? "");

  useEffect(() => {
    if (!editando) setValorLocal(valor ?? "");
  }, [valor, editando]);

  function confirmar() {
    setEditando(false);
    if (String(valorLocal) !== String(valor ?? "")) {
      onConfirmar(valorLocal);
    }
  }

  function cancelar() {
    setValorLocal(valor ?? "");
    setEditando(false);
  }

  const hayCambioPendiente = editando && String(valorLocal) !== String(valor ?? "");

  return (
    <div className="flex items-center gap-1">
      <input
        type="number"
        min="0"
        step={step}
        value={valorLocal}
        onFocus={() => setEditando(true)}
        onChange={(e) => setValorLocal(e.target.value)}
        onBlur={confirmar}
        onKeyDown={(e) => {
          if (e.key === "Enter") e.currentTarget.blur();
          if (e.key === "Escape") { cancelar(); e.currentTarget.blur(); }
        } }
        placeholder="0"
        className={`${width || "w-20"} px-2 py-1 rounded-md border text-sm outline-none`}
        style={ { borderColor: hayCambioPendiente ? "#0072CE" : "#DFE5EF" } }
      />
      {hayCambioPendiente && (
        <button
          type="button"
          onMouseDown={(e) => e.preventDefault()}
          onClick={confirmar}
          title="Confirmar cambio"
          className="text-xs px-1.5 py-1 rounded-md text-white leading-none"
          style={ { background: "#001E62" } }
        >
          ✓
        </button>
      )}
    </div>
  );
}

// Días de venta de un período: todos los días del mes menos los domingos y menos los
// últimos 2 días del mes. "transcurridos" incluye hoy si hoy es un día de venta.
function diasDeVentaPeriodo(periodoKey, hoy) {
  const { inicio, fin } = rangoCiclo(periodoKey);
  const ultimo = new Date(fin.getFullYear(), fin.getMonth(), fin.getDate() - 2);
  const h = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const cursor = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate());
  let total = 0;
  let transcurridos = 0;
  while (cursor <= ultimo) {
    if (cursor.getDay() !== 0) {
      total += 1;
      if (cursor <= h) transcurridos += 1;
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return { total, transcurridos };
}

// Tarjetas del Dashboard que se pueden ordenar. La de comisión nunca se esconde.
const ORDEN_DASHBOARD_BASE = ["dinero", "comision", "metas", "instalaciones", "planes", "dia", "ventas"];
function ordenDashboardNormal(cfg) {
  const o = cfg && Array.isArray(cfg.orden) ? cfg.orden.filter((id, i, a) => ORDEN_DASHBOARD_BASE.includes(id) && a.indexOf(id) === i) : [];
  // Una tarjeta que todavía no estaba guardada se coloca justo después de la que le
  // precede en el orden de fábrica (así "Instalaciones por día" queda bajo "Avance").
  ORDEN_DASHBOARD_BASE.forEach((id, k) => {
    if (o.includes(id)) return;
    const previo = k > 0 ? o.indexOf(ORDEN_DASHBOARD_BASE[k - 1]) : -1;
    if (previo >= 0) o.splice(previo + 1, 0, id);
    else o.push(id);
  });
  return o;
}
function ocultosDashboardNormal(cfg) {
  return cfg && Array.isArray(cfg.ocultos) ? cfg.ocultos.filter((id) => ORDEN_DASHBOARD_BASE.includes(id) && id !== "comision") : [];
}

// Bono de ingresos (+10 puntos): se activa al pasar el 100% de la meta de ingresos.
// Aproximado: cuántos clientes más hacen falta según lo que deja cada tipo en promedio.
function clientesParaBonoIngresos(ingresosTotal, metaDinero, rpuHogar, rpuMovil) {
  if (!metaDinero) return null;
  const falta = metaDinero - ingresosTotal;
  if (falta < 0) return { activo: true, falta: 0, cH: null, cM: null };
  const cuantos = (r) => (r > 0 ? Math.floor(falta / r) + 1 : null);
  return { activo: false, falta, cH: cuantos(rpuHogar), cM: cuantos(rpuMovil) };
}

            <div style={fila}><span>Móvil<em style={peq}>{movilN} de {metaClientesMovil || "—"} · {comision.pctMovil.toFixed(0)}%</em></span><span style={num}>× {PESO_CLIENTES_MOVIL * 100}%</span></div>
            <div style={fila}><span>Total de clientes</span><span style={num}>{pc.toFixed(1)}%</span></div>

            <div style={sep} />
            <div style={tit}>Ingresos</div>
            <div style={fila}>
              <span>Ingresos<em style={peq}>{fmtMiles(ingresosTotal, 0)} de {fmtMiles(metaDinero, 0)} · {pi.toFixed(base === 0 ? 1 : 0)}%{acel && base > 0 ? " + 10 pts" : ""}</em></span>

              <div style={ { marginBottom: 8, borderRadius: 10, padding: "6px 12px", background: C.pn } }>
                {[
                  { n: "Clientes hogar", v: "~" + proyeccion.clientes, m: metaClientesHogar, fm: (x) => String(x), vp: proyeccion.clientes },
                  { n: "Clientes móvil", v: "~" + proyeccion.convergencias, m: metaClientesMovil, fm: (x) => String(x), vp: proyeccion.convergencias },
                  { n: "Ingresos", v: "~" + fmtMiles(proyeccion.ingresos, 0), m: metaDinero, fm: (x) => fmtMiles(x, 0), vp: proyeccion.ingresos },

                  <div key={f.n} style={fila}>
