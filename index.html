// ---------- Helpers de fecha ----------
const toISO = (d) => {
  const dt = new Date(d);
  return dt.toISOString().slice(0, 10);
};
const addDays = (dateStr, n) => {
  const dt = new Date(dateStr + "T00:00:00");
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
};
const daysInMonth = (year, monthIndex) => new Date(year, monthIndex + 1, 0).getDate();
const addMonthsKeepDay = (dateStr, monthsToAdd, targetDay) => {
  const dt = new Date(dateStr + "T00:00:00");
  const totalMonth = dt.getMonth() + monthsToAdd;
  const year = dt.getFullYear() + Math.floor(totalMonth / 12);
  const month = ((totalMonth % 12) + 12) % 12;
  const lastDay = daysInMonth(year, month);
  const day = Math.min(targetDay || dt.getDate(), lastDay);
  return toISO(new Date(year, month, day));
};
const daysFromToday = (dateStr) => {
  const today = new Date(toISO(new Date()) + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
};

// Período de comisión: instalados del 21 del mes anterior al 20 del mes actual
// se cuentan como "del mes actual" (el día 21 ya arranca el período siguiente).
function periodoComision(fechaISO) {
  if (!fechaISO) return null;
  const [y, m, d] = fechaISO.split("-").map(Number);
  let year = y;
  let month = m;
  if (d >= 21) {
    month += 1;
    if (month > 12) { month = 1; year += 1; }
  }
  return `${year}-${String(month).padStart(2, "0")}`;
}
// Suma (o resta) meses a una clave "YYYY-MM", para navegar entre períodos de comisión.
function sumarMesClave(mesKey, delta) {
  const [y, m] = mesKey.split("-").map(Number);
  const total = y * 12 + (m - 1) + delta;
  const newY = Math.floor(total / 12);
  const newM = (((total % 12) + 12) % 12) + 1;
  return `${newY}-${String(newM).padStart(2, "0")}`;
}
// Lista de períodos de comisión recientes (el actual primero), según la fecha de hoy.
function periodosRecientes(count) {
  const actual = periodoComision(toISO(new Date()));
  const out = [];
  for (let i = 0; i < count; i++) {
    const key = sumarMesClave(actual, -i);
    out.push({ key, label: mesLabel(key) });
  }
  return out;
}

// ---------- Cálculo de comisión ----------
// Monto base según el % de logro en ingresos ($ de clientes) del período actual.
const TABLA_COMISION_BASE = [
  { min: 80, max: 89.9999, monto: 550 },
  { min: 90, max: 99.9999, monto: 750 },
  { min: 100, max: 109.9999, monto: 950 },
  { min: 110, max: 119.9999, monto: 1150 },
  { min: 120, max: 129.9999, monto: 1300 },
  { min: 130, max: 139.9999, monto: 1500 },
  { min: 140, max: Infinity, monto: 1700 },
];
function montoBaseComision(pctIngreso) {
  if (pctIngreso == null || pctIngreso < 80) return 0;
  const tramo = TABLA_COMISION_BASE.find((t) => pctIngreso >= t.min && pctIngreso <= t.max);
  return tramo ? tramo.monto : 1700;
}
// Comisión final = monto base (según % ingreso) × (% ARPU / 100) × (% clientes / 100).
// Si el % de clientes instalados supera 90%, el ingreso del período suma también
// los montos de las convergencias FULL TIGO de ese mismo período.
function calcularComision({ dineroDelPeriodo, metaDinero, arpuPeriodo, metaArpu, clientesInstalados, metaClientes, bonoFullTigo }) {
  const pctClientes = metaClientes ? (clientesInstalados / metaClientes) * 100 : null;
  const aplicaBono = pctClientes !== null && pctClientes > 90;
  const dineroAjustado = dineroDelPeriodo + (aplicaBono ? bonoFullTigo : 0);
  const pctIngreso = metaDinero ? (dineroAjustado / metaDinero) * 100 : null;
  const pctArpu = metaArpu ? (arpuPeriodo / metaArpu) * 100 : null;
  const montoBase = montoBaseComision(pctIngreso);
  const factorArpu = pctArpu != null ? pctArpu / 100 : 0;
  const factorClientes = pctClientes != null ? pctClientes / 100 : 0;
  const completo = pctIngreso != null && pctArpu != null && pctClientes != null;
  const total = completo ? montoBase * factorArpu * factorClientes : 0;
  return { total, montoBase, pctIngreso, pctArpu, pctClientes, aplicaBono, bonoFullTigo, dineroAjustado, completo };
}

function calcularPrimeraFactura(fechaInstalacion, cicloDia, montoMensual) {
  if (!fechaInstalacion || !cicloDia) return null;
  const dt = new Date(fechaInstalacion + "T00:00:00");
  const day = dt.getDate();
  let year = dt.getFullYear();
  let month = dt.getMonth();
  if (day >= cicloDia) {
    month += 1;
    if (month > 11) { month = 0; year += 1; }
  }
  const lastDay = daysInMonth(year, month);
  const diaFactura = Math.min(cicloDia, lastDay);
  const fecha1raFactura = toISO(new Date(year, month, diaFactura));
  const dias = Math.round((new Date(fecha1raFactura + "T00:00:00") - dt) / 86400000);
  const monto = montoMensual ? +((Number(montoMensual) * dias) / 30).toFixed(2) : "";
  return { fecha1raFactura, monto1raFactura: monto, dias };
}

function calcularFacturas(cliente, umbralProrrateo) {
  if (!cliente.fechaInstalacion) return [];
  const cicloDia = parseInt(cliente.cicloFacturacion, 10) || null;
  const facturas = [];
  for (let n = 1; n <= 4; n++) {
    const generada =
      n === 1
        ? cliente.fecha1raFactura
        : cicloDia
        ? addMonthsKeepDay(cliente.fecha1raFactura, n - 1, cicloDia)
        : addDays(cliente.fecha1raFactura, 30 * (n - 1));
    const siguienteGenerada = cicloDia
      ? addMonthsKeepDay(generada, 1, cicloDia)
      : addDays(generada, 30);
    const vencimiento = addDays(siguienteGenerada, -1);
    const milestones = MILESTONE_TYPES.map((mt) => {
      const key = `f${n}_${mt.type}`;
      const triggerDate =
        mt.type === "d1" ? addDays(generada, 1) :
        mt.type === "t15" ? addDays(vencimiento, -15) :
        addDays(vencimiento, -3);
      const enviado = !!cliente[key];
      const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
      const texto = mt.getTexto({ ...cliente, _venc: vencimiento, plan: planLabelMensaje(cliente) }, n);
      return { ...mt, key, n, triggerDate, enviado, pendienteHoy, texto };
    });

    // Solo para la 1ra factura: si el prorrateo es igual o mayor al umbral configurado,
    // se suma un aviso extra 3 días después de la instalación.
    if (n === 1 && cicloDia && cliente.montoMensual) {
      const rProrrateo = calcularPrimeraFactura(cliente.fechaInstalacion, cicloDia, cliente.montoMensual);
      if (rProrrateo && Number(rProrrateo.monto1raFactura) > 0) {
        const pctProrrateo = (Number(rProrrateo.monto1raFactura) / Number(cliente.montoMensual)) * 100;
        if (pctProrrateo >= Number(umbralProrrateo ?? 25)) {
          const key = "aviso_prorrateo";
          const triggerDate = addDays(cliente.fechaInstalacion, 3);
          const enviado = !!cliente[key];
          const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
          const texto = textoProrrateoAlto({ ...cliente, _venc: vencimiento });
          milestones.push({
            type: "prorrateo",
            tag: "D+3",
            label: "Aviso de prorrateo alto",
            color: "#7C3AED",
            bg: "#EDE9FE",
            key,
            n,
            triggerDate,
            enviado,
            pendienteHoy,
            texto,
          });
        }
      }
    }

    facturas.push({ n, generada, vencimiento, milestones });
  }
  return facturas;
}

function facturaActual(facturas) {
  if (!facturas.length) return null;
  for (let i = facturas.length - 1; i >= 0; i--) {
    if (daysFromToday(facturas[i].generada) <= 0) return facturas[i];
  }
  return facturas[0];
}

    (async () => {
      try {
        const res = await storage.get("clientes-eliminados");
        if (res && res.value) setEliminados(JSON.parse(res.value));
      } catch (e) {}
      setEliminadosLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!eliminadosLoaded) return;
    (async () => {
      try {
        await storage.set("clientes-eliminados", JSON.stringify(eliminados));
      } catch (e) {}
    })();
  }, [eliminados, eliminadosLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("umbral-prorrateo");
        if (res && res.value) setUmbralProrrateo(Number(res.value));
      } catch (e) {}
      setUmbralProrrateoLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!umbralProrrateoLoaded) return;
    (async () => {
      try {
        await storage.set("umbral-prorrateo", String(umbralProrrateo));
      } catch (e) {}
    })();
  }, [umbralProrrateo, umbralProrrateoLoaded]);

  const clientesCalc = useMemo(() => {
    return clientes.map((c) => {
      const facturas = calcularFacturas(c, umbralProrrateo);
      return { ...c, facturas, actual: facturaActual(facturas) };
    });
  }, [clientes, umbralProrrateo]);

  const clienteDetalle = useMemo(
    () => clientesCalc.find((c) => c.id === clienteDetalleId) || null,
    [clientesCalc, clienteDetalleId]
  );

  const alertasHoy = useMemo(() => {
    const list = [];
    clientesCalc.forEach((c) => {
      c.facturas.forEach((f) => {
        f.milestones.forEach((m) => {
          if (m.pendienteHoy) list.push({ cliente: c, factura: f, milestone: m });
        });
      });
    });
    const orden = { t3: 0, t15: 1, d1: 2, prorrateo: 3 };
    list.sort((a, b) => {
      if (orden[a.milestone.type] !== orden[b.milestone.type])
        return orden[a.milestone.type] - orden[b.milestone.type];
      return daysFromToday(a.milestone.triggerDate) - daysFromToday(b.milestone.triggerDate);
    });
    return list;
  }, [clientesCalc]);

  // Deja una sola alerta por cliente: la más reciente/urgente (T-3 > T-15 > D+1;
  // a igual prioridad, la de fecha de disparo más reciente).
  const alertasPorCliente = useMemo(() => {
    const orden = { t3: 0, t15: 1, d1: 2, prorrateo: 3 };
    const porCliente = new Map();
    alertasHoy.forEach(({ cliente, factura, milestone }) => {
      const actual = porCliente.get(cliente.id);
      if (!actual) {
        porCliente.set(cliente.id, { cliente, factura, milestone });
        return;
      }
      const prioridadActual = orden[actual.milestone.type];
      const prioridadNueva = orden[milestone.type];
      const esMasReciente =
        prioridadNueva < prioridadActual ||
        (prioridadNueva === prioridadActual && milestone.triggerDate > actual.milestone.triggerDate);
      if (esMasReciente) porCliente.set(cliente.id, { cliente, factura, milestone });
    });
    return Array.from(porCliente.values());
  }, [alertasHoy]);

  const filteredClientes = useMemo(() => {
    if (!search.trim()) return clientesCalc;
    const q = search.toLowerCase();
    return clientesCalc.filter(
      (c) =>
        c.nombre.toLowerCase().includes(q) ||
        c.numeroSuscriptor.toLowerCase().includes(q) ||
        c.telefono.toLowerCase().includes(q) ||
        planLabel(c).toLowerCase().includes(q)
    );
  }, [clientesCalc, search]);

  const stats = useMemo(() => {
    const total = clientes.length;
    const alHoy = alertasPorCliente.length;
    const proximos7 = clientesCalc.filter((c) =>
      c.facturas.some((f) =>
        f.milestones.some((m) => !m.enviado && daysFromToday(m.triggerDate) > 0 && daysFromToday(m.triggerDate) <= 7)
      )
    ).length;
    const atrasados = clientes.filter((c) => c.estadoPago === "Atrasado").length;
    return { total, alHoy, proximos7, atrasados };
  }, [clientes, alertasPorCliente, clientesCalc]);

  useEffect(() => {
    if (!loaded || stats.alHoy === 0 || sonidoReproducidoRef.current) return;
    sonidoReproducidoRef.current = true;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  }, [loaded, stats.alHoy]);

  useEffect(() => {
    setMobileMenuOpen(false);
  }, [tab]);

  function resetForm() {
    setForm(emptyForm());
    setEditingId(null);
  }

  function irANuevoConSuscriptor(numero) {
    setForm({ ...emptyForm(), numeroSuscriptor: numero });
    setEditingId(null);
    setTab("nuevo");
  }

  function actualizarMeta(mes, campo, valor) {
    setMetas((prev) => {
      const actual = typeof prev[mes] === "object" && prev[mes] !== null ? prev[mes] : {};
      return { ...prev, [mes]: { ...actual, [campo]: valor === "" ? undefined : Number(valor) } };
    });
  }

  function agregarConvergencia(nombre, telefono, fullTigo, montoPlan) {
    setConvergencias((prev) => [
      ...prev,
      { id: uid(), nombre, telefono, fullTigo: !!fullTigo, montoPlan: fullTigo ? Number(montoPlan) || 0 : null, creadoEn: new Date().toISOString() },
    ]);
  }

  function editarConvergencia(id, datos) {
    setConvergencias((prev) => prev.map((c) => (c.id === id ? { ...c, ...datos } : c)));
  }

  function eliminarConvergencia(id) {
    setConvergencias((prev) => prev.filter((c) => c.id !== id));
  }

  // Aplica un cambio a la lista de clientes, guardando el estado anterior
  // en el historial para poder deshacerlo.
  function actualizarClientes(updater) {
    setHistorial((h) => [...h, clientes].slice(-20));
    setClientes(updater);
  }

  function deshacerUltimaAccion() {
    setHistorial((h) => {
      if (h.length === 0) return h;
      const anterior = h[h.length - 1];
      setClientes(anterior);
      return h.slice(0, -1);
    });
  }

  function handleSubmit(e) {
    e.preventDefault();
    const obligatorios = [
      form.numeroSuscriptor,
      form.nombre,
      form.telefono,
      form.cicloFacturacion,
      form.planTipo,
      form.velocidad,
      form.montoMensual,
    ];
    if (form.planTipo === "DOBLE") obligatorios.push(form.planTV);
    if (obligatorios.some((v) => !String(v ?? "").trim())) return;

    const otros = clientes.filter((c) => c.id !== editingId);
    const numSusc = form.numeroSuscriptor.trim();
    const nombreNorm = form.nombre.trim().toLowerCase();
    const telDigits = form.telefono.replace(/\D/g, "");
    const duplicado = otros.find(
      (c) =>
        (c.numeroSuscriptor || "").trim() === numSusc ||
        (c.nombre || "").trim().toLowerCase() === nombreNorm ||
        (c.telefono || "").replace(/\D/g, "") === telDigits
    );
    if (duplicado) {
      const campo =
        (duplicado.numeroSuscriptor || "").trim() === numSusc
          ? "número de suscriptor"
          : (duplicado.nombre || "").trim().toLowerCase() === nombreNorm
          ? "nombre"
          : "teléfono";
      const continuar = window.confirm(
        `Ya existe un cliente con el mismo ${campo}: ${duplicado.nombre} (suscriptor ${duplicado.numeroSuscriptor || "—"}).\n\n¿Querés guardar este cliente de todas formas?`
      );
      if (!continuar) return;
    }

    if (editingId) {
      actualizarClientes((prev) => prev.map((c) => (c.id === editingId ? { ...c, ...form } : c)));
    } else {
      actualizarClientes((prev) => [...prev, { id: uid(), ...form, creadoEn: new Date().toISOString() }]);
    }
    resetForm();
    setTab("clientes");
  }

  function startEdit(c) {
    setForm({
      nombre: c.nombre,
      numeroSuscriptor: c.numeroSuscriptor,
      telefono: c.telefono,
      cicloFacturacion: c.cicloFacturacion,
      planTipo: c.planTipo,
      velocidad: c.velocidad,
      planTV: c.planTV,
      montoMensual: c.montoMensual,
      fechaInstalacion: c.fechaInstalacion,
      fecha1raFactura: c.fecha1raFactura,
      monto1raFactura: c.monto1raFactura,
      estadoPago: c.estadoPago,
      observaciones: c.observaciones,
    });
    setEditingId(c.id);
    setTab("nuevo");
  }

  function toggleMilestone(clienteId, key) {
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? { ...c, [key]: !c[key] } : c)));
  }

  function marcarFacturaPagada(clienteId, n) {
    actualizarClientes((prev) =>
      prev.map((c) =>
        c.id === clienteId
          ? { ...c, [`f${n}_d1`]: true, [`f${n}_t15`]: true, [`f${n}_t3`]: true, [`f${n}_estado`]: "pagada", estadoPago: "Pagado" }
          : c
      )
    );
  }

  // Cambia el estado de pago de una factura puntual: "pagada", "pendiente" o "" (sin marcar).
  // Al marcar como pagada, silencia sus 3 avisos; al desmarcar, los reactiva por si
  // corresponde que sigan recordándole al cliente.
  function actualizarEstadoFactura(clienteId, n, nuevoEstado) {
    actualizarClientes((prev) =>
      prev.map((c) => {
        if (c.id !== clienteId) return c;
        const marcarEnviado = nuevoEstado === "pagada";
        return {
          ...c,
          [`f${n}_estado`]: nuevoEstado,
          [`f${n}_d1`]: marcarEnviado,
          [`f${n}_t15`]: marcarEnviado,
          [`f${n}_t3`]: marcarEnviado,
          ...(marcarEnviado ? { estadoPago: "Pagado" } : {}),
        };
      })
    );
  }

  function deleteClient(id) {
    const cliente = clientes.find((c) => c.id === id);
    actualizarClientes((prev) => prev.filter((c) => c.id !== id));
    if (cliente) {
      setEliminados((prev) => [...prev, { ...cliente, eliminadoEn: new Date().toISOString() }]);
    }
    setConfirmDelete(null);
  }

  function recuperarCliente(id) {
    const cliente = eliminados.find((c) => c.id === id);
    if (!cliente) return;
    setEliminados((prev) => prev.filter((c) => c.id !== id));
    const { eliminadoEn, ...resto } = cliente;
    actualizarClientes((prev) => [...prev, resto]);
  }

  function copyMessage(cliente, milestone) {
    navigator.clipboard?.writeText(milestone.texto).catch(() => {});
    setCopiedKey(cliente.id + milestone.key);
    setTimeout(() => setCopiedKey(null), 1500);
  }

  function copySuscriptor(cliente) {
    navigator.clipboard?.writeText(cliente.numeroSuscriptor || "").catch(() => {});
    setCopiedSubKey(cliente.id);
    setTimeout(() => setCopiedSubKey(null), 1500);
  }

  function exportarRespaldo() {
    const blob = new Blob([JSON.stringify(clientes, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `metaforce-respaldo-${toISO(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importarRespaldo(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const importados = JSON.parse(reader.result);
        if (!Array.isArray(importados)) {
          alert("El archivo no tiene el formato esperado.");
          return;
        }
        actualizarClientes((prev) => {
          const idsExistentes = new Set(prev.map((c) => c.id));
          const nuevos = importados.filter((c) => c && c.id && !idsExistentes.has(c.id));
          alert(`Se importaron ${nuevos.length} cliente(s) nuevo(s) de ${importados.length} en el archivo.`);
          return [...prev, ...nuevos];
        });
      } catch (err) {
        alert("No se pudo leer el archivo. Verificá que sea un respaldo válido (.json).");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const navItems = [
    { key: "dashboard", label: "Dashboard" },
    { key: "clientes", label: "Clientes" },
    { key: "alertas", label: "Alertas de hoy", badge: stats.alHoy },
    { key: "precierre", label: "Precierre" },
  ];

  if (!autenticado) {
    return (
      <LoginScreen
        onSuccess={() => {
          try {
            localStorage.setItem("antichurn_auth", "1");
          } catch (e) {}
          setAutenticado(true);
        }}
      />
    );
  }

  return (
    <div className="min-h-screen flex flex-col md:flex-row font-sans" style={{ background: "#F4F6FA", color: "#001E62" }}>
      <div className="md:hidden flex items-center justify-between px-4 py-3" style={{ background: "#001E62" }}>
        <div className="flex items-center gap-2">
          <div className="w-2.5 h-2.5 rounded-full" style={{ background: "#00AEEF", boxShadow: "0 0 0 3px rgba(0,174,239,0.25)" }} />
          <span className="text-white font-semibold tracking-wide text-lg">MetaForce CRM</span>
        </div>
        <button
          onClick={() => setMobileMenuOpen((v) => !v)}
          className="text-white text-2xl leading-none px-2 py-1"
          aria-label="Abrir menú"
        >
          {mobileMenuOpen ? "✕" : "☰"}
        </button>
      </div>

      <aside
        className={(mobileMenuOpen ? "flex " : "hidden ") + "md:flex w-full md:w-56 md:shrink-0 flex-col justify-between"}
        style={{ background: "#001E62" }}
      >
        <div>
          <div className="hidden md:block px-5 pt-6 pb-8">
            <div className="flex items-center gap-2">
              <div className="w-2.5 h-2.5 rounded-full" style={{ background: "#00AEEF", boxShadow: "0 0 0 3px rgba(0,174,239,0.25)" }} />
              <span className="text-white font-semibold tracking-wide text-lg">MetaForce CRM</span>
            </div>
            <p className="text-[11px] mt-1" style={{ color: "#7C89B0" }}>
              CONTROL DE CLIENTES &amp; EARLY CHURN - TEAM AZUERO
            </p>
          </div>
          <nav className="flex flex-col gap-1 px-3 pt-3 md:pt-0">
            {navItems.map((item) => (
              <button
                key={item.key}
                onClick={() => {
                  if (item.key === "nuevo" && !editingId) resetForm();
                  setTab(item.key);
                }}
                className="text-left px-3 py-2.5 rounded-md text-sm flex items-center justify-between transition-colors"
                style={{
                  background: tab === item.key ? "rgba(255,255,255,0.08)" : "transparent",
                  color: tab === item.key ? "#FFFFFF" : "#8593B8",
                  fontWeight: tab === item.key ? 600 : 500,
                }}
              >
                {item.label}
                {!!item.badge && (
                  <span className="text-[11px] font-mono px-1.5 py-0.5 rounded animate-pulse" style={{ background: "#C23B3B", color: "white" }}>
                    {item.badge}
                  </span>
                )}
              </button>
            ))}
            <button
              onClick={() => {
                resetForm();
                setTab("nuevo");
              }}
              className="text-left px-3 py-2.5 rounded-md text-sm font-medium mt-1"
              style={{ background: "#2F9E6E", color: "white" }}
            >
              + Nuevo cliente
            </button>
          </nav>
        </div>
        <div className="px-5 pb-5 flex flex-col gap-2">
          <button
            onClick={deshacerUltimaAccion}
            disabled={historial.length === 0}
            className="text-xs font-medium text-left px-2 py-1.5 rounded-md disabled:opacity-40"
            style={{ color: "#8593B8", border: "1px solid #3A4258" }}
          >
            ↩️ Deshacer última acción
          </button>
          <button
            onClick={exportarRespaldo}
            disabled={clientes.length === 0}
            className="text-xs font-medium text-left px-2 py-1.5 rounded-md disabled:opacity-40"
            style={{ color: "#8593B8", border: "1px solid #3A4258" }}
          >
            ⬇️ Exportar respaldo (.json)
          </button>
          <button
            onClick={() => importInputRef.current && importInputRef.current.click()}
            className="text-xs font-medium text-left px-2 py-1.5 rounded-md"
            style={{ color: "#8593B8", border: "1px solid #3A4258" }}
          >
            ⬆️ Importar respaldo (.json)
          </button>
          <input
            type="file"
            accept="application/json"
            ref={importInputRef}
            onChange={importarRespaldo}
            style={{ display: "none" }}
          />
          <div className="text-[11px]" style={{ color: "#5C6480" }}>
            {saveError ? "⚠️ error al guardar" : "guardado automático activo (en la nube)"}
          </div>
          <div className="flex items-center justify-between gap-2 pt-1">
            <label className="text-[11px]" style={{ color: "#8593B8" }} title="A partir de qué % de prorrateo se envía el aviso D+3">
              Umbral prorrateo (%)
            </label>
            <input
              type="number"
              min="0"
              max="100"
              value={umbralProrrateo}
              onChange={(e) => setUmbralProrrateo(e.target.value === "" ? "" : Number(e.target.value))}
              className="w-14 px-1.5 py-1 rounded-md border text-xs outline-none"
              style={{ borderColor: "#3A4258", background: "#0B1E4D", color: "white" }}
            />
          </div>
          <button
            onClick={() => {
              try {
                localStorage.removeItem("antichurn_auth");
              } catch (e) {}
              setAutenticado(false);
            }}
            className="text-[11px] text-left underline"
            style={{ color: "#5C6480" }}
          >
            Cerrar sesión
          </button>
          <div className="text-[10px] text-center pt-1" style={{ color: "#3A4258" }}>JRS~</div>
        </div>
      </aside>

      <main className="flex-1 w-full px-4 py-5 sm:px-8 sm:py-7 max-w-5xl">
        {stats.alHoy > 0 && !bannerDismissed && tab !== "alertas" && (
          <div className="mb-4 rounded-lg border flex items-center justify-between px-4 py-3" style={{ background: "#FBEAEA", borderColor: "#F3C6C6" }}>
            <span className="text-sm font-medium" style={{ color: "#C23B3B" }}>
              🔔 Alertas pendientes: {stats.alHoy}
            </span>
            <div className="flex items-center gap-2">
              <button onClick={() => setTab("alertas")} className="text-xs font-medium px-3 py-1.5 rounded-md text-white" style={{ background: "#C23B3B" }}>
                Ver alertas
              </button>
              <button onClick={() => setBannerDismissed(true)} className="text-xs font-medium px-2" style={{ color: "#6B7280" }}>
                ✕
              </button>
            </div>
          </div>
        )}
        {tab === "dashboard" && (
          <Dashboard
            stats={stats}
            clientes={clientesCalc}
            metas={metas}
            onActualizarMeta={actualizarMeta}
            convergencias={convergencias}
            onAbrirConvergencias={() => setMostrarConvergencias(true)}
            onNuevo={() => {
              resetForm();
              setTab("nuevo");
            }}
          />
        )}
        {tab === "clientes" && (
          <ClientesTab
            clientes={filteredClientes}
            search={search}
            setSearch={setSearch}
            onEdit={startEdit}
            onDelete={(id) => setConfirmDelete(id)}
            onMarcarPagada={marcarFacturaPagada}
            onActualizarEstadoFactura={actualizarEstadoFactura}
            onVerDetalle={(c) => {
              setClienteDetalleId(c.id);
              setTab("detalle");
            }}
            onNuevo={() => {
              resetForm();
              setTab("nuevo");
            }}
            eliminados={eliminados}
            onRecuperar={recuperarCliente}
          />
        )}
        {tab === "detalle" && (
          <ClienteDetalle
            cliente={clienteDetalle}
            onVolver={() => setTab("clientes")}
            onEditar={startEdit}
            onMarcarPagada={marcarFacturaPagada}
            onActualizarEstadoFactura={actualizarEstadoFactura}
            onCopiarMensaje={copyMessage}
            copiedKey={copiedKey}
            onMarcarEnviado={toggleMilestone}
            onCopiarSuscriptor={copySuscriptor}
            copiedSubKey={copiedSubKey}
          />
        )}
        {tab === "alertas" && (
          <AlertasTab
            alertasHoy={alertasPorCliente}
            onMarcar={toggleMilestone}
            onCopiarSuscriptor={copySuscriptor}
            copiedSubKey={copiedSubKey}
            onPagoRealizado={marcarFacturaPagada}
            onVerDetalle={(c) => {
              setClienteDetalleId(c.id);
              setTab("detalle");
            }}
          />
        )}
        {tab === "precierre" && (
          <PrecierreTab clientes={clientesCalc} onIrNuevo={irANuevoConSuscriptor} />
        )}
        {tab === "nuevo" && (
          <FormularioCliente
            form={form}
            setForm={setForm}
            onSubmit={handleSubmit}
            editing={!!editingId}
            onCancel={() => {
              resetForm();
              setTab("clientes");
            }}
          />
        )}
      </main>

      {confirmDelete && <ConfirmModal onCancel={() => setConfirmDelete(null)} onConfirm={() => deleteClient(confirmDelete)} />}
      {mostrarConvergencias && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-lg w-full max-h-[85vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold text-lg">Convergencias</h3>
              <button onClick={() => setMostrarConvergencias(false)} className="text-sm" style={{ color: "#6B7280" }}>✕</button>
            </div>
            <ConvergenciasPanel
              convergencias={convergencias}
              onAgregar={agregarConvergencia}
              onEditar={editarConvergencia}
              onEliminar={eliminarConvergencia}
            />
          </div>
        </div>
      )}
    </div>
  );
}

// Clave de acceso simple para esta app. Cambiala por la que prefieras.
const CLAVE_ACCESO = "tigo507";

function LoginScreen({ onSuccess }) {
  const [clave, setClave] = useState("");
  const [error, setError] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (clave === CLAVE_ACCESO) {
      onSuccess();
    } else {
      setError(true);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center font-sans" style={{ background: "#F4F6FA" }}>
      <form onSubmit={handleSubmit} className="bg-white rounded-lg border border-gray-200 p-8 w-full max-w-sm">
        <div className="flex items-center gap-2 mb-1">
          <div className="w-2.5 h-2.5 rounded-full" style={{ background: "#00AEEF" }} />
          <span className="font-semibold text-lg" style={{ color: "#001E62" }}>MetaForce CRM</span>
        </div>
        <p className="text-sm mb-4" style={{ color: "#6B7280" }}>Ingresá la clave de acceso para continuar.</p>
        <input
          type="password"
          value={clave}

            setClave(e.target.value);
            setError(false);
          }}
          placeholder="Clave de acceso"
          autoFocus
          className="w-full px-3 py-2 rounded-md border text-sm outline-none mb-2"
          style={{ borderColor: error ? "#C23B3B" : "#D1D5DB" }}
        />
        {error && (
          <p className="text-xs mb-2" style={{ color: "#C23B3B" }}>
            Clave incorrecta.
          </p>
        )}
        <button type="submit" className="w-full text-sm font-medium px-4 py-2 rounded-md text-white" style={{ background: "#001E62" }}>
          Ingresar
        </button>
      </form>
    </div>
  );
}

function Dashboard({ stats, clientes, metas, onActualizarMeta, convergencias, onAbrirConvergencias, onNuevo }) {
  const periodoActual = periodoComision(toISO(new Date()));
  const [periodoVisto, setPeriodoVisto] = useState(periodoActual);
  const esActual = periodoVisto === periodoActual;

  const metaClientes = leerMeta(metas, periodoVisto, "clientes");
  const metaDinero = leerMeta(metas, periodoVisto, "dinero");
  const metaArpu = leerMeta(metas, periodoVisto, "arpu");

  // Todo lo que sigue se agrupa por período de comisión (instalados del 21 al 20),
  // no por mes calendario ni por fecha de ingreso.
  const clientesDelPeriodo = useMemo(
    () => clientes.filter((c) => periodoComision(c.fechaInstalacion) === periodoVisto),
    [clientes, periodoVisto]
  );
  const dineroDelPeriodo = useMemo(
    () => clientesDelPeriodo.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0),
    [clientesDelPeriodo]
  );
  const arpuPeriodo = useMemo(() => {
    if (clientesDelPeriodo.length === 0) return 0;
    return dineroDelPeriodo / clientesDelPeriodo.length;
  }, [clientesDelPeriodo, dineroDelPeriodo]);
  const singlesInstalados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.planTipo === "SINGLE").length,
    [clientesDelPeriodo]
  );
  const doblesInstalados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.planTipo === "DOBLE").length,
    [clientesDelPeriodo]
  );
  // Los pendientes de instalación no pertenecen a ningún período todavía (no tienen
  // fecha), así que se muestran como un total aparte, sin importar qué período mires.
  const pendientesAhora = useMemo(() => clientes.filter((c) => !c.fechaInstalacion).length, [clientes]);

  const convergenciasPeriodo = useMemo(
    () => convergencias.filter((c) => periodoComision((c.creadoEn || "").slice(0, 10)) === periodoVisto).length,
    [convergencias, periodoVisto]
  );

  const historialPeriodos = useMemo(() => {
    const out = [];
    for (let i = 0; i < 6; i++) out.push(sumarMesClave(periodoActual, -i));
    return out;
  }, [periodoActual]);

  const progresoClientesPct = metaClientes ? Math.round((clientesDelPeriodo.length / metaClientes) * 100) : null;
  const progresoDineroPct = metaDinero ? Math.round((dineroDelPeriodo / metaDinero) * 100) : null;
  const progresoArpuPct = metaArpu ? Math.round((arpuPeriodo / metaArpu) * 100) : null;

  const bonoFullTigo = useMemo(
    () =>
      convergencias
        .filter((c) => c.fullTigo && periodoComision((c.creadoEn || "").slice(0, 10)) === periodoVisto)
        .reduce((acc, c) => acc + (Number(c.montoPlan) || 0), 0),
    [convergencias, periodoVisto]
  );
  const comision = useMemo(
    () =>
      calcularComision({
        dineroDelPeriodo,
        metaDinero,
        arpuPeriodo,
        metaArpu,
        clientesInstalados: clientesDelPeriodo.length,
        metaClientes,
        bonoFullTigo,
      }),
    [dineroDelPeriodo, metaDinero, arpuPeriodo, metaArpu, clientesDelPeriodo.length, metaClientes, bonoFullTigo]
  );

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <h1 className="text-2xl font-semibold">Dashboard</h1>
        <button onClick={onNuevo} className="text-sm font-medium px-4 py-2 rounded-md text-white" style={{ background: "#001E62" }}>
          + Nuevo cliente
        </button>
      </div>

      <div className="flex items-center gap-2 mb-6 flex-wrap">
        <button
          onClick={() => setPeriodoVisto((p) => sumarMesClave(p, -1))}
          className="text-sm font-medium px-3 py-1.5 rounded-md border"
          style={{ borderColor: "#D1D5DB", color: "#374151" }}
        >
          ← Período anterior
        </button>
        <span className="text-sm font-semibold px-2" style={{ color: "#001E62" }}>
          Comisión de {mesLabel(periodoVisto)}
        </span>
        {!esActual && (
          <button
            onClick={() => setPeriodoVisto((p) => sumarMesClave(p, 1))}
            className="text-sm font-medium px-3 py-1.5 rounded-md border"
            style={{ borderColor: "#D1D5DB", color: "#374151" }}
          >
            Período siguiente →
          </button>
        )}
        {!esActual && (
          <button
            onClick={() => setPeriodoVisto(periodoActual)}

            style={{ color: "#0072CE" }}

      <div className="rounded-lg p-5 mb-6 text-white" style={{ background: "linear-gradient(135deg, #001E62, #0072CE)" }}>
        <div className="flex items-center justify-between flex-wrap gap-2 mb-2">

          {comision.aplicaBono && (

        </div>

                    <span className="ml-1 font-semibold" style={{ color: pctArpu >= 100 ? "#2F9E6E" : "#B8791F" }}>({pctArpu}%)</span>
                  )}

            );

    </div>
  );
}

function ultimosMeses(count) {
  const MESES_CAP = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const hoy = new Date();
  const out = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    out.push({ key, label: MESES_CAP[d.getMonth()], anio: d.getFullYear() });
  }
  return out;
}

function ClientesTab({ clientes, search, setSearch, onEdit, onDelete, onMarcarPagada, onActualizarEstadoFactura, onVerDetalle, onNuevo, eliminados, onRecuperar }) {
  const meses = useMemo(() => periodosRecientes(4), []);
  const mesActualKey = meses[0].key;
  const [mesActivo, setMesActivo] = useState(mesActualKey);
  const [ordenarPor, setOrdenarPor] = useState("creadoEn");
  const [ordenDireccion, setOrdenDireccion] = useState("desc");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [filtroInstalacion, setFiltroInstalacion] = useState("");
  const [fechaDesde, setFechaDesde] = useState("");
  const [fechaHasta, setFechaHasta] = useState("");
  const rangoActivo = !!(fechaDesde || fechaHasta);
  const [copiedCell, setCopiedCell] = useState(null);
  const [papeleraAbierta, setPapeleraAbierta] = useState(false);

  function copiarCelda(texto, id, campo) {
    navigator.clipboard?.writeText(texto || "").catch(() => {});
    setCopiedCell(id + campo);
    setTimeout(() => setCopiedCell(null), 1200);
  }

  const clientesDelMes = useMemo(() => {
    const instalados = clientes.filter((c) => periodoComision(c.fechaInstalacion) === mesActivo);
    if (mesActivo === mesActualKey) {
      const pendientes = clientes.filter((c) => !c.fechaInstalacion);
      return [...instalados, ...pendientes];
    }
    return instalados;
  }, [clientes, mesActivo, mesActualKey]);
  const visibles = search.trim() || rangoActivo ? clientes : clientesDelMes;
  const visiblesOrdenados = useMemo(() => {
    const arr = [...visibles];
    arr.sort((a, b) => {
      let cmp = 0;
      if (ordenarPor === "numeroSuscriptor") {
        cmp = (a.numeroSuscriptor || "").localeCompare(b.numeroSuscriptor || "", undefined, { numeric: true });
      } else {
        const va = ordenarPor === "creadoEn" ? (a.creadoEn || "") : (a.fechaInstalacion || "");
        const vb = ordenarPor === "creadoEn" ? (b.creadoEn || "") : (b.fechaInstalacion || "");
        cmp = va < vb ? -1 : va > vb ? 1 : 0;
      }
      return ordenDireccion === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [visibles, ordenarPor, ordenDireccion]);
  const visiblesFinal = useMemo(() => {
    let arr = filtroEstado ? visiblesOrdenados.filter((c) => c.estadoPago === filtroEstado) : visiblesOrdenados;
    if (filtroInstalacion === "instalados") arr = arr.filter((c) => !!c.fechaInstalacion);
    if (filtroInstalacion === "pendientes") arr = arr.filter((c) => !c.fechaInstalacion);
    if (rangoActivo) {
      arr = arr.filter((c) => {
        if (!c.fechaInstalacion) return false;
        if (fechaDesde && c.fechaInstalacion < fechaDesde) return false;
        if (fechaHasta && c.fechaInstalacion > fechaHasta) return false;
        return true;
      });
    }
    return arr;
  }, [visiblesOrdenados, filtroEstado, filtroInstalacion, rangoActivo, fechaDesde, fechaHasta]);
  const arpu = useMemo(() => {
    const soloInstalados = clientesDelMes.filter((c) => c.fechaInstalacion);
    if (soloInstalados.length === 0) return 0;
    const suma = soloInstalados.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0);
    return suma / soloInstalados.length;
  }, [clientesDelMes]);

  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h1 className="text-2xl font-semibold">Clientes</h1>
        <div className="flex items-center gap-2">
          <button
            onClick={() => setPapeleraAbierta(true)}
            className="text-sm font-medium px-3 py-2 rounded-md border flex items-center gap-1.5"
            style={{ borderColor: "#D1D5DB", color: "#374151" }}
            title="Ver clientes eliminados"
          >
            🗑️ Papelera{eliminados.length > 0 ? ` (${eliminados.length})` : ""}
          </button>
          <button onClick={onNuevo} className="text-sm font-medium px-4 py-2 rounded-md text-white" style={{ background: "#001E62" }}>
            + Nuevo cliente
          </button>
        </div>
      </div>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-1">
        <p className="text-sm" style={{ color: "#6B7280" }}>
          {search.trim()
            ? `${visiblesFinal.length} resultado${visiblesFinal.length !== 1 ? "s" : ""}`
            : rangoActivo
            ? `${visiblesFinal.length} cliente${visiblesFinal.length !== 1 ? "s" : ""} instalados ${fechaDesde ? `desde ${fmtFecha(fechaDesde)} ` : ""}${fechaHasta ? `hasta ${fmtFecha(fechaHasta)}` : ""}`
            : `${visiblesFinal.length} cliente${visiblesFinal.length !== 1 ? "s" : ""} · ${mesActivo === mesActualKey ? "instalados o pendientes en" : "instalados en"} ${meses.find((m) => m.key === mesActivo).label}`}
        </p>
        {!search.trim() && clientesDelMes.length > 0 && (
          <p className="text-sm font-mono" style={{ color: "#001E62" }}>
            ARPU: <span className="font-semibold">{fmtMonto(arpu)}</span>
          </p>
        )}
      </div>

      <div className="flex items-center gap-1.5 mb-4 flex-wrap">
        {meses.map((m, i) => (
          <button
            key={m.key}
            onClick={() => setMesActivo(m.key)}
            disabled={rangoActivo}
            className="text-xs font-medium px-3 py-1.5 rounded-full border transition-colors disabled:opacity-40"
            style={{
              borderColor: mesActivo === m.key ? "#001E62" : "#D1D5DB",
              background: mesActivo === m.key ? "#001E62" : "white",
              color: mesActivo === m.key ? "white" : "#374151",
            }}
          >
            {m.label.toUpperCase()}{i === 0 ? " (actual)" : ""}
          </button>
        ))}
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap rounded-md p-2.5" style={{ background: rangoActivo ? "#E3EDFA" : "#F4F6FA" }}>
        <span className="text-xs font-medium" style={{ color: "#6B7280" }}>Rango de fechas (instalación):</span>
        <label className="flex items-center gap-1.5 text-xs" style={{ color: "#6B7280" }}>
          Desde
          <input
            type="date"
            value={fechaDesde}
            onChange={(e) => setFechaDesde(e.target.value)}
            className="px-2 py-1 rounded-md border text-xs outline-none"
            style={{ borderColor: "#D1D5DB" }}
          />
        </label>
        <label className="flex items-center gap-1.5 text-xs" style={{ color: "#6B7280" }}>
          Hasta
          <input
            type="date"
            value={fechaHasta}
            onChange={(e) => setFechaHasta(e.target.value)}
            className="px-2 py-1 rounded-md border text-xs outline-none"
            style={{ borderColor: "#D1D5DB" }}
          />
        </label>
        {rangoActivo && (
          <button
            type="button"
            onClick={() => { setFechaDesde(""); setFechaHasta(""); }}
            className="text-xs font-medium px-2 py-1 rounded-md"
            style={{ color: "#0072CE" }}
          >
            Limpiar rango
          </button>
        )}
      </div>

      <div className="relative mb-4">
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Buscar en todos los meses por nombre, teléfono, suscriptor o plan…"
          className="w-full px-3 py-2 pr-9 rounded-md border text-sm outline-none"
          style={{ borderColor: "#D1D5DB" }}
        />
        {search && (
          <button
            onClick={() => setSearch("")}
            className="absolute right-2 top-1/2 -translate-y-1/2 text-sm font-medium px-1.5"
            style={{ color: "#9CA3AF" }}
            title="Limpiar búsqueda"
          >
            ✕
          </button>
        )}
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <span className="text-xs font-medium" style={{ color: "#6B7280" }}>Ordenar por:</span>
        <select
          value={ordenarPor}
          onChange={(e) => setOrdenarPor(e.target.value)}
          className="text-xs px-2 py-1.5 rounded-md border outline-none"
          style={{ borderColor: "#D1D5DB" }}
        >
          <option value="fechaInstalacion">Fecha de instalación</option>
          <option value="numeroSuscriptor">Número de suscriptor</option>
          <option value="creadoEn">Fecha de ingreso</option>
        </select>
        <button
          type="button"
          onClick={() => setOrdenDireccion((d) => (d === "asc" ? "desc" : "asc"))}
          className="text-xs font-medium px-2 py-1.5 rounded-md border"
          style={{ borderColor: "#D1D5DB", color: "#374151" }}
          title={ordenDireccion === "asc" ? "Ascendente" : "Descendente"}

          {ordenDireccion === "asc" ? "↑ Ascendente" : "↓ Descendente"}
        </button>
        <span className="text-xs font-medium ml-2" style={{ color: "#6B7280" }}>Instalación:</span>
        <select
          value={filtroInstalacion}
          onChange={(e) => setFiltroInstalacion(e.target.value)}
          className="text-xs px-2 py-1.5 rounded-md border outline-none"
          style={{ borderColor: "#D1D5DB" }}
        >
          <option value="">Todos</option>
          <option value="instalados">Instalados</option>
          <option value="pendientes">Pendientes de instalación</option>

        <span className="text-xs font-medium ml-2" style={{ color: "#6B7280" }}>Estado:</span>

          value={filtroEstado}

          style={{ borderColor: "#D1D5DB" }}

          <option value="">Todos</option>
          {ESTADOS.map((e) => <option key={e} value={e}>{e}</option>)}
        </select>
      </div>

      {visiblesFinal.length === 0 ? (
        <div className="bg-white rounded-lg border border-gray-200 p-10 text-center">
          <p className="text-sm" style={{ color: "#6B7280" }}>

          <table className="w-full text-sm">
            <thead>
              <tr className="text-left" style={{ background: "#F4F6FA" }}>

                  <th key={h} className="px-4 py-2.5 font-medium text-xs" style={{ color: "#6B7280" }}>{h}</th>

            <tbody>

                    </div>
                  </td>
                  <td className="px-4 py-3">
                    <button
                      onClick={() => onVerDetalle(c)}
                      className="font-medium text-left hover:underline"
                      style={{ color: "#001E62" }}

                      {c.nombre}

                    <div className="text-xs font-mono flex items-center gap-1.5" style={{ color: "#9CA3AF" }}>
                      <span>{c.telefono}</span>
                      <button
                        onClick={() => copiarCelda(c.telefono, c.id, "tel")}

                        className="text-xs"
                        style={{ color: copiedCell === c.id + "tel" ? "#2F9E6E" : "#9CA3AF" }}

                        {copiedCell === c.id + "tel" ? "✓" : "📋"}

                  <td className="px-4 py-3">{planResumen(c)}</td>

                    {c.fechaInstalacion ? (

                      <span className="text-xs font-bold px-2 py-1 rounded-full" style={{ background: "#F59E0B", color: "white" }}>
                        ⚠️ PENDIENTE POR INSTALAR
                      </span>
                    )}
                  </td>
                  <td className="px-4 py-3">
                    {c.facturas.filter((f) => daysFromToday(f.generada) <= 0).length > 0 ? (
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-mono" style={{ color: "#9CA3AF" }}>
                          {c.facturas.filter((f) => daysFromToday(f.generada) <= 0).length}/4
                        </span>
                        <div className="flex items-center gap-1">
                          {c.facturas
                            .filter((f) => daysFromToday(f.generada) <= 0)

                              <FacturaDot key={f.n} cliente={c} n={f.n} onCambiar={onActualizarEstadoFactura} />

                      <button onClick={() => onMarcarPagada(c.id, c.actual.n)} className="text-xs font-medium mr-3" style={{ color: "#2F9E6E" }}>Marcar pagada</button>
                    )}
                    <button onClick={() => onEdit(c)} className="text-xs font-medium mr-3" style={{ color: "#0072CE" }}>Editar</button>
                    <button onClick={() => onDelete(c.id)} className="text-xs font-medium" style={{ color: "#C23B3B" }}>Eliminar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

      {papeleraAbierta && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold">Clientes eliminados</h3>
              <button onClick={() => setPapeleraAbierta(false)} className="text-sm" style={{ color: "#6B7280" }}>✕</button>
            </div>
            {eliminados.length === 0 ? (
              <p className="text-sm" style={{ color: "#6B7280" }}>No hay clientes eliminados.</p>
            ) : (
              <div className="flex flex-col gap-2">
                {eliminados.map((c) => (
                  <div key={c.id} className="flex items-center justify-between rounded-md border p-3" style={{ borderColor: "#F0F0EF" }}>
                    <div>
                      <div className="text-sm font-medium">{c.nombre}</div>
                      <div className="text-xs font-mono" style={{ color: "#9CA3AF" }}>
                        {c.numeroSuscriptor} · eliminado el {fmtFecha((c.eliminadoEn || "").slice(0, 10))}
                      </div>
                    </div>
                    <button
                      onClick={() => onRecuperar(c.id)}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={{ background: "#2F9E6E" }}
                    >
                      Recuperar
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

                              style={{ borderColor: "#D1D5DB", color: "#374151" }}
                            >
                              Marcar como enviado
                            </button>
                      </div>
                    </div>
                  );
                })}
              </div>
                );
              })()}
            </div>
          );
        })}

  function handleSubmit(e) {
    e.preventDefault();
    if (!nombre.trim() || !telefono.trim()) return;
    if (fullTigo && !montoPlan) return;
    if (editingId) {
      onEditar(editingId, {
        nombre: nombre.trim(),
        telefono: telefono.trim(),
        fullTigo,
        montoPlan: fullTigo ? Number(montoPlan) || 0 : null,
      });
    } else {
      onAgregar(nombre.trim(), telefono.trim(), fullTigo, montoPlan);
    }
    setNombre("");
    setTelefono("");
    setFullTigo(false);
    setMontoPlan("");
    setEditingId(null);
  }

  function startEdit(c) {
    setNombre(c.nombre);
    setTelefono(c.telefono);
    setFullTigo(!!c.fullTigo);
    setMontoPlan(c.montoPlan != null ? String(c.montoPlan) : "");
    setEditingId(c.id);
  }

  function cancelEdit() {
    setNombre("");
    setTelefono("");
    setFullTigo(false);
    setMontoPlan("");
    setEditingId(null);
  }

  return (
    <div>
      <div className="bg-white rounded-lg border border-gray-200 p-5 mb-4">
        <h2 className="text-sm font-semibold mb-3">{editingId ? "Editar convergencia" : "Nueva convergencia"}</h2>
        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-3 sm:items-end">
          <div className="flex-1">
            <label className="text-xs font-medium block mb-1" style={{ color: "#6B7280" }}>Nombre</label>
            <input
              required
              value={nombre}
              onChange={(e) => setNombre(e.target.value)}
              className="w-full px-3 py-2 rounded-md border text-sm outline-none"
              style={{ borderColor: "#D1D5DB" }}
            />
          </div>
          <div className="flex-1">
            <label className="text-xs font-medium block mb-1" style={{ color: "#6B7280" }}>Número de celular</label>
            <input
              required
              value={telefono}
              onChange={(e) => setTelefono(e.target.value)}
              className="w-full px-3 py-2 rounded-md border text-sm outline-none"
              style={{ borderColor: "#D1D5DB" }}
            />
          </div>
          <div className="flex gap-2">
            <button type="submit" className="text-sm font-medium px-4 py-2 rounded-md text-white" style={{ background: "#001E62" }}>
              {editingId ? "Guardar" : "Agregar"}
            </button>
            {editingId && (
              <button type="button" onClick={cancelEdit} className="text-sm font-medium px-4 py-2 rounded-md border" style={{ borderColor: "#D1D5DB" }}>
                Cancelar
              </button>
            )}
          </div>
        </form>
        <div className="flex flex-wrap items-center gap-3 mt-3 pt-3 border-t" style={{ borderColor: "#F0F0EF" }}>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={fullTigo} onChange={(e) => setFullTigo(e.target.checked)} />
            FULL TIGO
          </label>
          {fullTigo && (
            <div className="flex items-center gap-2">
              <span className="text-xs" style={{ color: "#6B7280" }}>Monto del plan vendido:</span>
              <input
                type="number"
                step="0.01"
                min="0"
                required
                value={montoPlan}
                onChange={(e) => setMontoPlan(e.target.value)}
                placeholder="$0.00"
                className="w-28 px-2 py-1 rounded-md border text-sm outline-none"
                style={{ borderColor: "#D1D5DB" }}
              />
            </div>
          )}
        </div>
      </div>

      <div className="flex flex-col gap-2">
        {meses.map((m, i) => {
          const delMes = convergencias.filter((c) => periodoComision((c.creadoEn || "").slice(0, 10)) === m.key);
          const abierto = mesExpandido === m.key;
          return (
            <div key={m.key} className="bg-white rounded-lg border border-gray-200 overflow-hidden">
              <button
                onClick={() => setMesExpandido(abierto ? null : m.key)}
                className="w-full flex items-center justify-between px-4 py-3 text-left"
              >
                <span className="text-sm font-medium">{m.label}{i === 0 ? " (actual)" : ""}</span>
                <span className="text-sm font-mono flex items-center gap-2" style={{ color: "#001E62" }}>
                  {delMes.length} convergencia{delMes.length !== 1 ? "s" : ""}
                  <span style={{ color: "#9CA3AF" }}>{abierto ? "▲" : "▼"}</span>
                </span>
              </button>
              {abierto && (
                <div className="border-t" style={{ borderColor: "#F0F0EF" }}>
                  {delMes.length === 0 ? (
                    <p className="text-sm px-4 py-3" style={{ color: "#6B7280" }}>Sin convergencias este mes.</p>
                  ) : (
                    delMes.map((c) => (
                      <div key={c.id} className="flex items-center justify-between px-4 py-3 border-t" style={{ borderColor: "#F0F0EF" }}>
                        <div>
                          <div className="text-sm font-medium flex items-center gap-2">
                            {c.nombre}
                            {c.fullTigo && (
                              <span className="text-xs font-medium px-2 py-0.5 rounded-full" style={{ background: "#E3EDFA", color: "#0072CE" }}>
                                FULL TIGO · {fmtMonto(c.montoPlan)}
                              </span>
                            )}
                          </div>
                          <div className="text-xs font-mono" style={{ color: "#9CA3AF" }}>{c.telefono}</div>
                        </div>
                        <div className="flex gap-3">
                          <button onClick={() => startEdit(c)} className="text-xs font-medium" style={{ color: "#0072CE" }}>Editar</button>
                          <button
                            onClick={() => {
                              if (window.confirm(`¿Eliminar a ${c.nombre} de convergencias?`)) onEliminar(c.id);
                            }}
                            className="text-xs font-medium"
                            style={{ color: "#C23B3B" }}
                          >
                            Eliminar
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function FacturaDot({ cliente, n, onCambiar }) {
  const estado = cliente[`f${n}_estado`] || "";
  const estilos = {
    pagada: { background: "#0072CE", borderColor: "#0072CE" },
    pendiente: { background: "#F59E0B", borderColor: "#F59E0B" },
    "": { background: "white", borderColor: "#D1D5DB" },
  };
  const etiquetas = { pagada: "Pagada", pendiente: "Pendiente", "": "Sin marcar" };
  return (
    <button
      onClick={() => onCambiar(cliente.id, n, siguienteEstadoFactura(estado))}
      title={`${ORDINAL[n]} factura: ${etiquetas[estado]} (clic para cambiar)`}
      className="w-4 h-4 rounded-full border-2"
      style={estilos[estado]}
    />
  );
}

function EstadoBadge({ estado }) {
  const map = {
    Pendiente: { bg: "#FBF1DE", color: "#B8791F" },
    Pagado: { bg: "#EAF7F0", color: "#2F9E6E" },
    Atrasado: { bg: "#FBEAEA", color: "#C23B3B" },
    Suspendido: { bg: "#EFEFEF", color: "#4B5563" },
  };
  const s = map[estado] || map["Pendiente"];
  return <span className="text-xs font-medium px-2 py-0.5 rounded-full" style={{ background: s.bg, color: s.color }}>{estado}</span>;
}

function PrecierreTab({ clientes, onIrNuevo }) {
  const [texto, setTexto] = useState("");
  const [mesPrecierre, setMesPrecierre] = useState(() => toISO(new Date()).slice(0, 7));
  const [resultado, setResultado] = useState(null);

  function validar() {
    const numeros = Array.from(new Set((texto.match(/\d+/g) || []).map((n) => n.trim()).filter(Boolean)));
    const existentes = new Set(clientes.map((c) => (c.numeroSuscriptor || "").trim()).filter(Boolean));
    const faltantes = numeros.filter((n) => !existentes.has(n));
    const encontrados = numeros.filter((n) => existentes.has(n));

    // "Sobrantes": clientes instalados EN el mes del precierre (mes exacto, no acumulado)
    // cuyo número de suscriptor no aparece en la lista pegada.
    const instaladosEseMes = clientes.filter(
      (c) => c.fechaInstalacion && periodoComision(c.fechaInstalacion) === mesPrecierre
    );
    const sobrantes = instaladosEseMes.filter(
      (c) => c.numeroSuscriptor && !numeros.includes(c.numeroSuscriptor.trim())
    );

    setResultado({ mes: mesPrecierre, total: numeros.length, faltantes, encontrados, sobrantes });
  }

  return (
    <div className="max-w-3xl">
      <h1 className="text-2xl font-semibold mb-1">Validar precierre del mes</h1>
      <p className="text-sm mb-6" style={{ color: "#6B7280" }}>
        Pega aquí los números de suscriptor del archivo de precierre (uno por línea, o como vengan copiados desde Excel). La app detecta cuáles ya están cargados y cuáles faltan.
      </p>

      <div className="mb-4">
        <label className="text-xs font-medium block mb-1" style={{ color: "#6B7280" }}>
          Mes al que corresponde este precierre
        </label>
        <input
          type="month"
          value={mesPrecierre}
          onChange={(e) => setMesPrecierre(e.target.value)}
          className="px-3 py-2 rounded-md border text-sm outline-none"
          style={{ borderColor: "#D1D5DB" }}
        />
      </div>

      <textarea
        value={texto}
        onChange={(e) => setTexto(e.target.value)}
        rows={10}
        placeholder="Pega aquí la lista de suscriptores del precierre…"
        className="w-full px-3 py-2 rounded-md border text-sm outline-none mb-3 font-mono"
        style={{ borderColor: "#D1D5DB" }}
      />
      <button
        onClick={validar}
        disabled={!texto.trim()}
        className="text-sm font-medium px-4 py-2 rounded-md text-white disabled:opacity-40"
        style={{ background: "#001E62" }}
      >
        Validar precierre
      </button>

      {resultado && (
        <div className="mt-6 flex flex-col gap-4">
          <p className="text-sm font-medium" style={{ color: "#374151" }}>
            Resultado del precierre de {mesLabel(resultado.mes)}
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white rounded-lg border border-gray-200 p-4">
              <div className="text-2xl font-mono font-semibold" style={{ color: "#001E62" }}>{resultado.total}</div>
              <div className="text-xs mt-1" style={{ color: "#6B7280" }}>Suscriptores en el precierre</div>
            </div>
            <div className="bg-white rounded-lg border border-gray-200 p-4">
              <div className="text-2xl font-mono font-semibold" style={{ color: "#2F9E6E" }}>{resultado.encontrados.length}</div>
              <div className="text-xs mt-1" style={{ color: "#6B7280" }}>Ya cargados en la app</div>
            </div>
            <div className="bg-white rounded-lg border border-gray-200 p-4">
              <div className="text-2xl font-mono font-semibold" style={{ color: "#C23B3B" }}>{resultado.faltantes.length}</div>
              <div className="text-xs mt-1" style={{ color: "#6B7280" }}>Faltan por cargar</div>
            </div>
          </div>

          {resultado.faltantes.length > 0 ? (
            <div className="bg-white rounded-lg border border-gray-200 p-5">
              <h2 className="text-sm font-semibold mb-3" style={{ color: "#C23B3B" }}>
                ⚠️ Suscriptores del precierre que no están en la app
              </h2>
              <div className="flex flex-col gap-2">
                {resultado.faltantes.map((n) => (
                  <div
                    key={n}
                    className="flex items-center justify-between rounded-md border p-3"
                    style={{ borderColor: "#F3C6C6", background: "#FBEAEA" }}
                  >
                    <span className="font-mono text-sm">{n}</span>
                    <button
                      onClick={() => onIrNuevo(n)}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={{ background: "#001E62" }}
                    >
                      + Agregar cliente
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-lg border border-gray-200 p-5 text-center">
              <p className="text-sm" style={{ color: "#2F9E6E" }}>✅ Todos los suscriptores del precierre ya están cargados en la app.</p>
            </div>
          )}

          {resultado.sobrantes.length > 0 && (
            <div className="bg-white rounded-lg border border-gray-200 p-5">
              <h2 className="text-sm font-semibold mb-1" style={{ color: "#B8791F" }}>
                Instalados en {mesLabel(resultado.mes)} que no aparecen en este precierre
              </h2>
              <p className="text-xs mb-3" style={{ color: "#6B7280" }}>
                Revisá si corresponde alguna baja o si falta que Tigo los actualice en su sistema.
              </p>
              <div className="flex flex-col gap-2">
                {resultado.sobrantes.map((c) => (
                  <div
                    key={c.id}
                    className="flex items-center justify-between rounded-md border p-3"
                    style={{ borderColor: "#F3E3C3", background: "#FFFBF2" }}
                  >
                    <div>
                      <div className="font-mono text-sm font-medium">{c.numeroSuscriptor}</div>
                      <div className="text-xs" style={{ color: "#6B7280" }}>{c.nombre}</div>
                    </div>
                    <span className="text-xs font-mono" style={{ color: "#B8791F" }}>
                      Instalado: {fmtFecha(c.fechaInstalacion)}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function FormularioCliente({ form, setForm, onSubmit, editing, onCancel }) {
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const inputClass = "w-full px-3 py-2 rounded-md border text-sm outline-none focus:ring-2";
  const inputStyle = { borderColor: "#D1D5DB" };
  const lockedStyle = { borderColor: "#D1D5DB", background: "#F3F4F6", color: "#6B7280", cursor: "not-allowed" };
  const [diasProrrateo, setDiasProrrateo] = useState(null);

  function calcularAuto() {
    const r = calcularPrimeraFactura(form.fechaInstalacion, parseInt(form.cicloFacturacion, 10), form.montoMensual);
    if (!r) return;
    const totalPrimeraFactura = +((Number(form.montoMensual) || 0) + (Number(r.monto1raFactura) || 0)).toFixed(2);
    setForm((f) => ({ ...f, fecha1raFactura: r.fecha1raFactura, monto1raFactura: totalPrimeraFactura }));
    setDiasProrrateo(r.dias);
  }

  return (
    <div className="max-w-2xl">
      <h1 className="text-2xl font-semibold mb-1">{editing ? "Editar cliente" : "Nuevo cliente"}</h1>
      <p className="text-sm mb-6" style={{ color: "#6B7280" }}>
        Se hace seguimiento a las primeras 4 facturas. Las fechas de la 2da, 3ra y 4ta se calculan con el día del Ciclo de Facturación. Todos los campos son obligatorios.
      </p>
      <form onSubmit={onSubmit} className="bg-white rounded-lg border border-gray-200 p-6 flex flex-col gap-4">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Número de suscriptor *">
            <input required value={form.numeroSuscriptor} onChange={set("numeroSuscriptor")} className={inputClass} style={inputStyle} />
          </Field>
          <Field label="Nombre y apellido *">
            <input required value={form.nombre} onChange={set("nombre")} className={inputClass} style={inputStyle} />
          </Field>
          <Field label="Teléfono *">
            <input required value={form.telefono} onChange={set("telefono")} className={inputClass} style={inputStyle} />
          </Field>
          <Field label="Ciclo de facturación *">
            <select required value={form.cicloFacturacion} onChange={set("cicloFacturacion")} className={inputClass} style={inputStyle}>
              <option value="">Seleccionar…</option>
              {CICLOS.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
            </select>
          </Field>
          <Field label="Fecha de instalación">
            <input
              type="date"
              value={form.fechaInstalacion}
              onChange={set("fechaInstalacion")}
              disabled={!form.fechaInstalacion}
              required={!!form.fechaInstalacion}
              className={inputClass}
              style={!form.fechaInstalacion ? lockedStyle : inputStyle}
            />
            <label className="flex items-center gap-2 mt-1.5 text-xs" style={{ color: "#6B7280" }}>
              <input
                type="checkbox"
                checked={!form.fechaInstalacion}
                onChange={(e) =>
                  setForm((f) => ({ ...f, fechaInstalacion: e.target.checked ? "" : toISO(new Date()) }))
                }
              />
              Pendiente de instalación (todavía no tiene fecha)
            </label>
          </Field>
          <Field label="Tipo de plan *">
            <select
              required
              value={form.planTipo}
              onChange={(e) => setForm((f) => ({ ...f, planTipo: e.target.value, planTV: e.target.value === "SINGLE" ? "" : f.planTV }))}
              className={inputClass}
              style={inputStyle}
            >
              <option value="">Seleccionar…</option>
              {TIPOS_PLAN.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="Velocidad *">
            <select required value={form.velocidad} onChange={set("velocidad")} className={inputClass} style={inputStyle}>
              <option value="">Seleccionar…</option>
              {VELOCIDADES.map((v) => <option key={v} value={v}>{v}</option>)}
            </select>
          </Field>
          {form.planTipo === "DOBLE" && (
            <Field label="Plan de TV *">
              <select required value={form.planTV} onChange={set("planTV")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {TIPOS_TV.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
          )}
          <Field label="Monto mensual recurrente *">
            <input required type="number" step="0.01" value={form.montoMensual} onChange={set("montoMensual")} className={inputClass} style={inputStyle} />
          </Field>
        </div>

        <div className="rounded-md p-3 flex items-center justify-between" style={{ background: "#F4F6FA" }}>
          <div>
            <div className="text-xs font-medium" style={{ color: "#374151" }}>
              Fecha y monto de la 1ra factura (recurrente + prorrateo)
            </div>
            <div className="text-xs mt-0.5" style={{ color: "#9CA3AF" }}>
              {diasProrrateo != null
                ? `Calculado: ${diasProrrateo} día${diasProrrateo !== 1 ? "s" : ""} de prorrateo`
                : "Se calcula con fecha de instalación + ciclo + monto mensual"}
            </div>
          </div>
          <button
            type="button"
            onClick={calcularAuto}
            disabled={!form.fechaInstalacion || !form.cicloFacturacion || !form.montoMensual}
            className="text-xs font-medium px-3 py-1.5 rounded-md text-white disabled:opacity-40"
            style={{ background: "#001E62" }}
          >
            Calcular automáticamente
          </button>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Fecha 1ra factura (automática)">
            <input disabled type="date" value={form.fecha1raFactura} className={inputClass} style={lockedStyle} />
          </Field>
          <Field label="Monto 1ra factura (recurrente + prorrateo)">
            <input type="number" step="0.01" value={form.monto1raFactura} onChange={set("monto1raFactura")} className={inputClass} style={inputStyle} />
          </Field>
          <Field label="Estado de pago">
            <select value={form.estadoPago} onChange={set("estadoPago")} className={inputClass} style={inputStyle}>
              {ESTADOS.map((e) => <option key={e} value={e}>{e}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Observaciones">
          <textarea value={form.observaciones} onChange={set("observaciones")} rows={3} className={inputClass} style={inputStyle} />
        </Field>
        <div className="flex gap-2 pt-2">
          <button type="submit" className="text-sm font-medium px-4 py-2 rounded-md text-white" style={{ background: "#001E62" }}>
            {editing ? "Guardar cambios" : "Registrar cliente"}
          </button>
          <button type="button" onClick={onCancel} className="text-sm font-medium px-4 py-2 rounded-md border" style={{ borderColor: "#D1D5DB" }}>
            Cancelar
          </button>
        </div>
      </form>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-xs font-medium" style={{ color: "#6B7280" }}>{label}</span>
      {children}
    </label>
  );
}

function ConfirmModal({ onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div className="bg-white rounded-lg p-6 max-w-sm w-full">
        <h3 className="font-semibold mb-2">¿Eliminar cliente?</h3>
        <p className="text-sm mb-5" style={{ color: "#6B7280" }}>Esta acción no se puede deshacer.</p>
        <div className="flex gap-2 justify-end">
          <button onClick={onCancel} className="text-sm px-3 py-1.5 rounded-md border" style={{ borderColor: "#D1D5DB" }}>Cancelar</button>
          <button onClick={onConfirm} className="text-sm px-3 py-1.5 rounded-md text-white" style={{ background: "#C23B3B" }}>Eliminar</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
