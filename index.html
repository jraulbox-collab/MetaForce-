                    <span style={num}>{f.v}{f.m ? <em style={peq}>de {f.fm(f.m)} · {Math.round((f.vp / f.m) * 100)}%</em> : null}</span>

        <div style={ { borderTop: "1px solid " + C.bd, padding: "12px 0 8px" } }>

            type="button"

            style={ { width: "100%", minHeight: 44, background: "transparent", border: "1px solid #D3DCEC", borderRadius: 12, color: C.navy, fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 } }

            Simular clientes nuevos

  );
}

// Línea del bloque azul de notificaciones: abonos iniciales pendientes. Al tocarla lleva a
// Clientes con el filtro "Falta abono" para marcarlos allí.
function LineaAbonoPendiente({ clientes, conSeparador, onVer }) {
  const ahora = useAhoraMin();
  const lista = clientes
    .filter(abonoPendiente)
    .sort((a, b) => {
      const la = plazoAbono(a);
      const lb = plazoAbono(b);
      return (la ? la.getTime() : Infinity) - (lb ? lb.getTime() : Infinity);
    });
  if (lista.length === 0) return null;
  const masUrgente = lista[0];
  const i = infoPlazoAbono(masUrgente, ahora);
  const vencidos = lista.filter((c) => infoPlazoAbono(c, ahora).nivel === "vencido").length;
  const detalle =
    i.nivel === "vencido"
      ? `Ya venció el plazo de ${masUrgente.nombre || masUrgente.numeroSuscriptor}${vencidos > 1 ? " y " + (vencidos - 1) + " más" : ""}`
      : `Más urgente: ${i.texto.replace("⚠ Falta abono · ", "")}`;
  return (
    <button
      type="button"
      onClick={onVer}
      className="w-full text-left flex items-center gap-3 px-4 py-3"
      style={ { background: "transparent", color: "#fff", border: 0, borderTop: conSeparador ? "1px solid rgba(255,255,255,.25)" : 0 } }
    >
      <span className="shrink-0" style={ { fontSize: 22 } } aria-hidden="true">⚠</span>
      <span className="min-w-0 flex-1">
        <span className="block text-sm font-bold">{lista.length} {lista.length === 1 ? "abono pendiente" : "abonos pendientes"}</span>
        <span className="block text-xs mt-0.5" style={ { color: "#B9C4E0" } }>{detalle}</span>
      </span>
      <span className="shrink-0" style={ { fontSize: 18 } } aria-hidden="true">›</span>
    </button>
  );
}

// Línea del Dashboard: clientes con instalación programada a los que aún no se les envió la info.
function LineaInfoInstalacionPendiente({ clientes, conSeparador, onVer }) {
  const lista = clientes.filter(instalacionPorAvisar).sort((a, b) => String(a.instalacionProgramada).localeCompare(String(b.instalacionProgramada)));
  if (lista.length === 0) return null;
  const hoy = fechaLocalISO(new Date());
  const primero = lista[0];
  const cuando = primero.instalacionProgramada < hoy ? "ya venció" : primero.instalacionProgramada === hoy ? "se instala hoy" : primero.instalacionProgramada === addDays(hoy, 1) ? "se instala mañana" : "se instala el " + fmtFechaDia(primero.instalacionProgramada);
  return (
    <button
      type="button"
      onClick={onVer}
      className="w-full text-left flex items-center gap-3 px-4 py-3"

      <span className="shrink-0" style={ { fontSize: 22 } } aria-hidden="true">📩</span>
      <span className="min-w-0 flex-1">
        <span className="block text-sm font-bold">{lista.length} {lista.length === 1 ? "cliente sin info de instalación" : "clientes sin info de instalación"}</span>

}

// Línea del Dashboard: matches digitales que el titular del Hogar aún no aprueba.
function LineaMatchPendiente({ convergencias, conSeparador, onVer }) {
  const lista = (convergencias || [])
    .filter((c) => matchInfo(c))
    .sort((a, b) => (matchInfo(a).dias === null ? 99 : matchInfo(a).dias) - (matchInfo(b).dias === null ? 99 : matchInfo(b).dias));
  if (lista.length === 0) return null;
  const vencidos = lista.filter((c) => matchInfo(c).nivel === "vencido");
  const vigentes = lista.filter((c) => matchInfo(c).nivel !== "vencido");
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  const titulo = vencidos.length > 0
    ? `${plural(vencidos.length, "match vencido", "matches vencidos")} · sin descuento`
    : plural(vigentes.length, "match por confirmar", "matches por confirmar");
  const primero = vencidos.length > 0 ? vencidos[0] : vigentes[0];
  const detalle = vencidos.length > 0
    ? `Reenviar correo: ${tituloEs(vencidos[0].nombre || "")}${vigentes.length > 0 ? " · " + plural(vigentes.length, "más por confirmar", "más por confirmar") : ""}`
    : `Más urgente: ${tituloEs(primero.nombre || "")} · ${matchInfo(primero).texto.replace("⏳ Match pendiente · ", "")}`;
  return (
    <button
      type="button"
      onClick={() => onVer(primero)}
      className="w-full text-left flex items-center gap-3 px-4 py-3"
      style={ { background: "transparent", color: "#fff", border: 0, borderTop: conSeparador ? "1px solid rgba(255,255,255,.25)" : 0 } }
    >
      <span className="shrink-0" style={ { fontSize: 22 } } aria-hidden="true">{vencidos.length > 0 ? "⚠" : "⏳"}</span>
      <span className="min-w-0 flex-1">
        <span className="block text-sm font-bold">{titulo}</span>
        <span className="block text-xs mt-0.5" style={ { color: "#B9C4E0" } }>{detalle}</span>
      </span>
      <span className="shrink-0" style={ { fontSize: 18 } } aria-hidden="true">›</span>
    </button>
  );
}

// Lista única de "Por instalar" dentro de Avance del período: vencidas, hoy, mañana, más adelante
// y sin fecha agendada, todo a la vista y ordenado por urgencia.
function PanelPorInstalar({ porInstalar, onMarcarInstalado, onReprogramar, onCopiarMensaje, copiedKey, onVerCliente }) {
  const [abierto, setAbierto] = useState(null); // null = automático: se abre solo si hay vencidas
  const hoy = fechaLocalISO(new Date());
  const manana = addDays(hoy, 1);
  const porHora = (a, b) => horaInicioFranja(a.franjaInstalacion) - horaInicioFranja(b.franjaInstalacion);
  const porFecha = (a, b) => String(a.instalacionProgramada).localeCompare(String(b.instalacionProgramada)) || porHora(a, b);
  const g = { vencidas: [], hoy: [], manana: [], mas: [], sin: [] };
  porInstalar.forEach((c) => {
    const f = c.instalacionProgramada;
    if (!f) g.sin.push(c);
    else if (f < hoy) g.vencidas.push(c);
    else if (f === hoy) g.hoy.push(c);
    else if (f === manana) g.manana.push(c);
    else g.mas.push(c);
  });
  g.vencidas.sort(porFecha);
  g.hoy.sort(porHora);
  g.manana.sort(porHora);
  g.mas.sort(porFecha);
  g.sin.sort((a, b) => String(a.creadoEn || "").localeCompare(String(b.creadoEn || "")));
  const GRUPOS = [
    { k: "vencidas", t: "Vencidas, sin confirmar", l: g.vencidas, aviso: true },
    { k: "hoy", t: "Hoy", l: g.hoy },
    { k: "manana", t: "Mañana", l: g.manana },
    { k: "mas", t: "Más adelante", l: g.mas },
    { k: "sin", t: "Sin fecha agendada", l: g.sin },
  ].filter((x) => x.l.length > 0);
  const visible = abierto === null ? g.vencidas.length > 0 : abierto;
  const partes = [];
  if (g.vencidas.length) partes.push(`${g.vencidas.length} ${g.vencidas.length === 1 ? "vencida" : "vencidas"}`);
  if (g.hoy.length) partes.push(`hoy ${g.hoy.length}`);
  if (g.manana.length) partes.push(`mañana ${g.manana.length}`);

  function fila(c, k) {
    const barrio = leerBloqueTigo(c.observaciones).barrio;
    const horario = c.franjaInstalacion ? franjaCorta(c.franjaInstalacion) : "";
    let detalle;
    if (k === "vencidas") detalle = ["tenía instalación " + fmtFechaDia(c.instalacionProgramada), horario].filter(Boolean).join(" · ");
    else if (k === "mas") detalle = [fmtFechaDia(c.instalacionProgramada), horario].filter(Boolean).join(" · ");
    else if (k === "sin") {
      const dias = c.creadoEn ? Math.max(0, Math.round((new Date(hoy + "T00:00:00") - new Date(fechaLocalISO(new Date(c.creadoEn)) + "T00:00:00")) / 86400000)) : null;
      detalle = dias === null ? "" : dias === 0 ? "registrado hoy" : dias === 1 ? "registrado ayer" : "registrado hace " + dias + " días";
    } else detalle = [horario, barrio].filter(Boolean).join(" · ");
    const plan = [c.planTipo, c.velocidad].filter(Boolean).join(" ");
    const sub = [detalle, plan].filter(Boolean).join(" · ");
    // Recordatorio por WhatsApp: solo para instalaciones de hoy y mañana.
    const recordar = k === "hoy" || k === "manana";
    return (
      <div key={c.id} className="px-3 py-2" style={ { borderTop: "1px solid #EEF2F9" } }>
        <div className="flex items-center gap-2">
          <button type="button" onClick={() => onVerCliente(c)} className="flex-1 min-w-0 text-left" title="Abrir ficha">
            <span className="block text-[13px] font-bold underline underline-offset-2" style={ { color: "#0072CE", overflowWrap: "anywhere" } }>{nombreBonito(c.nombre)}</span>
            {sub ? <span className="block text-[11.5px]" style={ { color: "#5A6680" } }>{sub}</span> : null}
          </button>
          {recordar ? (
            <a
              href={whatsappLink(c, { texto: textoInstalacion(c) })}
              target="_blank"
              rel="noopener noreferrer"
              aria-label={"Enviar recordatorio de instalación por WhatsApp a " + nombreBonito(c.nombre)}
              title="Enviar recordatorio por WhatsApp"
              className="shrink-0 flex items-center justify-center rounded-[9px]"
              style={ { width: 36, height: 34, border: "1.5px solid #001E62", color: "#001E62", background: "white" } }
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z" /><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .7c-.9-.4-1.9-1.4-2.3-2.3l.7-1-1-2z" /></svg>
            </a>
          ) : null}
        </div>
      </div>
    );
  }

  return (
    <div className="mt-3 rounded-[10px] overflow-hidden" style={ { border: "1px solid #DCE2EE" } }>
      <button
        type="button"
        onClick={() => setAbierto(!visible)}
        aria-expanded={visible}
        className="w-full flex items-center justify-between gap-2 px-3 py-2 text-xs font-bold text-left"
        style={ { background: "#F3F6FB", color: "#001E62", minHeight: 40 } }
      >
        <span className="flex items-center gap-1.5 min-w-0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="shrink-0"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z" /></svg>
          <span className="min-w-0">
            Por instalar · {porInstalar.length}
            {partes.length > 0 ? <span className="block text-[11.5px] font-semibold" style={ { color: "#5A6680" } }>{partes.join(" · ")}</span> : null}
          </span>
        </span>
        <span className="shrink-0" style={ { color: "#5A6680" } }>{visible ? "Ocultar ▴" : "Mostrar ▾"}</span>
      </button>
      {visible ? GRUPOS.map((x) => (
        <div key={x.k}>
          <div className="flex items-center justify-between px-3 py-1 text-[11px] font-extrabold uppercase tracking-wider" style={ x.aviso ? { background: "#FFF3DC", color: "#7A4100", borderTop: "1px solid #DFE5EF" } : { background: "#F8FAFD", color: "#5A6680", borderTop: "1px solid #DFE5EF" } }>
            <span>{x.aviso ? "⚠ " : ""}{x.t}</span>
            <span>{x.l.length}</span>
          </div>
          {x.l.map((c) => fila(c, x.k))}
        </div>
      )) : null}
    </div>
  );
}

// Calcula qué clientes y números tocan hoy. Sin anotaciones: se apoya en lo que ya está guardado.
function calcularVentasHoy(clientes, convergencias, ahoraMs) {
  const hoyISO = fechaLocalISO(new Date(ahoraMs));
  const lista = (clientes || []).filter((c) => !c.cancelado && !c.penalizado && c.fechaInstalacion && c.f1_estado === "pagada");
  // clientes por barrio (para "zona con N clientes tuyos")
  const porBarrio = {};
  (clientes || []).forEach((c) => {
    const b = (leerBloqueTigo(c.observaciones).barrio || "").trim().toUpperCase();
    if (b) porBarrio[b] = (porBarrio[b] || 0) + 1;
  });
  const conocidos = new Set();
  (clientes || []).forEach((c) => { const k = d8(c.telefono); if (k.length >= 7) conocidos.add(k); });
  (convergencias || []).forEach((m) => { [m.telefono, m.whatsapp].forEach((t) => { const k = d8(t); if (k.length >= 7) conocidos.add(k); }); });
  const movilTelsTodos = new Set();
  (convergencias || []).forEach((m) => { [m.telefono, m.whatsapp].forEach((t) => { const k = d8(t); if (k.length >= 7) movilTelsTodos.add(k); }); });
  const haceTxt = (iso) => {
    if (!iso) return "";
    const d = -daysFromToday(fechaLocalISO(new Date(iso)));
    return d <= 0 ? "hoy" : d === 1 ? "hace 1 día" : `hace ${d} días`;
  };
  const refGlobal = new Set();
  let hechosHoy = 0;
  let ultimaApertura = 0;
  const filas = [];
  const seguimiento = [];
  lista.forEach((c) => {
    const bloque = leerBloqueTigo(c.observaciones);
    const vistos = new Set();
    const cand = [];
    const agregar = (tel, tipo, etiqueta) => {
      const k = d8(tel);
      if (k.length < 7 || vistos.has(k)) return;
      if (tipo === "contacto" && conocidos.has(k)) return; // ya es WhatsApp de otro cliente: se atiende en su propia fila
      vistos.add(k);
      cand.push({ k, tel: String(tel).trim(), tipo, etiqueta, frio: tipo === "contacto" && !conocidos.has(k) });
    };
    agregar(c.telefono, "ficha", "WhatsApp de su ficha");
    agregar(bloque.voz1, "contacto", "Contacto 1 de Tigo");
    agregar(bloque.voz2, "contacto", "Contacto 2 de Tigo");
    (c.referidos || []).forEach((r) => {
      const k = d8(r.tel);
      if (k.length < 7 || vistos.has(k) || refGlobal.has(k) || conocidos.has(k)) return; // ya es cliente o ya está en la lista
      refGlobal.add(k);
      vistos.add(k);
      cand.push({ k, tel: String(r.tel).trim(), tipo: "referido", etiqueta: "Referido por un contacto", frio: true, nombreRef: r.nombre || "" });
    });
    const vm = c.ventaMsg || {};
    const numeros = [];
    const tieneMovil = movilTelsTodos.has(d8(c.telefono));
    const otros = cand.map((n) => {
      const e = vm[n.k] || {};
      const ultimo = [e.abiertoEn, e.refAbiertoEn].filter(Boolean).sort().pop() || "";
      return { k: n.k, etiqueta: n.etiqueta, estado: e.noEscribir ? "no escribirle más" : ultimo ? `escrito ${haceTxt(ultimo)}` : "sin escribir" };
    });
    cand.forEach((n) => {
      const e = vm[n.k] || {};
      if (e.noEscribir) return;
      if (n.tipo === "ficha" && tieneMovil && !e.abiertoEn) {
        if (e.refAbiertoEn) {
          if (fechaLocalISO(new Date(e.refAbiertoEn)) === hoyISO) numeros.push({ ...n, ronda: "referido", estado: "abierto", abiertoEn: e.refAbiertoEn });
          return;
        }
      }
      if (e.abiertoEn) {
        const t = new Date(e.abiertoEn).getTime();
        const esHoy = fechaLocalISO(new Date(t)) === hoyISO;
        if (esHoy && n.frio) {
          hechosHoy += 1;
          if (t > ultimaApertura) ultimaApertura = t;
        }
        // Cliente Hogar: a los 60 días de su 1ra factura se le piden referidos (aunque haya respondido).
        if (n.tipo === "ficha" && !esHoy) {
          if (e.refAbiertoEn) {
            if (fechaLocalISO(new Date(e.refAbiertoEn)) === hoyISO) numeros.push({ ...n, ronda: "referido", estado: "abierto", abiertoEn: e.refAbiertoEn });
          } else if (!e.refDescartado && c.f1_pagadaEn && -daysFromToday(fechaLocalISO(new Date(c.f1_pagadaEn))) >= DIAS_REFERIDOS_CLIENTE && e.refSaltoDia !== hoyISO) {
            numeros.push({ ...n, ronda: "referido", estado: "pendiente", saltos: e.refSaltos || 0 });
          }
        }
        if (e.respondio) {
          if (!e.cerrado) seguimiento.push({ cliente: c, ...n, respondioEn: e.respondioEn || e.abiertoEn });
          return;
        }
        if (n.tipo === "ficha" && !esHoy) return;
        // Segunda ronda: a los 30 días se le piden referidos al contacto (sin tener que marcar nada).
        if (n.tipo === "contacto") {
          if (e.refAbiertoEn) {
            const tr = new Date(e.refAbiertoEn).getTime();
            if (fechaLocalISO(new Date(tr)) === hoyISO) {
              if (n.frio) { hechosHoy += 1; if (tr > ultimaApertura) ultimaApertura = tr; }
              numeros.push({ ...n, ronda: "referido", estado: "abierto", abiertoEn: e.refAbiertoEn });
            }
            return;
          }
          const dias = -daysFromToday(fechaLocalISO(new Date(e.abiertoEn)));
          if (!e.refDescartado && dias >= DIAS_PARA_REFERIDOS) {
            if (e.refSaltoDia !== hoyISO) numeros.push({ ...n, ronda: "referido", estado: "pendiente", saltos: e.refSaltos || 0 });
            return;
          }
        }
        if (esHoy) numeros.push({ ...n, estado: "abierto", abiertoEn: e.abiertoEn });
        return; // ya se le escribió antes
      }
      if (n.tipo === "ficha" && tieneMovil) {
        // Ya tiene móvil contigo: no se le ofrece plan móvil; a los 60 días se le piden referidos.
        if (!e.refDescartado && c.f1_pagadaEn && -daysFromToday(fechaLocalISO(new Date(c.f1_pagadaEn))) >= DIAS_REFERIDOS_CLIENTE && e.refSaltoDia !== hoyISO) {
          numeros.push({ ...n, ronda: "referido", estado: "pendiente", saltos: e.refSaltos || 0 });
        }
        return;
      }
      numeros.push({ ...n, estado: "pendiente" });
    });
    numeros.forEach((n) => {
      const e = vm[n.k] || {};
      n.ultimoISO = [e.abiertoEn, e.refAbiertoEn].filter(Boolean).sort().pop() || "";
    });
    if (numeros.length === 0) return;
    // ¿ya pasaron los días de espera desde que pagó la 1ra factura?
    const pagada = c.f1_pagadaEn ? fechaLocalISO(new Date(c.f1_pagadaEn)) : "";
    const diasDesde = pagada ? -daysFromToday(pagada) : null;
    const tieneAbierto = numeros.some((n) => n.estado === "abierto");
    if (!tieneAbierto && diasDesde !== null && diasDesde < DIAS_ESPERA_VENTA) return;
    const barrio = (bloque.barrio || "").trim().toUpperCase();
    filas.push({
      cliente: c,
      otros,
      tieneMovil,
      plan: planParaCliente(c),
      barrio: (bloque.barrio || "").trim(),
      instalacion: c.fechaInstalacion || "",
      numeros,
      diasDesde,
      zona: barrio ? porBarrio[barrio] || 0 : 0,
      pagada,
    });
  });
  // Clientes móvil: a los 15 días se les ofrece internet (si no tienen Hogar tuyo) y a los 60 se les piden referidos.
  const hogarTels = new Set();
  (clientes || []).forEach((c) => { const k = d8(c.telefono); if (k.length >= 7) hogarTels.add(k); });
  (convergencias || []).forEach((m) => {
    const tipo = tipoClienteMovil(m);
    if (tipo !== "pospago" && tipo !== "matchdigital" && tipo !== "convergencia") return;
    if (m.cancelado || m.penalizado) return;
    if (tipo === "matchdigital" && !m.matchConfirmado) return;
    if (m.f1_estado !== "pagada" || !m.f1_pagadaEn) return;
    const tel = m.whatsapp || m.telefono;
    const k = d8(tel);
    if (k.length < 7) return;
    const pagada = fechaLocalISO(new Date(m.f1_pagadaEn));
    const diasDesde = -daysFromToday(pagada);
    const vm = m.ventaMsg || {};
    const e = vm[k] || {};
    const lbl = (TIPOS_CLIENTE_MOVIL.find((t) => t.value === tipo) || {}).label || "Móvil";
    const base = { k, tel: String(tel).trim(), tipo: "movil", etiqueta: `WhatsApp · cliente móvil ${lbl}`, frio: false };
    const items = [];
    if (!e.noEscribir) {
      const ofreceInternet = tipo !== "convergencia" && !hogarTels.has(k) && !hogarTels.has(d8(m.telefono));
      const abiertoHoy = e.abiertoEn && fechaLocalISO(new Date(e.abiertoEn)) === hoyISO;
      if (ofreceInternet) {
        if (abiertoHoy) items.push({ ...base, estado: "abierto", abiertoEn: e.abiertoEn });
        else if (!e.abiertoEn && diasDesde >= DIAS_OFERTA_INTERNET_MOVIL && !e.intDescartado && e.intSaltoDia !== hoyISO) items.push({ ...base, estado: "pendiente", ronda: "movil", saltos: e.intSaltos || 0 });
      }
      if (e.abiertoEn && e.respondio && !e.cerrado) seguimiento.push({ cliente: m, ...base, respondioEn: e.respondioEn || e.abiertoEn });
      // Referidos a los 60 días (en Pospago/Match, después de haberles ofrecido internet).
      const internetPendiente = ofreceInternet && !e.abiertoEn;
      const yaEsHogar = hogarTels.has(k) || hogarTels.has(d8(m.telefono)); // su fila Hogar ya se encarga de pedirle referidos
      if (yaEsHogar) {
        // nada: no se duplica la fila
      } else if (e.refAbiertoEn) {
        if (fechaLocalISO(new Date(e.refAbiertoEn)) === hoyISO) items.push({ ...base, ronda: "referido", estado: "abierto", abiertoEn: e.refAbiertoEn });
      } else if (!internetPendiente && !abiertoHoy && diasDesde >= DIAS_REFERIDOS_CLIENTE && !e.refDescartado && e.refSaltoDia !== hoyISO) {
        items.push({ ...base, ronda: "referido", estado: "pendiente", saltos: e.refSaltos || 0 });
      }
    }
    items.forEach((it) => { it.ultimoISO = [e.abiertoEn, e.refAbiertoEn].filter(Boolean).sort().pop() || ""; });
    if (items.length) filas.push({ cliente: m, numeros: items, diasDesde, zona: 0, pagada, esMovil: true, plan: m.planNombre || "", barrio: (m.barrio || "").trim(), instalacion: m.fechaActivacion || "", otros: [] });
    // Contactos que este cliente móvil te dio
    (m.referidos || []).forEach((r) => {
      const kr = d8(r.tel);
      if (kr.length < 7 || refGlobal.has(kr) || conocidos.has(kr) || hogarTels.has(kr)) return;
      refGlobal.add(kr);
      const er = vm[kr] || {};
      if (er.noEscribir) return;
      const nr = { k: kr, tel: String(r.tel).trim(), tipo: "referido", etiqueta: "Referido por un contacto", frio: true, nombreRef: r.nombre || "" };
      if (er.abiertoEn) {
        const t = new Date(er.abiertoEn).getTime();
        if (fechaLocalISO(new Date(t)) === hoyISO) {
          hechosHoy += 1;
          if (t > ultimaApertura) ultimaApertura = t;
          filas.push({ cliente: m, numeros: [{ ...nr, estado: "abierto", abiertoEn: er.abiertoEn }], diasDesde, zona: 0, pagada, esMovil: true });
        } else if (er.respondio && !er.cerrado) seguimiento.push({ cliente: m, ...nr, respondioEn: er.respondioEn || er.abiertoEn });
        return;
      }
      filas.push({ cliente: m, numeros: [{ ...nr, estado: "pendiente" }], diasDesde, zona: 0, pagada, esMovil: true });
    });
  });
  filas.sort((a, b) => {
    const za = a.zona >= 3 ? a.zona : 0;
    const zb = b.zona >= 3 ? b.zona : 0;
    if (zb !== za) return zb - za;
    if (a.pagada && b.pagada) return b.pagada.localeCompare(a.pagada);
    return a.pagada ? -1 : b.pagada ? 1 : 0;
  });
  const pendientes = filas.reduce((n, f) => n + f.numeros.filter((x) => x.estado === "pendiente" && x.frio).length, 0);
  const pendientesCalientes = filas.reduce((n, f) => n + f.numeros.filter((x) => x.estado === "pendiente" && !x.frio).length, 0);
  // ventas del mes por beneficio compartido (Match Digital cuyo titular es un cliente tuyo)
  const mes = hoyISO.slice(0, 7);
  const dueños = {};
  (clientes || []).forEach((c) => {
    const b = leerBloqueTigo(c.observaciones);
    [c.telefono, b.voz1, b.voz2].forEach((t) => { const k = d8(t); if (k.length >= 7 && !dueños[k]) dueños[k] = c; });
  });
  const porCliente = {};
  let totalMatch = 0;
  (convergencias || []).forEach((m) => {
    if (m.tipo !== "matchdigital" || !m.titularTelefono) return;
    const f = String(m.matchFecha || m.creadoEn || "").slice(0, 7);
    if (f !== mes) return;
    const dueño = dueños[d8(m.titularTelefono)];
    if (!dueño) return;
    totalMatch += 1;
    porCliente[dueño.id] = { nombre: dueño.nombre, n: ((porCliente[dueño.id] || {}).n || 0) + 1 };
  });
  const telACliente = new Map();
  (clientes || []).forEach((c) => { const k = d8(c.telefono); if (k.length >= 7) telACliente.set(k, c.id); });
  const telMovil = new Set();
  (convergencias || []).forEach((m) => { [m.telefono, m.whatsapp].forEach((t) => { const k = d8(t); if (k.length >= 7) telMovil.add(k); }); });
  let refGuardados = 0;
  let refContrataron = 0;
  (clientes || []).forEach((c) => (c.referidos || []).forEach((r) => {
    refGuardados += 1;
    const k = d8(r.tel);
    if ((telACliente.has(k) && telACliente.get(k) !== c.id) || telMovil.has(k)) refContrataron += 1;
  }));
  (convergencias || []).forEach((m) => (m.referidos || []).forEach((r) => {
    refGuardados += 1;
    const k = d8(r.tel);
    if (telACliente.has(k) || (telMovil.has(k) && d8(m.telefono) !== k && d8(m.whatsapp) !== k)) refContrataron += 1;
  }));
  const mesISO = hoyISO.slice(0, 7);
  let enviadosMes = 0;
  const contarMes = (vm) => Object.values(vm || {}).forEach((e) => [e.abiertoEn, e.refAbiertoEn].forEach((t) => { if (t && fechaLocalISO(new Date(t)).slice(0, 7) === mesISO) enviadosMes += 1; }));
  (clientes || []).forEach((c) => contarMes(c.ventaMsg));
  (convergencias || []).forEach((m) => contarMes(m.ventaMsg));
  seguimiento.sort((a, b) => String(a.respondioEn).localeCompare(String(b.respondioEn)));
  return { filas, seguimiento, enviadosMes, referidos: { guardados: refGuardados, contrataron: refContrataron }, hechosHoy, pendientes, pendientesCalientes, ultimaApertura, ventasMes: { total: totalMatch, clientes: Object.values(porCliente) } };
}

// Lee una lista pegada (un contacto por línea): "6123-4567", "Pedro 6123-4567" o "6123-4567 Pedro".
function leerListaReferidos(texto, existe) {
  const validos = [];
  const sinLeer = [];
  const repetidos = [];
  const vistos = new Set();
  String(texto || "").split(/\n|;/).forEach((linea) => {
    const t = linea.trim();
    if (!t) return;
    const m = t.match(/(?:\+?507[\s-]*)?(\d[\d\s-]{6,}\d)/);
    const dig = m ? m[0].replace(/\D/g, "").replace(/^507(?=\d{8}$)/, "") : "";
    if (dig.length !== 8) { sinLeer.push(t); return; }
    const k = dig;
    if (vistos.has(k) || existe(k)) { repetidos.push(dig.slice(0, 4) + "-" + dig.slice(4)); return; }
    vistos.add(k);
    const nombre = t.replace(m[0], " ").replace(/[,:\-–·|]+/g, " ").replace(/\s+/g, " ").trim();
    validos.push({ tel: dig.slice(0, 4) + "-" + dig.slice(4), nombre });
  });
  return { validos, sinLeer, repetidos };
}

function FormReferido({ existe, onGuardar, onGuardarVarios, onCancelar }) {
  const [modo, setModo] = useState("uno");
  const [tel, setTel] = useState("");
  const [nom, setNom] = useState("");
  const [lista, setLista] = useState("");
  const [err, setErr] = useState("");
  const guardar = () => {
    const digitos = tel.replace(/\D/g, "");
    if (digitos.length < 8) { setErr("Revisa el número: faltan dígitos."); return; }
    if (existe(d8(tel))) { setErr("Ese número ya está en tu lista."); return; }
    onGuardar(tel.trim(), nom.trim());
  };
  const leido = modo === "varios" ? leerListaReferidos(lista, existe) : null;
  const guardarVarios = () => {
    if (!leido || leido.validos.length === 0) { setErr("No encontré ningún número para guardar."); return; }
    onGuardarVarios(leido.validos);
  };
  const estiloInput = { width: "100%", height: 40, border: "1.5px solid #9CA3AF", borderRadius: 8, padding: "0 10px", fontSize: 16, background: "#fff", color: "#111827" };
  return (
    <div className="mt-2 rounded-lg p-3" style={ { background: "#F3F6FB", border: "1.5px solid #D5DEEE" } }>
      <div className="flex items-center justify-between gap-2 mb-2">
        <div className="text-xs font-extrabold" style={ { color: "#001E62" } }>{modo === "uno" ? "Contacto que te dio" : "Pega la lista de contactos"}</div>
        {onGuardarVarios && (
          <button type="button" onClick={() => { setModo(modo === "uno" ? "varios" : "uno"); setErr(""); } } className="text-xs font-extrabold underline" style={ { color: "#001E62" } }>{modo === "uno" ? "Pegar varios" : "Solo uno"}</button>
        )}
      </div>
      {modo === "uno" ? (
        <>
          <input type="tel" inputMode="tel" value={tel} onChange={(e) => { setTel(e.target.value); setErr(""); } } placeholder="Número" aria-label="Número del contacto" style={ estiloInput } />
          <input type="text" value={nom} onChange={(e) => setNom(e.target.value)} placeholder="Nombre (opcional)" aria-label="Nombre del contacto" style={ { ...estiloInput, marginTop: 8 } } />
        </>
      ) : (
        <>
          <textarea value={lista} onChange={(e) => { setLista(e.target.value); setErr(""); } } rows={5} placeholder={"Uno por línea:\nPedro 6123-4567\n6234-5678"} aria-label="Lista de contactos" style={ { ...estiloInput, height: "auto", padding: 10 } } />
          {lista.trim() && leido && (
            <div className="text-xs mt-2" style={ { color: "#374151" } }>
              <div className="font-bold" style={ { color: "#0F5A2B" } }>✓ {leido.validos.length} {leido.validos.length === 1 ? "contacto listo" : "contactos listos"}</div>
              {leido.repetidos.length > 0 && <div className="mt-1">↺ Ya estaban guardados: {leido.repetidos.join(", ")}</div>}
              {leido.sinLeer.length > 0 && <div className="mt-1 font-bold" style={ { color: "#B45309" } }>⚠️ No pude leer: {leido.sinLeer.join(" | ")}</div>}
            </div>
          )}
        </>
      )}
      {err && <div className="text-xs font-bold mt-2" style={ { color: "#B42318" } }>⚠️ {err}</div>}
      <div className="flex gap-2 mt-3">
        <button type="button" onClick={modo === "uno" ? guardar : guardarVarios} className="flex-1 text-sm font-extrabold rounded-lg text-white" style={ { height: 40, background: "#001E62" } }>{modo === "uno" ? "Guardar" : `Guardar${leido && leido.validos.length ? " " + leido.validos.length : ""}`}</button>
        <button type="button" onClick={onCancelar} className="text-sm font-bold rounded-lg px-4" style={ { height: 40, background: "#fff", color: "#001E62", border: "1.5px solid #001E62" } }>Cancelar</button>
      </div>
    </div>
  );
}

// Tipo de mensaje de una fila (para los filtros del panel)
function tipoMensajeVenta(n) {
  if (n.tipo === "referido") return "nuevos";
  if (n.ronda === "referido") return "pedir";
  if (n.tipo === "movil") return "internet";
  if (n.tipo === "contacto") return "contactos";
  return "plan";
}
// Resumen de lo que se le ofrece o se le pide, para verlo sin abrir el mensaje.
function ofertaVenta(n, f) {
  if (n.tipo === "referido") return "Ofertas de internet";
  if (n.ronda === "referido") {
    const conMovil = n.tipo === "movil" || (n.tipo === "ficha" && f.tieneMovil);
    return conMovil ? "Pedir un referido: recargas o internet" : "Pedir un referido: mudanza o cambio de internet";
  }
  if (n.tipo === "movil") return "Preguntar por su internet";
  return "Plan móvil: precio especial";
}
const FILTROS_VENTAS = [
  { k: "todos", icono: "💬", txt: "Todos" },
  { k: "nuevos", icono: "🙋", txt: "Referidos nuevos" },
  { k: "plan", icono: "📱", txt: "Plan móvil" },
  { k: "contactos", icono: "👥", txt: "Contactos" },
  { k: "internet", icono: "🏠", txt: "Internet" },
  { k: "pedir", icono: "🤝", txt: "Pedir referidos" },
  { k: "respondieron", icono: "🔥", txt: "Respondieron" },
];
const LOTE_VENTAS = 10;

function AgregarReferidoGeneral({ clientes, convergencias, existe, onGuardar, onGuardarVarios, onCerrar }) {
  const [q, setQ] = useState("");
  const [elegido, setElegido] = useState(null);
  const gente = useMemo(() => [
    ...(clientes || []).map((c) => ({ id: c.id, nombre: c.nombre || "" })),
    ...(convergencias || []).map((m) => ({ id: m.id, nombre: m.nombre || "" })),
  ], [clientes, convergencias]);
  const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const coincide = q.trim().length >= 2 ? gente.filter((g) => norm(g.nombre).includes(norm(q.trim()))).slice(0, 6) : [];
  const cerrar = () => { setQ(""); setElegido(null); onCerrar(); };
  return (
    <div className="w-full rounded-lg p-3" style={ { background: "#F3F6FB", border: "1.5px solid #D5DEEE" } }>
      <div className="text-xs font-extrabold mb-2" style={ { color: "#001E62" } }>¿Quién te dio el contacto?</div>
      {!elegido ? (
        <>
          <input type="text" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Escribe su nombre" aria-label="Buscar cliente" style={ { width: "100%", height: 40, border: "1.5px solid #9CA3AF", borderRadius: 8, padding: "0 10px", fontSize: 16, background: "#fff", color: "#111827" } } />
          {coincide.map((g) => (
            <button key={g.id} type="button" onClick={() => setElegido(g)} className="block w-full text-left text-sm font-bold py-2 px-2 mt-1 rounded-lg" style={ { background: "#fff", color: "#001E62", border: "1px solid #D5DEEE" } }>{tituloEs(g.nombre)}</button>
          ))}
          {q.trim().length >= 2 && coincide.length === 0 && <div className="text-xs mt-2" style={ { color: "#5A6680" } }>No encontré a nadie con ese nombre.</div>}
          <button type="button" onClick={cerrar} className="mt-2 text-xs font-bold underline" style={ { color: "#5A6680" } }>Cancelar</button>
        </>
      ) : (
        <>
          <div className="text-sm font-bold mb-1" style={ { color: "#001E62" } }>{tituloEs(elegido.nombre)}</div>
          <FormReferido existe={existe} onGuardar={(t, nm) => { onGuardar(elegido.id, t, nm); cerrar(); } } onGuardarVarios={(l) => { onGuardarVarios(elegido.id, l); cerrar(); } } onCancelar={cerrar} />
        </>
      )}
    </div>
  );
}

function ListaMisReferidos({ clientes, convergencias }) {
  const telACliente = new Map();
  (clientes || []).forEach((c) => { const k = d8(c.telefono); if (k.length >= 7) telACliente.set(k, c.id); });
  const telMovil = new Set();
  (convergencias || []).forEach((m) => { [m.telefono, m.whatsapp].forEach((t) => { const k = d8(t); if (k.length >= 7) telMovil.add(k); }); });
  const filas = [];
  const agregar = (dador, r) => {
    const k = d8(r.tel);
    const e = (dador.ventaMsg || {})[k] || {};
    let estado = "Por enviar";
    let orden = 1;
    if ((telACliente.has(k) && telACliente.get(k) !== dador.id) || (telMovil.has(k) && d8(dador.telefono) !== k && d8(dador.whatsapp) !== k)) { estado = "✓ Ya es cliente"; orden = 4; }
    else if (e.respondio) { estado = e.cerrado ? "Respondió · cerrado" : "🔥 Respondió"; orden = e.cerrado ? 3 : 0; }
    else if (e.abiertoEn) { estado = `Enviado ${new Date(e.abiertoEn).toLocaleDateString("es-PA", { day: "numeric", month: "short" })}`; orden = 2; }
    else if (e.noEscribir) { estado = "No escribirle más"; orden = 5; }
    filas.push({ id: r.id || k, nombre: r.nombre || "", tel: r.tel, dador: dador.nombre || "", estado, orden });
  };
  (clientes || []).forEach((c) => (c.referidos || []).forEach((r) => agregar(c, r)));
  (convergencias || []).forEach((m) => (m.referidos || []).forEach((r) => agregar(m, r)));
  filas.sort((x, y) => x.orden - y.orden);
  if (filas.length === 0) return <p className="px-4 py-4 text-sm" style={ { color: "#5A6680" } }>Todavía no has guardado referidos.</p>;
  return (
    <div>
      {filas.map((f) => (
        <div key={f.id} className="px-4 py-2.5 border-t flex items-center gap-2" style={ { borderColor: "#EEF1F6" } }>
          <div className="min-w-0 flex-1">
            <div className="text-sm font-bold" style={ { color: "#001E62" } }>{f.nombre ? tituloEs(f.nombre) : f.tel}</div>
            <div className="text-[11px]" style={ { color: "#5A6680" } }>{f.nombre ? `${f.tel} · ` : ""}Lo dio {tituloEs(f.dador)}</div>
          </div>
          <span className="shrink-0 text-[11px] font-extrabold px-2 py-1 rounded-lg" style={ { background: "#EAF0FB", color: "#001E62" } }>{f.estado}</span>
        </div>
      ))}
    </div>
  );
}

function PanelVentasHoy({ clientes, convergencias, onAbrir, onDeshacer, onNoEscribir, onRespondio, onCerrar, onSaltar, onAgregarReferido, onVerCliente, onVerMovil }) {
  const [ahora, setAhora] = useState(Date.now());
  const [formKey, setFormKey] = useState(null);
  const [msgKey, setMsgKey] = useState(null);
  const [guardadoMsg, setGuardadoMsg] = useState("");
  const [filtro, setFiltro] = useState("todos");
  const [visibles, setVisibles] = useState(LOTE_VENTAS);
  const [verRefs, setVerRefs] = useState(false);
  const [agregando, setAgregando] = useState(false);
  const existe = (k) => {
    if ((clientes || []).some((c) => d8(c.telefono) === k || (c.referidos || []).some((r) => d8(r.tel) === k))) return true;
    return (convergencias || []).some((m) => d8(m.telefono) === k || d8(m.whatsapp) === k || (m.referidos || []).some((r) => d8(r.tel) === k));
  };
  const guardarRef = (idCliente, tel, nom) => guardarVarios(idCliente, [{ tel, nombre: nom }]);
  const guardarVarios = (idCliente, lista) => {
    onAgregarReferido(idCliente, lista);
    setFormKey(null);
    setGuardadoMsg(lista.length === 1 ? "✓ Contacto guardado. Sale en tu lista para escribirle." : `✓ ${lista.length} contactos guardados. Salen en tu lista para escribirles.`);
    setTimeout(() => setGuardadoMsg(""), 4000);
  };
  const datos = calcularVentasHoy(clientes, convergencias, ahora);
  const espera = Math.max(0, ESPERA_ENTRE_MENSAJES_S - Math.floor((ahora - datos.ultimaApertura) / 1000));
  const esperando = datos.ultimaApertura > 0 && espera > 0;
  useEffect(() => {
    if (!esperando) return;
    const t = setInterval(() => setAhora(Date.now()), 1000);
    return () => clearInterval(t);
  }, [esperando]);
  const llegoAlTope = datos.hechosHoy >= TOPE_DIARIO_VENTAS;
  // Aplanamos a una lista de números y los intercalamos: mientras corre la espera de un número nuevo, mandas los conocidos.
  const cupo = Math.max(0, TOPE_DIARIO_VENTAS - datos.hechosHoy);
  const items = [];
  datos.filas.forEach((f) => f.numeros.forEach((n) => items.push({ f, n })));
  const abiertos = items.filter((x) => x.n.estado === "abierto");
  const pendC = items.filter((x) => x.n.estado === "pendiente" && !x.n.frio);
  const pendF = items.filter((x) => x.n.estado === "pendiente" && x.n.frio);
  const pendFVisibles = pendF.slice(0, cupo);
  const paraManana = pendF.length - pendFVisibles.length;
  const mezcla = [];
  for (let i = 0; i < Math.max(pendC.length, pendFVisibles.length); i++) {
    if (pendFVisibles[i]) mezcla.push(pendFVisibles[i]);
    if (pendC[i]) mezcla.push(pendC[i]);
  }
  // Los referidos nuevos van primero: son los que más responden y se enfrían rápido.
  const pendientes = [...mezcla.filter((x) => x.n.tipo === "referido"), ...mezcla.filter((x) => x.n.tipo !== "referido")];
  const cuenta = { todos: pendientes.length, respondieron: datos.seguimiento.length, nuevos: 0, plan: 0, contactos: 0, internet: 0, pedir: 0 };
  pendientes.forEach((x) => { cuenta[tipoMensajeVenta(x.n)] += 1; });
  const filtroEf = filtro !== "todos" && !(cuenta[filtro] > 0) ? "todos" : filtro;
  const pasa = (x) => filtroEf === "todos" || filtroEf === tipoMensajeVenta(x.n);
  const abiertosF = filtroEf === "respondieron" ? [] : abiertos.filter(pasa);
  const pendF2 = filtroEf === "respondieron" ? [] : pendientes.filter(pasa);
  const mostrar = pendF2.slice(0, visibles);
  const restantes = pendF2.length - mostrar.length;
  const lista = [...abiertosF, ...mostrar];
  const primerPend = mostrar[0];
  const primerPendienteKey = primerPend ? `vta-${primerPend.f.cliente.id}-${primerPend.n.k}` : null;
  const pct = Math.min(100, Math.round((datos.hechosHoy / TOPE_DIARIO_VENTAS) * 100));
  const mensajeDe = (n, c, f) => (n.tipo === "movil" ? (n.ronda === "referido" ? mensajeVentaReferidosMovil(c) : mensajeVentaInternetMovil(c)) : n.tipo === "ficha" ? (n.ronda === "referido" ? (f.tieneMovil ? mensajeVentaReferidosMovil(c) : mensajeVentaReferidosCliente(c)) : mensajeVentaFicha(c)) : n.tipo === "referido" ? mensajeVentaReferido(n.nombreRef) : n.ronda === "referido" ? mensajeVentaReferidos(c) : mensajeVentaContacto(c));
  const enlaceDe = (n, c, f) => `https://wa.me/${telefonoWhatsapp(n.tel)}?text=${encodeURIComponent(mensajeDe(n, c, f))}`;
  // ---- Envío en cadena: recorre la lista abriendo WhatsApp con cada mensaje ----
  const [cola, setCola] = useState(null);
  const [idxCola, setIdxCola] = useState(0);
  const [abrirYa, setAbrirYa] = useState(false);
  const [resumenCola, setResumenCola] = useState(null);
  const envRef = useRef(0);
  const salRef = useRef(0);
  const terminarCola = (colaActual, desde) => {
    setResumenCola({ enviados: envRef.current, saltados: salRef.current, faltan: Math.max(0, colaActual.length - desde) });
    setCola(null);
    setAbrirYa(false);
  };
  const avanzarCola = (desde) => {
    if (desde >= cola.length) { terminarCola(cola, desde); return; }
    setIdxCola(desde);
    setAbrirYa(true);
  };
  const iniciarCola = (lista) => {
    if (!lista.length) return;
    envRef.current = 0;
    salRef.current = 0;
    setResumenCola(null);
    setCola(lista);
    setIdxCola(0);
    setAbrirYa(true);
  };
  const itemCola = cola ? cola[idxCola] : null;
  useEffect(() => {
    if (!cola || !abrirYa || !itemCola) return;
    if (itemCola.n.frio && datos.hechosHoy >= TOPE_DIARIO_VENTAS) { salRef.current += 1; avanzarCola(idxCola + 1); return; }
    if (itemCola.n.frio && esperando) return;
    setAbrirYa(false);
    window.location.href = enlaceDe(itemCola.n, itemCola.f.cliente, itemCola.f);
  }, [cola, idxCola, abrirYa, esperando, datos.hechosHoy]);
  const iconoWa = (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
  );
  const totalRefs = datos.referidos.guardados;
  return (
    <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden mb-4">
      {!cola && <button
        type="button"
        onClick={() => setAgregando(true)}
        className="fixed z-40 flex items-center justify-center gap-1.5 text-white text-sm font-extrabold px-4"
        style={ { right: 16, bottom: "calc(86px + env(safe-area-inset-bottom))", height: 48, borderRadius: 24, background: "#001E62", boxShadow: "0 4px 14px rgba(0,30,98,0.3)", border: 0 } }
        aria-label="Agregar referido"
      >
        ➕ Referido
      </button>}
      {agregando && (
        <div className="fixed inset-0 z-50 flex items-end justify-center" style={ { background: "rgba(0,0,0,0.45)" } } onClick={(e) => { if (e.target === e.currentTarget) setAgregando(false); } }>
          <div className="w-full bg-white p-4 overflow-auto" style={ { maxHeight: "85%", borderTopLeftRadius: 16, borderTopRightRadius: 16, maxWidth: 560 } }>
            <AgregarReferidoGeneral
              clientes={clientes}
              convergencias={convergencias}
              existe={existe}
              onGuardar={(id, t, nm) => { guardarRef(id, t, nm); setAgregando(false); } }
              onGuardarVarios={(id, l) => { guardarVarios(id, l); setAgregando(false); } }
              onCerrar={() => setAgregando(false)}
            />
          </div>
        </div>
      )}
      <div className="px-4 py-3 border-b" style={ { borderColor: "#EEF1F6" } }>
        <div className="text-base font-extrabold" style={ { color: "#001E62" } }>💬 Para escribir hoy · quedan {pendientes.length}</div>
        <div className="text-xs font-semibold mt-1" style={ { color: "#5A6680" } }>Números nuevos hoy: {datos.hechosHoy} de {TOPE_DIARIO_VENTAS}</div>
        <div className="mt-2 rounded-full overflow-hidden" style={ { height: 8, background: "#E3EDFA" } } role="progressbar" aria-valuenow={datos.hechosHoy} aria-valuemin={0} aria-valuemax={TOPE_DIARIO_VENTAS}>
          <div style={ { width: pct + "%", height: "100%", background: "#001E62" } }></div>
        </div>
        <div className="flex flex-wrap gap-2 mt-3">
          {FILTROS_VENTAS.filter((f) => f.k === "todos" || cuenta[f.k] > 0).map((f) => {
            const sel = filtroEf === f.k;
            return (
              <button
                key={f.k}
                type="button"
                aria-pressed={sel}
                onClick={() => { setFiltro(f.k); setVisibles(LOTE_VENTAS); }}
                className="text-xs font-extrabold rounded-full px-3"
                style={ { height: 32, background: sel ? "#001E62" : "#fff", color: sel ? "#fff" : "#001E62", border: "1.5px solid #001E62" } }
              >
                {sel ? "✓ " : ""}{f.icono} {f.txt} ({cuenta[f.k]})
              </button>
            );
          })}
        </div>
        {pendF2.length > 0 && (
          <button type="button" disabled={!!cola} onClick={() => iniciarCola(pendF2)} className="w-full mt-3 text-sm font-extrabold rounded-lg text-white disabled:opacity-50" style={ { minHeight: 46, background: "#001E62" } }>
            ▶ Empezar a enviar <span style={ { fontWeight: 500, opacity: 0.85 } }>· {pendF2.length} por WhatsApp</span>
          </button>
        )}
        {totalRefs > 0 && (
          <div className="mt-3">
            <button type="button" onClick={() => setVerRefs((v) => !v)} className="text-xs font-extrabold rounded-lg px-3" style={ { height: 34, background: verRefs ? "#001E62" : "#fff", color: verRefs ? "#fff" : "#001E62", border: "1.5px solid #001E62" } }>
              {verRefs ? "✓ " : ""}📋 Mis referidos ({totalRefs})
            </button>
          </div>
        )}
      </div>
      {cola && itemCola && (
        <div className="fixed z-[60] p-3" style={ { left: 10, right: 10, bottom: "calc(92px + env(safe-area-inset-bottom))", borderRadius: 16, background: "#001E62", boxShadow: "0 -4px 18px rgba(0,0,0,.35)", border: "1px solid #3A55A0" } }>
          <div className="text-sm font-extrabold text-white">
            Enviando {idxCola + 1} de {cola.length} · quedan {cola.length - idxCola - 1}
          </div>
          <div className="text-sm text-white mt-0.5">
            {tituloEs(itemCola.n.tipo === "referido" ? (itemCola.n.nombreRef || "Referido nuevo") : itemCola.f.cliente.nombre || "")} · {itemCola.n.tel}
          </div>
          {abrirYa && itemCola.n.frio && esperando ? (
            <div className="text-xs font-bold mt-1" style={ { color: "#FFD27A" } }>⏳ Espera {espera}s para abrir el siguiente número nuevo</div>
          ) : (
            <div className="text-xs mt-1" style={ { color: "#B9C4E0" } }>Se abrió WhatsApp con el mensaje. ¿Lo enviaste?</div>
          )}
          <div className="flex gap-2 mt-2 items-stretch">
            <button type="button" onClick={() => terminarCola(cola, idxCola)} className="text-sm font-extrabold rounded-lg px-3 whitespace-nowrap" style={ { minHeight: 44, background: "transparent", color: "#fff", border: "1.5px solid #fff" } }>⏹ Detener</button>
            <button type="button" onClick={() => { salRef.current += 1; avanzarCola(idxCola + 1); } } className="flex-1 text-sm font-extrabold rounded-lg whitespace-nowrap" style={ { minHeight: 44, background: "transparent", color: "#fff", border: "1.5px solid #fff" } }>No, saltar</button>
            <button type="button" onClick={() => { onAbrir(itemCola.f.cliente.id, itemCola.n.k, itemCola.n.ronda); envRef.current += 1; avanzarCola(idxCola + 1); } } className="text-sm font-extrabold rounded-lg whitespace-nowrap" style={ { minHeight: 48, flex: "1.4 1 0", background: "#fff", color: "#001E62", border: 0 } }>Sí, siguiente</button>
          </div>
          <button type="button" onClick={() => { if (window.confirm(`¿No escribirle más a ${itemCola.n.tel}? Sale de todas las listas.`)) { onNoEscribir(itemCola.f.cliente.id, itemCola.n.k); salRef.current += 1; avanzarCola(idxCola + 1); } } } className="mt-2 text-xs font-semibold underline" style={ { color: "#B9C4E0" } }>✕ No escribirle más</button>
        </div>
      )}
      {resumenCola && (
        <div className="px-4 py-3" style={ { background: "#E3F5EA", borderBottom: "1px solid #BFE3CC" } }>
          <div className="text-sm font-extrabold" style={ { color: "#0F5A2B" } }>✓ Recorrido terminado</div>
          <div className="text-sm mt-1" style={ { color: "#0F5A2B" } }>Enviaste {resumenCola.enviados} · saltaste {resumenCola.saltados} · faltan {resumenCola.faltan}</div>
          <button type="button" onClick={() => setResumenCola(null)} className="mt-2 text-xs font-extrabold underline" style={ { color: "#0F5A2B" } }>Cerrar</button>
        </div>
      )}
      {verRefs && <ListaMisReferidos clientes={clientes} convergencias={convergencias} />}
      {llegoAlTope && (
        <div className="px-4 py-3 text-sm font-bold" style={ { color: "#0F5A2B", background: "#E3F5EA" } }>✓ Listo con los nuevos de hoy. Los conocidos puedes seguir.</div>
      )}
      {guardadoMsg && <div className="px-4 py-2.5 text-sm font-bold" style={ { color: "#0F5A2B", background: "#E3F5EA" } }>{guardadoMsg}</div>}
      {(filtroEf === "todos" || filtroEf === "respondieron") && datos.seguimiento.length > 0 && (
        <div className="px-4 py-3" style={ { background: "#FFF3DC", borderBottom: "1px solid #F0D9AE" } }>
          <div className="text-sm font-extrabold" style={ { color: "#B45309" } }>🔥 Respondieron · falta cerrar ({datos.seguimiento.length})</div>
          {datos.seguimiento.map((x) => (
            <div key={`seg-${x.cliente.id}-${x.k}`}>
            <div className="mt-2 flex items-center gap-2">
              <div className="min-w-0 flex-1">
                <div className="text-sm font-bold font-mono">{x.tel}</div>
                <div className="text-[11px]" style={ { color: "#5A6680" } }>{x.tipo === "ficha" || x.tipo === "movil" ? "Cliente" : "Contacto de"} {tituloEs(x.cliente.nombre || "")}</div>
              </div>
              <a href={`https://wa.me/${telefonoWhatsapp(x.tel)}`} className="shrink-0 inline-flex items-center text-xs font-extrabold px-3 rounded-lg" style={ { height: 34, color: "#001E62", background: "#fff", border: "1.5px solid #001E62", textDecoration: "none" } }>Abrir chat</a>
              <button type="button" onClick={() => onCerrar(x.cliente.id, x.k)} className="shrink-0 text-xs font-extrabold px-3 rounded-lg" style={ { height: 34, color: "#0F5A2B", background: "#E3F5EA", border: "1.5px solid #0F5A2B" } }>✓ Listo</button>
            </div>
            {x.tipo !== "ficha" && x.tipo !== "movil" && (
              formKey === `seg-${x.cliente.id}-${x.k}` ? (
                <FormReferido existe={existe} onGuardar={(t, nm) => guardarRef(x.cliente.id, t, nm)} onGuardarVarios={(l) => guardarVarios(x.cliente.id, l)} onCancelar={() => setFormKey(null)} />
              ) : (
                <button type="button" onClick={() => setFormKey(`seg-${x.cliente.id}-${x.k}`)} className="mt-1.5 text-xs font-extrabold underline" style={ { color: "#001E62" } }>➕ Me dio un contacto</button>
              )
            )}
            </div>
          ))}

            {id === "comision" ? (
              <span className="text-xs" style={ { color: "#5A6680" } }>Siempre visible</span>
            ) : (
              <button type="button" onClick={() => alternarOculto(id)} style={ btn }>{oculto ? "Mostrar" : "Esconder"}</button>
            )}
          </div>
        )}
