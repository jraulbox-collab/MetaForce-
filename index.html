                    <td key={key} className="px-4 py-3">{renderCeldaCliente(c, key)}</td>
                  ))}
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    {c.actual && (
                      <button onClick={() => onMarcarPagada(c.id, c.actual.n)} className="text-xs font-medium mr-3" style={ { color: "#001E62" } }>{c.actual.n === 1 && c.f1_saldoPendiente ? "Saldo pagado" : "Marcar pagada"}</button>
                    )}
                    <button onClick={() => onEdit(c)} className="text-xs font-medium mr-3" style={ { color: "#0072CE" } }>Editar</button>
                    <button onClick={() => onDelete(c.id)} className="text-xs font-medium" style={ { color: "#B45309" } }>Eliminar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        </>
      )}

      {mostrarSelectorColumnas && (
        <SelectorColumnasModal
          orden={ordenColumnas}
          visibles={columnasVisibles}
          onToggle={(key) => setColumnasClientes((prev) => ({ ...prev, visibles: { ...prev.visibles, [key]: !prev.visibles[key] } }))}
          onMover={moverColumna}
          onClose={() => setMostrarSelectorColumnas(false)}
          chipsOrden={chipsOrdenWeb}
          chipsOcultos={chipsOcultosWeb}
          onToggleChip={(k) => guardarChipsWeb(chipsOrdenWeb, chipsOcultosWeb.includes(k) ? chipsOcultosWeb.filter((x) => x !== k) : [...chipsOcultosWeb, k])}
          onResetChips={() => guardarChipsWeb(CHIPS_WEB_BASE.map((x) => x[0]), [])}
        />
      )}

      {papeleraAbierta && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold">Clientes eliminados</h3>
              <button onClick={() => setPapeleraAbierta(false)} className="text-sm" style={ { color: "#5A6680" } }>✕</button>
            </div>
            {eliminados.length === 0 ? (
              <p className="text-sm" style={ { color: "#5A6680" } }>No hay clientes eliminados.</p>
            ) : (
              <div className="flex flex-col gap-2">
                {eliminados.map((c) => (
                  <div key={c.id} className="flex items-center justify-between rounded-md border p-3" style={ { borderColor: "#F0F0EF" } }>
                    <div>
                      <div className="text-sm font-medium">{c.nombre}</div>
                      <div className="text-xs font-mono" style={ { color: "#9CA3AF" } }>
                        {c.numeroSuscriptor} · eliminado el {fmtFecha((c.eliminadoEn || "").slice(0, 10))}
                      </div>
                    </div>
                    <button
                      onClick={() => onRecuperar(c.id)}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={ { background: "#001E62" } }
                    >
                      Recuperar
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
      </>
      )}
    </div>
  );
}

// Pegar el texto que Tigo da para la instalación: lo lee, muestra qué va a guardar y espera confirmación.
// Con "cliente" (ficha existente) solo agrega fecha, horario y datos extra; sin "cliente" (formulario
// de cliente nuevo) avisa si ese cliente ya existe y, si no, deja que el formulario se llene.
function PegarOrdenTigo({ cliente, clientes = [], onAplicar, onAbrirExistente, etiqueta = "Pegar texto de Tigo" }) {
  const [abierto, setAbierto] = useState(false);
  const [texto, setTexto] = useState("");
  const [datos, setDatos] = useState(null);
  const [franja, setFranja] = useState("");
  const [error, setError] = useState("");

  function cerrar() {
    setAbierto(false);
    setTexto("");
    setDatos(null);
    setFranja("");
    setError("");
  }
  function leer() {
    const d = leerOrdenInstalacionTigo(texto);
    if (!d.fecha) {
      setDatos(null);
      setError("No encontré la fecha de instalación. Pega el texto completo que da Tigo.");
      return;
    }
    setError("");
    setDatos(d);
    setFranja(d.franjas.length === 1 ? d.franjas[0] : "");
  }
  function aplicar() {
    if (!datos) return;
    if (datos.franjas.length > 1 && !franja) {
      setError("Elige el horario de instalación.");
      return;
    }
    onAplicar({ ...datos, franja: franja || "" });
    cerrar();
  }

  const existente = useMemo(() => {
    if (cliente || !datos) return null;
    const k = normalizarNombreOrden(datos.nombre);
    return (
      clientes.find(
        (c) =>
          (k && normalizarNombreOrden(c.nombre) === k) ||
          (datos.suscriptor && String(c.numeroSuscriptor || "").trim() === datos.suscriptor)
      ) || null
    );
  }, [cliente, datos, clientes]);

  const nombreDistinto = useMemo(() => {
    if (!cliente || !datos || !datos.nombre) return false;
    const k = normalizarNombreOrden(datos.nombre);
    if (!k) return false;
    return normalizarNombreOrden(cliente.nombre) !== k && !buscarClienteParecido(k, [cliente]);
  }, [cliente, datos]);

  if (!abierto) {
    return (
      <button
        type="button"
        onClick={() => setAbierto(true)}
        className="text-sm font-medium px-4 py-2.5 rounded-md border"
        style={ { borderColor: "#DFE5EF", color: "#374151", background: "#fff" } }
      >
        {etiqueta}
      </button>
    );
  }

  const antesProg = cliente && cliente.instalacionProgramada;
  const cambioFecha = !!(datos && antesProg && antesProg !== datos.fecha);
  const cambioHora = !!(datos && antesProg && franja && cliente.franjaInstalacion && cliente.franjaInstalacion !== franja);
  const fila = (nombre, valor) =>
    valor ? (
      <div className="flex justify-between gap-3 py-1 text-xs" style={ { borderTop: "1px solid #E3EDFA" } }>
        <span style={ { color: "#5A6680" } }>{nombre}</span>
        <span className="text-right" style={ { color: "#001E62" } }>{valor}</span>
      </div>
    ) : null;

  return (
    <div className="rounded-lg border p-3" style={ { borderColor: "#DFE5EF", background: "#F3F6FB" } }>
      {!datos && (
        <React.Fragment>
          <p className="text-xs mb-2" style={ { color: "#5A6680" } }>Pega aquí el texto de la instalación que da Tigo.</p>
          <textarea
            value={texto}
            onChange={(e) => { setTexto(e.target.value); setError(""); } }
            rows={6}
            className="w-full px-3 py-2 rounded-md border text-sm outline-none"
            style={ { borderColor: "#DFE5EF", background: "#fff" } }
          />
        </React.Fragment>
      )}
      {datos && (
        <div className="bg-white rounded-md p-3 mb-1" style={ { border: "1px solid #DFE5EF" } }>
          <div className="text-xs font-semibold mb-1" style={ { color: "#001E62" } }>Esto se va a guardar</div>
          {fila("Fecha de instalación", fmtFechaDia(datos.fecha))}
          {datos.franjas.length === 1 && fila("Horario", franjaCorta(datos.franjas[0]))}
          {datos.franjas.length === 0 && fila("Horario", "No venía en el texto")}
          {fila("Tecnología", datos.tecnologia)}
          {fila("Barrio", tituloEs(datos.barrio))}
          {fila("Número de cuenta", datos.cuenta)}
          {fila("Teléfonos de contacto", [datos.voz1, datos.voz2].filter(Boolean).join(" y "))}
          {fila("Correo", datos.correo)}
          {datos.franjas.length > 1 && (
            <div className="pt-2" style={ { borderTop: "1px solid #E3EDFA" } }>
              <div className="text-xs mb-1.5" style={ { color: "#5A6680" } }>Vinieron dos horarios. ¿Cuál es el de este cliente?</div>
              <div className="flex gap-2 flex-wrap">
                {datos.franjas.map((f) => (
                  <button
                    key={f}
                    type="button"
                    onClick={() => { setFranja(f); setError(""); } }
                    className="text-xs font-medium px-3 py-1.5 rounded-full border"
                    style={ franja === f ? { background: "#001E62", color: "#fff", borderColor: "#001E62" } : { background: "#fff", color: "#374151", borderColor: "#DFE5EF" } }
                  >
                    {franjaCorta(f)}
                  </button>
                ))}
              </div>
            </div>
          )}
          {(cambioFecha || cambioHora) && (
            <div className="text-xs mt-2 rounded-md px-2.5 py-2" style={ { background: "#FFF3DC", color: "#B45309" } }>
              Antes era {fmtFechaDia(antesProg)}{cliente.franjaInstalacion ? " · " + franjaCorta(cliente.franjaInstalacion) : ""}. Ahora será {fmtFechaDia(datos.fecha)}{franja ? " · " + franjaCorta(franja) : ""}.
            </div>
          )}
          {nombreDistinto && (
            <div className="text-xs mt-2 rounded-md px-2.5 py-2" style={ { background: "#FFF3DC", color: "#B45309" } }>
              El nombre del texto ({tituloEs(datos.nombre)}) no se parece al de esta ficha. Revisa que sea el cliente correcto.
            </div>
          )}
          {existente && (
            <div className="text-xs mt-2 rounded-md px-2.5 py-2" style={ { background: "#FFF3DC", color: "#B45309" } }>
              Este cliente ya está registrado como {existente.nombre}. Pega el texto desde su ficha para no duplicarlo.
            </div>
          )}
        </div>
      )}
      {error && <p className="text-xs mt-2" style={ { color: "#B45309" } }>{error}</p>}
      <div className="flex gap-2 mt-2">
        {!datos ? (
          <button
            type="button"
            onClick={leer}
            disabled={!texto.trim()}
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md text-white disabled:opacity-40"
            style={ { background: "#001E62" } }
          >
            Leer texto
          </button>
        ) : existente ? (
          <button
            type="button"
            onClick={() => { cerrar(); if (onAbrirExistente) onAbrirExistente(existente); } }
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md text-white"
            style={ { background: "#001E62" } }
          >
            Abrir su ficha
          </button>
        ) : (
          <button
            type="button"
            onClick={aplicar}
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md text-white"
            style={ { background: "#001E62" } }
          >
            {cliente ? "Guardar en la ficha" : "Usar en el formulario"}
          </button>
        )}
        {datos && (
          <button
            type="button"
            onClick={() => { setDatos(null); setFranja(""); setError(""); } }
            className="text-sm font-medium px-3 py-2 rounded-md border"
            style={ { borderColor: "#DFE5EF", color: "#374151", background: "#fff" } }
          >
            Cambiar texto
          </button>
        )}
        <button
          type="button"
          onClick={cerrar}
          className="text-sm font-medium px-3 py-2 rounded-md border"
          style={ { borderColor: "#DFE5EF", color: "#374151", background: "#fff" } }
        >
          Cancelar
        </button>
      </div>
    </div>
  );
}

// Bloque "Instalación" de la ficha de un cliente Hogar pendiente: fecha y horario programados,
// pegar el texto de Tigo y el mensaje listo para copiar y enviarle al cliente.
function BloqueInstalacionProgramada({ cliente, onGuardarOrden, onCopiarMensaje, copiado, onMarcarInstalado, onMarcarAbono, onEnviarInfo, onMarcarEnviada }) {
  const prog = cliente.instalacionProgramada;
  const vencida = !!prog && prog < fechaLocalISO(new Date());
  const hoyISO = fechaLocalISO(new Date());
  const [fechaInst, setFechaInst] = useState(null); // null = cerrado; si no, la fecha elegida para marcarlo instalado
  const [verMas, setVerMas] = useState(false);
  const abonoRecibido = cliente.abonoInicial !== false;
  const marcada = cliente.abonoFecha ? new Date(cliente.abonoFecha) : null;
  const tieneTel = !!String(cliente.telefono || "").replace(/\D/g, "");
  const enviadaEn = cliente.instalacionEnviadaEn ? new Date(cliente.instalacionEnviadaEn) : null;
  const enviada = !!enviadaEn && !isNaN(enviadaEn.getTime());
  const horaEnv = enviada ? enviadaEn.toLocaleTimeString("es-PA", { hour: "numeric", minute: "2-digit" }) : "";
  return (
    <div className="bg-white rounded-lg border border-gray-200 shadow-sm px-4 py-3 mb-3">
      <div className="flex items-center justify-between gap-2">
        <h2 className="text-sm font-semibold" style={ { color: "#001E62" } }>Instalación</h2>
        <span
          className="text-xs font-medium px-2.5 py-0.5 rounded-full whitespace-nowrap"
          style={ vencida ? { color: "#B91C1C", background: "#FDECEC" } : { color: "#B45309", background: "#FFF3DC" } }
        >
          {vencida ? "Vencida, sin confirmar" : "Pendiente de instalación"}
        </span>
      </div>
      {prog ? (
        <p className="text-sm mt-1.5" style={ { color: "#374151" } }>
          Programada: <strong>{fmtFechaDia(prog)}</strong>{cliente.franjaInstalacion ? " · " + franjaCorta(cliente.franjaInstalacion) : ""}
        </p>
      ) : (
        <p className="text-xs mt-1.5 mb-2" style={ { color: "#5A6680" } }>Todavía sin fecha. Pega el texto de Tigo para cargarla.</p>
      )}
      {!prog && <PegarOrdenTigo cliente={cliente} onAplicar={(d) => onGuardarOrden(cliente.id, d)} etiqueta="Pegar texto de Tigo" />}
      {onMarcarAbono && abonoRecibido && (
        <div className="flex items-center justify-between gap-2 mt-2" style={ { minHeight: 32 } }>
          <span className="text-[13px] font-semibold" style={ { color: "#001E62" } }>
            ✓ Abono recibido{marcada && !isNaN(marcada.getTime()) ? " · " + fmtFechaDia(fechaLocalISO(marcada)) : ""}
          </span>
          <button type="button" onClick={() => onMarcarAbono(cliente.id, false)} className="text-xs font-bold underline px-1" style={ { color: "#0072CE", minHeight: 32 } }>Quitar</button>
        </div>
      )}
      {prog && tieneTel && enviada && onMarcarEnviada && (
        <div className="flex items-center justify-between gap-2 mt-1" style={ { minHeight: 32 } }>
          <span className="text-[13px] font-semibold" style={ { color: "#001E62" } }>
            ✓ Info de instalación enviada · {fmtFechaDia(fechaLocalISO(enviadaEn))}, {horaEnv}
          </span>
          <button type="button" onClick={() => onMarcarEnviada(cliente.id, false)} className="text-xs font-bold underline px-1" style={ { color: "#0072CE", minHeight: 32 } }>Quitar</button>
        </div>
      )}
      {prog && tieneTel && !enviada && onEnviarInfo && (
        <div className="mt-2.5 rounded-lg p-3" style={ { background: "#FFF6E3", border: "1px solid #F0D9AE" } }>
          <div className="text-[13px] font-bold" style={ { color: "#B45309" } }>! Falta enviarle la info de instalación</div>
          <button
            type="button"
            onClick={() => onEnviarInfo(cliente)}
            className="w-full mt-2 text-sm font-bold rounded-md text-white"
            style={ { minHeight: 48, background: "#128C4A" } }
          >
            💬 Enviar info por WhatsApp
          </button>
          <div className="flex gap-2 mt-2">
            <button type="button" onClick={() => onCopiarMensaje(cliente)} className="flex-1 text-xs font-bold rounded-md" style={ { minHeight: 44, border: "1.5px solid #001E62", color: "#001E62", background: "#fff" } }>
              {copiado ? "Copiado ✓" : "Copiar mensaje"}
            </button>
            {onMarcarEnviada && (
              <button type="button" onClick={() => onMarcarEnviada(cliente.id, true)} className="flex-1 text-xs font-bold rounded-md" style={ { minHeight: 44, border: "1.5px solid #001E62", color: "#001E62", background: "#fff" } }>
                Ya se lo envié
              </button>
            )}
          </div>
        </div>
      )}
      {onMarcarInstalado && fechaInst === null && (
        <div className="flex gap-2 mt-2.5">
          <button
            type="button"
            onClick={() => setFechaInst(hoyISO)}
            className="flex-1 text-sm font-bold rounded-md"
            style={ { minHeight: 44, border: "2px solid #001E62", color: "#001E62", background: "white" } }
          >
            ✓ Ya instalado
          </button>
          {prog && (
            <button
              type="button"
              onClick={() => setVerMas(!verMas)}
              aria-expanded={verMas}
              className="text-sm font-semibold rounded-md px-4"
              style={ { minHeight: 44, border: "1px solid #DFE5EF", color: "#374151", background: "white" } }
            >
              Más {verMas ? "▴" : "▾"}
            </button>
          )}
        </div>
      )}
      {prog && tieneTel && enviada && fechaInst === null && (
        <a
          href={`https://wa.me/${telefonoWhatsapp(cliente.telefono)}`}
          className="flex items-center justify-center gap-2 w-full mt-2.5 text-sm font-bold rounded-md text-white"
          style={ { minHeight: 48, background: "#128C4A", textDecoration: "none" } }
        >
          💬 Abrir chat con el cliente
        </a>
      )}
      {onMarcarInstalado && fechaInst !== null && (
        <div className="mt-2.5 rounded-lg p-3" style={ { background: "#F3F6FB" } }>
          <label className="block text-xs font-semibold mb-1.5" style={ { color: "#001E62" } }>¿Qué día se instaló?</label>
          <input
            type="date"
            value={fechaInst}
            max={hoyISO}
            onChange={(e) => setFechaInst(e.target.value)}
            className="w-full rounded-md px-2.5 text-sm"
            style={ { background: "#fff", color: "#001E62", border: "1px solid #C9D3E6", height: 42 } }
          />
          <div className="flex gap-2 mt-2.5">
            <button
              type="button"
              disabled={!fechaInst}
              onClick={() => { onMarcarInstalado(cliente.id, fechaInst); setFechaInst(null); } }
              className="flex-1 text-sm font-bold rounded-md text-white"
              style={ { minHeight: 46, background: "#001E62", opacity: fechaInst ? 1 : 0.5 } }
            >
              Sí, marcar instalado
            </button>
            <button
              type="button"
              onClick={() => setFechaInst(null)}
              className="text-sm font-semibold rounded-md px-4"
              style={ { minHeight: 46, border: "1.5px solid #001E62", color: "#001E62", background: "white" } }
            >
              Cancelar
            </button>
          </div>
        </div>
      )}
      {prog && verMas && (
        <div className="mt-3 pt-3" style={ { borderTop: "1px solid #EEF2F9" } }>
          <PegarOrdenTigo cliente={cliente} onAplicar={(d) => onGuardarOrden(cliente.id, d)} etiqueta="Pegar otro texto de Tigo" />
          {enviada && (
            <div className="flex gap-2 mt-2.5">
              <button
                type="button"
                onClick={() => onCopiarMensaje(cliente)}
                className="flex-1 text-sm font-medium px-3 py-2.5 rounded-md"
                style={ { border: "1.5px solid #001E62", color: "#001E62", background: "#fff", minHeight: 44 } }
              >
                {copiado ? "Copiado ✓" : "Copiar mensaje"}
              </button>
              {onEnviarInfo && (
                <button
                  type="button"
                  onClick={() => onEnviarInfo(cliente)}
                  className="flex-1 text-sm font-medium px-3 py-2.5 rounded-md"
                  style={ { border: "1.5px solid #001E62", color: "#001E62", background: "#fff", minHeight: 44 } }
                >
                  Reenviar mensaje
                </button>
              )}
            </div>
          )}
          {!tieneTel && (
            <div className="text-xs text-center px-3 py-2.5 rounded-md mt-2.5" style={ { background: "#F3F6FB", color: "#5A6680" } }>
              Sin WhatsApp en la ficha
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ClienteDetalle({
  cliente,
  onVolver,
  volverLabel,
  onEditar,
  onMarcarPagada,
  onActualizarEstadoFactura,
  onCopiarMensaje,
  copiedKey,
  onMarcarEnviado,
  onCopiarSuscriptor,
  copiedSubKey,
  periodoActual,
  onCancelar,
  onDescancelar,
  onPenalizar,
  historialCambios,
  onGuardarOrden,
  onCopiarMensajeInstalacion,
  onEnviarInfoInstalacion,
  onMarcarInstalacionEnviada,
  onMarcarAbono,
  onMarcarInstalado,
}) {
  const [mostrarPenalizar, setMostrarPenalizar] = useState(false);
  const [motivoPenal, setMotivoPenal] = useState("");
  const [mostrarCancelar, setMostrarCancelar] = useState(false);
  const [fechaCancel, setFechaCancel] = useState(() => fechaLocalISO(new Date()));
  const [motivoCancel, setMotivoCancel] = useState("voluntaria");
  const [verObs, setVerObs] = useState(false);
  const [menuAcciones, setMenuAcciones] = useState(false);

  if (!cliente) {
    return (
      <div className="max-w-2xl">
        <button onClick={onVolver} className="text-xs font-medium mb-4" style={ { color: "#0072CE" } }>
          {volverLabel || "← Volver a Clientes"}
        </button>
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-10 text-center">
          <p className="text-sm" style={ { color: "#5A6680" } }>No se encontró el cliente (puede haber sido eliminado).</p>
        </div>
      </div>
    );
  }

  const cicloLabel = (CICLOS.find((c) => c.value === cliente.cicloFacturacion) || {}).label || "—";
  const riesgo = estadoRiesgoChurn(cliente, periodoActual);
  const mostrarInst = !cliente.fechaInstalacion && !cliente.cancelado && !cliente.penalizado && !!onGuardarOrden;

  return (
    <div className="max-w-2xl">
      <button onClick={onVolver} className="text-xs font-medium mb-4" style={ { color: "#0072CE" } }>
        {volverLabel || "← Volver a Clientes"}
      </button>

      <div className="flex items-center justify-between mb-1">
        <h1 className="text-2xl font-semibold">{cliente.nombre}</h1>
        <div className="flex items-center gap-1.5 shrink-0">
          <button
            onClick={() => onEditar(cliente)}
            className="text-sm font-medium px-4 py-2 rounded-md border"
            style={ { borderColor: "#DFE5EF", color: "#374151" } }
          >
            Editar cliente
          </button>
          {(!cliente.penalizado || !cliente.cancelado) && (
            <button
              type="button"
              onClick={() => setMenuAcciones(!menuAcciones)}
              aria-label="Más acciones"

// Búsqueda compartida Hogar + Móvil: coincidencia de un Cliente Móvil con el texto buscado.
function movilCoincideBusqueda(c, q) {
  if (!q) return true;
  return String(c.nombre || "").toLowerCase().includes(q) || String(c.telefono || "").includes(q) || String(c.whatsapp || "").includes(q);
}

// Bloque compacto con las coincidencias de la OTRA lista (Hogar o Móvil) bajo el buscador.
function BloqueOtraLista({ icono, titulo, filas, onAbrir }) {
  if (!filas || filas.length === 0) return null;
  return (
    <div className="bg-white rounded-lg border mb-3 overflow-hidden" style={ { borderColor: "#DFE5EF" } }>
      <div className="px-3 py-2 text-xs font-semibold" style={ { color: "#001E62", background: "#F3F6FB" } }>
        {icono} También en {titulo} ({filas.length})
      </div>
      {filas.map((f) => (
        <button
          key={f.id}
          type="button"
          onClick={() => onAbrir(f.ref)}
          className="w-full text-left px-3 py-2 border-t flex items-center justify-between gap-2"
          style={ { borderColor: "#F0F0EF" } }
        >
          <span className="min-w-0">
            <span className="block text-sm font-medium truncate" style={ { color: "#001E62" } }>{f.nombre}</span>
            {f.sub && <span className="block text-xs truncate" style={ { color: "#5A6680" } }>{f.sub}</span>}
          </span>
          <span style={ { color: "#9CA3AF" } }>›</span>
        </button>
      ))}
    </div>
  );
}

// Filtros rápidos de la pestaña Móvil. Los de factura solo aplican a períodos del esquema nuevo
// (antes no se llevaba el pago de la 1ra factura de los móviles).
function pasaChipMovil(c, chip) {
  if (chip === "todos") return true;
  if (chip === "portabilidad") return !!c.esPortabilidad;
  if (chip === "matchPendiente") return !!matchInfo(c);
  if (!esquemaNuevo(periodoDelMovil(c))) return false;
  const pagada = c.f1_estado === "pagada";
  if (chip === "pagadas") return pagada;
  if (chip === "sinPagar") return !pagada && movilCuentaParaComision(c);
  if (chip === "noCuenta") return !movilCuentaParaComision(c);
  return true;
}

function ClientesMovilPanel({ clientesMovil, onAgregar, onEditar, onEliminar, mesActivo, abrirForm, onFormAbierto, prefill, onVolverAPrecierre, metas, search, setSearch, hogarCoincidencias, onVerDetalleHogar, chipInicial, onChipAplicado }) {
  const [chipMovil, setChipMovil] = useState(chipInicial || "todos");
  useEffect(() => {
    if (chipInicial) { setChipMovil(chipInicial); if (onChipAplicado) onChipAplicado(); }
  }, [chipInicial]);
  // El texto de búsqueda es el mismo que el de Hogar (viene de App); si no llega, queda local.
  const [busquedaLocal, setBusquedaLocal] = useState("");
  const busquedaMovil = search !== undefined ? search : busquedaLocal;
  const setBusquedaMovil = setSearch || setBusquedaLocal;
  const [confirmarEliminarMovil, setConfirmarEliminarMovil] = useState(null);
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [tipo, setTipo] = useState("pospago");
  const [montoPlan, setMontoPlan] = useState("");
  const [fechaActivacion, setFechaActivacion] = useState(() => fechaLocalISO(new Date()));
  const [esPortabilidad, setEsPortabilidad] = useState(false);
  const [f1Pagada, setF1Pagada] = useState(false);
  const [cicloManual, setCicloManual] = useState("");
  const [cicloDesbloqueado, setCicloDesbloqueado] = useState(false);
  const [datosExtra, setDatosExtra] = useState({});
  const [pegarAbierto, setPegarAbierto] = useState(false);
  const [textoPegado, setTextoPegado] = useState("");
  const [lecturaTigo, setLecturaTigo] = useState(null);
  const [errorPegado, setErrorPegado] = useState("");
  const setExtra = (k, v) => setDatosExtra((prev) => ({ ...prev, [k]: v }));
  function leerTextoPegado() {
    const d = leerOrdenMovilTigo(textoPegado);
    if (!d.telefono && !d.nombre) {
      setLecturaTigo(null);
      setErrorPegado("No encontré datos del cliente. Pega el texto completo de la orden de Tigo.");
      return;
    }
    setErrorPegado("");
    setLecturaTigo(d);
  }
  function aplicarLecturaTigo() {
    const d = lecturaTigo;
    if (!d) return;
    if (d.nombre) setNombre(d.nombre);
    if (d.telefono) setTelefono(d.telefono);
    if (d.montoPlan != null) setMontoPlan(String(d.montoPlan));
    if (d.tipo) setTipo(d.tipo);
    if (d.esPortabilidad !== undefined) setEsPortabilidad(!!d.esPortabilidad);
    const nuevo = {};
    DATOS_EXTRA_MOVIL.forEach((k) => { if (d[k] !== undefined && d[k] !== "") nuevo[k] = d[k]; });
    if (d.tipo === "matchdigital") nuevo.matchFecha = fechaLocalISO(new Date());
    setDatosExtra((prev) => ({ ...prev, ...nuevo }));
    setLecturaTigo(null);
    setTextoPegado("");
    setPegarAbierto(false);
  }
  const [lineaCopiada, setLineaCopiada] = useState(null);
  function copiarLinea(clave, numero) {
    const limpio = String(numero || "").replace(/\D/g, "");
    if (!limpio) return;
    try { navigator.clipboard?.writeText(limpio).catch(() => {}); } catch (e) { /* sin portapapeles */ }
    setLineaCopiada(clave);
    setTimeout(() => setLineaCopiada((k) => (k === clave ? null : k)), 1500);
  }
  const [editingId, setEditingId] = useState(null);
  const [formAbierto, setFormAbierto] = useState(!!abrirForm);
  // El mes se elige arriba, en la fila compartida con Hogar (mesActivo). Aquí solo se muestra ese mes.
  const mesVisto = mesActivo || periodoComision(fechaLocalISO(new Date()));
  const meses = useMemo(() => periodosRecientes(4), []);
  const formRef = useRef(null);
  const nombreRef = useRef(null);
  // true cuando el formulario se abrió desde "Verificar órdenes": al guardar vuelve al Precierre.
  const vieneDePrecierre = useRef(false);
  const destinoVolver = useRef("precierre");

  // El formulario viene minimizado: solo se abre desde el botón flotante (+) o al editar un cliente.
  useEffect(() => {
    if (abrirForm) {
      const aEditar = prefill && prefill.editarId ? clientesMovil.find((x) => x.id === prefill.editarId) : null;
      if (aEditar) {
        setNombre(aEditar.nombre);
        setTelefono(aEditar.telefono);
        setWhatsapp(aEditar.whatsapp || "");
        setTipo(tipoClienteMovil(aEditar));
        setMontoPlan(aEditar.montoPlan != null ? String(aEditar.montoPlan) : "");
        setFechaActivacion(fechaActivacionMovil(aEditar) || fechaLocalISO(new Date()));
        setEsPortabilidad(!!aEditar.esPortabilidad);
        setF1Pagada(aEditar.f1_estado === "pagada");
        setCicloManual(aEditar.cicloManual ? String(aEditar.cicloManual) : "");
        setCicloDesbloqueado(!!aEditar.cicloManual);
        setDatosExtra(datosExtraDe(aEditar));
        setEditingId(aEditar.id);
        vieneDePrecierre.current = true;
        destinoVolver.current = prefill.volverA || "precierre";
      } else if (prefill) {
        setEditingId(null);
        setNombre(prefill.nombre || "");
        setTelefono("");
        setWhatsapp("");
        setTipo("pospago");
        setMontoPlan("");
        setFechaActivacion(prefill.fecha || fechaLocalISO(new Date()));
        setEsPortabilidad(false);
        setF1Pagada(false);
        setCicloManual("");
        setCicloDesbloqueado(false);
        setDatosExtra({});
        vieneDePrecierre.current = true;
        destinoVolver.current = "precierre";
      }
      setFormAbierto(true);
      if (onFormAbierto) onFormAbierto();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [abrirForm]);

  useEffect(() => {
    if (!formAbierto) return;
    const t = setTimeout(() => {
      if (nombreRef.current) nombreRef.current.focus({ preventScroll: true });
    }, 50);
    return () => clearTimeout(t);
  }, [formAbierto, editingId]);

  function limpiarForm() {
    vieneDePrecierre.current = false;
    setNombre("");
    setTelefono("");
    setWhatsapp("");
    setTipo("pospago");
    setMontoPlan("");
    setFechaActivacion(fechaLocalISO(new Date()));
    setEsPortabilidad(false);
    setF1Pagada(false);
    setCicloManual("");
    setCicloDesbloqueado(false);
    setDatosExtra({});
    setPegarAbierto(false);
    setTextoPegado("");
    setLecturaTigo(null);
    setErrorPegado("");
    setEditingId(null);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!nombre.trim() || !telefono.trim()) return;
    const volver = vieneDePrecierre.current;
    const cicloManualEfectivo = cicloDesbloqueado && cicloManual && Number(cicloManual) !== cicloAuto ? cicloManual : "";
    const editando = editingId ? clientesMovil.find((x) => x.id === editingId) : null;
    if (editingId) {
      onEditar(editingId, {
        nombre: nombre.trim(),
        telefono: telefono.trim(),
        whatsapp: whatsapp.trim(),
        tipo,
        montoPlan: montoPlan ? Number(montoPlan) || 0 : null,
        fechaActivacion,
        esPortabilidad,
        cicloManual: cicloManualEfectivo ? Number(cicloManualEfectivo) : null,
        ...datosExtra,
        ...fijarFactura(editando, f1Pagada),
      });
    } else {
      onAgregar(nombre.trim(), telefono.trim(), tipo, montoPlan, fechaActivacion, {
        whatsapp: whatsapp.trim(),
        esPortabilidad,
        cicloManual: cicloManualEfectivo ? Number(cicloManualEfectivo) : null,
        f1_estado: f1Pagada ? "pagada" : "",
        datos: datosExtra,
      });
    }
    limpiarForm();
    setFormAbierto(false);
    if (volver && onVolverAPrecierre) onVolverAPrecierre(destinoVolver.current);
  }

  function startEdit(c) {
    vieneDePrecierre.current = false;
    setNombre(c.nombre);
    setTelefono(c.telefono);
    setWhatsapp(c.whatsapp || "");
    setTipo(tipoClienteMovil(c));
    setMontoPlan(c.montoPlan != null ? String(c.montoPlan) : "");
    setFechaActivacion(fechaActivacionMovil(c) || fechaLocalISO(new Date()));
    setEsPortabilidad(!!c.esPortabilidad);
    setF1Pagada(c.f1_estado === "pagada");
    setCicloManual(c.cicloManual ? String(c.cicloManual) : "");
    setCicloDesbloqueado(!!c.cicloManual);
    setDatosExtra(datosExtraDe(c));
    setEditingId(c.id);
    setFormAbierto(true);
  }

  // Campos de 1ra factura a guardar al editar: conserva la fecha en que se marcó pagada
  // y la limpia si se desmarca.
  function fijarFactura(cliente, pagada) {
    const estabaPagada = !!cliente && cliente.f1_estado === "pagada";
    if (pagada) return { f1_estado: "pagada", f1_pagadaEn: estabaPagada && cliente.f1_pagadaEn ? cliente.f1_pagadaEn : new Date().toISOString() };
    return { f1_estado: "", f1_pagadaEn: null };
  }

  function cancelEdit() {
    const volver = vieneDePrecierre.current && destinoVolver.current !== "precierre";
    limpiarForm();
    setFormAbierto(false);
    if (volver && onVolverAPrecierre) onVolverAPrecierre(destinoVolver.current);
  }

  // Costos de plan más usados entre tus clientes Móvil: primero del mismo tipo de cliente
  // (si hay al menos 2), y si no, de todos.
  const montosSugeridosMovil = useMemo(() => {
    const contar = (lista) => {
      const conteo = new Map();
      lista.forEach((c) => {
        const m = Number(c.montoPlan);
        if (!m) return;
        conteo.set(m, (conteo.get(m) || 0) + 1);
      });
      return [...conteo.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([monto]) => monto);
    };
    const mismoTipo = (clientesMovil || []).filter((c) => tipoClienteMovil(c) === tipo);
    const delTipo = contar(mismoTipo);
    return mismoTipo.length >= 2 && delTipo.length > 0 ? delTipo : contar(clientesMovil || []);
  }, [clientesMovil, tipo]);
  const cicloAuto = (movilFechasPrimeraFactura({ fechaActivacion }) || {}).ciclo || null;
  const cicloMostrado = cicloDesbloqueado && cicloManual ? Number(cicloManual) : cicloAuto;
  const campoCls = "w-full px-3 py-2.5 sm:py-2 rounded-md border text-base sm:text-sm outline-none";
  const etiquetaCls = "text-xs font-medium block mb-1";

  return (
    <div>
      {formAbierto && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
        <div ref={formRef} className="bg-white rounded-lg shadow-lg p-4 sm:p-6 w-full max-w-lg max-h-full overflow-y-auto">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-base font-semibold">{editingId ? "Editar Cliente Móvil" : "Nuevo Cliente Móvil"}</h2>
            <button
              type="button"
              onClick={cancelEdit}
              className="text-lg leading-none w-9 h-9 flex items-center justify-center rounded-md"
              style={ { color: "#5A6680" } }
              aria-label="Cerrar formulario"
            >
              ✕
            </button>
          </div>
          <form onSubmit={handleSubmit} className="grid grid-cols-2 gap-3">
            <div className="col-span-2 rounded-md" style={ { background: "#F3F6FB" } }>
              {!pegarAbierto ? (
                <button
                  type="button"
                  onClick={() => setPegarAbierto(true)}
                  className="w-full text-sm font-bold px-3 py-2.5 text-left"
                  style={ { color: "#001E62", minHeight: 40 } }
                >
                  📋 Pegar texto de Tigo
                </button>
              ) : (
                <div className="p-3 flex flex-col gap-2">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-bold" style={ { color: "#001E62" } }>Pegar texto de Tigo</span>
                    <button type="button" onClick={() => { setPegarAbierto(false); setLecturaTigo(null); setErrorPegado(""); } } className="text-sm" style={ { color: "#5A6680" } } aria-label="Cerrar">✕</button>
                  </div>
                  {!lecturaTigo && (
                    <>
                      <textarea
                        value={textoPegado}
                        onChange={(e) => setTextoPegado(e.target.value)}
                        rows={5}
                        placeholder="Pega aquí todo el texto de la orden (Información del Cliente…)"
                        className={campoCls}
                        style={ { borderColor: "#DFE5EF", fontSize: 14 } }
                      />
                      {errorPegado && <div className="text-xs font-semibold" style={ { color: "#B45309" } }>⚠ {errorPegado}</div>}
                      <button
                        type="button"
                        onClick={leerTextoPegado}
                        disabled={!textoPegado.trim()}
                        className="text-sm font-bold px-4 py-2.5 rounded-md text-white disabled:opacity-40"
                        style={ { background: "#001E62", minHeight: 40 } }
                      >
                        Leer texto
                      </button>
                    </>
                  )}
                  {lecturaTigo && (
                    <>
                      {(lecturaTigo.avisos || []).map((a, i) => (
                        <div key={i} className="rounded-md p-2.5 text-sm font-bold" style={ { background: "#FFF3DC", color: "#7A3E00", border: "1.5px solid #B45309" } }>⚠ {a}</div>
                      ))}
                      <div className="text-xs font-bold" style={ { color: "#5A6680" } }>Esto voy a guardar:</div>
                      <div className="rounded-md p-2.5 text-sm flex flex-col gap-1 bg-white" style={ { border: "1px solid #DFE5EF" } }>
                        {[
                          ["Cliente", lecturaTigo.nombre],
                          ["Celular", lecturaTigo.telefono],
                          ["Teléfono adicional", lecturaTigo.telefonoAdicional],
                          ["Correo", lecturaTigo.correo],
                          ["Zona", [lecturaTigo.barrio, lecturaTigo.corregimiento].filter(Boolean).join(" · ")],
                          ["Plan", lecturaTigo.planNombre],
                          ["Cobra el cliente", lecturaTigo.montoPlan != null ? fmtMonto(lecturaTigo.montoPlan) + (lecturaTigo.precioLista ? " (lista " + fmtMonto(lecturaTigo.precioLista) + ")" : "") : ""],
                          ["Tipo de venta", lecturaTigo.tipoVenta],
                          ["Portabilidad", lecturaTigo.esPortabilidad === undefined ? "" : lecturaTigo.esPortabilidad ? "Sí" : "No"],
                          ["Tipo de cliente", lecturaTigo.tipo === "matchdigital" ? "Match Digital" : ""],
                          ["Titular del Hogar", lecturaTigo.titularTelefono ? [lecturaTigo.titularTelefono, lecturaTigo.titularCorreo].filter(Boolean).join(" · ") : ""],
                          ["Estado del match", lecturaTigo.estadoMatchTexto],
                          ["Estado de la orden", lecturaTigo.estadoOrden],
                        ].filter(([, v]) => v).map(([k, v]) => (
                          <div key={k} className="flex gap-2"><span className="shrink-0" style={ { color: "#5A6680", minWidth: 110 } }>{k}</span><span className="font-semibold break-all">{v}</span></div>
                        ))}
                      </div>
                      <div className="flex gap-2">
                        <button type="button" onClick={aplicarLecturaTigo} className="flex-1 text-sm font-bold px-4 py-2.5 rounded-md text-white" style={ { background: "#001E62", minHeight: 40 } }>Usar estos datos</button>
                        <button type="button" onClick={() => setLecturaTigo(null)} className="text-sm font-medium px-4 py-2.5 rounded-md border" style={ { borderColor: "#DFE5EF", minHeight: 40 } }>Volver</button>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
            <div className="col-span-2">
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Nombre</label>
              <input
                ref={nombreRef}
                required
                value={nombre}
                onChange={(e) => setNombre(e.target.value)}
                className={campoCls}
                style={ { borderColor: "#DFE5EF" } }
              />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Número de celular</label>
              <input
                required
                type="tel"
                inputMode="tel"
                value={telefono}
                onChange={(e) => setTelefono(e.target.value)}

              />
              {telefono.trim() && (
                <div

                  style={ { minHeight: 40, background: lineaCopiada === "form" ? "#E3F5EA" : "#FFFFFF", color: lineaCopiada === "form" ? "#0F5A2B" : "#0B4A99", border: "2px solid " + (lineaCopiada === "form" ? "#7CC79A" : "#0B4A99") } }
                >
                  {lineaCopiada === "form" ? "Copiado ✓" : "Copiar número"}
                </div>
              )}
            </div>
            <div className="col-span-2">
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>WhatsApp (solo si es distinto al celular)</label>
              <input
                type="tel"
                inputMode="tel"
                value={whatsapp}
                onChange={(e) => setWhatsapp(e.target.value)}
                placeholder="Déjalo vacío para usar el mismo"
                className={campoCls}
                style={ { borderColor: "#DFE5EF" } }
              />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Teléfono adicional</label>
              <input type="tel" inputMode="tel" value={datosExtra.telefonoAdicional || ""} onChange={(e) => setExtra("telefonoAdicional", e.target.value)} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Correo</label>
              <input type="email" value={datosExtra.correo || ""} onChange={(e) => setExtra("correo", e.target.value)} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Barrio</label>
              <input value={datosExtra.barrio || ""} onChange={(e) => setExtra("barrio", e.target.value.toUpperCase())} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Corregimiento</label>
              <input value={datosExtra.corregimiento || ""} onChange={(e) => setExtra("corregimiento", e.target.value.toUpperCase())} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Tipo</label>
              <select
                value={tipo}
                onChange={(e) => setTipo(e.target.value)}
                className={campoCls + " bg-white"}
                style={ { borderColor: "#DFE5EF" } }
              >
                {TIPOS_CLIENTE_MOVIL.filter((t) => t.value !== "fulltigo" || tipo === "fulltigo").map((t) => (
                  <option key={t.value} value={t.value}>{t.label}</option>
                ))}
              </select>
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Costo del plan móvil</label>
              <input
                type="number"
                inputMode="decimal"
                step="0.01"
                min="0"
                value={montoPlan}
                onChange={(e) => setMontoPlan(e.target.value)}
                placeholder="$0.00"
                className={campoCls}
                style={ { borderColor: "#DFE5EF" } }
              />
            </div>
            {montosSugeridosMovil.length > 0 && (
              <div className="col-span-2 flex flex-wrap items-center gap-2">
                <span className="text-xs" style={ { color: "#5A6680" } }>Sugeridos:</span>
                {montosSugeridosMovil.map((m) => (
                  <button
                    key={m}
                    type="button"
                    onClick={() => setMontoPlan(String(m))}
                    className="text-xs font-semibold px-3 py-1.5 rounded-full border"
                    style={
                      Number(montoPlan) === m
                        ? { background: "#001E62", color: "#fff", borderColor: "#001E62" }
                        : { background: "#F3F6FB", color: "#1F2937", borderColor: "#C9D2E3" }
                    }
                  >
                    {fmtMonto(m)}
                  </button>
                ))}
              </div>
            )}
            {tipo === "matchdigital" && (
              <div className="col-span-2 rounded-md p-3 grid grid-cols-2 gap-3" style={ { background: "#F3F6FB", border: "1px solid #C9D2E3" } }>
                <div className="col-span-2 text-sm font-bold" style={ { color: "#001E62" } }>Titular del Hogar (comparte el beneficio)</div>
                <div>
                  <label className={etiquetaCls} style={ { color: "#5A6680" } }>Teléfono del titular</label>
                  <input type="tel" inputMode="tel" value={datosExtra.titularTelefono || ""} onChange={(e) => setExtra("titularTelefono", e.target.value)} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
                </div>
                <div>
                  <label className={etiquetaCls} style={ { color: "#5A6680" } }>Correo del titular</label>
                  <input type="email" value={datosExtra.titularCorreo || ""} onChange={(e) => setExtra("titularCorreo", e.target.value)} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
                </div>
                <div className="col-span-2">
                  <label className={etiquetaCls} style={ { color: "#5A6680" } }>Cédula del titular (solo informativa)</label>
                  <input value={datosExtra.titularCedula || ""} onChange={(e) => setExtra("titularCedula", e.target.value)} className={campoCls} style={ { borderColor: "#DFE5EF" } } />
                </div>
                <label className="col-span-2 flex items-center gap-2 text-sm cursor-pointer">
                  <input type="checkbox" checked={!!datosExtra.matchConfirmado} onChange={(e) => setExtra("matchConfirmado", e.target.checked)} className="w-4 h-4" />
                  <span>✓ El titular ya confirmó el match <span className="text-xs" style={ { color: "#5A6680" } }>(tiene 5 días desde la orden)</span></span>
                </label>
              </div>
            )}
            {(datosExtra.planNombre || datosExtra.estadoOrden) && (
              <div className="col-span-2 text-xs" style={ { color: "#5A6680" } }>
                {[datosExtra.planNombre, datosExtra.estadoOrden ? "Orden: " + datosExtra.estadoOrden : ""].filter(Boolean).join(" · ")}
              </div>
            )}
            <div>
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Fecha de activación</label>
              <input
                type="date"
                value={fechaActivacion}
                onChange={(e) => setFechaActivacion(e.target.value)}
                className={campoCls}
                style={ { borderColor: "#DFE5EF" } }
              />
            </div>
            <div className="col-span-2">
              <label className={etiquetaCls} style={ { color: "#5A6680" } }>Ciclo de facturación</label>
              {cicloDesbloqueado ? (
                <div className="flex items-center gap-3 flex-wrap">
                  <select
                    value={cicloManual || String(cicloAuto || "")}
                    onChange={(e) => setCicloManual(e.target.value)}
                    className={campoCls}
                    style={ { borderColor: "#DFE5EF", maxWidth: 220 } }
                  >
                    <option value="4">Ciclo 04</option>
                    <option value="19">Ciclo 19</option>
                  </select>
                  <span
                    role="button"
                    tabIndex={0}
                    onClick={() => { setCicloManual(""); setCicloDesbloqueado(false); }}
                    className="text-sm font-semibold underline cursor-pointer"
                    style={ { color: "#0B4A99" } }
                  >
                    Volver a automático
                  </span>
                </div>
              ) : (
                <div className="flex items-center gap-3 flex-wrap">
                  <div className="px-3 py-2.5 sm:py-2 rounded-md border text-base sm:text-sm font-semibold" style={ { borderColor: "#DFE5EF", background: "#F3F6FB", color: "#1F2937", minWidth: 220 } }>
                    🔒 Ciclo {cicloAuto ? String(cicloAuto).padStart(2, "0") : "—"} <span className="font-normal" style={ { color: "#5A6680" } }>(automático)</span>
                  </div>
                  <span
                    role="button"
                    tabIndex={0}
                    onClick={() => { setCicloManual(String(cicloAuto || 19)); setCicloDesbloqueado(true); }}
                    className="text-sm font-semibold underline cursor-pointer"
                    style={ { color: "#0B4A99" } }
                  >
                    Cambiar
                  </span>
                </div>
              )}
              <div className="text-xs mt-1" style={ { color: "#5A6680" } }>
                Sale de la fecha de activación{cicloMostrado ? `. La 1ra factura se genera el ${fmtFecha((movilFechasPrimeraFactura({ fechaActivacion, cicloManual: cicloDesbloqueado ? cicloManual : "" }) || {}).facturaISO)} y le llega unos ${DIAS_RETRASO_FACTURA_MOVIL} días después` : ""}.
              </div>
            </div>
            {(() => {
              const fx = movilFechasPrimeraFactura({ fechaActivacion, cicloManual: cicloDesbloqueado ? cicloManual : "" });
              const calc = calcularPrimeraFacturaMovil(montoPlan, fx, false);
              if (!calc) return null;
              return (
                <div className="col-span-2 rounded-md p-3 flex items-center justify-between gap-3 flex-wrap" style={ { background: "#F3F6FB", border: "1px solid #C9D2E3" } }>
                  <div>
                    <div className="text-sm font-bold" style={ { color: "#001E62" } }>Primera factura aprox.</div>
                    <div className="text-xs" style={ { color: "#3D4A66" } }>Prorrateo de {calc.dias} días + mes completo, con impuestos</div>
                  </div>
                  <div className="text-xl font-extrabold" style={ { color: "#001E62" } }>{fmtMonto(calc.total)}</div>
                </div>
              );
            })()}
            <div className="col-span-2 flex flex-col gap-2 rounded-md p-3" style={ { background: "#F3F6FB" } }>
              <label className="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" checked={esPortabilidad} onChange={(e) => setEsPortabilidad(e.target.checked)} className="w-4 h-4" />
                <span>Es portabilidad <span className="text-xs" style={ { color: "#5A6680" } }>(el número viene de otra compañía)</span></span>
              </label>
              <label className="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" checked={f1Pagada} onChange={(e) => setF1Pagada(e.target.checked)} className="w-4 h-4" />
                <span>Primera factura pagada <span className="text-xs" style={ { color: "#5A6680" } }>(cuenta para tu comisión desde octubre)</span></span>
              </label>
            </div>
            <div className="flex gap-2 col-span-2 sm:justify-end sticky bottom-0 bg-white pt-2 pb-1">
              <button
                type="submit"
                className="flex-1 sm:flex-none text-sm font-medium px-5 py-3 sm:py-2 rounded-md text-white"
                style={ { background: "#001E62" } }
              >
                {editingId ? "Guardar" : "Agregar"}
              </button>
              <button
                type="button"
                onClick={cancelEdit}
                className="flex-1 sm:flex-none text-sm font-medium px-5 py-3 sm:py-2 rounded-md border"
                style={ { borderColor: "#DFE5EF" } }
              >
                Cancelar
              </button>
            </div>
            {editingId && (
              <div className="col-span-2 text-center pt-1">
                <button
                  type="button"
                  onClick={() => setConfirmarEliminarMovil(editingId)}
                  className="text-xs font-bold underline"

                >
                  🗑 Eliminar este cliente

        </div>
      )}

      {confirmarEliminarMovil && (
        <ConfirmModal
          onCancel={() => setConfirmarEliminarMovil(null)}

        />
      )}
      <input
        type="search"
        value={busquedaMovil}
        onChange={(e) => setBusquedaMovil(e.target.value)}

        className="w-full px-3 py-2 rounded-md border text-sm outline-none mb-3 bg-white"
        style={ { borderColor: "#DFE5EF" } }
      />
      {busquedaMovil.trim() && (
        <BloqueOtraLista
          icono="🏠"
          titulo="Hogar"

            nombre: c.nombre,
            sub: [c.telefono, c.fechaInstalacion ? "Instalado " + fmtFechaDia(c.fechaInstalacion) : "Pendiente de instalación"].filter(Boolean).join(" · "),

      {(() => {
        const visibles = clientesMovil.filter((c) => periodoComision(fechaActivacionMovil(c)) === mesVisto);
        const n = (k) => visibles.filter((c) => pasaChipMovil(c, k)).length;
        const chips = [

// Resumen real del estado de pago de un cliente, mirando TODAS las facturas ya
// generadas (no solo la última que se tocó) — para la ficha de detalle.
function resumenPagoCliente(c) {
  if (c.estadoPago === "Suspendido") {
    return { texto: "⏸ Suspendido", color: "#4B5563", bg: "#EFEFEF" };
  }
  const facturas = Array.isArray(c.facturas) ? c.facturas : [];
  const generadas = facturas.filter((f) => daysFromToday(f.generada) <= 0);
  if (generadas.length === 0) {
    return { texto: "⏳ Pendiente", color: "#B45309", bg: "#FFF3DC" };
  }
  const pagadas = generadas.filter((f) => c[`f${f.n}_estado`] === "pagada").length;
  const hayVencidaSinPagar = generadas.some((f) => daysFromToday(f.vencimiento) <= 0 && c[`f${f.n}_estado`] !== "pagada");
  if (pagadas === generadas.length) {
    return { texto: "✓ Pagado", color: "#001E62", bg: "#EAF0FB" };
  }
  if (hayVencidaSinPagar) {
    return { texto: `⚠ Atrasado (${pagadas}/${generadas.length} pagadas)`, color: "#B45309", bg: "#FFF3DC" };
  }
  return { texto: `◐ Pago parcial (${pagadas}/${generadas.length})`, color: "#B45309", bg: "#FFF3DC" };
}

// ---------- Bitácora de cambios ----------
function fmtFechaHora(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const fecha = fmtFecha(fechaLocalISO(d));
  const hora = d.toLocaleTimeString("es-PA", { hour: "numeric", minute: "2-digit" });
  return `${fecha} · ${hora}`;
}
function fmtRelativo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "justo ahora";
  if (min < 60) return `hace ${min} min`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `hace ${hrs} h`;
  const dias = Math.floor(hrs / 24);
  if (dias < 30) return `hace ${dias} d`;
  return fmtFechaHora(iso);
}

  rescate: { icon: "💰", label: "Rescate confirmado", color: "#001E62", bg: "#EAF0FB" },

};
function valorLegible(campo, valor) {
  if (campo === "abonoInicial") return valor === false || valor === "false" ? "Falta abono" : "✓ Recibido";
  if (valor === "" || valor === null || valor === undefined) return "—";
  if (campo === "montoMensual" || campo === "monto1raFactura" || campo === "montoPlan") return fmtMonto(valor);
  if (campo === "fechaInstalacion") return fmtFechaDia(valor);
  if (campo === "fecha1raFactura") return fmtFecha(valor);
  return String(valor);
}
const MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function etiquetaDiaHistorial(iso) {
  const d = new Date(iso);
  const clave = fechaLocalISO(d);
  const hoy = new Date();
  const ayer = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 1);
  const txt = d.getDate() + " " + MESES_CORTOS[d.getMonth()];
  if (clave === fechaLocalISO(hoy)) return "Hoy · " + txt;
  if (clave === fechaLocalISO(ayer)) return "Ayer · " + txt;
  return txt + " " + d.getFullYear();
}

              })}
            </React.Fragment>
          ))}
        </div>
      )}
    </div>
  );
}

// Copia texto al portapapeles (con respaldo para navegadores que lo bloquean).
async function copiarTextoPrecierre(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

// Lo pegado y el rango del precierre se guardan en este celular para que no se
// pierdan al cambiar de pestaña o refrescar. Se borran con "Limpiar".
const PRECIERRE_KEY = "antichurn_precierre";
function leerPrecierreGuardado() {
  const hoy = fechaLocalISO(new Date());
  const base = { texto: "", desde: hoy.slice(0, 8) + "01", hasta: hoy, aplicado: null };
  try {
    const raw = localStorage.getItem(PRECIERRE_KEY);
    if (!raw) return base;
    const g = JSON.parse(raw);
    return {
      texto: typeof g.texto === "string" ? g.texto : "",
      desde: g.desde || base.desde,
      hasta: g.hasta || base.hasta,
      aplicado: g.aplicado && typeof g.aplicado.texto === "string" ? g.aplicado : null,
    };
  } catch (e) {
    return base;
  }
}

// Lee el número de suscriptor de cada línea pegada. Si la línea trae más columnas
// (nombre, teléfono, fechas…), toma el número que ya existe en la app y, si ninguno
// existe, el primero de 6 o más dígitos. Los teléfonos con guion, fechas y montos
// no se confunden con suscriptores porque se parten en trozos cortos.
function leerSuscriptoresPrecierre(textoPegado, existentes) {
  const lineas = textoPegado.split(/\r?\n/).filter((l) => l.trim());
  const vistos = new Set();
  const numeros = [];
  let duplicados = 0;
  let sinNumero = 0;
  const agregarNumero = (n) => {
    if (vistos.has(n)) { duplicados++; return; }
    vistos.add(n);
    numeros.push(n);
  };
  lineas.forEach((linea) => {
    const candidatos = (linea.match(/\d+/g) || []).filter((n) => n.length >= 6);
    if (candidatos.length === 0) { sinNumero++; return; }
    const soloNumeros = !/[A-Za-zÁ-ÿ]/.test(linea) && !linea.includes("\t");
    if (soloNumeros) {
      candidatos.forEach(agregarNumero);
    } else {
      agregarNumero(candidatos.find((n) => existentes.has(n)) || candidatos[0]);
    }
  });
  return { numeros, duplicados, sinNumero, lineas: lineas.length };
}

// ---------- Precierre completo de Tigo (con encabezado y columnas) ----------
// Tigo manda una tabla (columnas separadas por tab) con SUSCRIPTOR, CUENTA, VENDEDOR, PRODUCTO,
// VARIANTE, FECHA_ACTIVACION y RAZON_SOLICITUD_PROD, entre otras. Un cliente con Internet + TV
// aparece en DOS líneas con el mismo suscriptor: aquí se unen en un solo cliente.
const VENDEDOR_PROPIO = "jose severino";
function sinAcentosMin(t) {
  return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}
function esVendedorPropio(v) {
  return !String(v || "").trim() || sinAcentosMin(v).includes(VENDEDOR_PROPIO);
}
// "10/14/26 0:00" (mes/día/año) -> "2026-10-14"
function fechaPrecierreAISO(t) {
  const m = String(t || "").match(/^\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!m) return "";
  const y = Number(m[3]) < 100 ? 2000 + Number(m[3]) : Number(m[3]);
  return `${y}-${String(m[1]).padStart(2, "0")}-${String(m[2]).padStart(2, "0")}`;
}
function leerTablaPrecierre(texto) {
  const lineas = String(texto || "").split(/\r?\n/).filter((l) => l.trim());
  if (lineas.length < 2) return null;
  const enc = lineas[0].split("\t").map((x) => x.trim().toUpperCase());
  const iSus = enc.indexOf("SUSCRIPTOR");
  if (iSus < 0 || enc.length < 3) return null;
  const iCta = enc.indexOf("CUENTA");
  const iVen = enc.indexOf("VENDEDOR");
  const iPro = enc.indexOf("PRODUCTO");
  const iVar = enc.indexOf("VARIANTE");
  const iAct = enc.indexOf("FECHA_ACTIVACION");
  const iRaz = enc.indexOf("RAZON_SOLICITUD_PROD");
  const datos = new Map();
  let filas = 0;
  lineas.slice(1).forEach((l) => {
    const c = l.split("\t");
    const num = String(c[iSus] || "").replace(/\D/g, "");
    if (num.length < 6) return;
    filas++;
    const g = (i) => (i >= 0 ? String(c[i] || "").trim() : "");
    let d = datos.get(num);
    if (!d) {
      d = { numero: num, cuenta: "", vendedor: g(iVen), razon: "", fechaInternet: "", fechaTV: "", velocidad: "", tv: "", tieneInternet: false, tieneTV: false };
      datos.set(num, d);
    }
    if (!d.cuenta) d.cuenta = g(iCta);
    const prod = sinAcentosMin(g(iPro));
    const variante = g(iVar);
    const fecha = fechaPrecierreAISO(g(iAct));
    if (/internet/.test(prod)) {
      d.tieneInternet = true;
      const m = variante.match(/(\d+)\s*megas/i);
      d.velocidad = m ? m[1] + " Megas" : variante;
      d.fechaInternet = fecha || d.fechaInternet;
    } else if (/cable|tv/.test(prod)) {
      d.tieneTV = true;
      d.tv = /combo/i.test(variante) ? "COMBO PACK" : /perfecto/i.test(variante) ? "TV PERFECTO" : variante.toUpperCase().replace(/^TV\s+/, "");
      d.fechaTV = fecha || d.fechaTV;
    }
    const raz = g(iRaz);
    if (raz && (!d.razon || /reconex/i.test(raz))) d.razon = raz;
  });
  if (datos.size === 0) return null;
  datos.forEach((d) => {
    d.fecha = d.fechaInternet || d.fechaTV || "";
    d.reconexion = /reconex/i.test(d.razon);
  });
  return { datos, numeros: [...datos.keys()], lineas: filas };
}
// Plan que Tigo activó: Single (solo Internet), Doble (Internet + TV) o solo TV.
function planDeTigo(d) {
  const tipo = d.tieneInternet ? (d.tieneTV ? "DOBLE" : "SINGLE") : d.tieneTV ? "SOLO_TV" : "";
  return { tipo, velocidad: d.velocidad || "", tv: tipo === "DOBLE" ? d.tv : "" };
}
function planTigoTexto(p) {
  if (p.tipo === "SOLO_TV") return "Solo TV" + (p.tv ? " " + p.tv : "");
  return planCorto({ planTipo: p.tipo, velocidad: p.velocidad, planTV: p.tv }) || p.tipo || "—";
}
function planCoincideConTigo(c, p) {
  if (!p.tipo) return true;
  if (p.tipo === "SOLO_TV") return false;
  if (c.planTipo !== p.tipo) return false;
  if (String(c.velocidad || "").trim().toLowerCase() !== p.velocidad.toLowerCase()) return false;
  if (p.tipo === "DOBLE" && String(c.planTV || "").trim().toUpperCase() !== String(p.tv || "").toUpperCase()) return false;
  return true;
}

// Compara el precierre pegado contra los clientes de la app. Es una función pura:
// se recalcula sola cada vez que cambian los clientes (por ejemplo, al agregar uno).
function calcularPrecierre(clientes, textoPegado, desde, hasta) {
  const clientesPorNumero = new Map(
    clientes.filter((c) => c.numeroSuscriptor).map((c) => [c.numeroSuscriptor.trim(), c])
  );
  const enRango = (c) => !!c.fechaInstalacion && c.fechaInstalacion >= desde && c.fechaInstalacion <= hasta;
  const tabla = leerTablaPrecierre(textoPegado);

  if (tabla) {
    // Tabla completa de Tigo: el rango que eliges decide qué filas se comparan.
    const setTodos = new Set(tabla.numeros);
    const considerados = tabla.numeros.filter((n) => {
      const f = tabla.datos.get(n).fecha;
      return !f || (f >= desde && f <= hasta);
    });
    const agregar = [], fecha = [], plan = [], vendedor = [], coinciden = [], actualizaciones = [];
    considerados.forEach((n) => {
      const d = tabla.datos.get(n);
      const c = clientesPorNumero.get(n);
      if (!esVendedorPropio(d.vendedor)) { vendedor.push({ numero: n, datos: d, cliente: c || null }); return; }
      if (!c) { agregar.push({ numero: n, datos: d }); return; }
      const upd = {};
      if (d.cuenta && c.cuentaTigo !== d.cuenta) upd.cuentaTigo = d.cuenta;
      if ((c.numeroSuscriptor || "") !== n) upd.numeroSuscriptor = n;
      if (Object.keys(upd).length) actualizaciones.push({ id: c.id, ...upd });
      let ok = true;
      if (d.fecha && c.fechaInstalacion !== d.fecha) { fecha.push({ cliente: c, tigo: d.fecha, app: c.fechaInstalacion || "" }); ok = false; }
      const pt = planDeTigo(d);
      if (!planCoincideConTigo(c, pt)) { plan.push({ cliente: c, tigo: pt, soloTV: pt.tipo === "SOLO_TV" }); ok = false; }
      if (ok) coinciden.push({ cliente: c, reconexion: d.reconexion });
    });
    // En la app, instalados dentro del rango, pero NO en el precierre -> reclamar a Tigo.
    const reclamar = clientes
      .filter((c) => c.numeroSuscriptor && !clienteExcluido(c) && enRango(c) && !setTodos.has(c.numeroSuscriptor.trim()))
      .sort((a, b) => (a.fechaInstalacion || "").localeCompare(b.fechaInstalacion || ""));
    return {
      completo: true, desde, hasta, total: considerados.length, duplicados: 0, sinNumero: 0, lineas: tabla.lineas,
      agregar, coinciden, revisar: [], reclamar, fecha, plan, vendedor, actualizaciones,
    };
  }

  // Solo números de suscriptor (sin encabezado): se compara como antes.
  const existentes = new Set(clientes.map((c) => (c.numeroSuscriptor || "").trim()).filter(Boolean));
  const { numeros, duplicados, sinNumero, lineas } = leerSuscriptoresPrecierre(textoPegado, existentes);
  const agregar = numeros.filter((n) => !clientesPorNumero.has(n)).map((n) => ({ numero: n, datos: null }));
  const enApp = numeros.filter((n) => clientesPorNumero.has(n)).map((n) => clientesPorNumero.get(n));
  const coinciden = enApp.filter(enRango).map((c) => ({ cliente: c, reconexion: false }));
  const revisar = enApp
    .filter((c) => !enRango(c))
    .map((c) => ({
      cliente: c,
      motivo: !c.fechaInstalacion
        ? "Sin fecha de instalación"
        : c.fechaInstalacion < desde
          ? "Instalado antes del rango"
          : "Instalado después del rango",
    }));
  const setNumeros = new Set(numeros);
  const reclamar = clientes
    .filter((c) => c.numeroSuscriptor && !clienteExcluido(c) && enRango(c) && !setNumeros.has(c.numeroSuscriptor.trim()))
    .sort((a, b) => (a.fechaInstalacion || "").localeCompare(b.fechaInstalacion || ""));
  return {
    completo: false, desde, hasta, total: numeros.length, duplicados, sinNumero, lineas,
    agregar, coinciden, revisar, reclamar, fecha: [], plan: [], vendedor: [], actualizaciones: [],
  };
}

// Rango de un mes calendario: offset 0 = este mes (del día 1 hasta hoy), -1 = mes anterior completo.
function rangoMesCalendario(offset) {
  const hoy = new Date();
  const ini = new Date(hoy.getFullYear(), hoy.getMonth() + offset, 1);
  const fin = offset === 0 ? hoy : new Date(hoy.getFullYear(), hoy.getMonth(), 0);
  return { desde: fechaLocalISO(ini), hasta: fechaLocalISO(fin) };
}
// Aviso suave (no bloquea) si el rango no abarca un mes calendario completo.
function avisoRangoPrecierre(desde, hasta) {
  if (!desde || !hasta) return null;
  const d = new Date(desde + "T00:00:00");
  const h = new Date(hasta + "T00:00:00");
  const finMes = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const hoyISO = fechaLocalISO(new Date());
  const completo = d.getDate() === 1 && (fechaLocalISO(h) === fechaLocalISO(finMes) || fechaLocalISO(h) === hoyISO);
  if (completo && h.getMonth() === d.getMonth() && h.getFullYear() === d.getFullYear()) return null;
  return "El rango no abarca un mes calendario completo (del 1 al 30 o 31).";
}

function FilaPrecierre({ color, numero, nombre, sub, derecha, onClick, children }) {
  const clicable = typeof onClick === "function";
  return (
    <div
      role={clicable ? "button" : undefined}

      onClick={clicable ? onClick : undefined}

      className={`flex items-center gap-3 py-2.5 border-t ${clicable ? "cursor-pointer active:bg-gray-50" : ""}`}
      style={ { borderColor: "#DFE5EF", minHeight: 60 } }
    >
      <span className="shrink-0 rounded-full flex items-center justify-center" style={ { width: 32, height: 32, background: color + "1F" } }>
        <span className="rounded-full" style={ { width: 10, height: 10, background: color } } />
      </span>
      <div className="min-w-0 flex-1">
        <div className="flex items-baseline gap-2">
          <span className="font-bold" style={ { fontSize: 16, fontVariantNumeric: "tabular-nums" } }>{numero}</span>
          {nombre && <span className="text-xs truncate" style={ { color: "#5A6680" } }>{nombre}</span>}
        </div>
        {sub && <div className="text-xs" style={ { color: "#5A6680" } }>{sub}</div>}
      </div>
      {derecha}
      {children}
      {clicable && (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6680" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="shrink-0"><path d="M9 6l6 6-6 6" /></svg>
      )}
    </div>
  );
}

function ResultadoPrecierre({ resultado, onIrNuevo, onAbrirCliente, onCambiarFecha, onCorregirPlan }) {
  const { agregar, reclamar, revisar, coinciden, fecha = [], plan = [], vendedor = [] } = resultado;
  const [ignorados, setIgnorados] = useState([]);
  const vendedorVisible = vendedor.filter((v) => !ignorados.includes(v.numero));
  const conteos = {
    fecha: fecha.length, plan: plan.length, agregar: agregar.length, reclamar: reclamar.length,
    vendedor: vendedorVisible.length, revisar: revisar.length, coinciden: coinciden.length,
  };
  const ORDEN = ["fecha", "plan", "agregar", "reclamar", "vendedor", "revisar"];
  const pendientes = ORDEN.reduce((a, k) => a + conteos[k], 0);
  const primeroConPendientes = ORDEN.find((k) => conteos[k] > 0) || "coinciden";
  const [grupo, setGrupo] = useState(primeroConPendientes);
  const [verTodas, setVerTodas] = useState(false);
  const [copiado, setCopiado] = useState(false);
  const grupoActivo = conteos[grupo] === 0 && grupo !== "coinciden" ? primeroConPendientes : grupo;
  const g = GRUPOS_PRECIERRE.find((x) => x.key === grupoActivo);
  const LIMITE_COINCIDEN = 8;

  async function copiarReclamo() {
    const lineas = reclamar.map(
      (c) => `• ${c.numeroSuscriptor} · ${c.nombre || "Sin nombre"} · instalado ${fmtFechaDia(c.fechaInstalacion)}`
    );
    const encabezado = `Suscriptores instalados del ${fmtFecha(resultado.desde)} al ${fmtFecha(resultado.hasta)} que no aparecen en el precierre:`;
    const ok = await copiarTextoPrecierre([encabezado, ...lineas].join("\n"));
    if (ok) {
      setCopiado(true);
      setTimeout(() => setCopiado(false), 2000);
    }
  }

  if (resultado.total === 0 && reclamar.length === 0) {
    return (
      <p className="text-sm font-bold rounded-xl p-4" style={ { border: "1px solid #F0D9AE", borderLeft: "5px solid #B45309", background: "#FFF3DC", color: "#B45309" } }>

      </p>

  return (
    <div className="flex flex-col gap-3">

      <div className="bg-white rounded-xl border p-4" style={ { borderColor: "#DFE5EF" } }>
        <div className="flex items-baseline justify-between gap-2 mb-2">
          <span className="text-sm font-semibold" style={ { color: pendientes === 0 ? "#001E62" : "#374151" } }>
            {pendientes === 0
              ? "✅ Todo cuadra"
              : `${pendientes} ${pendientes === 1 ? "cosa por resolver" : "cosas por resolver"}`}

          <span className="text-xs" style={ { color: "#5A6680" } }>Tigo: {resultado.total}</span>
        </div>
        <div className="flex gap-0.5 overflow-hidden rounded-full" style={ { height: 12 } }>
          {barra.map((k) => (
            <div key={k} style={ { flex: conteos[k], background: GRUPOS_PRECIERRE.find((x) => x.key === k).color } } />
          ))}
        </div>
        {(resultado.duplicados > 0 || resultado.sinNumero > 0) && (
          <p className="text-xs mt-2" style={ { color: "#5A6680" } }>
            {resultado.duplicados > 0 && `${resultado.duplicados} repetidas se contaron una vez`}
            {resultado.duplicados > 0 && resultado.sinNumero > 0 && " · "}
            {resultado.sinNumero > 0 && `${resultado.sinNumero} sin número se ignoraron`}

      </div>

      {/* Grupos tocables */}
      <div className="flex flex-wrap gap-2">
        {GRUPOS_PRECIERRE.filter((x) => conteos[x.key] > 0 || grupoActivo === x.key).map((x) => {
          const activo = grupoActivo === x.key;
          return (
            <button
              key={x.key}

                height: 44,
                padding: "0 14px",

              </div>
              <button
                onClick={() => { if (confirmarCambioFechaOrden(c, tigo, false)) onCambiarFecha(c.id, tigo); } }
                className="w-full font-bold text-white"

        {g.key === "plan" &&

            <div key={c.id} className="px-4 py-3 border-t" style={ { borderColor: "#DFE5EF" } }>

              <div className="flex gap-2 my-2">
                <div style={caja("tigo")}><span style={rotulo}>Tigo (manda)</span>{planTigoTexto(tigo)}</div>
                <div style={caja("app")}><span style={rotulo}>Tu app</span>{planCorto(c) || "—"}{c.montoMensual ? ` · ${fmtMonto(c.montoMensual)}` : ""}</div>

              {soloTV ? (

        {g.key === "agregar" &&
          agregar.map(({ numero, datos }) => (
            <FilaPrecierre

              <button
                onClick={() => onIrNuevo(numero, datos)}

        {g.key === "reclamar" &&
          reclamar.map((c) => (

        {g.key === "vendedor" &&
          vendedorVisible.map(({ numero, datos, cliente }) => (
            <FilaPrecierre
              key={numero}

        {g.key === "revisar" &&

        {g.key === "coinciden" && (
          <>
            {(verTodas ? coinciden : coinciden.slice(0, LIMITE_COINCIDEN)).map(({ cliente: c, reconexion }) => (
              <FilaPrecierre
                key={c.id}
                color={g.color}

              <button
                onClick={() => setVerTodas((v) => !v)}

            )}

        )}
      </div>
    </div>
  );
