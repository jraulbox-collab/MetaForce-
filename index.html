              {(() => {
                const alertasActivas = f.milestones.filter((m) => m.pendienteHoy);
                if (alertasActivas.length === 0) {
                  return (
                    <p className="text-xs" style={ { color: "#9CA3AF" } }>
                      Sin alertas activas en esta factura por el momento.
                    </p>
                  );
                }
                return (
                  <div className="flex flex-col gap-3">
                    {alertasActivas.map((m) => {
                      const key = cliente.id + m.key;
                      return (
                        <div key={m.key} className="rounded-md border p-3" style={ { borderColor: "#F0F0EF" } }>
                          <div className="flex items-center gap-2 mb-2">
                            <span className="font-mono text-[11px] px-1.5 py-0.5 rounded" style={ { background: m.bg, color: m.color } }>
                              {m.tag}
                            </span>
                            <span className="text-xs" style={ { color: "#6B7280" } }>{m.label}</span>
                          </div>
                          <div className="text-sm rounded-md p-3 mb-3" style={ { background: "#F4F6FA", color: "#374151" } }>
                            {m.texto}
                          </div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <a
                              href={whatsappLink(cliente, m)}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                              style={ { background: "#25D366" } }
                            >
                              Enviar por WhatsApp
                            </a>
                            <button
                              onClick={() => onCopiarMensaje(cliente, m)}
                              className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                              style={ { background: "#001E62" } }
                            >
                              {copiedKey === key ? "Copiado ✓" : "Copiar mensaje"}
                            </button>
                            <button
                              onClick={() => onMarcarEnviado(cliente.id, m.key)}
                              className="text-xs font-medium px-3 py-1.5 rounded-md border"
                              style={ { borderColor: "#D1D5DB", color: "#374151" } }
                            >
                              Marcar como enviado
                            </button>
                      </div>
                    </div>
                  );
                })}
              </div>
                );
              })()}
            </div>
          );
        })}
      </div>
      )}
    </div>
  );
}

function ConvergenciasPanel({ convergencias, onAgregar, onEditar, onEliminar }) {
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const [fullTigo, setFullTigo] = useState(false);
  const [montoPlan, setMontoPlan] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [mesExpandido, setMesExpandido] = useState(() => periodoComision(toISO(new Date())));
  const meses = useMemo(() => periodosRecientes(6), []);

  function handleSubmit(e) {
    e.preventDefault();
    if (!nombre.trim() || !telefono.trim()) return;
    if (fullTigo && !montoPlan) return;
    if (editingId) {
      onEditar(editingId, {
        nombre: nombre.trim(),
        telefono: telefono.trim(),
        fullTigo,
        montoPlan: fullTigo ? Number(montoPlan) || 0 : null,
      });
    } else {
      onAgregar(nombre.trim(), telefono.trim(), fullTigo, montoPlan);
    }
    setNombre("");
    setTelefono("");
    setFullTigo(false);
    setMontoPlan("");
    setEditingId(null);
  }

  function startEdit(c) {
    setNombre(c.nombre);
    setTelefono(c.telefono);
    setFullTigo(!!c.fullTigo);
    setMontoPlan(c.montoPlan != null ? String(c.montoPlan) : "");
    setEditingId(c.id);
  }

  function cancelEdit() {
    setNombre("");
    setTelefono("");
    setFullTigo(false);
    setMontoPlan("");
    setEditingId(null);
  }

  return (
    <div>
      <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-5 mb-4">
        <h2 className="text-sm font-semibold mb-3">{editingId ? "Editar convergencia" : "Nueva convergencia"}</h2>
        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-3 sm:items-end">
          <div className="flex-1">
            <label className="text-xs font-medium block mb-1" style={ { color: "#6B7280" } }>Nombre</label>
            <input
              required
              value={nombre}
              onChange={(e) => setNombre(e.target.value)}
              className="w-full px-3 py-2 rounded-md border text-sm outline-none"
              style={ { borderColor: "#D1D5DB" } }
            />
          </div>
          <div className="flex-1">
            <label className="text-xs font-medium block mb-1" style={ { color: "#6B7280" } }>Número de celular</label>
            <input
              required
              value={telefono}
              onChange={(e) => setTelefono(e.target.value)}
              className="w-full px-3 py-2 rounded-md border text-sm outline-none"
              style={ { borderColor: "#D1D5DB" } }
            />
          </div>
          <div className="flex gap-2">
            <button type="submit" className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>
              {editingId ? "Guardar" : "Agregar"}
            </button>
            {editingId && (
              <button type="button" onClick={cancelEdit} className="text-sm font-medium px-4 py-2 rounded-md border" style={ { borderColor: "#D1D5DB" } }>
                Cancelar
              </button>
            )}
          </div>
        </form>
        <div className="flex flex-wrap items-center gap-3 mt-3 pt-3 border-t" style={ { borderColor: "#F0F0EF" } }>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={fullTigo} onChange={(e) => setFullTigo(e.target.checked)} />
            FULL TIGO
          </label>
          {fullTigo && (
            <div className="flex items-center gap-2">
              <span className="text-xs" style={ { color: "#6B7280" } }>Monto del plan vendido:</span>
              <input
                type="number"
                step="0.01"
                min="0"
                required
                value={montoPlan}
                onChange={(e) => setMontoPlan(e.target.value)}
                placeholder="$0.00"
                className="w-28 px-2 py-1 rounded-md border text-sm outline-none"
                style={ { borderColor: "#D1D5DB" } }
              />
            </div>
          )}
        </div>
      </div>

      <div className="flex flex-col gap-2">
        {meses.map((m, i) => {
          const delMes = convergencias.filter((c) => periodoComision((c.creadoEn || "").slice(0, 10)) === m.key);
          const abierto = mesExpandido === m.key;
          return (
            <div key={m.key} className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
              <button
                onClick={() => setMesExpandido(abierto ? null : m.key)}
                className="w-full flex items-center justify-between px-4 py-3 text-left"
              >
                <span className="text-sm font-medium">{m.label}{i === 0 ? " (actual)" : ""}</span>
                <span className="text-sm font-mono flex items-center gap-2" style={ { color: "#001E62" } }>
                  {delMes.length} convergencia{delMes.length !== 1 ? "s" : ""}
                  <span style={ { color: "#9CA3AF" } }>{abierto ? "▲" : "▼"}</span>
                </span>
              </button>
              {abierto && (
                <div className="border-t" style={ { borderColor: "#F0F0EF" } }>
                  {delMes.length === 0 ? (
                    <p className="text-sm px-4 py-3" style={ { color: "#6B7280" } }>Sin convergencias este mes.</p>
                  ) : (
                    delMes.map((c) => (
                      <div key={c.id} className="flex items-center justify-between px-4 py-3 border-t" style={ { borderColor: "#F0F0EF" } }>
                        <div>
                          <div className="text-sm font-medium flex items-center gap-2">
                            {c.nombre}
                            {c.fullTigo && (
                              <span className="text-xs font-medium px-2 py-0.5 rounded-full" style={ { background: "#E3EDFA", color: "#0072CE" } }>
                                FULL TIGO · {fmtMonto(c.montoPlan)}
                              </span>
                            )}
                          </div>
                          <div className="text-xs font-mono" style={ { color: "#9CA3AF" } }>{c.telefono}</div>
                        </div>
                        <div className="flex gap-3">
                          <button onClick={() => startEdit(c)} className="text-xs font-medium" style={ { color: "#0072CE" } }>Editar</button>
                          <button
                            onClick={() => {
                              if (window.confirm(`¿Eliminar a ${c.nombre} de convergencias?`)) onEliminar(c.id);
                            } }
                            className="text-xs font-medium"
                            style={ { color: "#C23B3B" } }
                          >
                            Eliminar
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PrecierreTab({ clientes, onIrNuevo }) {
  const [texto, setTexto] = useState("");
  const hoyISO = toISO(new Date());
  const [fechaDesde, setFechaDesde] = useState(() => hoyISO.slice(0, 8) + "01");
  const [fechaHasta, setFechaHasta] = useState(hoyISO);
  const [resultado, setResultado] = useState(null);

  function validar() {
    const numeros = Array.from(new Set((texto.match(/\d+/g) || []).map((n) => n.trim()).filter(Boolean)));
    const existentes = new Set(clientes.map((c) => (c.numeroSuscriptor || "").trim()).filter(Boolean));
    const faltantes = numeros.filter((n) => !existentes.has(n));
    const encontrados = numeros.filter((n) => existentes.has(n));

    // "Sobrantes": clientes instalados dentro del rango de fechas exacto elegido
    // cuyo número de suscriptor no aparece en la lista pegada.
    const instaladosEseRango = clientes.filter(
      (c) => c.fechaInstalacion && c.fechaInstalacion >= fechaDesde && c.fechaInstalacion <= fechaHasta
    );
    const sobrantes = instaladosEseRango.filter(
      (c) => c.numeroSuscriptor && !numeros.includes(c.numeroSuscriptor.trim())
    );

    // "Fuera de rango": suscriptores del precierre que SÍ están en la app,
    // pero cuya fechaInstalacion cae fuera del rango de fechas seleccionado.
    const clientesPorNumero = new Map(
      clientes.filter((c) => c.numeroSuscriptor).map((c) => [c.numeroSuscriptor.trim(), c])
    );
    const fueraDeRango = encontrados
      .map((n) => clientesPorNumero.get(n))
      .filter(
        (c) => c && c.fechaInstalacion && (c.fechaInstalacion < fechaDesde || c.fechaInstalacion > fechaHasta)
      );

    setResultado({ desde: fechaDesde, hasta: fechaHasta, total: numeros.length, faltantes, encontrados, sobrantes, fueraDeRango });
  }

  return (
    <div className="max-w-3xl">
      <h1 className="text-2xl font-semibold mb-1">Validar precierre del mes</h1>
      <p className="text-sm mb-6" style={ { color: "#6B7280" } }>
        Pega aquí los números de suscriptor del archivo de precierre (uno por línea, o como vengan copiados desde Excel). La app detecta cuáles ya están cargados y cuáles faltan.
      </p>

      <div className="mb-4">
        <label className="text-xs font-medium block mb-1" style={ { color: "#6B7280" } }>
          Rango de fechas a verificar
        </label>
        <RangoFechasInput
          desde={fechaDesde}
          hasta={fechaHasta}
          onChange={(d, h) => { setFechaDesde(d); setFechaHasta(h); } }
          className="px-3 py-2 rounded-md border text-sm outline-none cursor-pointer"
          style={ { borderColor: "#D1D5DB", minWidth: "220px" } }
        />
      </div>

      <textarea
        value={texto}
        onChange={(e) => setTexto(e.target.value)}
        rows={10}
        placeholder="Pega aquí la lista de suscriptores del precierre…"
        className="w-full px-3 py-2 rounded-md border text-sm outline-none mb-3 font-mono"
        style={ { borderColor: "#D1D5DB" } }
      />
      <button
        onClick={validar}
        disabled={!texto.trim()}
        className="text-sm font-medium px-4 py-2 rounded-md text-white disabled:opacity-40"
        style={ { background: "#001E62" } }
      >
        Validar precierre
      </button>

      {resultado && (
        <div className="mt-6 flex flex-col gap-4">
          <p className="text-sm font-medium" style={ { color: "#374151" } }>
            Resultado del precierre del {fmtFecha(resultado.desde)} al {fmtFecha(resultado.hasta)}
          </p>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
              <div className="text-2xl font-mono font-semibold" style={ { color: "#001E62" } }>{resultado.total}</div>
              <div className="text-xs mt-1" style={ { color: "#6B7280" } }>Suscriptores en el precierre</div>
            </div>
            <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
              <div className="text-2xl font-mono font-semibold" style={ { color: "#2F9E6E" } }>{resultado.encontrados.length}</div>
              <div className="text-xs mt-1" style={ { color: "#6B7280" } }>Ya cargados en la app</div>
            </div>
            <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
              <div className="text-2xl font-mono font-semibold" style={ { color: "#C23B3B" } }>{resultado.faltantes.length}</div>
              <div className="text-xs mt-1" style={ { color: "#6B7280" } }>Faltan por cargar</div>
            </div>
            <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
              <div className="text-2xl font-mono font-semibold" style={ { color: "#C2761F" } }>{resultado.fueraDeRango.length}</div>
              <div className="text-xs mt-1" style={ { color: "#6B7280" } }>Fuera de rango</div>
            </div>
          </div>

          <ResultadoPrecierreTabs resultado={resultado} onIrNuevo={onIrNuevo} />
        </div>
      )}
    </div>
  );
}

function ResultadoPrecierreTabs({ resultado, onIrNuevo }) {
  const subtabs = [
    { key: "faltantes", label: "Faltantes", count: resultado.faltantes.length, color: "#C23B3B" },
    { key: "sobrantes", label: "Sobrantes", count: resultado.sobrantes.length, color: "#B8791F" },
    { key: "fueraDeRango", label: "Fuera de rango", count: resultado.fueraDeRango.length, color: "#C2761F" },

  return (
    <div className="bg-white rounded-lg border border-gray-200 shadow-sm">
      <div className="flex border-b border-gray-200">
        {subtabs.map((t) => (
          <button
            key={t.key}
            onClick={() => setSubtab(t.key)}
            className="flex-1 text-sm font-medium px-4 py-3 text-center"
            style={ {
              color: subtab === t.key ? t.color : "#6B7280",
              borderBottom: subtab === t.key ? `2px solid ${t.color}` : "2px solid transparent",
              background: subtab === t.key ? "#F9FAFB" : "transparent",
            } }
          >
            {t.label} ({t.count})
          </button>
        ))}
      </div>

      <div className="p-5">
        {subtab === "faltantes" && (
          resultado.faltantes.length > 0 ? (
            <div className="flex flex-col gap-2">
              <p className="text-xs mb-1" style={ { color: "#6B7280" } }>
                ⚠️ Suscriptores del precierre que no están en la app.
              </p>
              {resultado.faltantes.map((n) => (
                <div
                  key={n}
                  className="flex items-center justify-between rounded-md border p-3"
                  style={ { borderColor: "#F3C6C6", background: "#FBEAEA" } }
                >
                  <span className="font-mono text-sm">{n}</span>
                  <button
                    onClick={() => onIrNuevo(n)}
                    className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                    style={ { background: "#001E62" } }
                  >
                    + Agregar cliente
                  </button>
                </div>
              ))}
            </div>
          ) : (
            <p className="text-sm text-center" style={ { color: "#2F9E6E" } }>✅ Todos los suscriptores del precierre ya están cargados en la app.</p>
          )
        )}

        {subtab === "sobrantes" && (
          resultado.sobrantes.length > 0 ? (
            <div className="flex flex-col gap-2">
              <p className="text-xs mb-1" style={ { color: "#6B7280" } }>
                Instalados en el rango seleccionado que no aparecen en este precierre. Revisá si corresponde alguna baja o si falta que Tigo los actualice en su sistema.
              </p>
              {resultado.sobrantes.map((c) => (
                <div
                  key={c.id}
                  className="flex items-center justify-between rounded-md border p-3"
                  style={ { borderColor: "#F3E3C3", background: "#FFFBF2" } }
                >
                  <div>
                    <div className="font-mono text-sm font-medium">{c.numeroSuscriptor}</div>
                    <div className="text-xs" style={ { color: "#6B7280" } }>{c.nombre}</div>
                  </div>
                  <span className="text-xs font-mono" style={ { color: "#B8791F" } }>
                    Instalado: {fmtFecha(c.fechaInstalacion)}
                  </span>
                </div>
              ))}
            </div>
          ) : (
            <p className="text-sm text-center" style={ { color: "#2F9E6E" } }>✅ No hay sobrantes en el rango seleccionado.</p>
          )
        )}

        {subtab === "fueraDeRango" && (
          resultado.fueraDeRango.length > 0 ? (
            <div className="flex flex-col gap-2">
              <p className="text-xs mb-1" style={ { color: "#6B7280" } }>
                Están en el precierre y en la app, pero instalados fuera del rango seleccionado. Revisá si el rango de fechas es correcto o si la fecha de instalación cargada en la app está mal.
              </p>
              {resultado.fueraDeRango.map((c) => (
                <div
                  key={c.id}
                  className="flex items-center justify-between rounded-md border p-3"
                  style={ { borderColor: "#F5D9B8", background: "#FFF6EC" } }
                >
                  <div>
                    <div className="font-mono text-sm font-medium">{c.numeroSuscriptor}</div>
                    <div className="text-xs" style={ { color: "#6B7280" } }>{c.nombre}</div>
                  </div>
                  <span className="text-xs font-mono" style={ { color: "#C2761F" } }>
                    Instalado: {fmtFecha(c.fechaInstalacion)}
                  </span>
                </div>
              ))}
            </div>
          ) : (
            <p className="text-sm text-center" style={ { color: "#2F9E6E" } }>✅ Ninguno fuera de rango.</p>
          )
        )}
      </div>
    </div>
  );
}

function FormularioCliente({ form, setForm, onSubmit, editing, onCancel, clientes = [] }) {
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const inputClass = "w-full px-3 py-2 rounded-md border text-sm outline-none focus:ring-2";
  const inputStyle = { borderColor: "#D1D5DB" };
  const lockedStyle = { borderColor: "#D1D5DB", background: "#F3F4F6", color: "#6B7280", cursor: "not-allowed" };
  const [diasProrrateo, setDiasProrrateo] = useState(null);

  // Montos mensuales más usados para el plan que se está seleccionando ahora mismo.
  // Primero intenta con match exacto (tipo + velocidad + TV), y si no hay suficientes
  // datos, va ampliando el filtro (tipo + velocidad, y luego solo tipo de plan).
  const montosSugeridos = useMemo(() => {
    if (!form.planTipo) return [];
    const contar = (lista) => {
      const conteo = new Map();
      lista.forEach((c) => {
        const m = Number(c.montoMensual);
        if (!m) return;
        conteo.set(m, (conteo.get(m) || 0) + 1);
      });
      return [...conteo.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([monto]) => monto);
    };

    const porTipo = clientes.filter((c) => c.planTipo === form.planTipo);
    if (form.velocidad) {
      const porVelocidad = porTipo.filter((c) => c.velocidad === form.velocidad);
      const base =
        form.planTipo === "DOBLE" && form.planTV
          ? porVelocidad.filter((c) => c.planTV === form.planTV)
          : porVelocidad;
      if (base.length >= 2) return contar(base);
      if (porVelocidad.length > 0) return contar(porVelocidad);
    }
    return contar(porTipo);
  }, [clientes, form.planTipo, form.velocidad, form.planTV]);

  function calcularAuto() {
    const r = calcularPrimeraFactura(form.fechaInstalacion, parseInt(form.cicloFacturacion, 10), form.montoMensual);
    if (!r) return;
    const totalPrimeraFactura = +((Number(form.montoMensual) || 0) + (Number(r.monto1raFactura) || 0)).toFixed(2);
    setForm((f) => ({ ...f, fecha1raFactura: r.fecha1raFactura, monto1raFactura: totalPrimeraFactura }));
    setDiasProrrateo(r.dias);
  }

  useEffect(() => {
    if (!form.fechaInstalacion || !form.cicloFacturacion || form.montoMensual === "" || form.montoMensual == null) return;
    calcularAuto();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form.fechaInstalacion, form.cicloFacturacion, form.montoMensual]);

  return (
    <div className="max-w-2xl">
      <h1 className="text-2xl font-semibold mb-1">{editing ? "Editar cliente" : "Nuevo cliente"}</h1>
      <p className="text-sm mb-6" style={ { color: "#6B7280" } }>
        Se hace seguimiento a las primeras 4 facturas. Las fechas de la 2da, 3ra y 4ta se calculan con el día del Ciclo de Facturación. Todos los campos son obligatorios.
      </p>
      <form onSubmit={onSubmit} className="flex flex-col gap-3">
        <SeccionFormulario titulo="Datos del cliente">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <Field label="Número de suscriptor *">
              <input required value={form.numeroSuscriptor} onChange={set("numeroSuscriptor")} className={inputClass} style={inputStyle} />
            </Field>
            <Field label="Nombre y apellido *">
              <input required value={form.nombre} onChange={set("nombre")} className={inputClass} style={inputStyle} />
            </Field>
            <Field label="Teléfono *">
              <input required value={form.telefono} onChange={set("telefono")} className={inputClass} style={inputStyle} />
            </Field>
          </div>
        </SeccionFormulario>

        <SeccionFormulario titulo="Plan y facturación">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <Field label="Ciclo de facturación *">
              <select required value={form.cicloFacturacion} onChange={set("cicloFacturacion")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {CICLOS.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
              </select>
            </Field>
            <Field label="Fecha de instalación">
              <input
                type="date"
                value={form.fechaInstalacion}
                onChange={set("fechaInstalacion")}
                disabled={!form.fechaInstalacion}
                required={!!form.fechaInstalacion}
                className={inputClass}
                style={!form.fechaInstalacion ? lockedStyle : inputStyle}
              />
              <label className="flex items-center gap-2 mt-1.5 text-xs" style={ { color: "#6B7280" } }>
                <input
                  type="checkbox"
                  checked={!form.fechaInstalacion}
                  onChange={(e) =>
                    setForm((f) => ({ ...f, fechaInstalacion: e.target.checked ? "" : toISO(new Date()) }))
                  }
                />
                Pendiente de instalación (todavía no tiene fecha)
              </label>
            </Field>
            <Field label="Tipo de plan *">
              <select
                required
                value={form.planTipo}
                onChange={(e) => setForm((f) => ({ ...f, planTipo: e.target.value, planTV: e.target.value === "SINGLE" ? "" : f.planTV }))}
                className={inputClass}
                style={inputStyle}
              >
                <option value="">Seleccionar…</option>
                {TIPOS_PLAN.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
            <Field label="Velocidad *">
              <select required value={form.velocidad} onChange={set("velocidad")} className={inputClass} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {VELOCIDADES.map((v) => <option key={v} value={v}>{v}</option>)}
              </select>
            </Field>
            {form.planTipo === "DOBLE" && (
              <Field label="Plan de TV *">
                <select required value={form.planTV} onChange={set("planTV")} className={inputClass} style={inputStyle}>
                  <option value="">Seleccionar…</option>
                  {TIPOS_TV.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </Field>
            )}
            <Field label="Monto mensual recurrente *">
              <input required type="number" step="0.01" value={form.montoMensual} onChange={set("montoMensual")} className={inputClass} style={inputStyle} />
              {montosSugeridos.length > 0 && (
                <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                  <span className="text-xs" style={ { color: "#9CA3AF" } }>Sugeridos:</span>
                  {montosSugeridos.map((m) => (
                    <button
                      key={m}
                      type="button"
                      onClick={() => setForm((f) => ({ ...f, montoMensual: String(m) }))}
                      className="text-xs font-medium px-2 py-0.5 rounded-full border"
                      style={
                        Number(form.montoMensual) === m
                          ? { background: "#001E62", color: "#fff", borderColor: "#001E62" }
                          : { background: "#F4F6FA", color: "#374151", borderColor: "#D1D5DB" }
                      }
                    >
                      {fmtMonto(m)}
                    </button>
                  ))}
                </div>
              )}
            </Field>
          </div>

          <div className="rounded-md p-3 flex items-center justify-between mt-4" style={ { background: "#F4F6FA" } }>
            <div>
              <div className="text-xs font-medium" style={ { color: "#374151" } }>
                Fecha y monto de la 1ra factura (recurrente + prorrateo)
              </div>
              <div className="text-xs mt-0.5" style={ { color: "#9CA3AF" } }>
                {diasProrrateo != null
                  ? `Calculado automáticamente: ${diasProrrateo} día${diasProrrateo !== 1 ? "s" : ""} de prorrateo`
                  : "Se calcula solo al completar fecha de instalación + ciclo + monto mensual"}
              </div>
            </div>
            <button
              type="button"
              onClick={calcularAuto}
              disabled={!form.fechaInstalacion || !form.cicloFacturacion || !form.montoMensual}
              className="text-xs font-medium px-3 py-1.5 rounded-md text-white disabled:opacity-40"
              style={ { background: "#001E62" } }
              title="Recalcular por si editaste algo manualmente"
            >
              🔄 Recalcular
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <Field label="Fecha 1ra factura (automática)">
              <input disabled type="date" value={form.fecha1raFactura} className={inputClass} style={lockedStyle} />
            </Field>
            <Field label="Monto 1ra factura (recurrente + prorrateo)">
              <input type="number" step="0.01" value={form.monto1raFactura} onChange={set("monto1raFactura")} className={inputClass} style={inputStyle} />
            </Field>
            <Field label="Estado de pago">
              <select value={form.estadoPago} onChange={set("estadoPago")} className={inputClass} style={inputStyle}>
                {ESTADOS.map((e) => <option key={e} value={e}>{e}</option>)}
              </select>
            </Field>
          </div>
        </SeccionFormulario>

        <SeccionFormulario titulo="Observaciones" defaultOpen={false}>
          <Field label="Observaciones">
            <textarea value={form.observaciones} onChange={set("observaciones")} rows={3} className={inputClass} style={inputStyle} />
          </Field>
        </SeccionFormulario>

        <div className="flex gap-2 pt-2">
          <button type="submit" className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>
            {editing ? "Guardar cambios" : "Registrar cliente"}
          </button>
          <button type="button" onClick={onCancel} className="text-sm font-medium px-4 py-2 rounded-md border" style={ { borderColor: "#D1D5DB" } }>
            Cancelar
          </button>
        </div>
      </form>
    </div>
  );
}

function SeccionFormulario({ titulo, defaultOpen = true, children }) {
  const [abierta, setAbierta] = useState(defaultOpen);
  return (
    <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
      <button
        type="button"
        onClick={() => setAbierta((v) => !v)}
        className="w-full flex items-center justify-between px-5 py-3 text-left"
      >
        <span className="text-sm font-semibold" style={ { color: "#001E62" } }>{titulo}</span>
        <span className="text-xs" style={ { color: "#9CA3AF" } }>{abierta ? "▲" : "▼"}</span>
      </button>
      {abierta && (
        <div className="px-5 pb-5 pt-1 border-t" style={ { borderColor: "#F0F0EF" } }>
          {children}
        </div>
      )}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-xs font-medium" style={ { color: "#6B7280" } }>{label}</span>
      {children}
    </label>
  );
}

function SkeletonCargando() {
  const bloque = (clases) => (
    <div className={"animate-pulse rounded-lg bg-gray-200 " + clases} />
  );
  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        {bloque("h-7 w-40")}
        {bloque("h-9 w-32")}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        {bloque("h-28")}
        {bloque("h-28")}
        {bloque("h-28")}
      </div>
      <div className="flex flex-col gap-2">
        {bloque("h-14")}
        {bloque("h-14")}
        {bloque("h-14")}
      </div>
      <p className="text-xs text-center mt-6" style={ { color: "#9CA3AF" } }>Cargando datos…</p>
    </div>
  );
}

function SelectorNuevoModal({ onClose, onHogar, onConvergencia }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg p-6 max-w-sm w-full">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg">¿Qué querés agregar?</h3>
          <button onClick={onClose} className="text-sm" style={ { color: "#6B7280" } }>✕</button>
        </div>
        <div className="flex flex-col gap-2">
          <button
            onClick={onHogar}
            className="text-left px-4 py-3 rounded-md border flex items-center gap-3 hover:opacity-80"
            style={ { borderColor: "#D1D5DB" } }
          >
            <span className="text-xl" aria-hidden="true">🏠</span>
            <span>
              <span className="block text-sm font-semibold">Cliente de hogar</span>
              <span className="block text-xs" style={ { color: "#6B7280" } }>Registro completo con facturación y seguimiento</span>
            </span>
          </button>
          <button
            onClick={onConvergencia}
            className="text-left px-4 py-3 rounded-md border flex items-center gap-3 hover:opacity-80"
            style={ { borderColor: "#D1D5DB" } }
          >
            <span className="text-xl" aria-hidden="true">🔗</span>
            <span>
              <span className="block text-sm font-semibold">Convergencia</span>
              <span className="block text-xs" style={ { color: "#6B7280" } }>Se agrega al listado de convergencias</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  );
}

function ConfirmModal({ onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div className="bg-white rounded-lg p-6 max-w-sm w-full">
        <h3 className="font-semibold mb-2 flex items-center gap-2">
          <span aria-hidden="true">⚠️</span> ¿Eliminar cliente?
        </h3>
        <p className="text-sm mb-5" style={ { color: "#6B7280" } }>Esta acción no se puede deshacer.</p>
        <div className="flex gap-2 justify-end">
          <button onClick={onCancel} className="text-sm px-3 py-1.5 rounded-md border" style={ { borderColor: "#D1D5DB" } }>Cancelar</button>
          <button onClick={onConfirm} className="text-sm px-3 py-1.5 rounded-md text-white flex items-center gap-1.5" style={ { background: "#C23B3B" } }>
            <span aria-hidden="true">⚠️</span> Eliminar
          </button>
        </div>
      </div>
    </div>
  );
}

function ConfigModal({ onClose, onDeshacer, puedeDeshacer, onExportar, puedeExportar, onImportarClick, umbralProrrateo, setUmbralProrrateo, onCerrarSesion }) {
  const rowClass = "text-sm font-medium text-left px-3 py-2.5 rounded-md flex items-center gap-2 disabled:opacity-40";
  const rowStyle = { color: "#374151", border: "1px solid #E5E7EB" };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg p-6 max-w-sm w-full">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-lg flex items-center gap-2">⚙️ Configuración</h3>
          <button onClick={onClose} className="text-sm" style={ { color: "#6B7280" } }>✕</button>
        </div>
        <div className="flex flex-col gap-2 mb-4">
          <button onClick={onDeshacer} disabled={!puedeDeshacer} className={rowClass} style={rowStyle}>
            ↩️ Deshacer última acción
          </button>
          <button onClick={onExportar} disabled={!puedeExportar} className={rowClass} style={rowStyle}>
            ⬇️ Exportar respaldo (.json)
          </button>
          <button onClick={onImportarClick} className={rowClass} style={rowStyle}>
            ⬆️ Importar respaldo (.json)
          </button>
        </div>
        <div className="flex items-center justify-between gap-2 py-3 border-t" style={ { borderColor: "#F0F0EF" } }>
          <label className="text-xs" style={ { color: "#6B7280" } } title="A partir de qué % de prorrateo se envía el aviso D+3">
            Umbral de prorrateo (%)
          </label>
          <input
            type="number"
            min="0"
            max="100"
            value={umbralProrrateo}
            onChange={(e) => setUmbralProrrateo(e.target.value === "" ? "" : Number(e.target.value))}
            className="w-16 px-2 py-1 rounded-md border text-sm outline-none"
            style={ { borderColor: "#D1D5DB" } }
          />
        </div>
        <button
          onClick={onCerrarSesion}
          className="text-sm text-left underline pt-2"
          style={ { color: "#C23B3B" } }
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
