                </button>
                <button
                  onClick={() => onNoPagoTodavia(actual.cliente.id)}
                  className="w-full py-3 rounded-md border font-medium"
                  style={ { borderColor: "#D1D5DB", color: "#374151" } }
                >
                  ✕ No pagó todavía
                </button>
                <button
                  onClick={() => setConfirmando("descartar")}
                  className="w-full py-2 rounded-md font-medium text-xs"
                  style={ { color: "#B91C1C" } }
                >
                  🚫 Descartar cliente (no va a pagar / se desconecta)
                </button>
                <button
                  onClick={() => onSaltar(actual.cliente.id)}
                  className="w-full py-1.5 font-medium text-xs"
                  style={ { color: "#9CA3AF" } }
                >
                  Saltar por ahora →
                </button>
              </div>
            )}
          </>
        ) : (
          <div className="py-6">
            <div className="text-4xl mb-3">✓</div>
            <div className="text-lg font-semibold mb-1" style={ { color: "#001E62" } }>
              Listo, revisaste tus {total} de hoy
            </div>
            <p className="text-xs mb-5" style={ { color: "#9CA3AF" } }>
              No te vamos a volver a molestar con estos hasta mañana.
            </p>
            <button onClick={onCerrar} className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>
              Cerrar
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ stats, clientes, metas, onActualizarMeta, convergencias, onNuevo, onVerClientes, onActualizarEstadoFactura, onCopiarSuscriptor, copiedSubKey, onDescartarCliente, onConfirmarRescate, vista = "dashboard", onIrACobros, onVerCliente }) {
  const periodoActual = periodoComision(fechaLocalISO(new Date()));
  const [periodoVisto, setPeriodoVisto] = useState(() => (memoriaDashboard.retorno && memoriaDashboard.periodo ? memoriaDashboard.periodo : periodoComision(fechaLocalISO(new Date()))));
  memoriaDashboard.periodo = periodoVisto;
  useEffect(() => { memoriaDashboard.retorno = false; }, []);
  // Período con la ventana de rescate abierta ahora mismo (la más próxima que no ha
  // vencido). La usan tanto el uno-por-uno como el bloque de rescate del Dashboard,
  // para que siempre coincidan en a qué ciclo le están dando seguimiento.
  const periodoRescateActivo = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const candidato = [-1, -2]
      .map((d) => sumarMesClave(periodoActual, d))
      .map((p) => ({ p, limite: fechaLimitePrimeraFactura(p) }))
      .filter((x) => x.limite && x.limite >= hoy)
      .sort((a, b) => a.limite - b.limite)[0];
    return candidato ? candidato.p : null;
  }, [periodoActual]);
  const [rescateAbierto, setRescateAbierto] = useState(false);
  const [rescateSeleccion, setRescateSeleccion] = useState({});
  const [rescateConfirmando, setRescateConfirmando] = useState(false);
  useEffect(() => {
    setRescateSeleccion({});
    setRescateConfirmando(false);
  }, [periodoRescateActivo]);
  const esActual = periodoVisto === periodoActual;

  const esNuevo = esquemaNuevo(periodoVisto);
  const metaClientes = leerMeta(metas, periodoVisto, "clientes");
  const metaDinero = leerMeta(metas, periodoVisto, "dinero");
  const metaArpu = leerMeta(metas, periodoVisto, "arpu");
  const metaClientesHogar = leerMeta(metas, periodoVisto, "clientesHogar");
  const metaClientesMovil = leerMeta(metas, periodoVisto, "clientesMovil");

  // Progreso del ciclo actual (día 21 al 20) para poder proyectar a fin de ciclo.
  const UN_DIA_MS = 24 * 60 * 60 * 1000;
  const cicloInfo = useMemo(() => {
    const { inicio, fin } = rangoCiclo(periodoVisto);
    const hoy = new Date();
    const totalDias = Math.round((fin - inicio) / UN_DIA_MS) + 1;
    let diasTranscurridos = Math.round((hoy - inicio) / UN_DIA_MS) + 1;
    diasTranscurridos = Math.max(0, Math.min(totalDias, diasTranscurridos));
    return { totalDias, diasTranscurridos, pctTranscurrido: totalDias > 0 ? diasTranscurridos / totalDias : 0 };
  }, [periodoVisto]);
  const UMBRAL_PROYECCION = 0.15; // no proyectar antes del 15% del ciclo (muy poco dato, muy inestable)
  const aunEsTemprano = esActual && cicloInfo.pctTranscurrido < UMBRAL_PROYECCION;
  const puedeProyectar = esActual && !aunEsTemprano && cicloInfo.diasTranscurridos > 0;

  // Todo lo que sigue se agrupa por período de comisión (instalados del 21 al 20),
  // no por mes calendario ni por fecha de ingreso. Y excluye a los clientes que ya
  // perdieron su plazo de pago de la 1ra factura sin pagar — esos no cuentan para
  // tu comisión, sin importar en qué período cayó su instalación.
  const clientesDelPeriodo = useMemo(
    () => clientes.filter((c) => periodoDelCliente(c) === periodoVisto && clienteCuentaParaComision(c)),
    [clientes, periodoVisto]
  );
  const dineroDelPeriodo = useMemo(
    () => clientesDelPeriodo.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0),
    [clientesDelPeriodo]
  );
  const arpuPeriodo = useMemo(() => {
    if (clientesDelPeriodo.length === 0) return 0;
    return dineroDelPeriodo / clientesDelPeriodo.length;
  }, [clientesDelPeriodo, dineroDelPeriodo]);
  const singlesInstalados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.planTipo === "SINGLE").length,
    [clientesDelPeriodo]
  );
  const doblesInstalados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.planTipo === "DOBLE").length,
    [clientesDelPeriodo]
  );
  // Los pendientes de instalación no pertenecen a ningún período todavía (no tienen
  // fecha), así que se muestran como un total aparte, sin importar qué período mires.
  const pendientesAhora = useMemo(() => clientes.filter((c) => !c.fechaInstalacion).length, [clientes]);
  // Clientes que ya perdieron su plazo para pagar la 1ra factura (no cuentan para
  // comisión), solo del período que se está viendo en este momento en el Dashboard.
  const noCuentanComision = useMemo(
    () =>
      clientes.filter(
        (c) => c.fechaInstalacion && periodoDelCliente(c) === periodoVisto && !clienteCuentaParaComision(c)
      ).length,
    [clientes, periodoVisto]
  );

  const convergenciasDelPeriodo = useMemo(
    () => convergencias.filter((c) => periodoComision(fechaActivacionMovil(c)) === periodoVisto),
    [convergencias, periodoVisto]
  );
  // Esquema nuevo: solo cuentan los móviles que pagaron su 1ra factura o siguen dentro
  // de su plazo (antes de octubre cuentan todos).
  const resumenMovilesEsperado = useMemo(() => resumenMovilesNuevo(convergenciasDelPeriodo, false), [convergenciasDelPeriodo]);
  const resumenMovilesConfirmado = useMemo(() => resumenMovilesNuevo(convergenciasDelPeriodo, true), [convergenciasDelPeriodo]);
  const convergenciasPeriodo = resumenMovilesEsperado.cantidad;
  // Esquema nuevo (desde octubre 2026): el costo del plan de los móviles que cuentan
  // suma al ingreso del período.
  const costoPlanesMovilesPeriodo = resumenMovilesEsperado.costoPlanes;

  const historialPeriodos = useMemo(() => {
    const out = [];
    for (let i = 0; i < 6; i++) out.push(sumarMesClave(periodoActual, -i));
    return out;
  }, [periodoActual]);

  const [hoverPeriodo, setHoverPeriodo] = useState(null);

  // Comisión calculada para cada uno de los últimos 4 períodos, más antiguo primero
  // (para graficar de izquierda a derecha en orden cronológico).
  const historialComisiones = useMemo(() => {
    return historialPeriodos
      .slice(0, 4)
      .map((key) => {
        const delPeriodo = clientes.filter((c) => periodoDelCliente(c) === key && clienteCuentaParaComision(c));
        const cantidad = delPeriodo.length;
        const dinero = delPeriodo.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0);
        const arpuP = cantidad > 0 ? dinero / cantidad : 0;
        const converDelPeriodo = convergencias.filter((c) => periodoComision(fechaActivacionMovil(c)) === key);

        if (esquemaNuevo(key)) {
          const rm = resumenMovilesNuevo(converDelPeriodo, false);
          const com = calcularComision({
            periodoKey: key,
            clientesHogar: cantidad,
            metaClientesHogar: leerMeta(metas, key, "clientesHogar"),
            clientesMovil: rm.cantidad,
            metaClientesMovil: leerMeta(metas, key, "clientesMovil"),
            ingresosDelPeriodo: dinero + rm.costoPlanes,
            metaIngresos: leerMeta(metas, key, "dinero"),
            cantidadBonoMovil: rm.bonoConfirmado + rm.bonoPendiente,
            cantidadBonoPendiente: rm.bonoPendiente,
          });
          return { key, cantidad, dinero, arpu: arpuP, ...com };
        }

        const bonoFullTigoP = converDelPeriodo
          .filter((c) => c.fullTigo)
          .reduce((acc, c) => acc + (Number(c.montoPlan) || 0), 0);
        const com = calcularComision({
          periodoKey: key,
          dineroDelPeriodo: dinero,
          metaDinero: leerMeta(metas, key, "dinero"),
          arpuPeriodo: arpuP,
          metaArpu: leerMeta(metas, key, "arpu"),
          clientesInstalados: cantidad,
          metaClientes: leerMeta(metas, key, "clientes"),
          bonoFullTigo: bonoFullTigoP,
        });
        return { key, cantidad, dinero, arpu: arpuP, ...com };
      })
      .reverse();
  }, [historialPeriodos, metas, clientes, convergencias]);

  const periodoMostrado = hoverPeriodo || periodoVisto;
  const idxMostrado = historialComisiones.findIndex((d) => d.key === periodoMostrado);
  const detalleMostrado = idxMostrado >= 0 ? historialComisiones[idxMostrado] : null;
  const detalleAnterior = idxMostrado > 0 ? historialComisiones[idxMostrado - 1] : null;

  const progresoClientesPct = metaClientes ? Math.round((clientesDelPeriodo.length / metaClientes) * 100) : null;
  const progresoDineroPct = metaDinero ? Math.round((dineroDelPeriodo / metaDinero) * 100) : null;
  const progresoArpuPct = metaArpu ? Math.round((arpuPeriodo / metaArpu) * 100) : null;
  const progresoClientesHogarPct = metaClientesHogar ? Math.round((clientesDelPeriodo.length / metaClientesHogar) * 100) : null;
  const progresoClientesMovilPct = metaClientesMovil ? Math.round((convergenciasPeriodo / metaClientesMovil) * 100) : null;
  const progresoIngresoNuevoPct = metaDinero
    ? Math.round(((dineroDelPeriodo + costoPlanesMovilesPeriodo) / metaDinero) * 100)
    : null;

  const bonoFullTigo = useMemo(
    () =>
      convergenciasDelPeriodo
        .filter((c) => c.fullTigo)
        .reduce((acc, c) => acc + (Number(c.montoPlan) || 0), 0),
    [convergenciasDelPeriodo]
  );
  const comision = useMemo(() => {
    if (esNuevo) {
      return calcularComision({
        periodoKey: periodoVisto,
        clientesHogar: clientesDelPeriodo.length,
        metaClientesHogar,
        clientesMovil: convergenciasPeriodo,
        metaClientesMovil,
        ingresosDelPeriodo: dineroDelPeriodo + costoPlanesMovilesPeriodo,
        metaIngresos: metaDinero,
        cantidadBonoMovil: resumenMovilesEsperado.bonoConfirmado + resumenMovilesEsperado.bonoPendiente,
        cantidadBonoPendiente: resumenMovilesEsperado.bonoPendiente,
      });
    }
    return calcularComision({
      periodoKey: periodoVisto,
      dineroDelPeriodo,
      metaDinero,
      arpuPeriodo,
      metaArpu,
      clientesInstalados: clientesDelPeriodo.length,
      metaClientes,
      bonoFullTigo,
    });
  }, [
    esNuevo,
    periodoVisto,
    clientesDelPeriodo.length,
    metaClientesHogar,
    convergenciasPeriodo,
    metaClientesMovil,
    dineroDelPeriodo,
    costoPlanesMovilesPeriodo,
    resumenMovilesEsperado,
    metaDinero,
    arpuPeriodo,
    metaArpu,
    metaClientes,
    bonoFullTigo,
  ]);

  // Versión "confirmada": lo mismo, pero contando solo los clientes de hogar que ya
  // tienen su 1ra factura pagada (deja fuera a los que aún están dentro de su plazo
  // pero todavía no pagan). Los Clientes Móvil siguen la misma regla en el esquema nuevo.
  const clientesDelPeriodoConfirmados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.f1_estado === "pagada"),
    [clientesDelPeriodo]
  );
  const dineroDelPeriodoConfirmado = useMemo(
    () => clientesDelPeriodoConfirmados.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0),
    [clientesDelPeriodoConfirmados]
  );
  const arpuPeriodoConfirmado = useMemo(() => {
    if (clientesDelPeriodoConfirmados.length === 0) return 0;
    return dineroDelPeriodoConfirmado / clientesDelPeriodoConfirmados.length;
  }, [clientesDelPeriodoConfirmados, dineroDelPeriodoConfirmado]);
  const comisionConfirmada = useMemo(() => {
    if (esNuevo) {
      return calcularComision({
        periodoKey: periodoVisto,
        clientesHogar: clientesDelPeriodoConfirmados.length,
        metaClientesHogar,
        clientesMovil: resumenMovilesConfirmado.cantidad,
        metaClientesMovil,
        ingresosDelPeriodo: dineroDelPeriodoConfirmado + resumenMovilesConfirmado.costoPlanes,
        metaIngresos: metaDinero,
        cantidadBonoMovil: resumenMovilesConfirmado.bonoConfirmado,
        cantidadBonoPendiente: 0,
      });
    }
    return calcularComision({
      periodoKey: periodoVisto,
      dineroDelPeriodo: dineroDelPeriodoConfirmado,
      metaDinero,
      arpuPeriodo: arpuPeriodoConfirmado,
      metaArpu,
      clientesInstalados: clientesDelPeriodoConfirmados.length,
      metaClientes,
      bonoFullTigo,
    });
  }, [
    esNuevo,
    periodoVisto,
    clientesDelPeriodoConfirmados.length,
    metaClientesHogar,
    resumenMovilesConfirmado,
    metaClientesMovil,
    dineroDelPeriodoConfirmado,
    metaDinero,
    arpuPeriodoConfirmado,
    metaArpu,
    metaClientes,
    bonoFullTigo,
  ]);

  // ---- Simulador: ¿conviene pagar de mi bolsillo la diferencia de un cliente pendiente? ----
  // A diferencia de la línea "confirmado" de la tarjeta grande (que sigue el período que
  // navegues), este simulador siempre se queda fijo en el ciclo que tiene la ventana de
  // rescate abierta ahora mismo (periodoRescateActivo) — el mismo que usa el uno-por-uno.
  // Como ese ciclo por definición todavía no venció, en la práctica "rescateVencidos"
  // siempre sale vacío acá — se deja el cálculo por si algún día cambia esa regla.
  const esNuevoHoy = periodoRescateActivo ? esquemaNuevo(periodoRescateActivo) : false;
  const metaClientesHogarHoy = periodoRescateActivo ? leerMeta(metas, periodoRescateActivo, "clientesHogar") : null;
  const metaClientesMovilHoy = periodoRescateActivo ? leerMeta(metas, periodoRescateActivo, "clientesMovil") : null;
  const metaDineroHoy = periodoRescateActivo ? leerMeta(metas, periodoRescateActivo, "dinero") : null;
  const metaArpuHoy = periodoRescateActivo ? leerMeta(metas, periodoRescateActivo, "arpu") : null;
  const metaClientesHoy = periodoRescateActivo ? leerMeta(metas, periodoRescateActivo, "clientes") : null;
  const convergenciasPeriodoHoy = useMemo(
    () => (periodoRescateActivo ? convergencias.filter((c) => periodoComision(fechaActivacionMovil(c)) === periodoRescateActivo) : []),
    [convergencias, periodoRescateActivo]
  );
  const resumenMovilesConfirmadoHoy = useMemo(() => resumenMovilesNuevo(convergenciasPeriodoHoy, true), [convergenciasPeriodoHoy]);
  const costoPlanesMovilesPeriodoHoy = resumenMovilesConfirmadoHoy.costoPlanes;
  const bonoFullTigoHoy = useMemo(
    () => convergenciasPeriodoHoy.filter((c) => c.fullTigo).reduce((acc, c) => acc + (Number(c.montoPlan) || 0), 0),
    [convergenciasPeriodoHoy]
  );
  const clientesDelPeriodoHoy = useMemo(
    () => (periodoRescateActivo ? clientes.filter((c) => c.fechaInstalacion && periodoDelCliente(c) === periodoRescateActivo) : []),
    [clientes, periodoRescateActivo]
  );
  const clientesConfirmadosHoy = useMemo(
    () => clientesDelPeriodoHoy.filter((c) => c.f1_estado === "pagada"),
    [clientesDelPeriodoHoy]
  );
  const dineroConfirmadoHoy = useMemo(
    () => clientesConfirmadosHoy.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0),
    [clientesConfirmadosHoy]
  );
  function calcularComisionConSubconjuntoHoy(subset) {
    const clientesSimulados = clientesConfirmadosHoy.length + subset.length;
    const dineroSimulado = dineroConfirmadoHoy + subset.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0);
    const arpuSimulado = clientesSimulados > 0 ? dineroSimulado / clientesSimulados : 0;
    if (esNuevoHoy) {
      return calcularComision({
        periodoKey: periodoRescateActivo,
        clientesHogar: clientesSimulados,
        metaClientesHogar: metaClientesHogarHoy,
        clientesMovil: resumenMovilesConfirmadoHoy.cantidad,
        metaClientesMovil: metaClientesMovilHoy,
        ingresosDelPeriodo: dineroSimulado + costoPlanesMovilesPeriodoHoy,
        metaIngresos: metaDineroHoy,
        cantidadBonoMovil: resumenMovilesConfirmadoHoy.bonoConfirmado,
        cantidadBonoPendiente: 0,
      });
    }
    return calcularComision({
      periodoKey: periodoRescateActivo,
      dineroDelPeriodo: dineroSimulado,
      metaDinero: metaDineroHoy,
      arpuPeriodo: arpuSimulado,
      metaArpu: metaArpuHoy,
      clientesInstalados: clientesSimulados,
      metaClientes: metaClientesHoy,
      bonoFullTigo: bonoFullTigoHoy,
    });
  }
  const comisionConfirmadaHoy = useMemo(
    () => (periodoRescateActivo ? calcularComisionConSubconjuntoHoy([]) : { completo: false, total: 0 }),
    [periodoRescateActivo, clientesConfirmadosHoy.length, dineroConfirmadoHoy, esNuevoHoy, metaClientesHogarHoy, metaClientesMovilHoy, metaDineroHoy, metaArpuHoy, metaClientesHoy, resumenMovilesConfirmadoHoy, bonoFullTigoHoy]
  );
  const rescateVencidos = useMemo(
    () => (periodoRescateActivo ? clientesDelPeriodoHoy.filter((c) => !clienteCuentaParaComision(c)) : []),
    [clientesDelPeriodoHoy, periodoRescateActivo]
  );
  const rescateEnPlazo = useMemo(
    () => (periodoRescateActivo ? clientesDelPeriodoHoy.filter((c) => c.f1_estado !== "pagada" && clienteCuentaParaComision(c)) : []),
    [clientesDelPeriodoHoy, periodoRescateActivo]
  );
  const rescateCandidatos = useMemo(() => [...rescateVencidos, ...rescateEnPlazo], [rescateVencidos, rescateEnPlazo]);
  function montoFaltanteCliente(c) {
    const monto = Number(c.montoMensual) || 0;
    const factorImpuesto = c.planTipo === "DOBLE" ? 1.07 : 1.01;
    return (monto * factorImpuesto) / 2;
  }
  const rescateSeleccionados = useMemo(
    () => rescateCandidatos.filter((c) => rescateSeleccion[c.id]),
    [rescateCandidatos, rescateSeleccion]
  );
  const rescatePones = useMemo(
    () => rescateSeleccionados.reduce((acc, c) => acc + montoFaltanteCliente(c), 0),
    [rescateSeleccionados]
  );
  // La comparación siempre parte de tu comisión CONFIRMADA (solo lo ya pagado) — es la
  // única cifra de la que te puedes fiar hoy.
  const comisionSimulada = useMemo(() => {
    if (rescateSeleccionados.length === 0) return comisionConfirmadaHoy;
    return calcularComisionConSubconjuntoHoy(rescateSeleccionados);
  }, [rescateSeleccionados, comisionConfirmadaHoy, clientesConfirmadosHoy.length, dineroConfirmadoHoy, esNuevoHoy, periodoRescateActivo]);
  const rescateGanancia =
    comisionSimulada.completo && comisionConfirmadaHoy.completo ? comisionSimulada.total - comisionConfirmadaHoy.total : 0;
  // Días que faltan para que cierre la ventana de rescate de este período.
  const rescateDiasRestantes = useMemo(() => {
    if (!periodoRescateActivo) return null;
    const limite = fechaLimitePrimeraFactura(periodoRescateActivo);
    if (!limite) return null;
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return Math.round((limite - hoy) / 86400000);
  }, [periodoRescateActivo]);
  // Qué cambió exactamente con la selección actual: si cruzaste de tramo de base, y
  // (en el esquema nuevo) si activaste o desactivaste el acelerador.
  const rescateCruceTramo =
    comisionSimulada.completo && comisionConfirmadaHoy.completo && comisionSimulada.montoBase !== comisionConfirmadaHoy.montoBase;
  const rescateCruceAcelerador =
    esNuevoHoy &&
    comisionSimulada.completo &&
    comisionConfirmadaHoy.completo &&
    (comisionSimulada.ajusteIngreso === "acelerador") !== (comisionConfirmadaHoy.ajusteIngreso === "acelerador");
  // Cuánto te falta para llegar al siguiente tramo de la tabla, partiendo de lo confirmado
  // (en % de ingresos en el esquema viejo, en % de clientes ponderado en el nuevo).
  const rescateProximoTramo = useMemo(() => {
    if (!comisionConfirmadaHoy.completo) return null;
    const pctActual = esNuevoHoy ? comisionConfirmadaHoy.pctClientesPonderado : comisionConfirmadaHoy.pctIngreso;
    const siguiente = (esNuevoHoy ? TABLA_POSICION_NUEVA : TABLA_COMISION_BASE).find((t) => t.min > pctActual);
    if (!siguiente) return null;
    return { pctFalta: siguiente.min - pctActual, montoSiguiente: siguiente.monto };
  }, [comisionConfirmadaHoy, esNuevoHoy]);
  // Combinación de menor costo que ya alcanza el máximo posible (el mismo total que
  // pagando a todos) — para no cubrir más de lo que hace falta. Se prueban
  // todas las combinaciones porque la lista de candidatos suele ser chica.
  const rescateCombinacionMinima = useMemo(() => {
    if (rescateCandidatos.length === 0 || rescateCandidatos.length > 16) return null;
    const totalMaximo = calcularComisionConSubconjuntoHoy(rescateCandidatos).total;
    if (!comisionConfirmadaHoy.completo || totalMaximo <= comisionConfirmadaHoy.total) return null;
    let mejor = null;
    const n = rescateCandidatos.length;
    for (let mask = 1; mask < 1 << n; mask++) {
      const subset = rescateCandidatos.filter((_, i) => mask & (1 << i));
      if (calcularComisionConSubconjuntoHoy(subset).total < totalMaximo) continue;
      const costo = subset.reduce((acc, c) => acc + montoFaltanteCliente(c), 0);
      if (!mejor || subset.length < mejor.subset.length || (subset.length === mejor.subset.length && costo < mejor.costo)) {
        mejor = { subset, costo };
      }
    }
    return mejor ? mejor.subset : null;
  }, [rescateCandidatos, comisionConfirmadaHoy, clientesConfirmadosHoy.length, dineroConfirmadoHoy, esNuevoHoy, periodoRescateActivo]);
  function marcarCombinacionMinima() {
    if (!rescateCombinacionMinima) return;
    const nuevaSeleccion = {};
    rescateCombinacionMinima.forEach((c) => { nuevaSeleccion[c.id] = true; });
    setRescateSeleccion(nuevaSeleccion);
  }
  // Ordenados por mejor relación (más ingreso por cada dólar que pones), para que los
  // más convenientes aparezcan primero en la lista.
  const rescateVencidosOrdenados = useMemo(
    () => [...rescateVencidos].sort((a, b) => (Number(b.montoMensual) || 0) / montoFaltanteCliente(b) - (Number(a.montoMensual) || 0) / montoFaltanteCliente(a)),
    [rescateVencidos]
  );
  const rescateEnPlazoOrdenados = useMemo(
    () => [...rescateEnPlazo].sort((a, b) => (Number(b.montoMensual) || 0) / montoFaltanteCliente(b) - (Number(a.montoMensual) || 0) / montoFaltanteCliente(a)),
    [rescateEnPlazo]
  );

  // Proyección a fin de ciclo: regla de tres simple sobre el ritmo actual.
  // El ARPU no se extrapola directo (es un promedio) — se deriva de clientes/ingreso ya proyectados.
  // La comisión tampoco se extrapola directo (tiene tramos escalonados) — se vuelve a calcular
  // con calcularComision() usando los valores ya proyectados.
  const proyeccion = useMemo(() => {
    if (!puedeProyectar) return null;
    const factor = cicloInfo.totalDias / cicloInfo.diasTranscurridos;
    const clientesProy = Math.round(clientesDelPeriodo.length * factor);
    const dineroProy = dineroDelPeriodo * factor;
    const arpuProy = clientesProy > 0 ? dineroProy / clientesProy : 0;

    if (esNuevo) {
      const convergenciasProy = Math.round(convergenciasPeriodo * factor);
      const bonoMovilProy = Math.round((resumenMovilesEsperado.bonoConfirmado + resumenMovilesEsperado.bonoPendiente) * factor);
      const costoPlanesProy = costoPlanesMovilesPeriodo * factor;
      const comisionProy = calcularComision({
        periodoKey: periodoVisto,
        clientesHogar: clientesProy,
        metaClientesHogar,
        clientesMovil: convergenciasProy,
        metaClientesMovil,
        ingresosDelPeriodo: dineroProy + costoPlanesProy,
        metaIngresos: metaDinero,
        cantidadBonoMovil: bonoMovilProy,
        cantidadBonoPendiente: 0,
      });
      return {
        clientes: clientesProy,
        dinero: dineroProy,
        arpu: arpuProy,
        comision: comisionProy.total,
        convergencias: convergenciasProy,
        ingresos: dineroProy + costoPlanesProy,
        montoBase: comisionProy.montoBase,
      };
    }

    const bonoFullTigoProy = bonoFullTigo * factor;
    const comisionProy = calcularComision({
      periodoKey: periodoVisto,
      dineroDelPeriodo: dineroProy,
      metaDinero,
      arpuPeriodo: arpuProy,
      metaArpu,
      clientesInstalados: clientesProy,
      metaClientes,
      bonoFullTigo: bonoFullTigoProy,
    });
    return { clientes: clientesProy, dinero: dineroProy, arpu: arpuProy, comision: comisionProy.total };
  }, [
    puedeProyectar,
    cicloInfo,
    esNuevo,
    periodoVisto,
    clientesDelPeriodo.length,
    dineroDelPeriodo,
    bonoFullTigo,
    metaDinero,
    metaArpu,
    metaClientes,
    convergenciasPeriodo,
    costoPlanesMovilesPeriodo,
    resumenMovilesEsperado,
    metaClientesHogar,
    metaClientesMovil,
  ]);

  // Precio promedio real de tus planes SINGLE y DOBLE (según lo que ya cargaste),
  // para poder recomendar cuántos clientes de cada tipo hacen falta para llegar al ARPU meta.
  const precioPromedioPlan = useMemo(() => {
    function promedio(tipo) {
      const delPeriodo = clientesDelPeriodo.filter((c) => c.planTipo === tipo);
      const base = delPeriodo.length > 0 ? delPeriodo : clientes.filter((c) => c.planTipo === tipo && c.fechaInstalacion);
      if (base.length === 0) return null;
      return base.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0) / base.length;
    }
    return { SINGLE: promedio("SINGLE"), DOBLE: promedio("DOBLE") };
  }, [clientesDelPeriodo, clientes]);

  const recomendacionArpu = useMemo(() => {
    if (!esActual || !metaArpu) return null;
    const C = clientesDelPeriodo.length;
    const D = dineroDelPeriodo;
    if (C > 0 && D / C >= metaArpu) return { alcanzado: true };
    function paraTipo(precio) {
      if (precio == null) return null;
      if (precio <= metaArpu) return { imposible: true, precio };
      const n = Math.max(0, Math.ceil((metaArpu * C - D) / (precio - metaArpu)));
      return { n, precio };
    }
    return { alcanzado: false, single: paraTipo(precioPromedioPlan.SINGLE), doble: paraTipo(precioPromedioPlan.DOBLE) };
  }, [esActual, metaArpu, clientesDelPeriodo.length, dineroDelPeriodo, precioPromedioPlan]);

  const [copiadoReporte, setCopiadoReporte] = useState(false);

  // ---- Modo revisión diaria (foco en clientes que necesitan atención HOY) ----
  // Los clientes que sí marcaste como pagados dejan de aparecer solos (cambia su
  // estado de riesgo real). Los que dejaste como "no pagó todavía" no vuelven a
  // aparecer en la cola de HOY (para poder terminar la lista sin dar vueltas en
  // círculo), pero si mañana siguen sin pagar, vuelven a aparecer — el registro de
  // "revisados hoy" es local al celular y se reinicia solo cada día.
  const [revisadosHoy, setRevisadosHoy] = useState(() => {
    try {
      const guardado = JSON.parse(localStorage.getItem("revision_diaria_hoy") || "null");
      const hoy = fechaLocalISO(new Date());
      if (guardado && guardado.fecha === hoy) return guardado.ids || [];
    } catch (e) {}
    return [];
  });
  function marcarRevisadoHoy(clienteId) {
    setRevisadosHoy((prev) => {
      const nuevos = prev.includes(clienteId) ? prev : [...prev, clienteId];
      try {
        localStorage.setItem("revision_diaria_hoy", JSON.stringify({ fecha: fechaLocalISO(new Date()), ids: nuevos }));
      } catch (e) {}
      return nuevos;
    });
  }

  // Se muestra UN SOLO ciclo a la vez: el de instalación cuya fecha límite real
  // (día 5 del segundo período completo después de instalarse) es la más próxima
  // que todavía no pasó. Así el día 5 todavía se ve el ciclo que vence ese día
  // ("Vence HOY"), y desde el día 6 pasa solo al siguiente, sin mezclar dos ciclos.
  // Se calcula con la fecha límite real de cada ciclo, no con resta fija de meses,
  // para que siga funcionando aunque algún período dure más o menos de lo normal.
  // Dentro del ciclo, solo entran los que todavía no pagaron su 1ra factura.
  const enRiesgoHoy = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const periodoObjetivo = periodoRescateActivo;
    if (!periodoObjetivo) return [];
    return clientes
      .filter((c) => c.f1_estado !== "pagada" && c.fechaInstalacion && periodoDelCliente(c) === periodoObjetivo)
      .map((c) => {
        const facturaPendiente = (c.facturas || []).find((f) => f.n === 1) || null;
        const fechaLimite = fechaLimitePrimeraFactura(periodoDelCliente(c));
        const diasParaLimite = fechaLimite ? Math.round((fechaLimite - hoy) / 86400000) : null;
        const vencido = diasParaLimite !== null && diasParaLimite < 0;
        const texto =
          diasParaLimite === null
            ? "⚠️ Debe pagar su 1ra factura para contar en tu comisión"
            : vencido
            ? `⛔ Venció el ${fmtFecha(fechaLocalISO(fechaLimite))} — ya no cuenta si no paga ya`
            : diasParaLimite === 0
            ? "⏰ Vence HOY — última oportunidad"
            : `⚠️ Vence el ${fmtFecha(fechaLocalISO(fechaLimite))} (${diasParaLimite} día${diasParaLimite === 1 ? "" : "s"})`;
        return {
          cliente: c,
          facturaPendiente,
          fechaLimite,
          diasParaLimite,
          riesgo: { texto, color: vencido || diasParaLimite === 0 ? "#B45309" : "#B45309", bg: vencido || diasParaLimite === 0 ? "#FFF6E3" : "#FFF6E3" },
        };
      })
      .filter((x) => x.diasParaLimite === null || x.diasParaLimite >= 0)
      .sort((a, b) => (a.diasParaLimite ?? 999) - (b.diasParaLimite ?? 999));
  }, [clientes, periodoRescateActivo]);

  // Clientes que saltaste "por ahora" en el uno-por-uno: no quedan marcados como
  // revisados (mañana vuelven a aparecer igual si siguen sin resolver), pero se van
  // al final de la cola de hoy para no verlos en bucle.
  const [saltadosHoy, setSaltadosHoy] = useState([]);
  const pendientesHoy = useMemo(() => {
    const noRevisados = enRiesgoHoy.filter((x) => !revisadosHoy.includes(x.cliente.id));
    const noSaltados = noRevisados.filter((x) => !saltadosHoy.includes(x.cliente.id));
    const saltados = saltadosHoy.map((id) => noRevisados.find((x) => x.cliente.id === id)).filter(Boolean);
    return [...noSaltados, ...saltados];
  }, [enRiesgoHoy, revisadosHoy, saltadosHoy]);
  function saltarPorAhora(clienteId) {
    setSaltadosHoy((prev) => (prev.includes(clienteId) ? prev : [...prev, clienteId]));
  }
  const [mostrarRevisionDiaria, setMostrarRevisionDiaria] = useState(false);
  const [revisionDiariaAbierto, setRevisionDiariaAbierto] = useState(vista === "cobros");
  const [cobroMesAbierto, setCobroMesAbierto] = useState(false);

  // ---- Lo que se cobra este mes ----
  // Este mes se cobra el ciclo de hace 2 períodos (septiembre cobra julio, octubre cobra
  // agosto...), y su fecha límite de pago de la 1ra factura es el día 5 de este mismo mes.
  // "Confirmado" cuenta solo a los que ya pagaron; "si pagan los pendientes" suma también
  // a los que todavía están dentro de su plazo. Los que ya vencieron sin pagar no cuentan.
  const cobroMes = useMemo(() => {
    const periodoCobro = sumarMesClave(periodoActual, -2);
    const nuevo = esquemaNuevo(periodoCobro);
    const delCiclo = clientes.filter((c) => c.fechaInstalacion && periodoDelCliente(c) === periodoCobro);
    const pagados = delCiclo.filter((c) => c.f1_estado === "pagada");
    const enPlazo = delCiclo.filter((c) => c.f1_estado !== "pagada" && clienteCuentaParaComision(c));
    const vencidos = delCiclo.filter((c) => !clienteCuentaParaComision(c));
    const converDelCiclo = convergencias.filter((c) => periodoComision(fechaActivacionMovil(c)) === periodoCobro);
    const bonoFullTigoCiclo = converDelCiclo.filter((c) => c.fullTigo).reduce((a, c) => a + (Number(c.montoPlan) || 0), 0);

    const calcular = (lista, soloConfirmados) => {
      const dinero = lista.reduce((a, c) => a + (Number(c.montoMensual) || 0), 0);
      const cant = lista.length;
      if (nuevo) {
        const rm = resumenMovilesNuevo(converDelCiclo, soloConfirmados);
        return calcularComision({
          periodoKey: periodoCobro,
          clientesHogar: cant,
          metaClientesHogar: leerMeta(metas, periodoCobro, "clientesHogar"),
          clientesMovil: rm.cantidad,
          metaClientesMovil: leerMeta(metas, periodoCobro, "clientesMovil"),
          ingresosDelPeriodo: dinero + rm.costoPlanes,
          metaIngresos: leerMeta(metas, periodoCobro, "dinero"),
          cantidadBonoMovil: rm.bonoConfirmado + rm.bonoPendiente,
          cantidadBonoPendiente: rm.bonoPendiente,
        });
      }
      return calcularComision({
        periodoKey: periodoCobro,
        dineroDelPeriodo: dinero,
        metaDinero: leerMeta(metas, periodoCobro, "dinero"),
        arpuPeriodo: cant > 0 ? dinero / cant : 0,
        metaArpu: leerMeta(metas, periodoCobro, "arpu"),
        clientesInstalados: cant,
        metaClientes: leerMeta(metas, periodoCobro, "clientes"),
        bonoFullTigo: bonoFullTigoCiclo,
      });
    };

    const faltantes = (nuevo
      ? [["clientesHogar", "clientes hogar"], ["clientesMovil", "clientes móvil"], ["dinero", "ingresos"]]
      : [["clientes", "clientes"], ["dinero", "ingresos"], ["arpu", "ARPU"]]
    )
      .filter(([campo]) => !leerMeta(metas, periodoCobro, campo))
      .map(([, nombre]) => nombre);

    return {
      periodoCobro,
      nuevo,
      confirmado: calcular(pagados, true),
      siPagan: calcular([...pagados, ...enPlazo], false),
      nPagados: pagados.length,
      nEnPlazo: enPlazo.length,
      nVencidos: vencidos.length,
      nConvergencias: converDelCiclo.length,
      fechaLimite: fechaLimitePrimeraFactura(periodoCobro),
      faltantes,
      vacio: delCiclo.length === 0 && converDelCiclo.length === 0,
    };
  }, [clientes, convergencias, metas, periodoActual]);
  const [mostrarSimuladorArpu, setMostrarSimuladorArpu] = useState(false);

  function generarReporteDiario() {
    const ahora = new Date();
    const hoy = fechaLocalISO(ahora);
    const hora = ahora.getHours();
    const saludo = hora < 12 ? "Buenos días" : hora < 18 ? "Buenas tardes" : "Buenas noches";
    const ingresadosHoy = clientes.filter((c) => c.creadoEn && fechaLocalISO(c.creadoEn) === hoy);
    const doblesHoy = ingresadosHoy.filter((c) => c.planTipo === "DOBLE");
    const singlesHoy = ingresadosHoy.filter((c) => c.planTipo === "SINGLE");
    const converHoy = convergencias.filter((c) => c.creadoEn && fechaLocalISO(c.creadoEn) === hoy);

    // Una línea por plan: "300 Megas + COMBO PACK: 111, 222". Cada plan se escribe una sola vez.
    const textoPlan = (c) => {
      const partes = [(c.velocidad || "").trim(), c.planTipo === "DOBLE" && c.planTV ? "+ " + String(c.planTV).trim() : ""].filter(Boolean);
      return partes.length ? partes.join(" ") : "Sin plan";
    };
    const bloque = (titulo, lista) => {
      if (!lista.length) return "";
      const porPlan = new Map();
      lista.forEach((c) => {
        const p = textoPlan(c);
        if (!porPlan.has(p)) porPlan.set(p, []);
        porPlan.get(p).push((c.numeroSuscriptor || "").trim() || "sin suscriptor");
      });
      const lineas = [...porPlan.entries()].map(([plan, susc]) => `${plan}: ${susc.join(", ")}`);
      return `*${titulo}: ${lista.length}*\n${lineas.join("\n")}`;
    };

    // Convergencias: solo el total del día, sin nombres ni tipo.
    const bloqueConver = converHoy.length ? `*Convergencias: ${converHoy.length}*` : "";

    const bloques = [bloque("Dobles", doblesHoy), bloque("Singles", singlesHoy), bloqueConver].filter(Boolean);
    const cuerpo = bloques.length ? bloques.join("\n\n") : "Sin resultados, solo prospectos.";
    const texto = `${saludo}\n*Gestión de hoy* · ${fmtFecha(hoy)}\n\n${cuerpo}`;

    navigator.clipboard
      ?.writeText(texto)
      .then(() => {
        setCopiadoReporte(true);
        setTimeout(() => setCopiadoReporte(false), 2000);
      })
      .catch(() => {});
  }

  // Ganancia estimada de rescatar UN cliente puntual (usada en el modo uno-por-uno).
  // Se calcula sola, sin depender de qué período estés viendo en el Dashboard, usando
  // el período propio del cliente. El bono FULL TIGO del esquema viejo no se suma acá
  // (es una estimación rápida para decidir en el momento, no el número exacto).
  function calcularGananciaPorRescate(cliente) {
    const periodoCliente = periodoDelCliente(cliente);
    if (!periodoCliente) return null;
    const nuevo = esquemaNuevo(periodoCliente);
    const confirmadosDelPeriodo = clientes.filter(
      (c) => c.fechaInstalacion && periodoDelCliente(c) === periodoCliente && c.f1_estado === "pagada"
    );
    const converDelPeriodo = convergencias.filter((c) => periodoComision(fechaActivacionMovil(c)) === periodoCliente);
    const rmConfirmados = resumenMovilesNuevo(converDelPeriodo, true);

    function calcularCon(lista) {
      const dinero = lista.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0);
      if (nuevo) {
        return calcularComision({
          periodoKey: periodoCliente,
          clientesHogar: lista.length,
          metaClientesHogar: leerMeta(metas, periodoCliente, "clientesHogar"),
          clientesMovil: rmConfirmados.cantidad,
          metaClientesMovil: leerMeta(metas, periodoCliente, "clientesMovil"),
          ingresosDelPeriodo: dinero + rmConfirmados.costoPlanes,
          metaIngresos: leerMeta(metas, periodoCliente, "dinero"),
          cantidadBonoMovil: rmConfirmados.bonoConfirmado,
          cantidadBonoPendiente: 0,
        });
      }
      return calcularComision({
        periodoKey: periodoCliente,
        dineroDelPeriodo: dinero,
        metaDinero: leerMeta(metas, periodoCliente, "dinero"),
        arpuPeriodo: lista.length > 0 ? dinero / lista.length : 0,
        metaArpu: leerMeta(metas, periodoCliente, "arpu"),
        clientesInstalados: lista.length,
        metaClientes: leerMeta(metas, periodoCliente, "clientes"),
        bonoFullTigo: 0,
      });
    }

    const comisionBase = calcularCon(confirmadosDelPeriodo);
    const comisionCon = calcularCon([...confirmadosDelPeriodo, cliente]);
    if (!comisionBase.completo || !comisionCon.completo) return null;
    return comisionCon.total - comisionBase.total;
  }

  const vistaCobros = (
    <div>
      <h1 className="text-2xl font-semibold mb-4">Cobros</h1>

      {/* Sección 1: lo que hay que cobrar sí o sí para que cuente en la comisión */}
      <h2 className="text-xs font-bold uppercase tracking-wide mb-2" style={ { color: "#6B7280" } }>1 · Cobrar sí o sí</h2>
      <div className="rounded-xl overflow-hidden border mb-8 bg-white" style={ { borderColor: "#E5E7EB" } }>
      <div className="px-4 py-3">
        {enRiesgoHoy.length > 0 ? (
          <>
            <div className="text-sm font-bold" style={ { color: "#001E62" } }>
              <span style={ { color: "#B45309", fontSize: 18 } }>{enRiesgoHoy.length}</span> por cobrar
            </div>
            <div className="text-xs mt-0.5" style={ { color: "#6B7280" } }>
              Si no pagan, no cuentan
              {rescateDiasRestantes !== null && (
                <React.Fragment>
                  {" · "}
                  <span style={ rescateDiasRestantes <= 7 ? { color: "#B45309", fontWeight: 700 } : undefined }>
                    {rescateDiasRestantes <= 7 ? "⏳ " : ""}
                    {rescateDiasRestantes <= 0 ? "vence hoy" : rescateDiasRestantes === 1 ? "queda 1 día" : `quedan ${rescateDiasRestantes} días`}
                  </span>
                </React.Fragment>
              )}
            </div>
          </>
        ) : (
          <div className="text-sm font-bold" style={ { color: "#001E62" } }>✓ Todos pagaron su 1ra factura</div>
        )}
      </div>
      {enRiesgoHoy.length > 0 && (
        <div className="px-4 pb-3">
          <button
            type="button"
            onClick={() => setMostrarRevisionDiaria(true)}
            className="w-full py-3 rounded-lg text-white font-semibold text-sm"
            style={ { background: "#001E62" } }
          >
            {pendientesHoy.length > 0
              ? `Revisar uno a uno · ${pendientesHoy.length} por revisar hoy`
              : "✓ Ya revisaste tus clientes de hoy · Ver de nuevo"}
          </button>
        </div>
      )}

      {mostrarRevisionDiaria && (
        <RevisionDiariaModal
          pendientes={pendientesHoy}
          total={enRiesgoHoy.length}
          permiteParcial={(c) => (c.facturas || []).some((f) => f.n === 1 && f.milestones.some((m) => m.type === "toque1"))}
          onMarcarPagada={(clienteId, n, opciones) => {
            onActualizarEstadoFactura(clienteId, n, "pagada", opciones || {});
            marcarRevisadoHoy(clienteId);
          } }
          onNoPagoTodavia={marcarRevisadoHoy}
          onDescartar={(clienteId) => {
            onDescartarCliente(clienteId, fechaLocalISO(new Date()), "falta_pago");
            marcarRevisadoHoy(clienteId);
          } }
          onSaltar={saltarPorAhora}
          onCopiarSuscriptor={onCopiarSuscriptor}
          copiedSubKey={copiedSubKey}
          onCalcularGanancia={calcularGananciaPorRescate}
          onCerrar={() => setMostrarRevisionDiaria(false)}
        />
      )}
      {periodoRescateActivo && (() => {
        const mesPago = mesLabel(sumarMesClave(periodoRescateActivo, 2)).split(" ")[0];
        const hayPendientes = rescateCandidatos.length > 0;
        const colorTexto = !comisionConfirmadaHoy.completo ? "#B45309" : hayPendientes ? "#B45309" : "#001E62";
        const fondoBanner = !comisionConfirmadaHoy.completo ? "#FFF6E3" : hayPendientes ? "#FFF6E3" : "#EEF3FB";
        const urgente = hayPendientes && rescateDiasRestantes !== null && rescateDiasRestantes <= 3;
        const textoResumen = !comisionConfirmadaHoy.completo
          ? `Asegurar comisión de ${mesPago}: faltan metas`
          : `Asegurar comisión de ${mesPago} · confirmado ${fmtMonto(comisionConfirmadaHoy.total)}`;
        return (
          <div style={ { borderTop: "1px solid #E5E7EB" } }>
            <button
              type="button"
              onClick={() => setRescateAbierto((v) => !v)}
              className="w-full flex items-center justify-between gap-2 text-left px-4 py-3"
              style={ { background: fondoBanner } }
            >
              <span
                className="text-xs truncate"
                style={ { color: colorTexto, fontWeight: urgente ? 700 : 500, textDecoration: urgente ? "underline" : "none" } }
              >
                {textoResumen}
                {hayPendientes &&
                  rescateDiasRestantes !== null &&
                  (rescateDiasRestantes <= 0
                    ? " · hoy"
                    : rescateDiasRestantes <= 3
                    ? ` · ${rescateDiasRestantes}d ⚠️`
                    : ` · ${rescateDiasRestantes}d`)}
              </span>
              <span className="text-xs shrink-0" style={ { color: colorTexto } }>{rescateAbierto ? "▲" : "▼"}</span>
            </button>

          {rescateAbierto && (
            <div className="bg-white border-t border-gray-200 p-4">
              <p className="text-xs mb-2" style={ { color: "#6B7280" } }>
                Confirmado: {comisionConfirmadaHoy.completo ? fmtMonto(comisionConfirmadaHoy.total) : "—"}. Marca los clientes a regularizar y mira cuánto sube.
              </p>
              {rescateCandidatos.length === 0 ? (
                <p className="text-sm font-medium" style={ { color: "#001E62" } }>✓ Todos tus clientes de este ciclo ya pagaron su 1ra factura.</p>

// Estado de navegación del Dashboard para volver desde la ficha de un cliente
// sin perder el período ni el día que estabas viendo.
const memoriaDashboard = { retorno: false, periodo: null, dia: null, diaPeriodo: null };
function nombreBonito(n) {
  const minus = ["de", "del", "la", "las", "los", "y", "e"];
  return String(n || "").toLowerCase().split(/\s+/).filter(Boolean).map((p, i) => (i > 0 && minus.includes(p) ? p : p.charAt(0).toUpperCase() + p.slice(1))).join(" ");
}
function nombreDia(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  return dias[new Date(y, m - 1, d).getDay()] + " " + d + " de " + meses[m - 1];
}
// Tarjeta única de avance del período (esquema nuevo): barras de clientes hogar,
// clientes móvil e ingresos con ritmo esperado, resumen por tipo y gráfica diaria apilada.
// Una venta se instala ~2 días después (y si cae en domingo pasa al lunes), así que el
// "último día que cuenta" es el último del mes cuya instalación todavía cae dentro del mes.
function AvanceMetasCard({ periodoKey, esActual, hogar, moviles, dineroHogar, dineroMovil, metaClientesHogar, metaClientesMovil, metaDinero, onActualizarMeta, onVerClientes, onVerCliente }) {
  const [editMetas, setEditMetas] = useState(false);
  const [diaSel, setDiaSel] = useState(memoriaDashboard.retorno && memoriaDashboard.diaPeriodo === periodoKey ? memoriaDashboard.dia : null);
  function elegirDia(i) {
    memoriaDashboard.dia = i;
    memoriaDashboard.diaPeriodo = periodoKey;
    setDiaSel(i);
  }

  const info = useMemo(() => {
    const { inicio, fin } = rangoCiclo(periodoKey);
    const dias = [];
    const cursor = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate());
    const ultimoDia = new Date(fin.getFullYear(), fin.getMonth(), fin.getDate());
    while (cursor <= ultimoDia) {
      dias.push(fechaLocalISO(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
    const tot = dias.length;
    // último día en que una venta todavía se instala dentro del período
    let lim = tot;
    for (let d = tot; d >= 1; d--) {
      const inst = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + d - 1 + 2);
      if (inst.getDay() === 0) inst.setDate(inst.getDate() + 1);
      if (inst <= ultimoDia) { lim = d; break; }
    }
    const hoyISO = fechaLocalISO(new Date());
    let hoy = tot;
    if (esActual) {
      const idx = dias.indexOf(hoyISO);
      hoy = idx >= 0 ? idx + 1 : (hoyISO < dias[0] ? 0 : tot);
    }
    const A = dias.map(() => []);
    const B = dias.map(() => []);
    const colocar = (lista, arr, fechaDe, valorDe) => {
      lista.forEach((c) => {
        const f = fechaDe(c);
        if (!f) return;
        let i = dias.indexOf(f);
        if (i < 0) i = f < dias[0] ? 0 : -1;
        if (i >= 0) arr[i].push({ nombre: c.nombre || "Sin nombre", v: valorDe(c), cliente: c });
      });
    };
    colocar(hogar, A, (c) => c.fechaInstalacion, (c) => Number(c.montoMensual) || 0);
    colocar(moviles, B, (c) => fechaActivacionMovil(c), (c) => Number(c.montoPlan) || 0);
    return { dias, tot, lim, hoy, A, B };
  }, [periodoKey, esActual, hogar, moviles]);

  const { dias, tot, lim, hoy, A, B } = info;
  const cerrado = !esActual;
  const esp = cerrado ? 100 : lim ? Math.min(100, (hoy / lim) * 100) : 100;
  const fx = (v) => String(Math.round(v));
  const cuenta = (arr) => arr.length;
  const serieA = A.map(cuenta);
  const serieB = B.map(cuenta);
  const totA = serieA.reduce((a, v) => a + v, 0);
  const totB = serieB.reduce((a, v) => a + v, 0);
  const totDia = serieA.map((v, i) => v + serieB[i]);
  const totAll = totA + totB;
  const metaGrafica = (metaClientesHogar || 0) + (metaClientesMovil || 0);
  const ritmo = metaGrafica && lim ? metaGrafica / lim : 0;

  // texto de estado de cada línea: cumplida / proyección / lo que falta
  const fx0 = fx;
  const textoEstado = (meta, actual) => {
    if (!meta) return null;
    const falta = Math.max(0, meta - actual);
    if (cerrado) return actual >= meta ? "✓ Meta cumplida" : "No llegó a la meta (faltaron " + fx(falta) + ")";
    const dRest = lim - hoy + 1;
    const pr = hoy >= 4 ? Math.floor((actual / hoy) * lim) : 0;
    if (falta <= 0) return "✓ Meta cumplida" + (pr > meta ? " · vas para ~" + fx0(pr) : "");
    if (dRest <= 0) return "Ya no entran más ventas";
    if (pr >= meta) return "A este ritmo cierras con ~" + fx0(pr) + " (meta " + fx0(meta) + ")";
    return "Te faltan " + fx(falta) + " en " + dRest + " días";
  };
  const promedio = (v) => (hoy > 0 ? (v / hoy).toFixed(1) : "—");

  const barras = [
    { nom: "Clientes hogar", actual: hogar.length, meta: metaClientesHogar, fmt: (v) => String(v), enlace: () => onVerClientes({ periodo: periodoKey }) },
    { nom: "Clientes móvil", actual: moviles.length, meta: metaClientesMovil, fmt: (v) => String(v), enlace: () => onVerClientes({ periodo: periodoKey, subVista: "movil" }) },
    { nom: "Ingresos", actual: dineroHogar + dineroMovil, meta: metaDinero, fmt: (v) => fmtMonto(v), extra: "Hogar " + fmtMonto(dineroHogar) + " + planes móviles " + fmtMonto(dineroMovil) },
  ];

  // gráfica
  const W = 640, H = 190, PL = 40, PR = 8, PT = 18, PB = 22;
  const mx = Math.max(1, ...totDia, ritmo) * 1.2;
  const y = (v) => PT + (1 - v / mx) * (H - PT - PB);
  const dw = (W - PL - PR) / Math.max(1, tot);
  const bw = Math.max(2, dw - 3);
  const mejor = totDia.reduce((bi, v, i) => (v > totDia[bi] ? i : bi), 0);
  const marcasX = [1, 5, 10, 15, 20, 25, tot].filter((d, i, a) => d <= tot && a.indexOf(d) === i);
  const sel = diaSel !== null && diaSel < tot ? diaSel : null;
  const dineroDe = (arr) => arr.reduce((a, e) => a + e.v, 0);
  const acumDineroHasta = (i) => { let t = 0; for (let k = 0; k <= i; k++) t += dineroDe(A[k]) + dineroDe(B[k]); return t; };
  const uid = "avm" + periodoKey.replace("-", "");

  return (
    <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-5 mb-6">
      <div className="flex items-baseline justify-between flex-wrap gap-2">
        <h2 className="font-semibold text-sm" style={ { color: "#001E62" } }>{cerrado ? "Cómo cerró el período" : "Avance del período"}</h2>
        <div className="text-xs flex items-center gap-2" style={ { color: "#6B7280" } }>
          <span>{cerrado ? "Período cerrado" : "Día " + hoy + " · últimas ventas que cuentan: día " + lim}</span>
          <button type="button" onClick={() => setEditMetas(!editMetas)} className="underline underline-offset-2" style={ { color: "#6B7280" } }>✎ Metas</button>
        </div>
      </div>

      {editMetas && (
        <div className="mt-3 rounded-lg p-3" style={ { background: "#F4F6FA", border: "1px solid #E5E7EB" } }>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <div className="text-[11px] mb-1" style={ { color: "#6B7280" } }>Meta clientes hogar</div>
              <MetaInput valor={metaClientesHogar} onConfirmar={(v) => onActualizarMeta(periodoKey, "clientesHogar", v)} width="w-20" />
            </div>
            <div>
              <div className="text-[11px] mb-1" style={ { color: "#6B7280" } }>Meta clientes móvil</div>
              <MetaInput valor={metaClientesMovil} onConfirmar={(v) => onActualizarMeta(periodoKey, "clientesMovil", v)} width="w-20" />
            </div>
            <div>
              <div className="text-[11px] mb-1" style={ { color: "#6B7280" } }>Meta ingresos ($)</div>
              <MetaInput valor={metaDinero} onConfirmar={(v) => onActualizarMeta(periodoKey, "dinero", v)} width="w-24" step="0.01" />
            </div>
          </div>
          <p className="text-[11px] mt-2" style={ { color: "#6B7280" } }>La meta de ingresos define el acelerador (±10%).</p>
        </div>
      )}

      {barras.map((b) => {
        const p = b.meta ? (b.actual / b.meta) * 100 : 0;
        const dif = p - esp;
        const est = !b.meta ? ["Sin meta", "#374151", "#F4F6FA"] : cerrado ? (p >= 100 ? ["✓ Cumplida", "#001E62", "#EEF3FB"] : ["▼ No llegó", "#B45309", "#FFF6E3"]) : dif >= 5 ? ["▲ Adelantado", "#001E62", "#EEF3FB"] : dif <= -5 ? ["▼ Atrasado", "#B45309", "#FFF6E3"] : ["● En ritmo", "#374151", "#F4F6FA"];
        const falta = b.meta ? Math.max(0, b.meta - b.actual) : 0;
        return (
          <div key={b.nom} className="mt-4">
            <div className="flex items-center justify-between gap-2 mb-1.5">
              {b.enlace ? (
                <button type="button" onClick={b.enlace} className="text-sm font-semibold hover:underline underline-offset-2" style={ { color: "#111827" } } title="Ver clientes de este período">{b.nom} →</button>
              ) : (
                <span className="text-sm font-semibold" style={ { color: "#111827" } }>{b.nom}</span>
              )}
              <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap" style={ { color: est[1], background: est[2] } }>{est[0]}</span>
            </div>
            <div className="relative h-3.5 rounded-full" style={ { background: "#F4F6FA", border: "1px solid #E5E7EB" } }>
              <div className="absolute left-0 top-0 bottom-0 rounded-full" style={ { width: Math.min(100, p) + "%", background: "#001E62" } } />
              {b.meta && !cerrado ? (
                <div className="absolute" style={ { left: esp + "%", top: "-5px", bottom: "-5px", borderLeft: "2px dashed #B45309" } } />
              ) : null}
            </div>
            <div className="flex items-center justify-between flex-wrap gap-x-3 mt-1 text-xs" style={ { color: "#6B7280" } }>
              <span><span className="font-mono font-semibold" style={ { color: "#111827" } }>{b.fmt(b.actual)}</span>{b.meta ? <> de <span className="font-mono font-semibold" style={ { color: "#111827" } }>{b.fmt(b.meta)}</span> · {Math.round(p)}%</> : null}</span>
              <span>{!b.meta ? "Pon la meta con ✎ Metas" : falta > 0 ? <>Te faltan <span className="font-mono font-semibold" style={ { color: "#111827" } }>{b.fmt(falta)}</span></> : "✓ Meta cumplida"}</span>
            </div>
            {b.extra ? <div className="text-[11px] mt-0.5" style={ { color: "#6B7280" } }>{b.extra}</div> : null}
          </div>
        );
      })}
      {!cerrado && (
        <div className="flex items-center gap-1.5 text-[11px] mt-3" style={ { color: "#B45309" } }>
          <span style={ { display: "inline-block", height: "12px", borderLeft: "2px dashed #B45309" } } />
          Marca punteada = dónde deberías ir hoy para llegar a la meta con la última venta que cuenta (2 días de margen y sin instalar en domingo)
        </div>
      )}

      <hr className="my-5" style={ { borderColor: "#E5E7EB" } } />
      <h2 className="font-semibold text-sm" style={ { color: "#001E62" } }>Lo que ingresas cada día</h2>

      <div className="mt-3 text-[13px] leading-relaxed" style={ { color: "#111827" } }>
        {[
          { sq: "#001E62", nom: "Hogar", v: totA, meta: metaClientesHogar },
          { sq: "dot", nom: "Móvil", v: totB, meta: metaClientesMovil },
        ].map((l) => (
          <div key={l.nom} className="flex items-center gap-2 flex-wrap">
            <span style={ l.sq === "dot" ? { width: "12px", height: "10px", borderRadius: "2px", border: "1px solid #B45309", background: "radial-gradient(#B45309 1.4px, #fff 1.5px) 0 0 / 5px 5px", display: "inline-block" } : { width: "12px", height: "10px", borderRadius: "2px", background: l.sq, display: "inline-block" } } />
            <span>{l.nom}:</span>
            <span className="font-mono font-semibold" style={ { color: "#001E62" } }>{fx(l.v)}</span>
            {cerrado ? null : <span>en {hoy} días · <span className="font-mono font-semibold" style={ { color: "#001E62" } }>{promedio(l.v)}</span> por día</span>}
            {l.meta ? <span className="text-xs" style={ { color: "#B45309" } }>{textoEstado(l.meta, l.v)}</span> : null}
          </div>
        ))}
        <div className="text-xs mt-0.5" style={ { color: "#6B7280" } }>
          Total: <span className="font-mono font-semibold" style={ { color: "#001E62" } }>{fx(totAll)}</span> clientes
        </div>
      </div>

      <svg viewBox={ "0 0 " + W + " " + H } className="w-full mt-2" role="img" aria-label="Lo que ingresas por día" style={ { display: "block" } }>
        <defs>
          <pattern id={uid + "pt"} width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff" /><circle cx="2.5" cy="2.5" r="1.7" fill="#B45309" /></pattern>
          <pattern id={uid + "pn"} width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fff" /><line x1="0" y1="0" x2="0" y2="4" stroke="#9CA3AF" strokeWidth="1.5" /></pattern>
        </defs>
        <line x1={PL} x2={W - PR} y1={y(0)} y2={y(0)} stroke="#E5E7EB" />
        <text x={PL - 5} y={y(0) + 4} textAnchor="end" fontSize="10" fill="#6B7280">0</text>
        <text x={PL - 5} y={y(mx / 1.2) + 4} textAnchor="end" fontSize="10" fill="#6B7280">{fx0(mx / 1.2)}</text>
        {dias.map((d, i) => {
          const x = PL + i * dw + 1.5;
          if (i + 1 > lim) return <rect key={d} x={x} y={y(0) - 6} width={bw} height="6" fill={ "url(#" + uid + "pn)" } opacity="0.55" />;
          if (!cerrado && i >= hoy) return <rect key={d} x={x} y={y(0) - 1.5} width={bw} height="1.5" fill="#E5E7EB" />;
          const a = serieA[i], b = serieB[i];
          const resalta = sel === i;
          if (a + b === 0) return <rect key={d} x={x} y={y(0) - 2} width={bw} height="2" fill="#C7D2E8" style={ { cursor: "pointer" } } onClick={() => elegirDia(i)} />;
          return (
            <g key={d} style={ { cursor: "pointer" } } onClick={() => elegirDia(i)} opacity={sel !== null && !resalta ? 0.55 : 1}>
              <rect x={x} y={y(a)} width={bw} height={Math.max(0, y(0) - y(a))} fill="#001E62" rx={b ? 0 : 2.5} />
              {b ? <rect x={x} y={y(a + b)} width={bw} height={Math.max(0, y(a) - y(a + b))} fill={ "url(#" + uid + "pt)" } stroke="#B45309" strokeWidth="1" rx="2" /> : null}
            </g>
          );
        })}
        {totDia[mejor] > 0 && (cerrado || mejor < hoy) ? (
          <text x={PL + mejor * dw + dw / 2} y={y(totDia[mejor]) - 5} textAnchor="middle" fontSize="10" fontWeight="700" fill="#001E62">{fx0(totDia[mejor])}</text>
        ) : null}
        {ritmo > 0 ? (
          <>
            <line x1={PL} x2={W - PR} y1={y(ritmo)} y2={y(ritmo)} stroke="#B45309" strokeWidth="1.5" strokeDasharray="5 4" />
            <text x={W - PR} y={y(ritmo) - 4} textAnchor="end" fontSize="10" fill="#B45309">{"Ritmo: " + ritmo.toFixed(1) + " por día"}</text>
          </>
        ) : null}
        {marcasX.map((d) => (
          <text key={d} x={PL + (d - 1) * dw + dw / 2} y={H - 6} textAnchor="middle" fontSize="10" fill={!cerrado && d === hoy ? "#001E62" : "#6B7280"} fontWeight={!cerrado && d === hoy ? "700" : "400"}>{d}</text>
        ))}
      </svg>
      <div className="flex gap-x-4 gap-y-1 flex-wrap text-[11px] mt-1.5" style={ { color: "#6B7280" } }>
        <span>■ Clientes hogar</span>
        <span>▨ Clientes móvil</span>
        {ritmo > 0 ? <span style={ { color: "#B45309" } }>╌ Ritmo diario para llegar a la meta</span> : null}
        <span>▨ gris = días que ya no cuentan (la instalación caería en el mes siguiente)</span>
      </div>

      <div className="mt-3 rounded-lg p-3.5 text-[13px]" style={ { background: "#F4F6FA", color: "#111827", minHeight: "46px" } }>
        {sel === null ? (
          <span className="text-xs">Toca una barra para ver qué entró ese día.</span>
        ) : (
          <>
            <div className="flex items-baseline justify-between gap-2 pb-2" style={ { borderBottom: "1px solid #E5E7EB" } }>
              <span className="font-semibold">Día {sel + 1} · {nombreDia(dias[sel])}</span>
              <span className="font-mono font-bold text-[15px]" style={ { color: "#001E62" } }>{fmtMonto(dineroDe(A[sel]) + dineroDe(B[sel]))}</span>
            </div>
            {A[sel].length + B[sel].length === 0 ? <div className="mt-2 text-xs" style={ { color: "#6B7280" } }>No entró nada ese día.</div> : null}
            {[
              { nom: "Hogar", lista: A[sel], hogar: true },
              { nom: "Móvil", lista: B[sel], hogar: false },
            ].filter((g) => g.lista.length > 0).map((g) => (
              <div key={g.nom} className="mt-3">
                <div className="flex items-center justify-between gap-2 text-xs font-semibold">
                  <span className="flex items-center gap-1.5">
                    <span style={ g.hogar ? { width: "12px", height: "10px", borderRadius: "2px", background: "#001E62", display: "inline-block" } : { width: "12px", height: "10px", borderRadius: "2px", border: "1px solid #B45309", background: "radial-gradient(#B45309 1.4px, #fff 1.5px) 0 0 / 5px 5px", display: "inline-block" } } />
                    {g.nom} · {g.lista.length} {g.lista.length === 1 ? "cliente" : "clientes"}
                  </span>
                  <span className="font-mono" style={ { color: "#001E62" } }>{fmtMonto(dineroDe(g.lista))}</span>
                </div>
                {g.lista.map((e, k) => (
                  <div key={k} className="grid gap-2.5 py-1 items-start" style={ { gridTemplateColumns: "62px 1fr", paddingLeft: "19px" } }>
                    <span className="font-mono">{fmtMonto(e.v)}</span>
                    <button
                      type="button"
                      onClick={() => (g.hogar ? onVerCliente(e.cliente) : onVerClientes({ periodo: periodoKey, subVista: "movil" }))}
                      className="text-left underline underline-offset-2 hover:opacity-80"
                      style={ { color: "#0072CE", overflowWrap: "anywhere" } }
                      title={g.hogar ? "Ver ficha del cliente" : "Ver en Clientes móvil"}
                    >
                      {nombreBonito(e.nombre)}
                    </button>
                  </div>
                ))}
              </div>
            ))}
            <div className="mt-3 pt-2 text-[11px]" style={ { borderTop: "1px solid #E5E7EB", color: "#6B7280" } }>
              Acumulado: <b className="font-mono" style={ { color: "#111827" } }>{fmtMonto(acumDineroHasta(sel))}</b>
              {metaDinero ? <> de <b className="font-mono" style={ { color: "#111827" } }>{fmtMonto(metaDinero)}</b> ({Math.round((acumDineroHasta(sel) / metaDinero) * 100)}%)</> : null}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function HistorialComisionChart({ data, periodoActivo, onSelect, onHover }) {
  const max = Math.max(1, ...data.map((d) => d.total));
  const ALTURA_MAX = 110;
  return (
    <div className="flex items-end gap-3 sm:gap-4" style={ { height: ALTURA_MAX + 44 } }>
      {data.map((d) => {
        const alturaPx = Math.max(6, Math.round((d.total / max) * ALTURA_MAX));
        const activo = d.key === periodoActivo;
        return (
          <button
            key={d.key}
            type="button"
            onClick={() => onSelect(d.key)}
            onMouseEnter={() => onHover(d.key)}
            onMouseLeave={() => onHover(null)}
            onFocus={() => onHover(d.key)}
            onBlur={() => onHover(null)}
            className="flex-1 flex flex-col items-center justify-end gap-1.5"
          >
            <span className="text-[11px] font-mono font-semibold whitespace-nowrap" style={ { color: activo ? "#001E62" : "#9CA3AF" } }>
              {fmtMonto(d.total)}
            </span>
            <div
              className="w-full rounded-t-md transition-all"
              style={ { height: alturaPx, background: activo ? "#001E62" : "#C7D2E8" } }
            />
            <span className="text-[11px] font-medium" style={ { color: activo ? "#001E62" : "#6B7280" } }>
              {mesLabel(d.key).split(" ")[0].slice(0, 3).toUpperCase()}
            </span>
          </button>
        );
      })}
    </div>
  );
}

function AlertasTab({ alertasHoy, alertasTodas, onMarcar, onCopiarSuscriptor, copiedSubKey, onPagoRealizado, onVerDetalle, search, setSearch, filtroTipo, setFiltroTipo }) {
  const [expandidos, setExpandidos] = useState(new Set());
  const [extrasAbiertos, setExtrasAbiertos] = useState(new Set());
  const [listaAbierta, setListaAbierta] = useState(false);

  // ---- Envío en cadena por WhatsApp ----
  // Cola de alertas pendientes de recorrer una por una: abre WhatsApp con el
  // mensaje, y al volver pregunta si se envió antes de pasar a la siguiente.
  const [colaEnvio, setColaEnvio] = useState(null); // null = inactivo
  const [indiceEnvio, setIndiceEnvio] = useState(0);
  const [contadorEnviados, setContadorEnviados] = useState(0);
  const [resumenEnvio, setResumenEnvio] = useState(null); // { total, enviados } al terminar

  function iniciarEnvioEnCadena(lista) {
    if (!lista.length) return;
    setColaEnvio(lista);
    setIndiceEnvio(0);
    setContadorEnviados(0);
    setResumenEnvio(null);
    window.location.href = whatsappLink(lista[0].cliente, lista[0].milestone);
  }

  function avanzarEnvio(marcarComoEnviado) {
    const actual = colaEnvio[indiceEnvio];
    if (marcarComoEnviado) {
      onMarcar(actual.cliente.id, actual.milestone.key);
    }
    const nuevosEnviados = contadorEnviados + (marcarComoEnviado ? 1 : 0);
    const siguienteIndice = indiceEnvio + 1;
    if (siguienteIndice >= colaEnvio.length) {
      setResumenEnvio({ total: colaEnvio.length, enviados: nuevosEnviados });
      setColaEnvio(null);
    } else {
      setContadorEnviados(nuevosEnviados);
      setIndiceEnvio(siguienteIndice);
      const siguiente = colaEnvio[siguienteIndice];
      window.location.href = whatsappLink(siguiente.cliente, siguiente.milestone);
    }
  }

  function cancelarEnvioEnCadena() {
    setColaEnvio(null);
    setIndiceEnvio(0);
  }

  const conteosPorTipo = useMemo(() => {
    const c = {};
    alertasHoy.forEach(({ milestone }) => { c[milestone.type] = (c[milestone.type] || 0) + 1; });
    return c;
  }, [alertasHoy]);

  // Alertas adicionales que tiene el mismo cliente y que quedaron ocultas al
  // colapsar a "una alerta por cliente" (la más urgente se muestra arriba).
  const extrasPorCliente = useMemo(() => {
    const map = new Map();
    (alertasTodas || []).forEach((a) => {
      const arr = map.get(a.cliente.id) || [];
      arr.push(a);
      map.set(a.cliente.id, arr);
    });
    return map;
  }, [alertasTodas]);

  const q = search.trim().toLowerCase();
  const alertasFiltradas = alertasHoy
    .filter(({ milestone }) => (filtroTipo ? milestone.type === filtroTipo : true))
    .filter(({ cliente }) =>
      q
        ? cliente.nombre.toLowerCase().includes(q) ||
          (cliente.telefono || "").toLowerCase().includes(q) ||
          (cliente.numeroSuscriptor || "").toLowerCase().includes(q)
        : true
    );

  // Agrupa por urgencia para que se puedan escanear las más críticas primero.
  const GRUPOS = [
    { type: "t3", titulo: "⏰ 3 días (urgente)" },
    { type: "t15", titulo: "⏰ 15 días" },
    { type: "d1", titulo: "🧾 Nueva factura" },
    { type: "toque2", titulo: "🔔 Recordatorio de abono" },
    { type: "toque1", titulo: "👋 Bienvenida (pedir abono)" },
  ];
  const gruposConDatos = GRUPOS.map((g) => ({
    ...g,
    items: alertasFiltradas.filter(({ milestone }) => milestone.type === g.type),
  })).filter((g) => g.items.length > 0);

  function toggleExpandido(id) {
    setExpandidos((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  function toggleExtras(id) {
    setExtrasAbiertos((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  function diasTexto(triggerDate) {
    const dias = daysFromToday(triggerDate);
    if (dias === 0) return "Vence hoy";
    const abs = Math.abs(dias);
    return `Atrasada hace ${abs} día${abs === 1 ? "" : "s"}`;
  }

  return (
    <div>
      <h2 className="text-xs font-bold uppercase tracking-wide mb-2 mt-8" style={ { color: "#6B7280" } }>2 · Recordatorios</h2>
      <div className="bg-white rounded-xl border overflow-hidden mb-4" style={ { borderColor: "#E5E7EB" } }>
        <div className="px-4 py-3.5" style={ { borderBottom: "1px solid #E5E7EB" } }>
          <div className="text-sm font-bold" style={ { color: "#001E62" } }>
            {alertasHoy.length > 0 ? (
              <React.Fragment><span style={ { color: "#B45309", fontSize: 18 } }>{alertasHoy.length}</span> {alertasHoy.length === 1 ? "recordatorio por enviar" : "recordatorios por enviar"}</React.Fragment>
            ) : "✓ Sin recordatorios por enviar"}
          </div>
          <div className="text-xs mt-0.5" style={ { color: "#6B7280" } }>Mensaje automático para que paguen su factura</div>
        </div>
        {alertasHoy.length > 0 && (
          <div className="p-4">
            <button
              type="button"
              onClick={() => iniciarEnvioEnCadena(alertasHoy)}
              disabled={!!colaEnvio}
              className="w-full py-3 rounded-lg text-white text-sm font-semibold disabled:opacity-50"
              style={ { background: "#001E62" } }
            >
              Enviar recordatorios <span style={ { fontWeight: 500, opacity: 0.8 } }>· {alertasHoy.length} por WhatsApp</span>
            </button>
          </div>
        )}
        {alertasHoy.length > 0 && (
          <button
            type="button"
            onClick={() => setListaAbierta((v) => !v)}
            className="w-full flex items-center justify-between px-4 py-3 text-sm font-semibold text-left"
            style={ { background: "#EEF3FB", color: "#001E62", border: 0, borderTop: "1px solid #E5E7EB", cursor: "pointer" } }
          >
            <span>Ver lista</span><span>{listaAbierta ? "▲" : "▼"}</span>
          </button>
        )}
      </div>

      {colaEnvio && (
        <div
          className="sticky top-0 z-10 flex items-center justify-between gap-3 rounded-lg p-4 mb-4 flex-wrap"

function ultimosMeses(count) {
  const MESES_CAP = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const hoy = new Date();
  const out = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    out.push({ key, label: MESES_CAP[d.getMonth()], anio: d.getFullYear() });
  }
  return out;
}
