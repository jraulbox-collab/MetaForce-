// Filtro de Clientes según el estado real de la 1ra factura.
function pasaFiltroFactura(c, f) {
  if (f === "penalizado") return !!c.penalizado;
  if (f === "pago1") return c.f1_estado === "pagada";
  if (f === "nopago1") return !!c.fechaInstalacion && c.f1_estado !== "pagada";
  if (f === "nocuenta") return !!c.fechaInstalacion && !clienteCuentaParaComision(c);
  return true;
}

function ClientesTab({ clientes, search, setSearch, onEdit, onDelete, onMarcarPagada, onActualizarEstadoFactura, onVerDetalle, onNuevo, eliminados, onRecuperar, saltarAMes, onSaltoAplicado, columnasClientes, setColumnasClientes, periodoActual, mesActivo, setMesActivo, filtrosClientes, setFiltrosClientes, clientesMovil, onAgregarMovil, onEditarMovil, onEliminarMovil, onVolverAPrecierre }) {
  const meses = useMemo(() => periodosRecientes(4), []);
  const mesActualKey = meses[0].key;
  const mesActivoEfectivo = mesActivo || mesActualKey;

  // Todos estos filtros viven en App (no aquí) para que no se reseteen cuando entras
  // al detalle de un cliente y vuelves atrás — quedan tal como los dejaste.
  const { modoVerTodos, ordenarPor, ordenDireccion, filtroEstado, filtroInstalacion, filtroPlan, fechaDesde, fechaHasta } = filtrosClientes;
  function hacerSetter(key) {
    return (valOrFn) => {
      setFiltrosClientes((prev) => ({
        ...prev,
        [key]: typeof valOrFn === "function" ? valOrFn(prev[key]) : valOrFn,
      }));
    };
  }
  const setModoVerTodos = hacerSetter("modoVerTodos");
  const setOrdenarPor = hacerSetter("ordenarPor");
  const setOrdenDireccion = hacerSetter("ordenDireccion");
  const setFiltroEstado = hacerSetter("filtroEstado");
  const setFiltroInstalacion = hacerSetter("filtroInstalacion");
  const setFiltroPlan = hacerSetter("filtroPlan");
  const setFechaDesde = hacerSetter("fechaDesde");
  const setFechaHasta = hacerSetter("fechaHasta");

  const [subVista, setSubVista] = useState("clientes");
  const [abrirFormMovil, setAbrirFormMovil] = useState(false);
  const [prefillMovil, setPrefillMovil] = useState(null);
  useEffect(() => {
    if (saltarAMes) {
      if (saltarAMes.periodo) setMesActivo(saltarAMes.periodo);
      setSubVista(saltarAMes.subVista === "movil" ? "movil" : "clientes");
      if (saltarAMes.abrirForm) {
        setPrefillMovil(saltarAMes.prefill || null);
        setAbrirFormMovil(true);
      }
      setFiltrosClientes((prev) => ({
        ...prev,
        fechaDesde: "",
        fechaHasta: "",
        filtroPlan: saltarAMes.filtroPlan || "",
        filtroInstalacion: saltarAMes.filtroInstalacion || "",
        filtroEstado: saltarAMes.filtroEstado || "",
        modoVerTodos: !!saltarAMes.todosLosMeses,
      }));
      setSearch("");
      setFiltrosAbiertos(true);
      // La orden de "saltar a tal mes/filtros" se usa UNA sola vez: se borra en cuanto
      // se aplica, para que al volver del detalle de un cliente no se vuelva a ejecutar
      // y te pise el mes y los filtros que tenías.
      if (onSaltoAplicado) onSaltoAplicado();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [saltarAMes]);
  const rangoActivo = !!(fechaDesde || fechaHasta);
  const [copiedCell, setCopiedCell] = useState(null);
  const [papeleraAbierta, setPapeleraAbierta] = useState(false);
  const [filtrosAbiertos, setFiltrosAbiertos] = useState(false);
  const ordenColumnas = columnasClientes.orden;
  const columnasVisibles = columnasClientes.visibles;
  const [mostrarSelectorColumnas, setMostrarSelectorColumnas] = useState(false);
  const [colArrastrando, setColArrastrando] = useState(null);

  function handleOrdenarPorColumna(key) {
    const col = COLUMNAS_CLIENTES.find((c) => c.key === key);
    if (!col || !col.sortable) return;
    if (ordenarPor === key) setOrdenDireccion((d) => (d === "asc" ? "desc" : "asc"));
    else {
      setOrdenarPor(key);
      setOrdenDireccion("asc");
    }
  }

  function moverColumna(key, direccion) {
    setColumnasClientes((prev) => {
      const idx = prev.orden.indexOf(key);
      const nuevoIdx = idx + direccion;
      if (nuevoIdx < 0 || nuevoIdx >= prev.orden.length) return prev;
      const next = [...prev.orden];
      [next[idx], next[nuevoIdx]] = [next[nuevoIdx], next[idx]];
      return { ...prev, orden: next };
    });
  }

  function handleDropColumna(keyDestino) {
    if (!colArrastrando || colArrastrando === keyDestino) {
      setColArrastrando(null);
      return;
    }
    setColumnasClientes((prev) => {
      const next = [...prev.orden];
      const fromIdx = next.indexOf(colArrastrando);
      const toIdx = next.indexOf(keyDestino);
      next.splice(fromIdx, 1);
      next.splice(toIdx, 0, colArrastrando);
      return { ...prev, orden: next };
    });
    setColArrastrando(null);
  }

  const columnasAMostrar = ordenColumnas.filter((k) => columnasVisibles[k]);

  function copiarCelda(texto, id, campo) {
    navigator.clipboard?.writeText(texto || "").catch(() => {});
    setCopiedCell(id + campo);
    setTimeout(() => setCopiedCell(null), 1200);
  }

  function renderCeldaCliente(c, key) {
    switch (key) {
      case "suscriptor":
        return (
          <div className="flex items-center gap-1.5 font-mono text-xs">
            <span>{c.numeroSuscriptor}</span>
            <button
              onClick={() => copiarCelda(c.numeroSuscriptor, c.id, "sub")}
              title="Copiar número de suscriptor"
              className="text-xs"
              style={ { color: copiedCell === c.id + "sub" ? "#0F766E" : "#9CA3AF" } }
            >
              {copiedCell === c.id + "sub" ? "✓" : "📋"}
            </button>
          </div>
        );
      case "cliente":
        return (
          <div className="max-w-[150px]">
            <button
              onClick={() => onVerDetalle(c)}
              title={c.nombre}
              className="font-medium text-left hover:underline truncate block w-full"
              style={ { color: "#001E62" } }
            >
              {c.nombre}
            </button>
            <div className="text-xs font-mono flex items-center gap-1.5" style={ { color: "#9CA3AF" } }>
              <span>{c.telefono}</span>
              <button
                onClick={() => copiarCelda(c.telefono, c.id, "tel")}
                title="Copiar teléfono"
                className="text-xs"
                style={ { color: copiedCell === c.id + "tel" ? "#0F766E" : "#9CA3AF" } }
              >
                {copiedCell === c.id + "tel" ? "✓" : "📋"}
              </button>
            </div>
          </div>
        );
      case "plan":
        return planResumen(c);
      case "monto":
        return <span className="font-mono text-xs">{c.montoMensual ? fmtMonto(c.montoMensual) : "—"}</span>;
      case "ciclo":
        return <span className="font-mono text-xs">{cicloCorto(c)}</span>;
      case "instalacion":
        return c.fechaInstalacion ? (
          <span className="font-mono text-xs">{fmtFecha(c.fechaInstalacion)}</span>
        ) : (
          <span className="text-xs font-bold px-2 py-1 rounded-full" style={ { background: "#F59E0B", color: "white" } }>
            ⚠️ PENDIENTE POR INSTALAR
          </span>
        );
      case "ingreso":
        return <span className="font-mono text-xs">{c.creadoEn ? fmtFecha(c.creadoEn.slice(0, 10)) : "—"}</span>;
      case "periodo": {
        const p = periodoDelCliente(c);
        return p ? <span className="text-xs">{mesLabel(p)}</span> : <span className="text-xs" style={ { color: "#9CA3AF" } }>—</span>;
      }
      case "seguimiento": {
        if (!c.fechaInstalacion) {
          return (
            <span
              className="text-xs font-medium px-2 py-1 rounded-full inline-block whitespace-nowrap"
              style={ { color: "#B8791F", background: "#FBF1DE" } }
            >
              ⚠️ Pendiente por instalar
            </span>
          );
        }
        const mes = mesCicloCliente(c.fechaInstalacion, periodoActual);
        if (mes === null || mes < 2 || mes > 4) {
          if (!clienteCuentaParaComision(c)) {
            return (
              <span
                className="text-xs font-medium px-2 py-1 rounded-full inline-block whitespace-nowrap"
                style={ { color: "#B91C1C", background: "#FBEAEA" } }
              >
                ⛔ No cuenta para comisión
              </span>
            );
          }
          return <span className="text-xs" style={ { color: "#D1D5DB" } }>—</span>;
        }
        const riesgo = estadoRiesgoChurn(c, periodoActual);
        const generadas = (c.facturas || []).filter((f) => daysFromToday(f.generada) <= 0);
        return (
          <div className="flex flex-col gap-1 items-start">
            {riesgo && (
              <span
                className="text-xs font-medium px-2 py-1 rounded-full inline-block whitespace-nowrap"
                style={ { color: riesgo.color, background: riesgo.bg } }
              >
                {riesgo.texto}
              </span>
            )}
            {generadas.length > 0 && (
              <div className="flex items-center gap-1">
                {generadas.map((f) => (
                  <FacturaDot key={f.n} cliente={c} n={f.n} onCambiar={onActualizarEstadoFactura} />
                ))}
              </div>
            )}
          </div>
        );
      }
      case "obs":
        return c.observaciones && c.observaciones.trim() ? (
          <span title={c.observaciones}>📝</span>
        ) : (
          <span style={ { color: "#D1D5DB" } }>—</span>
        );
      default:
        return null;
    }
  }

  const clientesDelMes = useMemo(() => {
    return clientes.filter((c) => periodoDelCliente(c) === mesActivoEfectivo);
  }, [clientes, mesActivoEfectivo]);
  const visibles = search.trim() || rangoActivo || modoVerTodos ? clientes : clientesDelMes;
  const visiblesOrdenados = useMemo(() => {
    const arr = [...visibles];
    arr.sort((a, b) => {
      const va = valorOrdenColumna(a, ordenarPor);
      const vb = valorOrdenColumna(b, ordenarPor);
      let cmp;
      if (typeof va === "number" && typeof vb === "number") cmp = va - vb;
      else cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return ordenDireccion === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [visibles, ordenarPor, ordenDireccion]);
  const visiblesFinal = useMemo(() => {
    const baseSinPenalizados = filtroEstado === "penalizado" ? visiblesOrdenados : visiblesOrdenados.filter((c) => !c.penalizado);
    let arr = filtroEstado ? baseSinPenalizados.filter((c) => pasaFiltroFactura(c, filtroEstado)) : baseSinPenalizados;
    if (filtroInstalacion === "instalados") arr = arr.filter((c) => !!c.fechaInstalacion);
    if (filtroInstalacion === "pendientes") arr = arr.filter((c) => !c.fechaInstalacion);
    if (filtroPlan) arr = arr.filter((c) => c.planTipo === filtroPlan);
    if (rangoActivo) {
      arr = arr.filter((c) => {
        if (!c.fechaInstalacion) return false;
        if (fechaDesde && c.fechaInstalacion < fechaDesde) return false;
        if (fechaHasta && c.fechaInstalacion > fechaHasta) return false;
        return true;
      });
    }
    return arr;
  }, [visiblesOrdenados, filtroEstado, filtroInstalacion, filtroPlan, rangoActivo, fechaDesde, fechaHasta]);
  const filtrosActivos = [filtroEstado, filtroInstalacion, filtroPlan, rangoActivo].filter(Boolean).length;
  const statsClientes = useMemo(() => {
    const instalados = visiblesFinal.filter((c) => !!c.fechaInstalacion).length;
    return { instalados, pendientes: visiblesFinal.length - instalados, total: visiblesFinal.length };
  }, [visiblesFinal]);

  const [exportarAbierto, setExportarAbierto] = useState(false);
  // Cuántos Cliente Móvil hay en el mismo período que se está viendo en Clientes.
  const clientesMovilDelMes = useMemo(
    () => (clientesMovil || []).filter((c) => periodoComision(fechaActivacionMovil(c)) === mesActivoEfectivo).length,
    [clientesMovil, mesActivoEfectivo]
  );

  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h1 className="text-2xl font-semibold">Clientes</h1>
        <div className="flex items-center gap-2">
          <button
            onClick={() => setExportarAbierto(true)}
            className="text-sm font-medium px-3 py-2 rounded-md border flex items-center gap-1.5"
            style={ { borderColor: "#D1D5DB", color: "#374151" } }
            title="Exportar suscriptores instalados en un rango de fechas"
          >
            ⬇️ Exportar suscriptores
          </button>
          <button
            onClick={() => setPapeleraAbierta(true)}
            className="text-sm font-medium px-3 py-2 rounded-md border flex items-center gap-1.5"
            style={ { borderColor: "#D1D5DB", color: "#374151" } }
            title="Ver clientes eliminados"
          >
            🗑️ Papelera{eliminados.length > 0 ? ` (${eliminados.length})` : ""}
          </button>
          <button onClick={onNuevo} className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>
            + Nuevo cliente
          </button>
        </div>
      </div>

      <div className="flex items-center gap-1.5 mb-4">
        <button
          onClick={() => setSubVista("clientes")}
          className="text-sm font-medium px-3 py-1.5 rounded-md border"
          style={
            subVista === "clientes"
              ? { background: "#001E62", borderColor: "#001E62", color: "white" }
              : { borderColor: "#D1D5DB", color: "#374151" }
          }
        >
          👥 Clientes
        </button>
        <button
          onClick={() => setSubVista("movil")}
          className="text-sm font-medium px-3 py-1.5 rounded-md border"
          style={
            subVista === "movil"
              ? { background: "#001E62", borderColor: "#001E62", color: "white" }
              : { borderColor: "#D1D5DB", color: "#374151" }
          }
        >
          📱 Clientes Móvil ({clientesMovilDelMes})
        </button>
      </div>

      {subVista === "movil" ? (
        <ClientesMovilPanel
          clientesMovil={clientesMovil || []}
          onAgregar={onAgregarMovil}
          onEditar={onEditarMovil}
          onEliminar={onEliminarMovil}
          mesActivo={mesActivoEfectivo}
          abrirForm={abrirFormMovil}
          prefill={prefillMovil}
          onFormAbierto={() => { setAbrirFormMovil(false); setPrefillMovil(null); }}
          onVolverAPrecierre={onVolverAPrecierre}
        />
      ) : (
        <>
      {exportarAbierto && <ExportarModal clientes={clientes} onCerrar={() => setExportarAbierto(false)} />}
      <div className="flex items-center gap-4 mb-4 flex-wrap">
        <p className="text-sm">
          <span className="font-semibold" style={ { color: "#0F766E" } }>{statsClientes.instalados}</span>{" "}
          <span style={ { color: "#6B7280" } }>instalados</span>
        </p>
        <p className="text-sm">
          <span className="font-semibold" style={ { color: "#F59E0B" } }>{statsClientes.pendientes}</span>{" "}
          <span style={ { color: "#6B7280" } }>pendientes de instalación</span>
        </p>
        <p className="text-sm">
          <span className="font-semibold" style={ { color: "#001E62" } }>{statsClientes.total}</span>{" "}
          <span style={ { color: "#6B7280" } }>clientes en total</span>
        </p>
      </div>

      {modoVerTodos && (
        <div className="flex items-center justify-between gap-2 rounded-md p-2.5 mb-3" style={ { background: "#E3EDFA" } }>
          <span className="text-xs font-medium" style={ { color: "#0072CE" } }>Mostrando resultados de todos los meses.</span>
          <button
            type="button"
            onClick={() => setModoVerTodos(false)}
            className="text-xs font-medium"
            style={ { color: "#0072CE" } }
          >
            Volver a vista por mes
          </button>
        </div>
      )}

      <div className="flex items-center gap-1.5 mb-4 flex-wrap">
        {meses.map((m, i) => (
          <button
            key={m.key}
            onClick={() => { setMesActivo(m.key); setModoVerTodos(false); } }
            disabled={rangoActivo || modoVerTodos}
            className="text-xs font-medium px-3 py-1.5 rounded-full border transition-colors disabled:opacity-40"
            style={ {
              borderColor: mesActivoEfectivo === m.key ? "#001E62" : "#D1D5DB",
              background: mesActivoEfectivo === m.key ? "#001E62" : "white",
              color: mesActivoEfectivo === m.key ? "white" : "#374151",
            } }
          >
            {m.label.toUpperCase()}{i === 0 ? " (actual)" : ""}
          </button>
        ))}
      </div>

      <div className="relative mb-3">
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Buscar en todos los meses por nombre, teléfono, suscriptor o plan…"
          className="w-full px-3 py-2 pr-9 rounded-md border text-sm outline-none"
          style={ { borderColor: "#D1D5DB" } }
        />
        {search && (
          <button
            onClick={() => setSearch("")}
            className="absolute top-1/2 -translate-y-1/2 text-sm font-medium px-1.5"
            style={ {
              color: "#9CA3AF",
              left: `min(calc(0.75rem + ${search.length}ch + 0.3rem), calc(100% - 2.1rem))`,
            } }
            title="Limpiar búsqueda"
          >
            ✕
          </button>
        )}
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <button
          type="button"
          onClick={() => setFiltrosAbiertos((v) => !v)}
          className="text-xs font-medium px-3 py-1.5 rounded-md border flex items-center gap-1.5"
          style={ {
            borderColor: filtrosActivos > 0 ? "#0072CE" : "#D1D5DB",
            color: filtrosActivos > 0 ? "#0072CE" : "#374151",
            background: filtrosActivos > 0 ? "#E3EDFA" : "white",
          } }
        >
          🔍 Filtros{filtrosActivos > 0 ? ` (${filtrosActivos})` : ""} {filtrosAbiertos ? "▲" : "▼"}
        </button>
        {filtrosActivos > 0 && (
          <button
            type="button"
            onClick={() => {
              setFiltroEstado("");
              setFiltroInstalacion("");
              setFiltroPlan("");
              setFechaDesde("");
              setFechaHasta("");
            } }
            className="text-xs font-medium px-3 py-1.5 rounded-md border flex items-center gap-1.5"
            style={ { borderColor: "#F3C6C6", color: "#C23B3B", background: "#FBEAEA" } }
          >
            ✕ Limpiar filtros
          </button>
        )}
        <button
          type="button"
          onClick={() => setMostrarSelectorColumnas(true)}
          className="text-xs font-medium px-3 py-1.5 rounded-md border flex items-center gap-1.5"
          style={ { borderColor: "#D1D5DB", color: "#374151" } }
        >
          🧱 Columnas ({columnasAMostrar.length})
        </button>
      </div>

      {filtrosAbiertos && (
        <div className="mb-4 bg-white rounded-lg border border-gray-200 shadow-sm p-4 flex flex-col gap-4">
          <div className="rounded-md p-3" style={ { background: rangoActivo ? "#E3EDFA" : "#F4F6FA" } }>
            <div className="flex items-center justify-between mb-2 flex-wrap gap-1">
              <span className="text-xs font-semibold" style={ { color: "#374151" } }>Rango de fechas (instalación)</span>
              {rangoActivo && (
                <button
                  type="button"
                  onClick={() => { setFechaDesde(""); setFechaHasta(""); } }
                  className="text-xs font-medium"
                  style={ { color: "#0072CE" } }
                >
                  Limpiar rango
                </button>
              )}
            </div>
            <div className="flex items-center gap-4 flex-wrap">
              <label className="flex items-center gap-1.5 text-xs" style={ { color: "#6B7280" } }>
                Rango de fechas de instalación
                <RangoFechasInput
                  desde={fechaDesde}
                  hasta={fechaHasta}
                  onChange={(d, h) => { setFechaDesde(d); setFechaHasta(h); } }
                  className="px-2 py-1 rounded-md border text-xs outline-none cursor-pointer"
                  style={ { borderColor: "#D1D5DB", minWidth: "180px" } }
                />
              </label>
            </div>
          </div>

          <p className="text-[11px] -mb-1" style={ { color: "#9CA3AF" } }>Tip: toca el encabezado de cualquier columna en la tabla para ordenar por ella.</p>

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <FiltroCampo label="Tipo de plan">
              <select
                value={filtroPlan}
                onChange={(e) => setFiltroPlan(e.target.value)}
                className="w-full text-xs px-2 py-1.5 rounded-md border outline-none"
                style={ { borderColor: "#D1D5DB" } }
              >
                <option value="">Todos</option>
                {TIPOS_PLAN.map((t) => <option key={t} value={t}>{t === "SINGLE" ? "Single" : "Doble"}</option>)}
              </select>
            </FiltroCampo>

            <FiltroCampo label="Instalación">
              <select
                value={filtroInstalacion}
                onChange={(e) => setFiltroInstalacion(e.target.value)}
                className="w-full text-xs px-2 py-1.5 rounded-md border outline-none"
                style={ { borderColor: "#D1D5DB" } }
              >
                <option value="">Todos</option>
                <option value="instalados">Instalados</option>
                <option value="pendientes">Pendientes de instalación</option>
              </select>
            </FiltroCampo>

            <FiltroCampo label="1ra factura">
              <select
                value={filtroEstado}
                onChange={(e) => setFiltroEstado(e.target.value)}
                className="w-full text-xs px-2 py-1.5 rounded-md border outline-none"
                style={ { borderColor: "#D1D5DB" } }
              >
                <option value="">Todos</option>
                <option value="pago1">✓ Pagó su 1ra factura</option>
                <option value="nopago1">Aún no la ha pagado</option>
                <option value="nocuenta">⛔ No cuenta para comisión</option>
                <option value="penalizado">🚫 Penalizados</option>
              </select>
            </FiltroCampo>
          </div>
        </div>
      )}

      {filtroEstado === "penalizado" && (() => {
        const conteo = {};
        clientes.filter((c) => c.penalizado).forEach((c) => {
          const m = (c.motivoPenalizacion || "").trim() || "Sin motivo";
          conteo[m] = (conteo[m] || 0) + 1;
        });
        const filas = Object.entries(conteo).sort((x, y) => y[1] - x[1]);
        return filas.length > 0 ? (
          <div className="bg-white rounded-lg border border-gray-200 p-3 mb-3 text-xs" style={ { color: "#374151" } }>
            <div className="font-semibold mb-1" style={ { color: "#001E62" } }>Motivos de penalización</div>
            <div className="flex flex-wrap gap-x-4 gap-y-1">
              {filas.map(([m, n]) => (
                <span key={m}>{m}: <span className="font-semibold">{n}</span></span>
              ))}
            </div>
          </div>
        ) : null;
      })()}

      {visiblesFinal.length === 0 ? (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-10 text-center">
          <p className="text-sm" style={ { color: "#6B7280" } }>
            {filtroEstado || filtroInstalacion || filtroPlan || rangoActivo
              ? "No hay clientes con ese filtro."
              : search.trim()
              ? "Sin resultados para esa búsqueda."
              : "No hay clientes en este mes."}
          </p>
        </div>
      ) : (
        <>
          {/* Vista de tarjetas: solo en pantallas angostas (celular), sin scroll horizontal.
              Muestra exactamente las columnas activadas en el selector ⚙️, igual que la tabla. */}
          <div className="md:hidden flex flex-col gap-2">
            {(() => {
              // El nombre siempre va en el encabezado de la tarjeta (para poder tocarlo y
              // abrir el detalle); el resto de columnas activadas se listan debajo.
              const camposCard = columnasAMostrar.filter((k) => k !== "cliente");
              return visiblesFinal.map((c) => {
                const cuenta = clienteCuentaParaComision(c);
                return (
                <div
                  key={c.id}
                  className="bg-white rounded-lg border p-3"
                  style={ { borderColor: "#E5E7EB", opacity: cuenta ? 1 : 0.5 } }
                >
                  <button onClick={() => onVerDetalle(c)} className="text-left block w-full">
                    <div className="font-medium text-sm truncate" style={ { color: "#001E62" } }>{c.nombre}</div>
                    {c.telefono && (
                      <div className="text-xs font-mono truncate" style={ { color: "#9CA3AF" } }>{c.telefono}</div>
                    )}
                    {!cuenta && (
                      <div className="text-[10px] font-semibold mt-0.5" style={ { color: "#B91C1C" } }>
                        ⛔ No cuenta para tu comisión (venció sin pagar la 1ra factura)
                      </div>
                    )}
                  </button>

                  {camposCard.length > 0 && (
                    <div className="grid grid-cols-2 gap-x-3 gap-y-2 mt-2.5 pt-2.5 border-t" style={ { borderColor: "#F0F0EF" } }>
                      {camposCard.map((key) => {
                        const col = COLUMNAS_CLIENTES.find((x) => x.key === key);
                        if (!col) return null;
                        return (
                          <div key={key} className="min-w-0">
                            <div className="text-[10px] font-medium uppercase tracking-wide mb-0.5" style={ { color: "#9CA3AF" } }>
                              {col.label}
                            </div>
                            <div className="truncate">{renderCeldaCliente(c, key)}</div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  <div className="flex items-center gap-4 mt-2.5 pt-2.5 border-t" style={ { borderColor: "#F0F0EF" } }>
                    {c.actual && (
                      <button onClick={() => onMarcarPagada(c.id, c.actual.n)} className="text-xs font-medium" style={ { color: "#0F766E" } }>
                        {c.actual.n === 1 && c.f1_saldoPendiente ? "Saldo pagado" : "Marcar pagada"}
                      </button>
                    )}
                    <button onClick={() => onEdit(c)} className="text-xs font-medium" style={ { color: "#0072CE" } }>Editar</button>
                    <button onClick={() => onDelete(c.id)} className="text-xs font-medium" style={ { color: "#C23B3B" } }>Eliminar</button>
                  </div>
                </div>
                );
              });
            })()}
          </div>

          {/* Vista de tabla clásica: solo en pantallas anchas (tablet/desktop). */}
          <div className="hidden md:block bg-white rounded-lg border border-gray-200 shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left" style={ { background: "#F4F6FA" } }>
                {columnasAMostrar.map((key) => {
                  const col = COLUMNAS_CLIENTES.find((c) => c.key === key);
                  const activa = ordenarPor === key;
                  return (
                    <th
                      key={key}
                      draggable
                      onDragStart={() => setColArrastrando(key)}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={() => handleDropColumna(key)}
                      onClick={() => handleOrdenarPorColumna(key)}
                      className="px-4 py-2.5 font-medium text-xs select-none whitespace-nowrap"
                      style={ {
                        color: activa ? "#001E62" : "#6B7280",
                        cursor: col.sortable ? "pointer" : "grab",
                        opacity: colArrastrando === key ? 0.4 : 1,
                      } }
                      title={col.sortable ? "Toca para ordenar · arrastra para mover" : "Arrastra para mover"}
                    >
                      <span className="inline-flex items-center gap-1">
                        <span style={ { color: "#C7D2E8" } }>⠿</span>
                        {col.label}
                        {activa && <span>{ordenDireccion === "asc" ? "▲" : "▼"}</span>}
                      </span>
                    </th>
                  );
                })}
                <th className="px-4 py-2.5 font-medium text-xs" style={ { color: "#6B7280" } }></th>
              </tr>
            </thead>
            <tbody>
              {visiblesFinal.map((c) => (
                <tr key={c.id} className="border-t" style={ { borderColor: "#F0F0EF", opacity: clienteCuentaParaComision(c) ? 1 : 0.5 } }>
                  {columnasAMostrar.map((key) => (
                    <td key={key} className="px-4 py-3">{renderCeldaCliente(c, key)}</td>
                  ))}
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    {c.actual && (
                      <button onClick={() => onMarcarPagada(c.id, c.actual.n)} className="text-xs font-medium mr-3" style={ { color: "#0F766E" } }>{c.actual.n === 1 && c.f1_saldoPendiente ? "Saldo pagado" : "Marcar pagada"}</button>
                    )}
                    <button onClick={() => onEdit(c)} className="text-xs font-medium mr-3" style={ { color: "#0072CE" } }>Editar</button>
                    <button onClick={() => onDelete(c.id)} className="text-xs font-medium" style={ { color: "#C23B3B" } }>Eliminar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        </>
      )}

      {mostrarSelectorColumnas && (
        <SelectorColumnasModal
          orden={ordenColumnas}
          visibles={columnasVisibles}
          onToggle={(key) => setColumnasClientes((prev) => ({ ...prev, visibles: { ...prev.visibles, [key]: !prev.visibles[key] } }))}
          onMover={moverColumna}
          onClose={() => setMostrarSelectorColumnas(false)}
        />
      )}

      {papeleraAbierta && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold">Clientes eliminados</h3>
              <button onClick={() => setPapeleraAbierta(false)} className="text-sm" style={ { color: "#6B7280" } }>✕</button>
            </div>
            {eliminados.length === 0 ? (
              <p className="text-sm" style={ { color: "#6B7280" } }>No hay clientes eliminados.</p>
            ) : (
              <div className="flex flex-col gap-2">
                {eliminados.map((c) => (
                  <div key={c.id} className="flex items-center justify-between rounded-md border p-3" style={ { borderColor: "#F0F0EF" } }>
                    <div>
                      <div className="text-sm font-medium">{c.nombre}</div>
                      <div className="text-xs font-mono" style={ { color: "#9CA3AF" } }>
                        {c.numeroSuscriptor} · eliminado el {fmtFecha((c.eliminadoEn || "").slice(0, 10))}
                      </div>
                    </div>
                    <button
                      onClick={() => onRecuperar(c.id)}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={ { background: "#0F766E" } }
                    >
                      Recuperar
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
      </>
      )}
    </div>
  );
}

function ClienteDetalle({
  cliente,
  onVolver,
  volverLabel,
  onEditar,
  onMarcarPagada,
  onActualizarEstadoFactura,
  onCopiarMensaje,
  copiedKey,
  onMarcarEnviado,
  onCopiarSuscriptor,
  copiedSubKey,
  periodoActual,
  onCancelar,
  onDescancelar,
  onPenalizar,
  historialCambios,
}) {
  const [mostrarPenalizar, setMostrarPenalizar] = useState(false);
  const [motivoPenal, setMotivoPenal] = useState("");
  const [mostrarCancelar, setMostrarCancelar] = useState(false);
  const [fechaCancel, setFechaCancel] = useState(() => fechaLocalISO(new Date()));
  const [motivoCancel, setMotivoCancel] = useState("voluntaria");

  if (!cliente) {
    return (
      <div className="max-w-2xl">
        <button onClick={onVolver} className="text-xs font-medium mb-4" style={ { color: "#0072CE" } }>
          {volverLabel || "← Volver a Clientes"}
        </button>
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-10 text-center">
          <p className="text-sm" style={ { color: "#6B7280" } }>No se encontró el cliente (puede haber sido eliminado).</p>
        </div>
      </div>
    );
  }

  const cicloLabel = (CICLOS.find((c) => c.value === cliente.cicloFacturacion) || {}).label || "—";
  const riesgo = estadoRiesgoChurn(cliente, periodoActual);

  return (
    <div className="max-w-2xl">
      <button onClick={onVolver} className="text-xs font-medium mb-4" style={ { color: "#0072CE" } }>
        {volverLabel || "← Volver a Clientes"}
      </button>

      <div className="flex items-center justify-between mb-1">
        <h1 className="text-2xl font-semibold">{cliente.nombre}</h1>
        <button
          onClick={() => onEditar(cliente)}
          className="text-sm font-medium px-4 py-2 rounded-md border"
          style={ { borderColor: "#D1D5DB", color: "#374151" } }
        >
          Editar cliente
        </button>
      </div>
      <p className="text-sm mb-3" style={ { color: "#6B7280" } }>{planLabel(cliente)}</p>

      {riesgo && (
        <div
          className="text-xs font-medium px-3 py-2 rounded-md mb-3 inline-block"
          style={ { color: riesgo.color, background: riesgo.bg } }
        >
          {riesgo.texto}
        </div>
      )}

      <div className="mb-3">
        {cliente.penalizado ? (
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs" style={ { color: "#374151" } }>
              🚫 Penalizado{cliente.fechaPenalizacion ? ` el ${fmtFecha(cliente.fechaPenalizacion)}` : ""}
              {cliente.motivoPenalizacion ? ` · ${cliente.motivoPenalizacion}` : ""} · no cuenta para nada
            </span>
            <button
              onClick={() => onPenalizar(cliente.id, false)}
              className="text-xs font-medium px-2 py-1 rounded-md border"
              style={ { color: "#374151", borderColor: "#D1D5DB" } }
            >
              Quitar penalización
            </button>
          </div>
        ) : mostrarPenalizar ? (
          <div className="flex items-center gap-2 flex-wrap bg-white border rounded-md px-3 py-2" style={ { borderColor: "#E5E7EB" } }>
            <input
              type="text"
              value={motivoPenal}
              onChange={(e) => setMotivoPenal(e.target.value)}
              placeholder="Motivo (opcional)"
              className="px-2 py-1 rounded-md border text-xs outline-none flex-1 min-w-[140px]"
              style={ { borderColor: "#D1D5DB" } }
            />
            <button
              onClick={() => { onPenalizar(cliente.id, true, motivoPenal); setMostrarPenalizar(false); setMotivoPenal(""); } }
              className="text-xs font-medium px-2.5 py-1 rounded-md text-white"
              style={ { background: "#374151" } }
            >
              Confirmar penalización
            </button>
            <button
              onClick={() => { setMostrarPenalizar(false); setMotivoPenal(""); } }
              className="text-xs font-medium px-2 py-1 rounded-md"
              style={ { color: "#6B7280", border: "1px solid #D1D5DB" } }
            >
              Cancelar
            </button>
          </div>
        ) : (
          <button
            onClick={() => setMostrarPenalizar(true)}
            className="text-xs font-medium px-2.5 py-1.5 rounded-md border"
            style={ { color: "#374151", borderColor: "#D1D5DB" } }
          >
            Marcar cliente como penalizado
          </button>
        )}
      </div>

      <div className="mb-4">
        {cliente.cancelado ? (
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs" style={ { color: "#B91C1C" } }>
              ❌ Cliente cancelado el {fmtFecha(cliente.fechaCancelacion)} ({cliente.motivoCancelacion === "falta_pago" ? "falta de pago" : "cancelación voluntaria"})
            </span>
            <button
              onClick={() => onDescancelar(cliente.id)}
              className="text-xs font-medium px-2 py-1 rounded-md border"
              style={ { color: "#374151", borderColor: "#D1D5DB" } }
            >
              Deshacer cancelación
            </button>
          </div>
        ) : mostrarCancelar ? (
          <div className="flex items-center gap-2 flex-wrap bg-white border rounded-md px-3 py-2" style={ { borderColor: "#E5E7EB" } }>
            <input
              type="date"
              value={fechaCancel}
              onChange={(e) => setFechaCancel(e.target.value)}
              className="px-2 py-1 rounded-md border text-xs outline-none"
              style={ { borderColor: "#D1D5DB" } }
            />
            <select
              value={motivoCancel}
              onChange={(e) => setMotivoCancel(e.target.value)}
              className="px-2 py-1 rounded-md border text-xs outline-none"
              style={ { borderColor: "#D1D5DB" } }
            >
              <option value="voluntaria">Cancelación voluntaria</option>
              <option value="falta_pago">Falta de pago</option>
            </select>
            <button
              onClick={() => { onCancelar(cliente.id, fechaCancel, motivoCancel); setMostrarCancelar(false); } }
              className="text-xs font-medium px-2.5 py-1 rounded-md text-white"
              style={ { background: "#C23B3B" } }
            >
              Confirmar cancelación
            </button>
            <button
              onClick={() => setMostrarCancelar(false)}
              className="text-xs font-medium px-2 py-1 rounded-md"
              style={ { color: "#6B7280", border: "1px solid #D1D5DB" } }
            >
              Cancelar
            </button>
          </div>
        ) : (
          <button
            onClick={() => setMostrarCancelar(true)}
            className="text-xs font-medium px-2.5 py-1.5 rounded-md border"
            style={ { color: "#B91C1C", borderColor: "#F3C6C6" } }
          >
            Marcar cliente como cancelado
          </button>
        )}
      </div>

      <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-5 mb-4 grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Número de suscriptor</div>
          <div className="font-medium flex items-center gap-1.5">
            <span>{cliente.numeroSuscriptor || "—"}</span>
            {cliente.numeroSuscriptor && (
              <button
                onClick={() => onCopiarSuscriptor(cliente)}
                title="Copiar número de suscriptor"
                className="text-xs"
                style={ { color: copiedSubKey === cliente.id ? "#0F766E" : "#9CA3AF" } }
              >
                {copiedSubKey === cliente.id ? "✓" : "📋"}
              </button>
            )}
          </div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Teléfono</div>
          <div className="font-medium">{cliente.telefono || "—"}</div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Ciclo de facturación</div>
          <div className="font-medium">{cicloLabel}</div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Fecha de instalación</div>
          <div className="font-medium">{fmtFecha(cliente.fechaInstalacion)}</div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Monto mensual recurrente</div>
          <div className="font-medium">{fmtMonto(cliente.montoMensual)}</div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Monto 1ra factura</div>
          <div className="font-medium">{fmtMonto(cliente.monto1raFactura)}</div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Estado de pago</div>
          <div>
            {(() => {
              const r = resumenPagoCliente(cliente);
              return (
                <span className="text-xs font-medium px-2 py-0.5 rounded-full inline-block" style={ { color: r.color, background: r.bg } }>
                  {r.texto}
                </span>
              );
            })()}
          </div>
        </div>
        <div>
          <div className="text-xs" style={ { color: "#6B7280" } }>Fecha de ingreso</div>
          <div className="font-medium">{cliente.creadoEn ? fmtFecha(cliente.creadoEn.slice(0, 10)) : "—"}</div>
        </div>
      </div>

      {cliente.observaciones && (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4 mb-4 text-sm">
          <div className="text-xs font-medium mb-1" style={ { color: "#6B7280" } }>Observaciones</div>
          {cliente.observaciones}
        </div>
      )}

      <h2 className="text-sm font-semibold mb-2">Facturas</h2>
      {cliente.facturas.length === 0 ? (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-5 text-center">
          <p className="text-sm" style={ { color: "#B8791F" } }>
            Este cliente está <strong>pendiente de instalación</strong>, todavía no tiene fecha cargada. Editalo para asignarle la fecha de instalación y así empezar a generar sus facturas.
          </p>
        </div>
      ) : (
      <div className="flex flex-col gap-2">
        {cliente.facturas.map((f) => {
          const estadoFactura = cliente[`f${f.n}_estado`] || "";
          return (
            <div key={f.n} className="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
              <div className="flex items-center justify-between mb-3">
                <div>
                  <div className="font-medium text-sm">{ORDINAL[f.n]} factura</div>
                  <div className="text-xs" style={ { color: "#6B7280" } }>
                    Generada: {fmtFecha(f.generada)} · Vence: {fmtFecha(f.vencimiento)}
                  </div>
                  {estadoFactura === "pagada" && (
                    <div className="text-xs mt-0.5" style={ { color: "#0072CE" } }>
                      {(() => {
                        const marcada = fechaMarcadaPagada(cliente, f.n, historialCambios);
                        return marcada ? `✓ Marcada como pagada el ${fmtFechaHora(marcada)}` : "✓ Marcada como pagada · sin fecha registrada";
                      })()}
                    </div>
                  )}
                </div>
                {estadoFactura === "pagada" ? (
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-medium px-3 py-1.5 rounded-full" style={ { background: "#E3EDFA", color: "#0072CE" } }>
                      Pagada ✓
                    </span>
                    <button
                      onClick={() => onActualizarEstadoFactura(cliente.id, f.n, "")}
                      className="text-xs font-medium px-3 py-1.5 rounded-md border"
                      style={ { borderColor: "#D1D5DB", color: "#374151" } }
                    >
                      Desmarcar
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => onActualizarEstadoFactura(cliente.id, f.n, "pagada")}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={ { background: "#0F766E" } }
                    >
                      Marcar como pagada
                    </button>
                  </div>
                )}
              </div>

              {(() => {
                const alertasActivas = f.milestones.filter((m) => m.pendienteHoy);
                if (alertasActivas.length === 0) {
                  return (
                    <p className="text-xs" style={ { color: "#9CA3AF" } }>
                      Sin alertas activas en esta factura por el momento.
                    </p>
                  );
                }
                return (
                  <div className="flex flex-col gap-3">
                    {alertasActivas.map((m) => {
                      const key = cliente.id + m.key;
                      return (
                        <div key={m.key} className="rounded-md border p-3" style={ { borderColor: "#F0F0EF" } }>
                          <div className="flex items-center gap-2 mb-2">
                            <span className="font-mono text-[11px] px-1.5 py-0.5 rounded" style={ { background: m.bg, color: m.color } }>
                              {m.tag}
                            </span>
                            <span className="text-xs" style={ { color: "#6B7280" } }>{m.label}</span>
                          </div>
                          <div className="text-sm rounded-md p-3 mb-3" style={ { background: "#F4F6FA", color: "#374151" } }>
                            {m.texto}
                          </div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <a
                              href={whatsappLink(cliente, m)}
                              className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                              style={ { background: "#25D366" } }
                            >
                              Enviar por WhatsApp
                            </a>
                            <button
                              onClick={() => onCopiarMensaje(cliente, m)}
                              className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                              style={ { background: "#001E62" } }
                            >
                              {copiedKey === key ? "Copiado ✓" : "Copiar mensaje"}
                            </button>
                            <button
                              onClick={() => onMarcarEnviado(cliente.id, m.key)}
                              className="text-xs font-medium px-3 py-1.5 rounded-md border"
                              style={ { borderColor: "#D1D5DB", color: "#374151" } }
                            >
                              Marcar como enviado
                            </button>
                      </div>
                    </div>
                  );
                })}
              </div>
                );
              })()}
            </div>
          );
        })}
      </div>
      )}
    </div>
  );
}

function ClientesMovilPanel({ clientesMovil, onAgregar, onEditar, onEliminar, mesActivo, abrirForm, onFormAbierto, prefill, onVolverAPrecierre }) {
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [tipo, setTipo] = useState("pospago");
  const [montoPlan, setMontoPlan] = useState("");
  const [fechaActivacion, setFechaActivacion] = useState(() => fechaLocalISO(new Date()));
  const [esPortabilidad, setEsPortabilidad] = useState(false);
  const [f1Pagada, setF1Pagada] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [formAbierto, setFormAbierto] = useState(!!abrirForm);
  const [mesExpandido, setMesExpandido] = useState(() => mesActivo || periodoComision(fechaLocalISO(new Date())));
  const meses = useMemo(() => periodosRecientes(6), []);
  const formRef = useRef(null);
  const nombreRef = useRef(null);
  // true cuando el formulario se abrió desde "Verificar órdenes": al guardar vuelve al Precierre.
  const vieneDePrecierre = useRef(false);

  // El formulario viene minimizado: solo se abre desde el botón flotante (+) o al editar un cliente.
  useEffect(() => {
    if (abrirForm) {
      const aEditar = prefill && prefill.editarId ? clientesMovil.find((x) => x.id === prefill.editarId) : null;
      if (aEditar) {
        setNombre(aEditar.nombre);
        setTelefono(aEditar.telefono);
        setWhatsapp(aEditar.whatsapp || "");
        setTipo(tipoClienteMovil(aEditar));
        setMontoPlan(aEditar.montoPlan != null ? String(aEditar.montoPlan) : "");
        setFechaActivacion(fechaActivacionMovil(aEditar) || fechaLocalISO(new Date()));
        setEsPortabilidad(!!aEditar.esPortabilidad);
        setF1Pagada(aEditar.f1_estado === "pagada");
        setEditingId(aEditar.id);
        vieneDePrecierre.current = true;
      } else if (prefill) {
        setEditingId(null);
        setNombre(prefill.nombre || "");
        setTelefono("");
        setWhatsapp("");
        setTipo("pospago");
        setMontoPlan("");
        setFechaActivacion(prefill.fecha || fechaLocalISO(new Date()));
        setEsPortabilidad(false);
        setF1Pagada(false);
        vieneDePrecierre.current = true;
      }
      setFormAbierto(true);
      if (onFormAbierto) onFormAbierto();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [abrirForm]);

  useEffect(() => {
    if (!formAbierto) return;
    const t = setTimeout(() => {
      if (nombreRef.current) nombreRef.current.focus({ preventScroll: true });
    }, 50);
    return () => clearTimeout(t);
  }, [formAbierto, editingId]);

  function limpiarForm() {
    vieneDePrecierre.current = false;
    setNombre("");
    setTelefono("");
    setWhatsapp("");
    setTipo("pospago");
    setMontoPlan("");
    setFechaActivacion(fechaLocalISO(new Date()));
    setEsPortabilidad(false);
    setF1Pagada(false);
    setEditingId(null);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!nombre.trim() || !telefono.trim()) return;
    const volver = vieneDePrecierre.current;
    const editando = editingId ? clientesMovil.find((x) => x.id === editingId) : null;
    if (editingId) {
      onEditar(editingId, {
        nombre: nombre.trim(),
        telefono: telefono.trim(),
        whatsapp: whatsapp.trim(),
        tipo,
        montoPlan: montoPlan ? Number(montoPlan) || 0 : null,
        fechaActivacion,
        esPortabilidad,
        ...fijarFactura(editando, f1Pagada),
      });
    } else {
      onAgregar(nombre.trim(), telefono.trim(), tipo, montoPlan, fechaActivacion, {
        whatsapp: whatsapp.trim(),
        esPortabilidad,
        f1_estado: f1Pagada ? "pagada" : "",
      });
    }
    limpiarForm();
    setFormAbierto(false);
    if (volver && onVolverAPrecierre) onVolverAPrecierre();
  }

  function startEdit(c) {
    vieneDePrecierre.current = false;
    setNombre(c.nombre);
    setTelefono(c.telefono);
    setWhatsapp(c.whatsapp || "");
    setTipo(tipoClienteMovil(c));
    setMontoPlan(c.montoPlan != null ? String(c.montoPlan) : "");
    setFechaActivacion(fechaActivacionMovil(c) || fechaLocalISO(new Date()));
    setEsPortabilidad(!!c.esPortabilidad);
    setF1Pagada(c.f1_estado === "pagada");
    setEditingId(c.id);
    setFormAbierto(true);
  }

  // Campos de 1ra factura a guardar al editar: conserva la fecha en que se marcó pagada
  // y la limpia si se desmarca.
  function fijarFactura(cliente, pagada) {
    const estabaPagada = !!cliente && cliente.f1_estado === "pagada";
    if (pagada) return { f1_estado: "pagada", f1_pagadaEn: estabaPagada && cliente.f1_pagadaEn ? cliente.f1_pagadaEn : new Date().toISOString() };
    return { f1_estado: "", f1_pagadaEn: null };
  }

  function cancelEdit() {
    limpiarForm();
    setFormAbierto(false);
  }

  const campoCls = "w-full px-3 py-2.5 sm:py-2 rounded-md border text-base sm:text-sm outline-none";
  const etiquetaCls = "text-xs font-medium block mb-1";

  return (
    <div>
      {formAbierto && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
        <div ref={formRef} className="bg-white rounded-lg shadow-lg p-4 sm:p-6 w-full max-w-lg max-h-full overflow-y-auto">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-base font-semibold">{editingId ? "Editar Cliente Móvil" : "Nuevo Cliente Móvil"}</h2>
            <button
              type="button"
              onClick={cancelEdit}
              className="text-lg leading-none w-9 h-9 flex items-center justify-center rounded-md"
              style={ { color: "#6B7280" } }
              aria-label="Cerrar formulario"
            >
              ✕
            </button>
          </div>
          <form onSubmit={handleSubmit} className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className={etiquetaCls} style={ { color: "#6B7280" } }>Nombre</label>
              <input
                ref={nombreRef}
                required
                value={nombre}
                onChange={(e) => setNombre(e.target.value)}
                className={campoCls}
                style={ { borderColor: "#D1D5DB" } }
              />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#6B7280" } }>Número de celular</label>
              <input
                required
                type="tel"
                inputMode="tel"
                value={telefono}
                onChange={(e) => setTelefono(e.target.value)}
                className={campoCls}
                style={ { borderColor: "#D1D5DB" } }
              />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#6B7280" } }>WhatsApp (solo si es distinto al celular)</label>
              <input
                type="tel"
                inputMode="tel"
                value={whatsapp}
                onChange={(e) => setWhatsapp(e.target.value)}
                placeholder="Déjalo vacío para usar el mismo"
                className={campoCls}
                style={ { borderColor: "#D1D5DB" } }
              />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#6B7280" } }>Tipo</label>
              <select
                value={tipo}
                onChange={(e) => setTipo(e.target.value)}
                className={campoCls + " bg-white"}
                style={ { borderColor: "#D1D5DB" } }
              >
                {TIPOS_CLIENTE_MOVIL.map((t) => (
                  <option key={t.value} value={t.value}>{t.label}</option>
                ))}
              </select>
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#6B7280" } }>Costo del plan móvil</label>
              <input
                type="number"
                inputMode="decimal"
                step="0.01"
                min="0"
                value={montoPlan}
                onChange={(e) => setMontoPlan(e.target.value)}
                placeholder="$0.00"
                className={campoCls}
                style={ { borderColor: "#D1D5DB" } }
              />
            </div>
            <div>
              <label className={etiquetaCls} style={ { color: "#6B7280" } }>Fecha de activación</label>
              <input
                type="date"
                value={fechaActivacion}
                onChange={(e) => setFechaActivacion(e.target.value)}
                className={campoCls}
                style={ { borderColor: "#D1D5DB" } }
              />
            </div>
            <div className="sm:col-span-2 flex flex-col gap-2 rounded-md p-3" style={ { background: "#F4F6FA" } }>
              <label className="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" checked={esPortabilidad} onChange={(e) => setEsPortabilidad(e.target.checked)} className="w-4 h-4" />
                <span>Es portabilidad <span className="text-xs" style={ { color: "#6B7280" } }>(el número viene de otra compañía)</span></span>
              </label>
              <label className="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" checked={f1Pagada} onChange={(e) => setF1Pagada(e.target.checked)} className="w-4 h-4" />
                <span>Primera factura pagada <span className="text-xs" style={ { color: "#6B7280" } }>(cuenta para tu comisión desde octubre)</span></span>
              </label>
            </div>
            <div className="flex gap-2 sm:col-span-2 sm:justify-end">
              <button
                type="submit"
                className="flex-1 sm:flex-none text-sm font-medium px-5 py-3 sm:py-2 rounded-md text-white"
                style={ { background: "#001E62" } }
              >
                {editingId ? "Guardar" : "Agregar"}
              </button>
              <button
                type="button"
                onClick={cancelEdit}
                className="flex-1 sm:flex-none text-sm font-medium px-5 py-3 sm:py-2 rounded-md border"
                style={ { borderColor: "#D1D5DB" } }
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
        </div>
      )}

      <div className="flex flex-col gap-2">
        {meses.map((m, i) => {
          const delMes = clientesMovil.filter((c) => periodoComision(fechaActivacionMovil(c)) === m.key);
          const resumenMes = esquemaNuevo(m.key) ? resumenMovilesNuevo(delMes, false) : null;
          const abierto = mesExpandido === m.key;

// Resumen real del estado de pago de un cliente, mirando TODAS las facturas ya
// generadas (no solo la última que se tocó) — para la ficha de detalle.
function resumenPagoCliente(c) {
  if (c.estadoPago === "Suspendido") {
    return { texto: "⏸ Suspendido", color: "#4B5563", bg: "#EFEFEF" };
  }
  const facturas = Array.isArray(c.facturas) ? c.facturas : [];
  const generadas = facturas.filter((f) => daysFromToday(f.generada) <= 0);
  if (generadas.length === 0) {
    return { texto: "⏳ Pendiente", color: "#B8791F", bg: "#FBF1DE" };
  }
  const pagadas = generadas.filter((f) => c[`f${f.n}_estado`] === "pagada").length;
  const hayVencidaSinPagar = generadas.some((f) => daysFromToday(f.vencimiento) <= 0 && c[`f${f.n}_estado`] !== "pagada");
  if (pagadas === generadas.length) {
    return { texto: "✓ Pagado", color: "#0F766E", bg: "#DCF5F3" };
  }
  if (hayVencidaSinPagar) {
    return { texto: `⚠ Atrasado (${pagadas}/${generadas.length} pagadas)`, color: "#C23B3B", bg: "#FBEAEA" };
  }
  return { texto: `◐ Pago parcial (${pagadas}/${generadas.length})`, color: "#B8791F", bg: "#FBF1DE" };
}

// ---------- Bitácora de cambios ----------
function fmtFechaHora(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const fecha = d.toLocaleDateString("es-PA", { day: "2-digit", month: "2-digit", year: "numeric" });
  const hora = d.toLocaleTimeString("es-PA", { hour: "2-digit", minute: "2-digit" });
  return `${fecha} · ${hora}`;
}
function fmtRelativo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "justo ahora";
  if (min < 60) return `hace ${min} min`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `hace ${hrs} h`;
  const dias = Math.floor(hrs / 24);
  if (dias < 30) return `hace ${dias} d`;
  return fmtFechaHora(iso);
}

// Copia texto al portapapeles (con respaldo para navegadores que lo bloquean).
async function copiarTextoPrecierre(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

// Lo pegado y el rango del precierre se guardan en este celular para que no se
// pierdan al cambiar de pestaña o refrescar. Se borran con "Limpiar".
const PRECIERRE_KEY = "antichurn_precierre";
function leerPrecierreGuardado() {
  const hoy = fechaLocalISO(new Date());
  const base = { texto: "", desde: hoy.slice(0, 8) + "01", hasta: hoy, aplicado: null };
  try {
    const raw = localStorage.getItem(PRECIERRE_KEY);
    if (!raw) return base;
    const g = JSON.parse(raw);
    return {
      texto: typeof g.texto === "string" ? g.texto : "",
      desde: g.desde || base.desde,
      hasta: g.hasta || base.hasta,
      aplicado: g.aplicado && typeof g.aplicado.texto === "string" ? g.aplicado : null,
    };
  } catch (e) {
    return base;
  }
}

// Lee el número de suscriptor de cada línea pegada. Si la línea trae más columnas
// (nombre, teléfono, fechas…), toma el número que ya existe en la app y, si ninguno
// existe, el primero de 6 o más dígitos. Los teléfonos con guion, fechas y montos
// no se confunden con suscriptores porque se parten en trozos cortos.
function leerSuscriptoresPrecierre(textoPegado, existentes) {
  const lineas = textoPegado.split(/\r?\n/).filter((l) => l.trim());
  const vistos = new Set();
  const numeros = [];
  let duplicados = 0;
  let sinNumero = 0;
  const agregarNumero = (n) => {
    if (vistos.has(n)) { duplicados++; return; }
    vistos.add(n);
    numeros.push(n);
  };
  lineas.forEach((linea) => {
    const candidatos = (linea.match(/\d+/g) || []).filter((n) => n.length >= 6);
    if (candidatos.length === 0) { sinNumero++; return; }
    const soloNumeros = !/[A-Za-zÁ-ÿ]/.test(linea) && !linea.includes("\t");
    if (soloNumeros) {
      candidatos.forEach(agregarNumero);
    } else {
      agregarNumero(candidatos.find((n) => existentes.has(n)) || candidatos[0]);
    }
  });
  return { numeros, duplicados, sinNumero, lineas: lineas.length };
}

// Compara el precierre pegado contra los clientes de la app. Es una función pura:
// se recalcula sola cada vez que cambian los clientes (por ejemplo, al agregar uno).
function calcularPrecierre(clientes, textoPegado, desde, hasta) {
  const existentes = new Set(clientes.map((c) => (c.numeroSuscriptor || "").trim()).filter(Boolean));
  const { numeros, duplicados, sinNumero, lineas } = leerSuscriptoresPrecierre(textoPegado, existentes);

  const clientesPorNumero = new Map(
    clientes.filter((c) => c.numeroSuscriptor).map((c) => [c.numeroSuscriptor.trim(), c])
  );
  const enRango = (c) => !!c.fechaInstalacion && c.fechaInstalacion >= desde && c.fechaInstalacion <= hasta;

  // En el precierre pero NO en la app -> hay que agregarlos.
  const agregar = numeros.filter((n) => !clientesPorNumero.has(n));

  // En el precierre Y en la app.
  const enApp = numeros.filter((n) => clientesPorNumero.has(n)).map((n) => clientesPorNumero.get(n));
  const coinciden = enApp.filter(enRango);
  const revisar = enApp
    .filter((c) => !enRango(c))
    .map((c) => ({
      cliente: c,
      motivo: !c.fechaInstalacion
        ? "Sin fecha de instalación"
        : c.fechaInstalacion < desde
          ? "Instalado antes del rango"
          : "Instalado después del rango",
    }));

  // En la app, instalados dentro del rango, pero NO en el precierre -> reclamar a Tigo.
  // Primero los que ya tienen la 1ª factura pagada (esos cuentan para la comisión).
  const setNumeros = new Set(numeros);
  const reclamar = clientes
    .filter((c) => c.numeroSuscriptor && enRango(c) && !setNumeros.has(c.numeroSuscriptor.trim()))
    .sort(
      (a, b) =>
        (b.f1_estado === "pagada" ? 1 : 0) - (a.f1_estado === "pagada" ? 1 : 0) ||
        (a.fechaInstalacion || "").localeCompare(b.fechaInstalacion || "")
    );

  return { desde, hasta, total: numeros.length, duplicados, sinNumero, lineas, agregar, coinciden, revisar, reclamar };
}

                className="text-sm font-medium px-3 py-2 rounded-md"
                style={ { color: "#6B7280", border: "1px solid #D1D5DB" } }
              >
                Cancelar
              </button>
            )}
          </div>
        </div>
      ) : (
        <div className="flex items-center justify-between gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2 mb-4">
          <span className="text-xs min-w-0 truncate" style={ { color: "#6B7280" } }>
            {resultado ? resultado.lineas : 0} filas · {fmtFecha(estado.aplicado.desde)} al {fmtFecha(estado.aplicado.hasta)}
          </span>
          <div className="flex items-center gap-2 shrink-0">
            <button
              onClick={() => setEditando(true)}
              className="text-xs font-medium px-2.5 py-1 rounded-md"
              style={ { color: "#001E62", border: "1px solid #D1D5DB" } }
            >
              Editar
            </button>
            <button
              onClick={limpiar}
              className="text-xs font-medium px-2.5 py-1 rounded-md"
              style={ { color: "#C23B3B", border: "1px solid #D1D5DB" } }
            >
              Limpiar
            </button>
          </div>
        </div>
      )}

      {!editando && resultado && (
        <ResultadoPrecierre resultado={resultado} onIrNuevo={onIrNuevo} onAbrirCliente={onAbrirCliente} />
      )}
      </React.Fragment>
      )}
    </div>
  );
}

function FilaPrecierre({ color, numero, nombre, sub, derecha, onClick, children }) {
  const clicable = typeof onClick === "function";
  return (
    <div
      role={clicable ? "button" : undefined}
      tabIndex={clicable ? 0 : undefined}
      onClick={clicable ? onClick : undefined}
      onKeyDown={clicable ? (e) => { if (e.key === "Enter") onClick(); } : undefined}
      className={`flex items-center gap-2.5 py-2.5 border-b border-gray-100 last:border-0 ${clicable ? "cursor-pointer active:bg-gray-50" : ""}`}
    >
      <span className="shrink-0 rounded-full" style={ { width: 8, height: 8, background: color } } />
      <div className="min-w-0 flex-1">
        <div className="flex items-baseline gap-2">
          <span className="font-mono text-sm font-medium">{numero}</span>
          {nombre && <span className="text-xs truncate" style={ { color: "#6B7280" } }>{nombre}</span>}

function ResultadoPrecierre({ resultado, onIrNuevo, onAbrirCliente }) {

      </p>

  return (
    <div className="flex flex-col gap-3">

          <span className="text-sm font-semibold" style={ { color: pendientes === 0 ? "#0F766E" : "#374151" } }>

        {g.key === "revisar" &&
          revisar.map(({ cliente: c, motivo }) => (
            <FilaPrecierre
              key={c.id}
              color={g.color}
              numero={c.numeroSuscriptor}

        {g.key === "coinciden" && (
          <>
            {(verTodas ? coinciden : coinciden.slice(0, LIMITE_COINCIDEN)).map((c) => (
              <FilaPrecierre

                numero={c.numeroSuscriptor}

}

// ---------- Verificar órdenes (lista de órdenes de la herramienta de Tigo) ----------
// Se pega la lista tal como sale de la página de Tigo (columnas separadas por tab):
// N.° de orden · Tipo · Estado · Nombre · Cédula · Fecha de creación · Fecha de cierre.
// Los clientes se comparan POR NOMBRE contra los de la app.
const VERIF_ORDENES_KEY = "antichurn_verif_ordenes";
// Órdenes de estos tipos son clientes de Hogar (en minúsculas).
const ORDENES_TIPOS_VERIFICABLES = ["hogar"];
// Órdenes de estos tipos son Clientes Móvil (se comparan contra la lista de móviles).
const ORDENES_TIPOS_MOVIL = ["match digital", "convergente puro"];
// Estados que significan "ya ingresada en Tigo, todavía no instalada" (en minúsculas).
// "Propuesta enviada" a propósito NO está aquí: todavía no es una orden ingresada.
const ORDENES_ESTADOS_EN_PROCESO = ["procesando", "agendar visita"];

function leerVerifOrdenesGuardado() {
  const base = { modo: "precierre", texto: "", aplicado: null, descartados: [], seccion: null };
  try {
    const raw = localStorage.getItem(VERIF_ORDENES_KEY);
    if (!raw) return base;
    const g = JSON.parse(raw);
    return {
      modo: g.modo === "ordenes" ? "ordenes" : "precierre",
      texto: typeof g.texto === "string" ? g.texto : "",
      aplicado: typeof g.aplicado === "string" ? g.aplicado : null,
      descartados: Array.isArray(g.descartados) ? g.descartados : [],
      seccion: g.seccion === "movil" || g.seccion === "hogar" ? g.seccion : null,
    };
  } catch (e) {
    return base;
  }
}

// Minúsculas, sin tildes ni signos y sin espacios de más: "Nuñez  López" = "nunez lopez".
function normalizarNombreOrden(s) {
  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Tigo muestra las fechas como MM/DD/YYYY. La app las guarda como YYYY-MM-DD.
function fechaTigoAISO(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || "").trim());
  if (!m) return "";
  return m[3] + "-" + m[1].padStart(2, "0") + "-" + m[2].padStart(2, "0");
}

function distanciaTexto(a, b) {
  if (a === b) return 0;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

// Formato del celular: cada orden viene en varias líneas ("No. Orden: …", "Tipo: …",
// "Estado: …", "Cliente: …", "ID: …", "Creado: …", "Fin: …"). Se convierte a las mismas
// filas que el formato de la PC.
function leerOrdenesTigoCelular(texto) {
  const filas = [];
  let actual = null;
  const cerrar = () => {
    if (actual && actual.orden) filas.push(actual);
    actual = null;
  };
  String(texto || "").split(/\r?\n/).forEach((linea) => {
    const m = /^\s*([^:]+?)\s*:\s*(.*?)\s*$/.exec(linea);
    if (!m) return;
    const campo = m[1].toLowerCase().replace(/\./g, "").trim();
    const valor = m[2];
    if (campo === "no orden" || campo === "n orden" || campo === "orden") {
      cerrar();
      actual = { orden: valor.replace(/\D/g, ""), tipo: "", estado: "", nombre: "", cedula: "", creada: "", fin: "" };
      return;
    }
    if (!actual) return;
    if (campo === "tipo") actual.tipo = valor;
    else if (campo === "estado") actual.estado = valor;
    else if (campo === "cliente") actual.nombre = valor;
    else if (campo === "id") actual.cedula = valor;
    else if (campo === "creado") actual.creada = fechaTigoAISO(valor);
    else if (campo === "fin") actual.fin = fechaTigoAISO(valor);
  });
  cerrar();
  return { filas, ignoradas: 0 };
}

function leerOrdenesTigo(texto) {
  if (/no\.?\s*orden\s*:/i.test(String(texto || ""))) return leerOrdenesTigoCelular(texto);
  const filas = [];
  let ignoradas = 0;
  String(texto || "").split(/\r?\n/).forEach((linea) => {
    if (!linea.trim()) return;
    let cols = linea.split("\t").map((c) => c.trim());
    if (cols.length < 5) cols = linea.trim().split(/\s{2,}/).map((c) => c.trim());
    if (cols.length < 5 || !/^\d+$/.test(cols[0])) {
      ignoradas++;
      return;
    }
    filas.push({
      orden: cols[0],
      tipo: cols[1] || "",
      estado: cols[2] || "",
      nombre: cols[3] || "",
      cedula: cols[4] || "",
      creada: fechaTigoAISO(cols[5]),
      fin: fechaTigoAISO(cols[6]),
    });
  });
  return { filas, ignoradas };
}

function claseEstadoOrden(estado) {
  const e = normalizarNombreOrden(estado);
  if (e.includes("completad")) return "completada";
  if (ORDENES_ESTADOS_EN_PROCESO.includes(e)) return "proceso";
  return "otro";
}

// Un cliente de la app con nombre casi igual (error de dedo) o que contiene todos los
// nombres/apellidos del otro. Solo sirve para avisar: nunca se une nada automáticamente.
function buscarClienteParecido(key, clientes) {
  const largos = (s) => s.split(" ").filter((t) => t.length > 2);
  const tk = largos(key);
  for (const c of clientes) {
    const ck = normalizarNombreOrden(c.nombre);
    if (!ck || ck === key) continue;
    if (key.length >= 10 && Math.abs(ck.length - key.length) <= 2 && distanciaTexto(ck, key) <= 2) return c;
    const tc = largos(ck);
    const corto = tk.length <= tc.length ? tk : tc;
    const largo = tk.length <= tc.length ? tc : tk;
    if (corto.length >= 2 && corto.every((t) => largo.includes(t))) return c;
  }
  return null;
}

function compararOrdenes(clientes, texto, descartados, convergencias) {
  const { filas, ignoradas } = leerOrdenesTigo(texto);
  const porNombre = new Map();
  clientes.forEach((c) => {
    const k = normalizarNombreOrden(c.nombre);
    if (k && !porNombre.has(k)) porNombre.set(k, c);
  });
  const moviles = convergencias || [];
  const porNombreMovil = new Map();
  moviles.forEach((c) => {
    const k = normalizarNombreOrden(c.nombre);
    if (k && !porNombreMovil.has(k)) porNombreMovil.set(k, c);
  });
  const r = {
    total: filas.length,
    ignoradas,
    repetidas: 0,
    faltan: [],
    procesoFaltan: [],
    fechaDistinta: [],
    pendientesInstalados: [],
    alertas: [],
    posibles: [],
    bien: [],
    noVerificadas: [],
    movil: { faltan: [], proceso: [], fechaDistinta: [], alertas: [], posibles: [], bien: [] },
  };
  const vistos = new Set();
  filas.forEach((f) => {
    const tipoNorm = normalizarNombreOrden(f.tipo);
    const clase = claseEstadoOrden(f.estado);
    const key = normalizarNombreOrden(f.nombre);

    // Órdenes móviles (MATCH DIGITAL / CONVERGENTE PURO): se comparan contra Clientes Móvil.
    // "Completada" cuenta como completada (aunque Tigo la rechace después, no se puede saber).
    if (ORDENES_TIPOS_MOVIL.includes(tipoNorm)) {
      if (clase === "otro" || !key) {
        r.noVerificadas.push(f);
        return;
      }
      const claveM = "m|" + key + "|" + clase;
      if (vistos.has(claveM)) {
        r.repetidas++;
        return;
      }
      vistos.add(claveM);
      const m = porNombreMovil.get(key);
      if (!m) {
        const parecidoM = descartados.has("m:" + key) ? null : buscarClienteParecido(key, moviles);
        if (parecidoM) {
          r.movil.posibles.push({ fila: f, cliente: parecidoM, key: "m:" + key });
          return;
        }
        (clase === "completada" ? r.movil.faltan : r.movil.proceso).push(f);
        return;
      }
      if (clase === "completada") {
        if (f.fin && fechaActivacionMovil(m) !== f.fin) r.movil.fechaDistinta.push({ fila: f, cliente: m });
        else r.movil.bien.push({ fila: f, cliente: m });
      } else {
        r.movil.alertas.push({ fila: f, cliente: m });
      }
      return;
    }

    const tipoOk = ORDENES_TIPOS_VERIFICABLES.includes(tipoNorm);
    if (!tipoOk || clase === "otro" || !key) {
      r.noVerificadas.push(f);
      return;
    }
    const clave = key + "|" + clase;
    if (vistos.has(clave)) {
      r.repetidas++;
      return;
    }
    vistos.add(clave);
    const c = porNombre.get(key);
    if (!c) {
      const parecido = descartados.has(key) ? null : buscarClienteParecido(key, clientes);
      if (parecido) {
        r.posibles.push({ fila: f, cliente: parecido, key });
        return;
      }
      (clase === "completada" ? r.faltan : r.procesoFaltan).push(f);
      return;
    }
    if (clase === "completada") {
      if (!c.fechaInstalacion) r.pendientesInstalados.push({ fila: f, cliente: c });
      else if (f.fin && c.fechaInstalacion !== f.fin) r.fechaDistinta.push({ fila: f, cliente: c });
      else r.bien.push({ fila: f, cliente: c });
    } else {
      if (c.fechaInstalacion) r.alertas.push({ fila: f, cliente: c });
      else r.bien.push({ fila: f, cliente: c });
    }
  });
  return r;
}
