// ---------- Conexión a Supabase ----------
const SUPABASE_URL = "PEGA_AQUI_TU_PROJECT_URL";
const SUPABASE_ANON_KEY = "PEGA_AQUI_TU_ANON_KEY";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Almacenamiento en la nube (reemplaza window.storage / localStorage) ----------
const storage = {
  async get(key) {
    try {
      const { data, error } = await supabaseClient
        .from("kv_store")
        .select("value")
        .eq("key", key)
        .maybeSingle();
      if (error) throw error;
      if (!data) return null;
      return { key, value: data.value, shared: true };
    } catch (e) {
      console.error("Error leyendo de Supabase:", e);
      return null;
    }
  },
  async set(key, value) {
    try {
      const { error } = await supabaseClient
        .from("kv_store")
        .upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value, shared: true };
    } catch (e) {
      console.error("Error guardando en Supabase:", e);
      return null;
    }
  },
};

// ---------- Helpers de fecha ----------
const toISO = (d) => {
  const dt = new Date(d);
  return dt.toISOString().slice(0, 10);
};
// Fecha en el calendario LOCAL del usuario (no UTC). Se usa para comparar
// "creadoEn" (guardado con hora exacta) contra el día de hoy sin que el
// cambio de día en UTC desincronice la comparación cerca de medianoche.
const fechaLocalISO = (d) => {
  const dt = new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const day = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const addDays = (dateStr, n) => {
  const dt = new Date(dateStr + "T00:00:00");
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
};
const daysInMonth = (year, monthIndex) => new Date(year, monthIndex + 1, 0).getDate();
const addMonthsKeepDay = (dateStr, monthsToAdd, targetDay) => {
  const dt = new Date(dateStr + "T00:00:00");
  const totalMonth = dt.getMonth() + monthsToAdd;
  const year = dt.getFullYear() + Math.floor(totalMonth / 12);
  const month = ((totalMonth % 12) + 12) % 12;
  const lastDay = daysInMonth(year, month);
  const day = Math.min(targetDay || dt.getDate(), lastDay);
  return toISO(new Date(year, month, day));
};
const daysFromToday = (dateStr) => {
  const today = new Date(toISO(new Date()) + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
};
const fmtFecha = (dateStr) => {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-");
  return `${d}/${m}/${y}`;
};
const MESES = [
  "enero", "febrero", "marzo", "abril", "mayo", "junio",
  "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
];
const fmtFechaLarga = (dateStr) => {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-");
  return `${parseInt(d, 10)} de ${MESES[parseInt(m, 10) - 1]}`;
};
const mesLabel = (valorMes) => {
  if (!valorMes) return "—";
  const [y, m] = valorMes.split("-");
  const nombre = MESES[parseInt(m, 10) - 1] || "";
  return `${nombre.charAt(0).toUpperCase()}${nombre.slice(1)} ${y}`;
};
// Período de comisión: instalados del 21 del mes anterior al 20 del mes actual
// se cuentan como "del mes actual" (el día 21 ya arranca el período siguiente).
function periodoComision(fechaISO) {
  if (!fechaISO) return null;
  const [y, m, d] = fechaISO.split("-").map(Number);
  let year = y;
  let month = m;
  if (d >= 21) {
    month += 1;
    if (month > 12) { month = 1; year += 1; }
  }
  return `${year}-${String(month).padStart(2, "0")}`;
}
// Suma (o resta) meses a una clave "YYYY-MM", para navegar entre períodos de comisión.
function sumarMesClave(mesKey, delta) {
  const [y, m] = mesKey.split("-").map(Number);
  const total = y * 12 + (m - 1) + delta;
  const newY = Math.floor(total / 12);
  const newM = (((total % 12) + 12) % 12) + 1;
  return `${newY}-${String(newM).padStart(2, "0")}`;
}
// Rango de fechas (inicio y fin) de un período de comisión "YYYY-MM" (día 21 al 20).
function rangoCiclo(periodoKey) {
  const [y, m] = periodoKey.split("-").map(Number);
  const inicio = new Date(y, m - 2, 21);
  const fin = new Date(y, m - 1, 20);
  return { inicio, fin };
}
function periodosRecientes(count) {
  const actual = periodoComision(toISO(new Date()));
  const out = [];
  for (let i = 0; i < count; i++) {
    const key = sumarMesClave(actual, -i);
    out.push({ key, label: mesLabel(key) });
  }
  return out;
}
// Lee una meta (clientes o dinero) de un mes, compatible con el formato viejo
// donde metas[mes] era un número simple (solo meta de clientes).
function leerMeta(metas, mes, campo) {
  const m = metas[mes];
  if (m == null) return undefined;
  if (typeof m === "number") return campo === "clientes" ? m : undefined;
  return m[campo];
}
const fmtMonto = (n) => `$${Number(n || 0).toFixed(2)}`;
const ORDINAL = { 1: "1ra", 2: "2da", 3: "3ra", 4: "4ta" };
// Ciclo de estados al hacer clic en el indicador de una factura: sin marcar → pendiente → pagada → sin marcar.
function siguienteEstadoFactura(actual) {
  if (actual === "pagada") return "";
  if (actual === "pendiente") return "pagada";
  return "pendiente";
}

// ---------- Cálculo de comisión ----------
// Monto base según el % de logro en ingresos ($ de clientes) del período actual.
const TABLA_COMISION_BASE = [
  { min: 80, max: 89.9999, monto: 550 },
  { min: 90, max: 99.9999, monto: 750 },
  { min: 100, max: 109.9999, monto: 950 },
  { min: 110, max: 119.9999, monto: 1150 },
  { min: 120, max: 129.9999, monto: 1300 },
  { min: 130, max: 139.9999, monto: 1500 },
  { min: 140, max: Infinity, monto: 1700 },
];
function montoBaseComision(pctIngreso) {
  if (pctIngreso == null || pctIngreso < 80) return 0;
  const tramo = TABLA_COMISION_BASE.find((t) => pctIngreso >= t.min && pctIngreso <= t.max);
  return tramo ? tramo.monto : 1700;
}
// Comisión final = monto base (según % ingreso) × (% ARPU / 100) × (% clientes / 100).
// Si el % de clientes instalados supera 90%, el ingreso del período suma también
// los montos de las convergencias FULL TIGO de ese mismo período.
function calcularComision({ dineroDelPeriodo, metaDinero, arpuPeriodo, metaArpu, clientesInstalados, metaClientes, bonoFullTigo }) {
  const pctClientes = metaClientes ? (clientesInstalados / metaClientes) * 100 : null;
  const aplicaBono = pctClientes !== null && pctClientes > 90;
  const dineroAjustado = dineroDelPeriodo + (aplicaBono ? bonoFullTigo : 0);
  const pctIngreso = metaDinero ? (dineroAjustado / metaDinero) * 100 : null;
  const pctArpu = metaArpu ? (arpuPeriodo / metaArpu) * 100 : null;
  const montoBase = montoBaseComision(pctIngreso);
  const factorArpu = pctArpu != null ? pctArpu / 100 : 0;
  const factorClientes = pctClientes != null ? pctClientes / 100 : 0;
  const completo = pctIngreso != null && pctArpu != null && pctClientes != null;
  const total = completo ? montoBase * factorArpu * factorClientes : 0;
  return { total, montoBase, pctIngreso, pctArpu, pctClientes, aplicaBono, bonoFullTigo, dineroAjustado, completo };
}

// Columnas disponibles en la tabla de Clientes: metadata para el selector,

// Limpia el teléfono y le antepone el código de país de Panamá (507) si no lo tiene.
function telefonoWhatsapp(telefono) {
  const digits = (telefono || "").replace(/\D/g, "");
  if (digits.startsWith("507")) return digits;
  return `507${digits}`;
}
function whatsappLink(cliente, milestone) {
  return `https://wa.me/${telefonoWhatsapp(cliente.telefono)}?text=${encodeURIComponent(milestone.texto)}`;
}

function calcularPrimeraFactura(fechaInstalacion, cicloDia, montoMensual) {
  if (!fechaInstalacion || !cicloDia) return null;
  const dt = new Date(fechaInstalacion + "T00:00:00");
  const day = dt.getDate();
  let year = dt.getFullYear();
  let month = dt.getMonth();
  if (day >= cicloDia) {
    month += 1;
    if (month > 11) { month = 0; year += 1; }
  }
  const lastDay = daysInMonth(year, month);
  const diaFactura = Math.min(cicloDia, lastDay);
  const fecha1raFactura = toISO(new Date(year, month, diaFactura));
  const dias = Math.round((new Date(fecha1raFactura + "T00:00:00") - dt) / 86400000);
  const monto = montoMensual ? +((Number(montoMensual) * dias) / 30).toFixed(2) : "";
  return { fecha1raFactura, monto1raFactura: monto, dias };
}

// ---------- Plantillas de mensajes por tipo de aviso ----------
// Extrae el primer nombre de forma robusta: ignora espacios extra al inicio/fin
// y entre palabras, y da un saludo genérico si el nombre viniera vacío.
// Nombre completo del cliente, recortando espacios extra; da un saludo
// genérico si el nombre viniera vacío.
function nombreCompleto(c) {
  const n = (c.nombre || "").trim();
  return n || "estimado cliente";
}

// Frase de vencimiento calculada según los días reales que faltan hoy
// (no un número fijo), con casos especiales para "vence hoy" y atrasos.
function fraseVencimiento(dias) {
  if (dias > 0) return `vence en ${dias} día${dias !== 1 ? "s" : ""}`;
  if (dias === 0) return "vence hoy";
  const atraso = Math.abs(dias);
  return `venció hace ${atraso} día${atraso !== 1 ? "s" : ""}`;
}

📋 Plan: ${c.plan}
📅 Prorrateo: ${fmtFechaLarga(c.fechaInstalacion)} al ${fmtFechaLarga(finProrrateo)}

🔢 N° de suscriptor: *${c.numeroSuscriptor}*

Este cobro incluye ambos períodos: el prorrateo desde su instalación y su primera mensualidad regular completa. Por eso el monto de esta factura difiere de las próximas, que solo cobrarán la mensualidad regular.

  }
  return `Hola ${nombre}, le saluda José Rodríguez, ejecutivo de ventas residenciales en Tigo Panamá. Le confirmo que su factura correspondiente a este mes ya fue generada, con vencimiento el *${fmtFechaLarga(c._venc)}*. Su número de suscriptor es *${c.numeroSuscriptor}*, lo va a necesitar para realizar el pago correctamente. Una vez realizado el pago, por favor compárteme el comprobante para validar que haya ingresado correctamente al sistema. Cualquier duda, quedo atento.`;
}

}

const MILESTONE_TYPES = [

function calcularFacturas(cliente, umbralProrrateo) {
  if (!cliente.fechaInstalacion) return [];
  const cicloDia = parseInt(cliente.cicloFacturacion, 10) || null;
  const facturas = [];
  for (let n = 1; n <= 4; n++) {
    const generada =
      n === 1
        ? cliente.fecha1raFactura
        : cicloDia
        ? addMonthsKeepDay(cliente.fecha1raFactura, n - 1, cicloDia)
        : addDays(cliente.fecha1raFactura, 30 * (n - 1));
    const siguienteGenerada = cicloDia
      ? addMonthsKeepDay(generada, 1, cicloDia)
      : addDays(generada, 30);
    const vencimiento = addDays(siguienteGenerada, -1);
    const milestones = MILESTONE_TYPES.map((mt) => {
      const key = `f${n}_${mt.type}`;
      const triggerDate =
        mt.type === "d1" ? addDays(generada, 1) :
        mt.type === "t15" ? addDays(vencimiento, -15) :
        addDays(vencimiento, -3);
      const enviado = !!cliente[key];
      const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
      const texto = mt.getTexto({ ...cliente, _venc: vencimiento, plan: planLabelMensaje(cliente) }, n);
      return { ...mt, key, n, triggerDate, enviado, pendienteHoy, texto };
    });

    // Solo para la 1ra factura: si el prorrateo es igual o mayor al umbral configurado,
    // se suma un aviso extra 3 días después de la instalación.
    if (n === 1 && cicloDia && cliente.montoMensual) {
      const rProrrateo = calcularPrimeraFactura(cliente.fechaInstalacion, cicloDia, cliente.montoMensual);
      if (rProrrateo && Number(rProrrateo.monto1raFactura) > 0) {
        const pctProrrateo = (Number(rProrrateo.monto1raFactura) / Number(cliente.montoMensual)) * 100;
        if (pctProrrateo >= Number(umbralProrrateo ?? 25)) {
          const key = "aviso_prorrateo";
          const triggerDate = addDays(cliente.fechaInstalacion, 3);
          const enviado = !!cliente[key];
          const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
          const texto = textoProrrateoAlto({ ...cliente, _venc: vencimiento });
          milestones.push({
            type: "prorrateo",
            tag: "D+3",
            label: "Aviso de prorrateo alto",
            color: "#7C3AED",
            bg: "#EDE9FE",
            key,
            n,
            triggerDate,
            enviado,
            pendienteHoy,
            texto,
          });
        }
      }
    }

    facturas.push({ n, generada, vencimiento, milestones });
  }
  return facturas;
}

function facturaActual(facturas) {
  if (!facturas.length) return null;
  for (let i = facturas.length - 1; i >= 0; i--) {
    if (daysFromToday(facturas[i].generada) <= 0) return facturas[i];
  }
  return facturas[0];
}

// ---------- Selector de rango de fechas en un solo campo (calendario único) ----------
// Usa flatpickr en modo "range": el usuario abre un solo calendario y elige
// primero la fecha inicial y luego la final, sin tener que usar dos campos separados.
function RangoFechasInput({ desde, hasta, onChange, className, style, placeholder = "Seleccionar rango de fechas" }) {
  const inputRef = useRef(null);
  const fpRef = useRef(null);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange;

  useEffect(() => {
    if (!inputRef.current || !window.flatpickr) return;
    fpRef.current = window.flatpickr(inputRef.current, {
      mode: "range",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d/m/Y",
      locale: window.flatpickr.l10ns && window.flatpickr.l10ns.es ? "es" : undefined,
      defaultDate: [desde, hasta].filter(Boolean),
      onChange: (selectedDates) => {
        if (selectedDates.length === 2) {
          onChangeRef.current(fechaLocalISO(selectedDates[0]), fechaLocalISO(selectedDates[1]));
        } else if (selectedDates.length === 0) {
          onChangeRef.current("", "");
        }
      },
    });
    return () => {
      if (fpRef.current) fpRef.current.destroy();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Mantiene el calendario sincronizado si el rango cambia desde afuera (ej. botón "Limpiar").
  useEffect(() => {
    if (fpRef.current) {
      fpRef.current.setDate([desde, hasta].filter(Boolean), false);
    }
  }, [desde, hasta]);

  return (
    <input
      ref={inputRef}
      type="text"
      readOnly
      placeholder={placeholder}
      className={className || "px-3 py-2 rounded-md border text-sm outline-none cursor-pointer"}
      style={style || { borderColor: "#D1D5DB" } }
    />
  );
}

// ---------- Componente principal ----------
function App() {

    try {

  const [saveError, setSaveError] = useState(false);

  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [historial, setHistorial] = useState([]);
  const [metas, setMetas] = useState({});
  const [metasLoaded, setMetasLoaded] = useState(false);
  const [convergencias, setConvergencias] = useState([]);
  const [convergenciasLoaded, setConvergenciasLoaded] = useState(false);
  const [mostrarConvergencias, setMostrarConvergencias] = useState(false);
  const [eliminados, setEliminados] = useState([]);
  const [eliminadosLoaded, setEliminadosLoaded] = useState(false);
  const [umbralProrrateo, setUmbralProrrateo] = useState(25);
  const [umbralProrrateoLoaded, setUmbralProrrateoLoaded] = useState(false);
  const [columnasClientes, setColumnasClientes] = useState({
    orden: COLUMNAS_CLIENTES_KEYS,
    visibles: Object.fromEntries(COLUMNAS_CLIENTES_KEYS.map((k) => [k, true])),
  });
  const [columnasClientesLoaded, setColumnasClientesLoaded] = useState(false);
  const [mostrarConfig, setMostrarConfig] = useState(false);
  const [saltarAMes, setSaltarAMes] = useState(null);
  const [mostrarSelectorNuevo, setMostrarSelectorNuevo] = useState(false);
  const importInputRef = useRef(null);
  const sonidoReproducidoRef = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("clientes-churn");
        if (res && res.value) setClientes(JSON.parse(res.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const r = await storage.set("clientes-churn", JSON.stringify(clientes));
        setSaveError(!r);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [clientes, loaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("metas-mensuales");
        if (res && res.value) setMetas(JSON.parse(res.value));
      } catch (e) {}
      setMetasLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!metasLoaded) return;
    (async () => {
      try {
        await storage.set("metas-mensuales", JSON.stringify(metas));
      } catch (e) {}
    })();
  }, [metas, metasLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("convergencias-churn");
        if (res && res.value) setConvergencias(JSON.parse(res.value));
      } catch (e) {}
      setConvergenciasLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!convergenciasLoaded) return;
    (async () => {
      try {
        await storage.set("convergencias-churn", JSON.stringify(convergencias));
      } catch (e) {}
    })();
  }, [convergencias, convergenciasLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("clientes-eliminados");
        if (res && res.value) setEliminados(JSON.parse(res.value));
      } catch (e) {}
      setEliminadosLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!eliminadosLoaded) return;
    (async () => {
      try {
        await storage.set("clientes-eliminados", JSON.stringify(eliminados));
      } catch (e) {}
    })();
  }, [eliminados, eliminadosLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("umbral-prorrateo");
        if (res && res.value) setUmbralProrrateo(Number(res.value));
      } catch (e) {}
      setUmbralProrrateoLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!umbralProrrateoLoaded) return;
    (async () => {
      try {
        await storage.set("umbral-prorrateo", String(umbralProrrateo));
      } catch (e) {}
    })();
  }, [umbralProrrateo, umbralProrrateoLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("clientes-columnas");
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && Array.isArray(parsed.orden) && parsed.visibles) {
            const ordenValido = parsed.orden.filter((k) => COLUMNAS_CLIENTES_KEYS.includes(k));
            const faltantes = COLUMNAS_CLIENTES_KEYS.filter((k) => !ordenValido.includes(k));
            setColumnasClientes({
              orden: [...ordenValido, ...faltantes],
              visibles: { ...Object.fromEntries(COLUMNAS_CLIENTES_KEYS.map((k) => [k, true])), ...parsed.visibles },
            });
          }
        }
      } catch (e) {}
      setColumnasClientesLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!columnasClientesLoaded) return;
    (async () => {
      try {
        await storage.set("clientes-columnas", JSON.stringify(columnasClientes));
      } catch (e) {}
    })();
  }, [columnasClientes, columnasClientesLoaded]);

  const clientesCalc = useMemo(() => {
    return clientes.map((c) => {
      const facturas = calcularFacturas(c, umbralProrrateo);
      return { ...c, facturas, actual: facturaActual(facturas) };
    });
  }, [clientes, umbralProrrateo]);

  const clienteDetalle = useMemo(
    () => clientesCalc.find((c) => c.id === clienteDetalleId) || null,
    [clientesCalc, clienteDetalleId]
  );

  const alertasHoy = useMemo(() => {
    const list = [];
    clientesCalc.forEach((c) => {
      c.facturas.forEach((f) => {
        f.milestones.forEach((m) => {
          if (m.pendienteHoy) list.push({ cliente: c, factura: f, milestone: m });
        });
      });
    });
    const orden = { t3: 0, t15: 1, d1: 2, prorrateo: 3 };
    list.sort((a, b) => {
      if (orden[a.milestone.type] !== orden[b.milestone.type])
        return orden[a.milestone.type] - orden[b.milestone.type];
      return daysFromToday(a.milestone.triggerDate) - daysFromToday(b.milestone.triggerDate);
    });
    return list;
  }, [clientesCalc]);

  // Deja una sola alerta por cliente: la más reciente/urgente (T-3 > T-15 > D+1;
  // a igual prioridad, la de fecha de disparo más reciente).
  const alertasPorCliente = useMemo(() => {
    const orden = { t3: 0, t15: 1, d1: 2, prorrateo: 3 };
    const porCliente = new Map();
    alertasHoy.forEach(({ cliente, factura, milestone }) => {
      const actual = porCliente.get(cliente.id);
      if (!actual) {
        porCliente.set(cliente.id, { cliente, factura, milestone });
        return;
      }
      const prioridadActual = orden[actual.milestone.type];
      const prioridadNueva = orden[milestone.type];
      const esMasReciente =
        prioridadNueva < prioridadActual ||
        (prioridadNueva === prioridadActual && milestone.triggerDate > actual.milestone.triggerDate);
      if (esMasReciente) porCliente.set(cliente.id, { cliente, factura, milestone });
    });
    return Array.from(porCliente.values());
  }, [alertasHoy]);

  const filteredClientes = useMemo(() => {
    if (!search.trim()) return clientesCalc;
    const q = search.toLowerCase();
    return clientesCalc.filter(
      (c) =>
        c.nombre.toLowerCase().includes(q) ||
        c.numeroSuscriptor.toLowerCase().includes(q) ||
        c.telefono.toLowerCase().includes(q) ||
        planLabel(c).toLowerCase().includes(q)
    );
  }, [clientesCalc, search]);

  const stats = useMemo(() => {
    const total = clientes.length;
    const alHoy = alertasPorCliente.length;
    const proximos7 = clientesCalc.filter((c) =>
      c.facturas.some((f) =>
        f.milestones.some((m) => !m.enviado && daysFromToday(m.triggerDate) > 0 && daysFromToday(m.triggerDate) <= 7)
      )
    ).length;
    const atrasados = clientes.filter((c) => c.estadoPago === "Atrasado").length;
    return { total, alHoy, proximos7, atrasados };
  }, [clientes, alertasPorCliente, clientesCalc]);

  useEffect(() => {
    if (!loaded || stats.alHoy === 0 || sonidoReproducidoRef.current) return;
    sonidoReproducidoRef.current = true;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  }, [loaded, stats.alHoy]);

  useEffect(() => {
    setMobileMenuOpen(false);
  }, [tab]);

  function resetForm() {
    setForm(emptyForm());
    setEditingId(null);
  }

  function irANuevoConSuscriptor(numero) {
    setForm({ ...emptyForm(), numeroSuscriptor: numero });
    setEditingId(null);
    setTab("nuevo");
  }

  function actualizarMeta(mes, campo, valor) {
    setMetas((prev) => {
      const actual = typeof prev[mes] === "object" && prev[mes] !== null ? prev[mes] : {};
      return { ...prev, [mes]: { ...actual, [campo]: valor === "" ? undefined : Number(valor) } };
    });
  }

  function agregarConvergencia(nombre, telefono, fullTigo, montoPlan) {
    setConvergencias((prev) => [
      ...prev,
      { id: uid(), nombre, telefono, fullTigo: !!fullTigo, montoPlan: fullTigo ? Number(montoPlan) || 0 : null, creadoEn: new Date().toISOString() },
    ]);
  }

  function editarConvergencia(id, datos) {
    setConvergencias((prev) => prev.map((c) => (c.id === id ? { ...c, ...datos } : c)));
  }

  function eliminarConvergencia(id) {
    setConvergencias((prev) => prev.filter((c) => c.id !== id));
  }

  // Aplica un cambio a la lista de clientes, guardando el estado anterior
  // en el historial para poder deshacerlo.
  function actualizarClientes(updater) {
    setHistorial((h) => [...h, clientes].slice(-20));
    setClientes(updater);
  }

  function deshacerUltimaAccion() {
    setHistorial((h) => {
      if (h.length === 0) return h;
      const anterior = h[h.length - 1];
      setClientes(anterior);
      return h.slice(0, -1);
    });
  }

  function handleSubmit(e) {
    e.preventDefault();
    const obligatorios = [
      form.numeroSuscriptor,
      form.nombre,
      form.telefono,
      form.cicloFacturacion,
      form.planTipo,
      form.velocidad,
      form.montoMensual,
    ];
    if (form.planTipo === "DOBLE") obligatorios.push(form.planTV);
    if (obligatorios.some((v) => !String(v ?? "").trim())) return;

    const otros = clientes.filter((c) => c.id !== editingId);
    const numSusc = form.numeroSuscriptor.trim();
    const nombreNorm = form.nombre.trim().toLowerCase();
    const telDigits = form.telefono.replace(/\D/g, "");
    const duplicado = otros.find(
      (c) =>
        (c.numeroSuscriptor || "").trim() === numSusc ||
        (c.nombre || "").trim().toLowerCase() === nombreNorm ||
        (c.telefono || "").replace(/\D/g, "") === telDigits
    );
    if (duplicado) {
      const campo =
        (duplicado.numeroSuscriptor || "").trim() === numSusc
          ? "número de suscriptor"
          : (duplicado.nombre || "").trim().toLowerCase() === nombreNorm
          ? "nombre"
          : "teléfono";
      const continuar = window.confirm(
        `Ya existe un cliente con el mismo ${campo}: ${duplicado.nombre} (suscriptor ${duplicado.numeroSuscriptor || "—"}).\n\n¿Querés guardar este cliente de todas formas?`
      );
      if (!continuar) return;
    }

    if (editingId) {
      actualizarClientes((prev) => prev.map((c) => (c.id === editingId ? { ...c, ...form } : c)));
    } else {
      actualizarClientes((prev) => [...prev, { id: uid(), ...form, creadoEn: new Date().toISOString() }]);
    }
    resetForm();
    setTab("clientes");
  }

  function startEdit(c) {
    setForm({
      nombre: c.nombre,
      numeroSuscriptor: c.numeroSuscriptor,
      telefono: c.telefono,
      cicloFacturacion: c.cicloFacturacion,
      planTipo: c.planTipo,
      velocidad: c.velocidad,
      planTV: c.planTV,
      montoMensual: c.montoMensual,
      fechaInstalacion: c.fechaInstalacion,
      fecha1raFactura: c.fecha1raFactura,
      monto1raFactura: c.monto1raFactura,
      estadoPago: c.estadoPago,
      observaciones: c.observaciones,
    });
    setEditingId(c.id);
    setTab("nuevo");
  }

  function toggleMilestone(clienteId, key) {
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? { ...c, [key]: !c[key] } : c)));
  }

  function marcarFacturaPagada(clienteId, n) {
    actualizarClientes((prev) =>
      prev.map((c) =>
        c.id === clienteId
          ? { ...c, [`f${n}_d1`]: true, [`f${n}_t15`]: true, [`f${n}_t3`]: true, [`f${n}_estado`]: "pagada", estadoPago: "Pagado" }
          : c
      )
    );
  }

  // Cambia el estado de pago de una factura puntual: "pagada", "pendiente" o "" (sin marcar).
  // Al marcar como pagada, silencia sus 3 avisos; al desmarcar, los reactiva por si
  // corresponde que sigan recordándole al cliente.
  function actualizarEstadoFactura(clienteId, n, nuevoEstado) {
    actualizarClientes((prev) =>
      prev.map((c) => {
        if (c.id !== clienteId) return c;
        const marcarEnviado = nuevoEstado === "pagada";
        return {
          ...c,
          [`f${n}_estado`]: nuevoEstado,
          [`f${n}_d1`]: marcarEnviado,
          [`f${n}_t15`]: marcarEnviado,
          [`f${n}_t3`]: marcarEnviado,
          ...(marcarEnviado ? { estadoPago: "Pagado" } : {}),
        };
      })
    );
  }

  function deleteClient(id) {
    const cliente = clientes.find((c) => c.id === id);
    actualizarClientes((prev) => prev.filter((c) => c.id !== id));
    if (cliente) {
      setEliminados((prev) => [...prev, { ...cliente, eliminadoEn: new Date().toISOString() }]);
    }
    setConfirmDelete(null);
  }

  function recuperarCliente(id) {
    const cliente = eliminados.find((c) => c.id === id);
    if (!cliente) return;
    setEliminados((prev) => prev.filter((c) => c.id !== id));
    const { eliminadoEn, ...resto } = cliente;
    actualizarClientes((prev) => [...prev, resto]);
  }

  function copyMessage(cliente, milestone) {
    navigator.clipboard?.writeText(milestone.texto).catch(() => {});
    setCopiedKey(cliente.id + milestone.key);
    setTimeout(() => setCopiedKey(null), 1500);
  }

  function copySuscriptor(cliente) {
    navigator.clipboard?.writeText(cliente.numeroSuscriptor || "").catch(() => {});
    setCopiedSubKey(cliente.id);
    setTimeout(() => setCopiedSubKey(null), 1500);
  }

  function exportarRespaldo() {
    const blob = new Blob([JSON.stringify(clientes, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `metaforce-respaldo-${toISO(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importarRespaldo(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const importados = JSON.parse(reader.result);
        if (!Array.isArray(importados)) {
          alert("El archivo no tiene el formato esperado.");
          return;
        }
        actualizarClientes((prev) => {
          const idsExistentes = new Set(prev.map((c) => c.id));
          const nuevos = importados.filter((c) => c && c.id && !idsExistentes.has(c.id));
          alert(`Se importaron ${nuevos.length} cliente(s) nuevo(s) de ${importados.length} en el archivo.`);
          return [...prev, ...nuevos];
        });
      } catch (err) {
        alert("No se pudo leer el archivo. Verificá que sea un respaldo válido (.json).");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const navItems = [
    { key: "dashboard", label: "Dashboard", icon: "📊" },
    { key: "clientes", label: "Clientes", icon: "👥" },
    { key: "alertas", label: "Alertas de hoy", icon: "🔔", badge: stats.alHoy },
    { key: "precierre", label: "Precierre", icon: "🧾" },
  ];

  if (!autenticado) {
    return (
      <LoginScreen
        onSuccess={() => {
          try {
            localStorage.setItem("antichurn_auth", "1");
          } catch (e) {}
          setAutenticado(true);
        } }
      />
    );
  }

  return (
    <div className="min-h-screen flex flex-col md:flex-row font-sans" style={ { background: "#F4F6FA", color: "#001E62" } }>
      <div className="md:hidden flex items-center justify-between px-4 py-3" style={ { background: "#001E62" } }>
        <button
          onClick={() => { setTab("dashboard"); setMobileMenuOpen(false); } }
          className="flex items-center gap-2"
        >
          <div className="w-2.5 h-2.5 rounded-full" style={ { background: "#00AEEF", boxShadow: "0 0 0 3px rgba(0,174,239,0.25)" } } />
          <span className="text-white font-semibold tracking-wide text-lg">MetaForce CRM</span>
        </button>
        <button
          onClick={() => setMobileMenuOpen((v) => !v)}
          className="text-white text-2xl leading-none px-2 py-1"
          aria-label="Abrir menú"
        >
          {mobileMenuOpen ? "✕" : "☰"}
        </button>
      </div>

      <aside
        className={(mobileMenuOpen ? "flex " : "hidden ") + "md:flex w-full md:w-56 md:shrink-0 flex-col justify-between"}
        style={ { background: "#001E62" } }
      >
        <div>
          <div className="hidden md:block px-5 pt-6 pb-8">
            <button onClick={() => setTab("dashboard")} className="flex items-center gap-2">
              <div className="w-2.5 h-2.5 rounded-full" style={ { background: "#00AEEF", boxShadow: "0 0 0 3px rgba(0,174,239,0.25)" } } />
              <span className="text-white font-semibold tracking-wide text-lg">MetaForce CRM</span>
            </button>
            <p className="text-[11px] mt-1" style={ { color: "#7C89B0" } }>
              CONTROL DE CLIENTES &amp; EARLY CHURN - TEAM AZUERO
            </p>
          </div>
          <nav className="flex flex-col gap-1 px-3 pt-3 md:pt-0">
            {navItems.map((item) => (
              <button
                key={item.key}
                onClick={() => {
                  if (item.key === "nuevo" && !editingId) resetForm();
                  setTab(item.key);
                } }
                className="text-left px-3 py-2.5 rounded-md text-sm flex items-center justify-between transition-colors"
                style={ {
                  background: tab === item.key ? "rgba(255,255,255,0.08)" : "transparent",
                  color: tab === item.key ? "#FFFFFF" : "#8593B8",
                  fontWeight: tab === item.key ? 600 : 500,
                } }
              >
                <span className="flex items-center gap-2">
                  <span aria-hidden="true">{item.icon}</span>
                  {item.label}

function Dashboard({ stats, clientes, metas, onActualizarMeta, convergencias, onAbrirConvergencias, onNuevo, onVerClientes }) {
  const periodoActual = periodoComision(toISO(new Date()));
  const [periodoVisto, setPeriodoVisto] = useState(periodoActual);
  const esActual = periodoVisto === periodoActual;

  const metaClientes = leerMeta(metas, periodoVisto, "clientes");
  const metaDinero = leerMeta(metas, periodoVisto, "dinero");
  const metaArpu = leerMeta(metas, periodoVisto, "arpu");

  // Progreso del ciclo actual (día 21 al 20) para poder proyectar a fin de ciclo.
  const UN_DIA_MS = 24 * 60 * 60 * 1000;
  const cicloInfo = useMemo(() => {
    const { inicio, fin } = rangoCiclo(periodoVisto);
    const hoy = new Date();
    const totalDias = Math.round((fin - inicio) / UN_DIA_MS) + 1;
    let diasTranscurridos = Math.round((hoy - inicio) / UN_DIA_MS) + 1;
    diasTranscurridos = Math.max(0, Math.min(totalDias, diasTranscurridos));
    return { totalDias, diasTranscurridos, pctTranscurrido: totalDias > 0 ? diasTranscurridos / totalDias : 0 };
  }, [periodoVisto]);
  const UMBRAL_PROYECCION = 0.15; // no proyectar antes del 15% del ciclo (muy poco dato, muy inestable)
  const aunEsTemprano = esActual && cicloInfo.pctTranscurrido < UMBRAL_PROYECCION;
  const puedeProyectar = esActual && !aunEsTemprano && cicloInfo.diasTranscurridos > 0;

  // Todo lo que sigue se agrupa por período de comisión (instalados del 21 al 20),
  // no por mes calendario ni por fecha de ingreso.
  const clientesDelPeriodo = useMemo(
    () => clientes.filter((c) => periodoComision(c.fechaInstalacion) === periodoVisto),
    [clientes, periodoVisto]
  );
  const dineroDelPeriodo = useMemo(
    () => clientesDelPeriodo.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0),
    [clientesDelPeriodo]
  );
  const arpuPeriodo = useMemo(() => {
    if (clientesDelPeriodo.length === 0) return 0;
    return dineroDelPeriodo / clientesDelPeriodo.length;
  }, [clientesDelPeriodo, dineroDelPeriodo]);
  const singlesInstalados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.planTipo === "SINGLE").length,
    [clientesDelPeriodo]
  );
  const doblesInstalados = useMemo(
    () => clientesDelPeriodo.filter((c) => c.planTipo === "DOBLE").length,
    [clientesDelPeriodo]
  );
  // Los pendientes de instalación no pertenecen a ningún período todavía (no tienen
  // fecha), así que se muestran como un total aparte, sin importar qué período mires.
  const pendientesAhora = useMemo(() => clientes.filter((c) => !c.fechaInstalacion).length, [clientes]);

  const convergenciasPeriodo = useMemo(
    () => convergencias.filter((c) => periodoComision((c.creadoEn || "").slice(0, 10)) === periodoVisto).length,
    [convergencias, periodoVisto]
  );

  const historialPeriodos = useMemo(() => {
    const out = [];
    for (let i = 0; i < 6; i++) out.push(sumarMesClave(periodoActual, -i));
    return out;
  }, [periodoActual]);

  const [hoverPeriodo, setHoverPeriodo] = useState(null);

  // Comisión calculada para cada uno de los últimos 4 períodos, más antiguo primero
  // (para graficar de izquierda a derecha en orden cronológico).
  const historialComisiones = useMemo(() => {
    return historialPeriodos
      .slice(0, 4)
      .map((key) => {
        const metaClientesP = leerMeta(metas, key, "clientes");
        const metaDineroP = leerMeta(metas, key, "dinero");
        const metaArpuP = leerMeta(metas, key, "arpu");
        const delPeriodo = clientes.filter((c) => periodoComision(c.fechaInstalacion) === key);
        const cantidad = delPeriodo.length;
        const dinero = delPeriodo.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0);
        const arpuP = cantidad > 0 ? dinero / cantidad : 0;
        const bonoFullTigoP = convergencias
          .filter((c) => c.fullTigo && periodoComision((c.creadoEn || "").slice(0, 10)) === key)
          .reduce((acc, c) => acc + (Number(c.montoPlan) || 0), 0);
        const com = calcularComision({
          dineroDelPeriodo: dinero,
          metaDinero: metaDineroP,
          arpuPeriodo: arpuP,
          metaArpu: metaArpuP,
          clientesInstalados: cantidad,
          metaClientes: metaClientesP,
          bonoFullTigo: bonoFullTigoP,
        });
        return { key, cantidad, dinero, arpu: arpuP, ...com };
      })
      .reverse();
  }, [historialPeriodos, metas, clientes, convergencias]);

  const periodoMostrado = hoverPeriodo || periodoVisto;
  const idxMostrado = historialComisiones.findIndex((d) => d.key === periodoMostrado);
  const detalleMostrado = idxMostrado >= 0 ? historialComisiones[idxMostrado] : null;
  const detalleAnterior = idxMostrado > 0 ? historialComisiones[idxMostrado - 1] : null;

  const progresoClientesPct = metaClientes ? Math.round((clientesDelPeriodo.length / metaClientes) * 100) : null;
  const progresoDineroPct = metaDinero ? Math.round((dineroDelPeriodo / metaDinero) * 100) : null;
  const progresoArpuPct = metaArpu ? Math.round((arpuPeriodo / metaArpu) * 100) : null;

  const bonoFullTigo = useMemo(
    () =>
      convergencias
        .filter((c) => c.fullTigo && periodoComision((c.creadoEn || "").slice(0, 10)) === periodoVisto)
        .reduce((acc, c) => acc + (Number(c.montoPlan) || 0), 0),
    [convergencias, periodoVisto]
  );
  const comision = useMemo(
    () =>
      calcularComision({
        dineroDelPeriodo,
        metaDinero,
        arpuPeriodo,
        metaArpu,
        clientesInstalados: clientesDelPeriodo.length,
        metaClientes,
        bonoFullTigo,
      }),
    [dineroDelPeriodo, metaDinero, arpuPeriodo, metaArpu, clientesDelPeriodo.length, metaClientes, bonoFullTigo]
  );

  // Proyección a fin de ciclo: regla de tres simple sobre el ritmo actual.
  // El ARPU no se extrapola directo (es un promedio) — se deriva de clientes/ingreso ya proyectados.
  // La comisión tampoco se extrapola directo (tiene tramos escalonados) — se vuelve a calcular
  // con calcularComision() usando los valores ya proyectados.
  const proyeccion = useMemo(() => {
    if (!puedeProyectar) return null;
    const factor = cicloInfo.totalDias / cicloInfo.diasTranscurridos;
    const clientesProy = Math.round(clientesDelPeriodo.length * factor);
    const dineroProy = dineroDelPeriodo * factor;
    const arpuProy = clientesProy > 0 ? dineroProy / clientesProy : 0;
    const bonoFullTigoProy = bonoFullTigo * factor;
    const comisionProy = calcularComision({
      dineroDelPeriodo: dineroProy,
      metaDinero,
      arpuPeriodo: arpuProy,
      metaArpu,
      clientesInstalados: clientesProy,
      metaClientes,
      bonoFullTigo: bonoFullTigoProy,
    });
    return { clientes: clientesProy, dinero: dineroProy, arpu: arpuProy, comision: comisionProy.total };
  }, [puedeProyectar, cicloInfo, clientesDelPeriodo.length, dineroDelPeriodo, bonoFullTigo, metaDinero, metaArpu, metaClientes]);

  // Precio promedio real de tus planes SINGLE y DOBLE (según lo que ya cargaste),
  // para poder recomendar cuántos clientes de cada tipo hacen falta para llegar al ARPU meta.
  const precioPromedioPlan = useMemo(() => {
    function promedio(tipo) {
      const delPeriodo = clientesDelPeriodo.filter((c) => c.planTipo === tipo);
      const base = delPeriodo.length > 0 ? delPeriodo : clientes.filter((c) => c.planTipo === tipo && c.fechaInstalacion);
      if (base.length === 0) return null;
      return base.reduce((acc, c) => acc + (Number(c.montoMensual) || 0), 0) / base.length;
    }
    return { SINGLE: promedio("SINGLE"), DOBLE: promedio("DOBLE") };
  }, [clientesDelPeriodo, clientes]);

  const recomendacionArpu = useMemo(() => {
    if (!esActual || !metaArpu) return null;
    const C = clientesDelPeriodo.length;
    const D = dineroDelPeriodo;
    if (C > 0 && D / C >= metaArpu) return { alcanzado: true };
    function paraTipo(precio) {
      if (precio == null) return null;
      if (precio <= metaArpu) return { imposible: true, precio };
      const n = Math.max(0, Math.ceil((metaArpu * C - D) / (precio - metaArpu)));
      return { n, precio };
    }
    return { alcanzado: false, single: paraTipo(precioPromedioPlan.SINGLE), doble: paraTipo(precioPromedioPlan.DOBLE) };
  }, [esActual, metaArpu, clientesDelPeriodo.length, dineroDelPeriodo, precioPromedioPlan]);

  const [copiadoReporte, setCopiadoReporte] = useState(false);
  const [mostrarSimuladorArpu, setMostrarSimuladorArpu] = useState(false);

  function generarReporteDiario() {

    const doblesHoy = instaladosHoy.filter((c) => c.planTipo === "DOBLE");
    const singlesHoy = instaladosHoy.filter((c) => c.planTipo === "SINGLE");
    const converHoy = convergencias.filter((c) => c.creadoEn && fechaLocalISO(c.creadoEn) === hoy);
    const listaSusc = (arr) => arr.map((c) => c.numeroSuscriptor).filter(Boolean).join(", ");

    const texto = `Buenas tardes
Gestión de hoy

Dobles: ${doblesHoy.length}${doblesHoy.length ? " - " + listaSusc(doblesHoy) : ""}
Singles: ${singlesHoy.length}${singlesHoy.length ? " - " + listaSusc(singlesHoy) : ""}
Conver: ${converHoy.length}
Port: 
Early: `;

    navigator.clipboard
      ?.writeText(texto)
      .then(() => {
        setCopiadoReporte(true);
        setTimeout(() => setCopiadoReporte(false), 2000);
      })
      .catch(() => {});
  }

  return (

        <div className="flex items-center gap-2">

          <button onClick={onNuevo} className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>

          </button>
        </div>
      </div>

      <div className="flex items-center gap-2 mb-6 flex-wrap">

        >
          ← Período anterior
        </button>
        <span className="text-sm font-semibold px-2" style={ { color: "#001E62" } }>

        </span>
        {!esActual && (

            style={ { borderColor: "#D1D5DB", color: "#374151" } }
          >
            Período siguiente →
          </button>
        )}
        {!esActual && (
          <button
            onClick={() => setPeriodoVisto(periodoActual)}
            className="text-sm font-medium px-3 py-1.5 rounded-md"
            style={ { color: "#0072CE" } }
          >
            Volver al período actual
          </button>
        )}
      </div>

      <div className="rounded-lg p-5 mb-6 text-white" style={ { background: "linear-gradient(135deg, #001E62, #0072CE)" } }>
        <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
          <h2 className="font-semibold text-sm opacity-90">Comisión estimada de {mesLabel(periodoVisto)}</h2>
          {comision.aplicaBono && (
            <span className="text-xs font-medium px-2 py-0.5 rounded-full" style={ { background: "rgba(255,255,255,0.2)" } }>

        </div>
        {comision.completo ? (
          <>
            <div className="text-4xl font-mono font-bold mb-2">{fmtMonto(comision.total)}</div>
            <div className="text-xs opacity-80 leading-relaxed">
              Base {fmtMonto(comision.montoBase)} ({comision.pctIngreso.toFixed(1)}% ingresos
              {comision.aplicaBono ? `, incluye ${fmtMonto(bonoFullTigo)} de convergencias FULL TIGO` : ""}) ×{" "}

        {detalleMostrado && (

  );
}

function HistorialComisionChart({ data, periodoActivo, onSelect, onHover }) {
  const max = Math.max(1, ...data.map((d) => d.total));
  const ALTURA_MAX = 110;
  return (
    <div className="flex items-end gap-3 sm:gap-4" style={ { height: ALTURA_MAX + 44 } }>
      {data.map((d) => {
        const alturaPx = Math.max(6, Math.round((d.total / max) * ALTURA_MAX));
        const activo = d.key === periodoActivo;
        return (
          <button
            key={d.key}
            type="button"
            onClick={() => onSelect(d.key)}
            onMouseEnter={() => onHover(d.key)}
            onMouseLeave={() => onHover(null)}
            onFocus={() => onHover(d.key)}
            onBlur={() => onHover(null)}
            className="flex-1 flex flex-col items-center justify-end gap-1.5"
          >
            <span className="text-[11px] font-mono font-semibold whitespace-nowrap" style={ { color: activo ? "#001E62" : "#9CA3AF" } }>
              {fmtMonto(d.total)}
            </span>
            <div
              className="w-full rounded-t-md transition-all"
              style={ { height: alturaPx, background: activo ? "#001E62" : "#C7D2E8" } }
            />
            <span className="text-[11px] font-medium" style={ { color: activo ? "#001E62" : "#6B7280" } }>
              {mesLabel(d.key).split(" ")[0].slice(0, 3).toUpperCase()}
            </span>
          </button>
        );
      })}
    </div>
  );
}

function AlertasTab({ alertasHoy, alertasTodas, onMarcar, onCopiarSuscriptor, copiedSubKey, onPagoRealizado, onVerDetalle, search, setSearch, filtroTipo, setFiltroTipo }) {
  const [expandidos, setExpandidos] = useState(new Set());
  const [extrasAbiertos, setExtrasAbiertos] = useState(new Set());

  // ---- Envío en cadena por WhatsApp ----
  // Cola de alertas pendientes de recorrer una por una: abre WhatsApp con el
  // mensaje, y al volver pregunta si se envió antes de pasar a la siguiente.
  const [colaEnvio, setColaEnvio] = useState(null); // null = inactivo
  const [indiceEnvio, setIndiceEnvio] = useState(0);
  const [contadorEnviados, setContadorEnviados] = useState(0);
  const [resumenEnvio, setResumenEnvio] = useState(null); // { total, enviados } al terminar

  function iniciarEnvioEnCadena(lista) {
    if (!lista.length) return;
    setColaEnvio(lista);
    setIndiceEnvio(0);
    setContadorEnviados(0);
    setResumenEnvio(null);
    window.open(whatsappLink(lista[0].cliente, lista[0].milestone), "_blank", "noopener,noreferrer");
  }

  function avanzarEnvio(marcarComoEnviado) {
    const actual = colaEnvio[indiceEnvio];
    if (marcarComoEnviado) {
      onMarcar(actual.cliente.id, actual.milestone.key);
    }
    const nuevosEnviados = contadorEnviados + (marcarComoEnviado ? 1 : 0);
    const siguienteIndice = indiceEnvio + 1;
    if (siguienteIndice >= colaEnvio.length) {
      setResumenEnvio({ total: colaEnvio.length, enviados: nuevosEnviados });
      setColaEnvio(null);
    } else {
      setContadorEnviados(nuevosEnviados);
      setIndiceEnvio(siguienteIndice);
      const siguiente = colaEnvio[siguienteIndice];
      window.open(whatsappLink(siguiente.cliente, siguiente.milestone), "_blank", "noopener,noreferrer");
    }
  }

  function cancelarEnvioEnCadena() {
    setColaEnvio(null);
    setIndiceEnvio(0);
  }

  const conteosPorTipo = useMemo(() => {
    const c = {};
    alertasHoy.forEach(({ milestone }) => { c[milestone.type] = (c[milestone.type] || 0) + 1; });
    return c;
  }, [alertasHoy]);

  // Alertas adicionales que tiene el mismo cliente y que quedaron ocultas al
  // colapsar a "una alerta por cliente" (la más urgente se muestra arriba).
  const extrasPorCliente = useMemo(() => {
    const map = new Map();
    (alertasTodas || []).forEach((a) => {
      const arr = map.get(a.cliente.id) || [];
      arr.push(a);
      map.set(a.cliente.id, arr);
    });
    return map;
  }, [alertasTodas]);

  const q = search.trim().toLowerCase();
  const alertasFiltradas = alertasHoy
    .filter(({ milestone }) => (filtroTipo ? milestone.type === filtroTipo : true))
    .filter(({ cliente }) =>
      q
        ? cliente.nombre.toLowerCase().includes(q) ||
          (cliente.telefono || "").toLowerCase().includes(q) ||
          (cliente.numeroSuscriptor || "").toLowerCase().includes(q)
        : true
    );

  // Agrupa por urgencia para que se puedan escanear las más críticas primero.
  const GRUPOS = [
    { type: "t3", titulo: "🔴 Vencidas / urgentes" },
    { type: "t15", titulo: "🟡 Próximas a vencer" },
    { type: "d1", titulo: "🟢 Facturas nuevas" },
    { type: "prorrateo", titulo: "🟣 Prorrateo alto" },
  ];
  const gruposConDatos = GRUPOS.map((g) => ({
    ...g,
    items: alertasFiltradas.filter(({ milestone }) => milestone.type === g.type),
  })).filter((g) => g.items.length > 0);

  function toggleExpandido(id) {
    setExpandidos((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  function toggleExtras(id) {
    setExtrasAbiertos((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  function diasTexto(triggerDate) {
    const dias = daysFromToday(triggerDate);
    if (dias === 0) return "Vence hoy";

    return `Atrasada hace ${abs} día${abs === 1 ? "" : "s"}`;

      {alertasHoy.length > 0 && (

          <div className="flex items-center gap-3 flex-wrap">
            <input

              value={search}

      {alertasHoy.length === 0 ? (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-10 text-center">
          <p className="text-sm" style={ { color: "#6B7280" } }>No tenés alertas pendientes en este momento.</p>

        <div className="flex flex-col gap-6">
          {gruposConDatos.map((grupo) => (

                  return (
                    <div key={cliente.id} className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                      <div className="p-4 flex items-center justify-between flex-wrap gap-2" style={ { borderBottom: "1px solid #F0F0EF", background: "#FAFAF9" } }>

                        )}
                        <div className="flex items-center gap-2 flex-wrap">
                          <a
                            href={whatsappLink(cliente, milestone)}
                            target="_blank"

                              {extrasAbiertos.has(cliente.id)

                              <div className="flex flex-col gap-2 mt-2">
                                {extras.map((ex) => (
                                  <div
                                    key={ex.milestone.key}

                                    style={ { borderColor: "#E5E7EB", background: "#FAFAF9" } }
                                  >
                                    <div className="flex items-center gap-2 flex-wrap">

                                      <span className="text-xs font-medium" style={ { color: ex.milestone.color } }>{diasTexto(ex.milestone.triggerDate)}</span>
                                    </div>

                                      onClick={() => {

                                          onMarcar(ex.cliente.id, ex.milestone.key);

                                      } }
                                      className="text-xs font-medium px-2 py-1 rounded-md border"
                                      style={ { borderColor: "#D1D5DB", color: "#374151" } }
                                    >
                                      Marcar como enviado
                                    </button>
                                  </div>
                                ))}

                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ultimosMeses(count) {
  const MESES_CAP = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const hoy = new Date();
  const out = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    out.push({ key, label: MESES_CAP[d.getMonth()], anio: d.getFullYear() });
  }
  return out;
}

function FiltroCampo({ label, children }) {
  return (

  );
}

function ClientesTab({ clientes, search, setSearch, onEdit, onDelete, onMarcarPagada, onActualizarEstadoFactura, onVerDetalle, onNuevo, eliminados, onRecuperar, saltarAMes, columnasClientes, setColumnasClientes }) {
  const meses = useMemo(() => periodosRecientes(4), []);
  const mesActualKey = meses[0].key;
  const [mesActivo, setMesActivo] = useState(mesActualKey);
  const [modoVerTodos, setModoVerTodos] = useState(false);
  useEffect(() => {
    if (saltarAMes) {
      if (saltarAMes.periodo) setMesActivo(saltarAMes.periodo);
      setFechaDesde("");
      setFechaHasta("");
      setSearch("");
      setFiltroPlan(saltarAMes.filtroPlan || "");
      setFiltroInstalacion(saltarAMes.filtroInstalacion || "");
      setFiltroEstado(saltarAMes.filtroEstado || "");
      setModoVerTodos(!!saltarAMes.todosLosMeses);
      setFiltrosAbiertos(true);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [saltarAMes]);
  const [ordenarPor, setOrdenarPor] = useState("ingreso");
  const [ordenDireccion, setOrdenDireccion] = useState("desc");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [filtroInstalacion, setFiltroInstalacion] = useState("");
  const [filtroPlan, setFiltroPlan] = useState("");
  const [fechaDesde, setFechaDesde] = useState("");
  const [fechaHasta, setFechaHasta] = useState("");
  const rangoActivo = !!(fechaDesde || fechaHasta);
  const [copiedCell, setCopiedCell] = useState(null);
  const [papeleraAbierta, setPapeleraAbierta] = useState(false);
  const [filtrosAbiertos, setFiltrosAbiertos] = useState(false);
  const ordenColumnas = columnasClientes.orden;
  const columnasVisibles = columnasClientes.visibles;
  const [mostrarSelectorColumnas, setMostrarSelectorColumnas] = useState(false);
  const [colArrastrando, setColArrastrando] = useState(null);

  function handleOrdenarPorColumna(key) {
    const col = COLUMNAS_CLIENTES.find((c) => c.key === key);
    if (!col || !col.sortable) return;
    if (ordenarPor === key) setOrdenDireccion((d) => (d === "asc" ? "desc" : "asc"));
    else {
      setOrdenarPor(key);
      setOrdenDireccion("asc");
    }
  }

  function moverColumna(key, direccion) {
    setColumnasClientes((prev) => {
      const idx = prev.orden.indexOf(key);
      const nuevoIdx = idx + direccion;
      if (nuevoIdx < 0 || nuevoIdx >= prev.orden.length) return prev;
      const next = [...prev.orden];
      [next[idx], next[nuevoIdx]] = [next[nuevoIdx], next[idx]];
      return { ...prev, orden: next };
    });
  }

  function handleDropColumna(keyDestino) {
    if (!colArrastrando || colArrastrando === keyDestino) {
      setColArrastrando(null);
      return;
    }
    setColumnasClientes((prev) => {
      const next = [...prev.orden];
      const fromIdx = next.indexOf(colArrastrando);
      const toIdx = next.indexOf(keyDestino);
      next.splice(fromIdx, 1);
      next.splice(toIdx, 0, colArrastrando);
      return { ...prev, orden: next };
    });
    setColArrastrando(null);
  }

  const columnasAMostrar = ordenColumnas.filter((k) => columnasVisibles[k]);

  function copiarCelda(texto, id, campo) {
    navigator.clipboard?.writeText(texto || "").catch(() => {});
    setCopiedCell(id + campo);
    setTimeout(() => setCopiedCell(null), 1200);
  }

  function renderCeldaCliente(c, key) {
    switch (key) {
      case "suscriptor":
        return (
          <div className="flex items-center gap-1.5 font-mono text-xs">
            <span>{c.numeroSuscriptor}</span>
            <button
              onClick={() => copiarCelda(c.numeroSuscriptor, c.id, "sub")}
              title="Copiar número de suscriptor"
              className="text-xs"
              style={ { color: copiedCell === c.id + "sub" ? "#2F9E6E" : "#9CA3AF" } }
            >
              {copiedCell === c.id + "sub" ? "✓" : "📋"}
            </button>
          </div>
        );
      case "cliente":
        return (
          <div className="max-w-[150px]">
            <button
              onClick={() => onVerDetalle(c)}
              title={c.nombre}
              className="font-medium text-left hover:underline truncate block w-full"
              style={ { color: "#001E62" } }
            >
              {c.nombre}
            </button>
            <div className="text-xs font-mono flex items-center gap-1.5" style={ { color: "#9CA3AF" } }>
              <span>{c.telefono}</span>
              <button
                onClick={() => copiarCelda(c.telefono, c.id, "tel")}
                title="Copiar teléfono"
                className="text-xs"
                style={ { color: copiedCell === c.id + "tel" ? "#2F9E6E" : "#9CA3AF" } }
              >
                {copiedCell === c.id + "tel" ? "✓" : "📋"}
              </button>
            </div>
          </div>
        );
      case "plan":
        return planResumen(c);
      case "monto":
        return <span className="font-mono text-xs">{c.montoMensual ? fmtMonto(c.montoMensual) : "—"}</span>;
      case "ciclo":
        return <span className="font-mono text-xs">{cicloCorto(c)}</span>;
      case "instalacion":
        return c.fechaInstalacion ? (
          <span className="font-mono text-xs">{fmtFecha(c.fechaInstalacion)}</span>
        ) : (
          <span className="text-xs font-bold px-2 py-1 rounded-full" style={ { background: "#F59E0B", color: "white" } }>
            ⚠️ PENDIENTE POR INSTALAR
          </span>
        );
      case "ingreso":
        return <span className="font-mono text-xs">{c.creadoEn ? fmtFecha(c.creadoEn.slice(0, 10)) : "—"}</span>;
      case "periodo": {
        const p = periodoComision(c.fechaInstalacion);
        return p ? <span className="text-xs">{mesLabel(p)}</span> : <span className="text-xs" style={ { color: "#9CA3AF" } }>—</span>;
      }
      case "facturas": {
        const generadas = c.facturas.filter((f) => daysFromToday(f.generada) <= 0);
        return generadas.length > 0 ? (
          <div className="flex items-center gap-1.5">
            <span className="text-xs font-mono" style={ { color: "#9CA3AF" } }>{generadas.length}/4</span>
            <div className="flex items-center gap-1">
              {generadas.map((f) => (
                <FacturaDot key={f.n} cliente={c} n={f.n} onCambiar={onActualizarEstadoFactura} />
              ))}
            </div>
          </div>
        ) : (
          <span className="text-xs" style={ { color: "#9CA3AF" } }>—</span>
        );
      }
      case "estado":
        return <EstadoBadge estado={c.estadoPago} />;
      case "obs":
        return c.observaciones && c.observaciones.trim() ? (
          <span title={c.observaciones}>📝</span>
        ) : (
          <span style={ { color: "#D1D5DB" } }>—</span>
        );
      default:
        return null;
    }
  }

  const clientesDelMes = useMemo(() => {
    const instalados = clientes.filter((c) => periodoComision(c.fechaInstalacion) === mesActivo);
    if (mesActivo === mesActualKey) {
      const pendientes = clientes.filter((c) => !c.fechaInstalacion);
      return [...instalados, ...pendientes];
    }
    return instalados;
  }, [clientes, mesActivo, mesActualKey]);
  const visibles = search.trim() || rangoActivo || modoVerTodos ? clientes : clientesDelMes;
  const visiblesOrdenados = useMemo(() => {
    const arr = [...visibles];
    arr.sort((a, b) => {
      const va = valorOrdenColumna(a, ordenarPor);
      const vb = valorOrdenColumna(b, ordenarPor);
      let cmp;
      if (typeof va === "number" && typeof vb === "number") cmp = va - vb;
      else cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return ordenDireccion === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [visibles, ordenarPor, ordenDireccion]);
  const visiblesFinal = useMemo(() => {
    let arr = filtroEstado ? visiblesOrdenados.filter((c) => c.estadoPago === filtroEstado) : visiblesOrdenados;
    if (filtroInstalacion === "instalados") arr = arr.filter((c) => !!c.fechaInstalacion);
    if (filtroInstalacion === "pendientes") arr = arr.filter((c) => !c.fechaInstalacion);
    if (filtroPlan) arr = arr.filter((c) => c.planTipo === filtroPlan);
    if (rangoActivo) {
      arr = arr.filter((c) => {
        if (!c.fechaInstalacion) return false;
        if (fechaDesde && c.fechaInstalacion < fechaDesde) return false;
        if (fechaHasta && c.fechaInstalacion > fechaHasta) return false;
        return true;
      });
    }
    return arr;
  }, [visiblesOrdenados, filtroEstado, filtroInstalacion, filtroPlan, rangoActivo, fechaDesde, fechaHasta]);
  const filtrosActivos = [filtroEstado, filtroInstalacion, filtroPlan, rangoActivo].filter(Boolean).length;
  const statsClientes = useMemo(() => {
    const instalados = visiblesFinal.filter((c) => !!c.fechaInstalacion).length;
    return { instalados, pendientes: visiblesFinal.length - instalados, total: visiblesFinal.length };
  }, [visiblesFinal]);

  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h1 className="text-2xl font-semibold">Clientes</h1>
        <div className="flex items-center gap-2">
          <button
            onClick={() => setPapeleraAbierta(true)}
            className="text-sm font-medium px-3 py-2 rounded-md border flex items-center gap-1.5"
            style={ { borderColor: "#D1D5DB", color: "#374151" } }
            title="Ver clientes eliminados"
          >
            🗑️ Papelera{eliminados.length > 0 ? ` (${eliminados.length})` : ""}
          </button>
          <button onClick={onNuevo} className="text-sm font-medium px-4 py-2 rounded-md text-white" style={ { background: "#001E62" } }>
            + Nuevo cliente
          </button>
        </div>
      </div>
      <div className="flex items-center gap-4 mb-4 flex-wrap">
        <p className="text-sm">
          <span className="font-semibold" style={ { color: "#2F9E6E" } }>{statsClientes.instalados}</span>{" "}
          <span style={ { color: "#6B7280" } }>instalados</span>
        </p>
        <p className="text-sm">
          <span className="font-semibold" style={ { color: "#F59E0B" } }>{statsClientes.pendientes}</span>{" "}
          <span style={ { color: "#6B7280" } }>pendientes de instalación</span>
        </p>
        <p className="text-sm">
          <span className="font-semibold" style={ { color: "#001E62" } }>{statsClientes.total}</span>{" "}
          <span style={ { color: "#6B7280" } }>clientes en total</span>
        </p>
      </div>

      {modoVerTodos && (
        <div className="flex items-center justify-between gap-2 rounded-md p-2.5 mb-3" style={ { background: "#E3EDFA" } }>
          <span className="text-xs font-medium" style={ { color: "#0072CE" } }>Mostrando resultados de todos los meses.</span>
          <button
            type="button"
            onClick={() => setModoVerTodos(false)}
            className="text-xs font-medium"
            style={ { color: "#0072CE" } }
          >
            Volver a vista por mes
          </button>
        </div>
      )}

      <div className="flex items-center gap-1.5 mb-4 flex-wrap">
        {meses.map((m, i) => (
          <button
            key={m.key}
            onClick={() => { setMesActivo(m.key); setModoVerTodos(false); } }
            disabled={rangoActivo || modoVerTodos}
            className="text-xs font-medium px-3 py-1.5 rounded-full border transition-colors disabled:opacity-40"
            style={ {
              borderColor: mesActivo === m.key ? "#001E62" : "#D1D5DB",
              background: mesActivo === m.key ? "#001E62" : "white",
              color: mesActivo === m.key ? "white" : "#374151",
            } }
          >
            {m.label.toUpperCase()}{i === 0 ? " (actual)" : ""}
          </button>
        ))}
      </div>

      <div className="relative mb-3">
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Buscar en todos los meses por nombre, teléfono, suscriptor o plan…"
          className="w-full px-3 py-2 pr-9 rounded-md border text-sm outline-none"
          style={ { borderColor: "#D1D5DB" } }
        />
        {search && (
          <button
            onClick={() => setSearch("")}
            className="absolute top-1/2 -translate-y-1/2 text-sm font-medium px-1.5"
            style={ {
              color: "#9CA3AF",
              left: `min(calc(0.75rem + ${search.length}ch + 0.3rem), calc(100% - 2.1rem))`,
            } }
            title="Limpiar búsqueda"
          >
            ✕
          </button>
        )}
      </div>

      <div className="flex items-center gap-2 mb-4">
        <button
          type="button"
          onClick={() => setFiltrosAbiertos((v) => !v)}
          className="text-xs font-medium px-3 py-1.5 rounded-md border flex items-center gap-1.5"
          style={ {
            borderColor: filtrosActivos > 0 ? "#0072CE" : "#D1D5DB",
            color: filtrosActivos > 0 ? "#0072CE" : "#374151",
            background: filtrosActivos > 0 ? "#E3EDFA" : "white",
          } }
        >
          🔍 Filtros{filtrosActivos > 0 ? ` (${filtrosActivos})` : ""} {filtrosAbiertos ? "▲" : "▼"}
        </button>
        <button
          type="button"
          onClick={() => setMostrarSelectorColumnas(true)}
          className="text-xs font-medium px-3 py-1.5 rounded-md border flex items-center gap-1.5"
          style={ { borderColor: "#D1D5DB", color: "#374151" } }
        >
          🧱 Columnas ({columnasAMostrar.length})
        </button>
      </div>

      {filtrosAbiertos && (
        <div className="mb-4 bg-white rounded-lg border border-gray-200 shadow-sm p-4 flex flex-col gap-4">
          <div className="rounded-md p-3" style={ { background: rangoActivo ? "#E3EDFA" : "#F4F6FA" } }>
            <div className="flex items-center justify-between mb-2 flex-wrap gap-1">
              <span className="text-xs font-semibold" style={ { color: "#374151" } }>Rango de fechas (instalación)</span>
              {rangoActivo && (
                <button
                  type="button"
                  onClick={() => { setFechaDesde(""); setFechaHasta(""); } }
                  className="text-xs font-medium"
                  style={ { color: "#0072CE" } }
                >
                  Limpiar rango
                </button>
              )}
            </div>
            <div className="flex items-center gap-4 flex-wrap">
              <label className="flex items-center gap-1.5 text-xs" style={ { color: "#6B7280" } }>
                Rango de fechas de instalación
                <RangoFechasInput
                  desde={fechaDesde}
                  hasta={fechaHasta}
                  onChange={(d, h) => { setFechaDesde(d); setFechaHasta(h); } }
                  className="px-2 py-1 rounded-md border text-xs outline-none cursor-pointer"
                  style={ { borderColor: "#D1D5DB", minWidth: "180px" } }

            </div>

          <p className="text-[11px] -mb-1" style={ { color: "#9CA3AF" } }>Tip: tocá el encabezado de cualquier columna en la tabla para ordenar por ella.</p>

              <select
                value={filtroPlan}
                onChange={(e) => setFiltroPlan(e.target.value)}

                style={ { borderColor: "#D1D5DB" } }

                <option value="">Todos</option>
                {TIPOS_PLAN.map((t) => <option key={t} value={t}>{t === "SINGLE" ? "Single" : "Doble"}</option>)}

            </FiltroCampo>

            <FiltroCampo label="Instalación">
              <select
                value={filtroInstalacion}
                onChange={(e) => setFiltroInstalacion(e.target.value)}

                style={ { borderColor: "#D1D5DB" } }
              >
                <option value="">Todos</option>
                <option value="instalados">Instalados</option>
                <option value="pendientes">Pendientes de instalación</option>
              </select>
            </FiltroCampo>

            <FiltroCampo label="Estado">
              <select
                value={filtroEstado}
                onChange={(e) => setFiltroEstado(e.target.value)}
                className="w-full text-xs px-2 py-1.5 rounded-md border outline-none"
                style={ { borderColor: "#D1D5DB" } }

          {filtrosActivos > 0 && (
            <button
              type="button"
              onClick={() => {
                setFiltroEstado("");
                setFiltroInstalacion("");

                setFechaDesde("");
                setFechaHasta("");
              } }
              className="text-xs font-medium self-start"
              style={ { color: "#C23B3B" } }
            >
              ✕ Limpiar todos los filtros
            </button>
          )}
        </div>
      )}

      {visiblesFinal.length === 0 ? (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-10 text-center">
          <p className="text-sm" style={ { color: "#6B7280" } }>
            {filtroEstado || filtroInstalacion || filtroPlan || rangoActivo
              ? "No hay clientes con ese filtro."

              ? "Sin resultados para esa búsqueda."
              : "No hay clientes en este mes."}
          </p>
        </div>
      ) : (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left" style={ { background: "#F4F6FA" } }>
                {columnasAMostrar.map((key) => {

                  const activa = ordenarPor === key;
                  return (
                    <th
                      key={key}
                      draggable
                      onDragStart={() => setColArrastrando(key)}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={() => handleDropColumna(key)}
                      onClick={() => handleOrdenarPorColumna(key)}
                      className="px-4 py-2.5 font-medium text-xs select-none whitespace-nowrap"
                      style={ {
                        color: activa ? "#001E62" : "#6B7280",
                        cursor: col.sortable ? "pointer" : "grab",
                        opacity: colArrastrando === key ? 0.4 : 1,
                      } }
                      title={col.sortable ? "Tocá para ordenar · arrastrá para mover" : "Arrastrá para mover"}
                    >
                      <span className="inline-flex items-center gap-1">
                        <span style={ { color: "#C7D2E8" } }>⠿</span>
                        {col.label}
                        {activa && <span>{ordenDireccion === "asc" ? "▲" : "▼"}</span>}
                      </span>
                    </th>
                  );
                })}
                <th className="px-4 py-2.5 font-medium text-xs" style={ { color: "#6B7280" } }></th>
              </tr>
            </thead>
            <tbody>
              {visiblesFinal.map((c) => (
                <tr key={c.id} className="border-t" style={ { borderColor: "#F0F0EF" } }>
                  {columnasAMostrar.map((key) => (
                    <td key={key} className="px-4 py-3">{renderCeldaCliente(c, key)}</td>
                  ))}
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    {c.actual && (
                      <button onClick={() => onMarcarPagada(c.id, c.actual.n)} className="text-xs font-medium mr-3" style={ { color: "#2F9E6E" } }>Marcar pagada</button>
                    )}
                    <button onClick={() => onEdit(c)} className="text-xs font-medium mr-3" style={ { color: "#0072CE" } }>Editar</button>
                    <button onClick={() => onDelete(c.id)} className="text-xs font-medium" style={ { color: "#C23B3B" } }>Eliminar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {mostrarSelectorColumnas && (
        <SelectorColumnasModal
          orden={ordenColumnas}
          visibles={columnasVisibles}
          onToggle={(key) => setColumnasClientes((prev) => ({ ...prev, visibles: { ...prev.visibles, [key]: !prev.visibles[key] } }))}
          onMover={moverColumna}
          onClose={() => setMostrarSelectorColumnas(false)}
        />
      )}

      {papeleraAbierta && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold">Clientes eliminados</h3>
              <button onClick={() => setPapeleraAbierta(false)} className="text-sm" style={ { color: "#6B7280" } }>✕</button>
            </div>
            {eliminados.length === 0 ? (
              <p className="text-sm" style={ { color: "#6B7280" } }>No hay clientes eliminados.</p>
            ) : (
              <div className="flex flex-col gap-2">
                {eliminados.map((c) => (
                  <div key={c.id} className="flex items-center justify-between rounded-md border p-3" style={ { borderColor: "#F0F0EF" } }>
                    <div>
                      <div className="text-sm font-medium">{c.nombre}</div>
                      <div className="text-xs font-mono" style={ { color: "#9CA3AF" } }>
                        {c.numeroSuscriptor} · eliminado el {fmtFecha((c.eliminadoEn || "").slice(0, 10))}
                      </div>
                    </div>
                    <button
                      onClick={() => onRecuperar(c.id)}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={ { background: "#2F9E6E" } }
                    >
                      Recuperar
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

      {cliente.observaciones && (
        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4 mb-4 text-sm">

      )}

      <h2 className="text-sm font-semibold mb-2">Facturas</h2>

        <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-5 text-center">

                  <div className="flex items-center gap-2">
                    <span className="text-xs font-medium px-3 py-1.5 rounded-full" style={ { background: "#E3EDFA", color: "#0072CE" } }>

                    >
                      Desmarcar
                    </button>

                  <div className="flex items-center gap-2">
                    {estadoFactura === "pendiente" && (
                      <span className="text-xs font-medium px-3 py-1.5 rounded-full" style={ { background: "#FBF1DE", color: "#B8791F" } }>

                      </span>
                    )}

                      onClick={() => onActualizarEstadoFactura(cliente.id, f.n, "pagada")}
                      className="text-xs font-medium px-3 py-1.5 rounded-md text-white"
                      style={ { background: "#2F9E6E" } }
                    >
                      Marcar como pagada
                    </button>
                  </div>
                )}
