  const pctArpu = metaArpu ? (arpuPeriodo / metaArpu) * 100 : null;
  const montoBase = montoBaseComision(pctIngreso);
  const factorArpu = pctArpu != null ? pctArpu / 100 : 0;
  const factorClientes = pctClientes != null ? pctClientes / 100 : 0;
  const completo = pctIngreso != null && pctArpu != null && pctClientes != null;
  const total = completo ? montoBase * factorArpu * factorClientes : 0;
  return { esquema: "viejo", total, montoBase, pctIngreso, pctArpu, pctClientes, aplicaBono, bonoFullTigo, dineroAjustado, completo };
}

// ---- Fórmula nueva (desde el período "2026-10" en adelante) ----
// La posición sale del % de clientes (hogar 65% + móvil 35%, ponderado, sin redondear)
// en la tabla de posicionamiento. Ya no se mide ARPU.
// El % de logro de la meta de ingresos (hogar + costo de planes móviles, sin peso) ajusta
// ese monto así (esquema de Tigo):
//   · más de 100%: posición × (% de ingresos + 10 puntos)   → acelerador
//   · menos de 100%: posición × % de ingresos               → desacelerador
//   · exactamente 100%: posición × 1
// Ejemplo del PDF: 108% de ingresos → ×1.18; 91% → ×0.91.
// Además se suma $6 por cada portabilidad pospago con su 1ra factura pagada.
// "cantidadBonoMovil" es cuántas portabilidades entran en el total y
// "cantidadBonoPendiente" cuántas de esas siguen sin pagar su 1ra factura (solo informativo).
function calcularComisionNueva({
  clientesHogar,
  metaClientesHogar,
  clientesMovil,
  metaClientesMovil,
  ingresosDelPeriodo,
  metaIngresos,
  cantidadBonoMovil,
  cantidadBonoPendiente,
}) {
  const pctHogar = metaClientesHogar ? (clientesHogar / metaClientesHogar) * 100 : null;
  const pctMovil = metaClientesMovil ? (clientesMovil / metaClientesMovil) * 100 : null;
  const pctClientesPonderado =
    pctHogar != null && pctMovil != null ? pctHogar * PESO_CLIENTES_HOGAR + pctMovil * PESO_CLIENTES_MOVIL : null;
  const montoBase = montoPosicionNueva(pctClientesPonderado);

  const pctIngreso = metaIngresos ? (ingresosDelPeriodo / metaIngresos) * 100 : null;
  let ajusteIngreso = "ninguno";
  let factorAcelerador = 1;
  if (pctIngreso != null) {
    if (pctIngreso > 100) {
      ajusteIngreso = "acelerador";
      factorAcelerador = pctIngreso / 100 + 0.1;
    } else if (pctIngreso < 100) {
      ajusteIngreso = "desacelerador";
      factorAcelerador = pctIngreso / 100;
    }
  }

  const bonoConvergencias = BONO_POR_CONVERGENCIA * (cantidadBonoMovil || 0);
  const bonoPendiente = BONO_POR_CONVERGENCIA * (cantidadBonoPendiente || 0);
  const completo = pctHogar != null && pctMovil != null && pctIngreso != null;
  const comisionSinBono = completo ? montoBase * factorAcelerador : 0;
  const total = comisionSinBono + bonoConvergencias;

  return {
    esquema: "nuevo",
    total,
    montoBase,
    pctHogar,
    pctMovil,
    pctClientesPonderado,
    pctIngreso,
    ajusteIngreso,
    factorAcelerador,
    comisionSinBono,
    bonoConvergencias,
    bonoPendiente,
    cantidadConvergencias: cantidadBonoMovil || 0,
    cantidadBonoPendiente: cantidadBonoPendiente || 0,
    completo,
  };
}

// Texto corto que explica cómo se ajusta la posición según el % de ingresos.
function textoAjusteIngreso(r) {
  if (r.pctIngreso == null) return "";
  if (r.ajusteIngreso === "acelerador")
    return `× ${(r.factorAcelerador * 100).toFixed(1)}% (${r.pctIngreso.toFixed(1)}% de ingresos + 10 puntos de acelerador)`;
  if (r.ajusteIngreso === "desacelerador")
    return `× ${(r.factorAcelerador * 100).toFixed(1)}% (cobras lo que lograste de ingresos)`;
  return "× 100% (justo en la meta de ingresos)";
}

// - Si empieza con "+", ya trae su código de país (ej. +1 859…, +507 6…): se usa tal cual.
// - Si no, se asume Panamá y se le antepone 507 (salvo que ya empiece con 507).
function telefonoWhatsapp(telefono) {
  const texto = (telefono || "").trim();
  const digits = texto.replace(/\D/g, "");
  if (texto.startsWith("+")) return digits;
  if (digits.startsWith("507")) return digits;
  return `507${digits}`;
}

function calcularPrimeraFactura(fechaInstalacion, cicloDia, montoMensual) {
  if (!fechaInstalacion || !cicloDia) return null;
  const dt = new Date(fechaInstalacion + "T00:00:00");
  const day = dt.getDate();
  let year = dt.getFullYear();
  let month = dt.getMonth();
  if (day >= cicloDia) {
    month += 1;
    if (month > 11) { month = 0; year += 1; }
  }
  const lastDay = daysInMonth(year, month);
  const diaFactura = Math.min(cicloDia, lastDay);
  const fecha1raFactura = toISO(new Date(year, month, diaFactura));
  const dias = Math.round((new Date(fecha1raFactura + "T00:00:00") - dt) / 86400000);
  const monto = montoMensual ? +((Number(montoMensual) * dias) / 30).toFixed(2) : "";
  return { fecha1raFactura, monto1raFactura: monto, dias };
}

// 2026 en adelante: en vez de esperar a que exista la factura real (con el número
// grande de prorrateo + mensualidad), se le pide completar el resto de su primer
// mes en una fecha de QUINCENA (día 15 o 30) — sin mencionar montos, la factura
// oficial de Tigo ni su fecha de vencimiento.
const DIAS_SEMANA = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
// "viernes 30 de octubre"
function fmtFechaConDia(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-").map(Number);
  return `${DIAS_SEMANA[new Date(y, m - 1, d).getDay()]} ${d} de ${MESES[m - 1]}`;
}
// Quincenas (día 15 y día 30, o el último día si el mes es más corto) de `meses`
// meses seguidos desde el mes de `desdeISO`. Si caen en fin de semana, se corren
// al viernes anterior. Los feriados no se consideran.
function quincenasDesde(desdeISO, meses) {
  const [y0, m0] = desdeISO.split("-").map(Number);
  const out = [];
  for (let i = 0; i < meses; i++) {
    const total = (m0 - 1) + i;
    const y = y0 + Math.floor(total / 12);
    const m = (total % 12) + 1;
    const ultimo = Math.min(30, daysInMonth(y, m - 1));
    [15, ultimo].forEach((d) => {
      const dt = new Date(y, m - 1, d);
      while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate() - 1);
      out.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`);
    });
  }
  return out.sort();
}
// Fecha de pago que se le pide al cliente: la ÚLTIMA quincena anterior a la fecha en
// que sale su 1ra factura y que quede al menos 10 días después de la instalación.
// Si no hay ninguna, la primera quincena que quede a 10 días o más de la instalación.
function fechaPagoQuincena(c) {
  if (!c.fechaInstalacion) return null;
  const minimo = addDays(c.fechaInstalacion, 10);
  const quincenas = quincenasDesde(c.fechaInstalacion, 4).filter((q) => q >= minimo);
  if (c.fecha1raFactura) {
    const antes = quincenas.filter((q) => q < c.fecha1raFactura);
    if (antes.length) return antes[antes.length - 1];
  }
  return quincenas.length ? quincenas[0] : null;
}

// Cliente de "prorrateo alto": instalado desde el 1 de septiembre de 2026 y cuyo
// prorrateo de la 1ra factura es igual o mayor al umbral configurado (por defecto 25 %).
// A estos clientes se les mandan los mensajes de abono (bienvenida y recordatorio) y,
// al marcar su 1ra factura como pagada, pueden quedar en PAGO PARCIAL.
function esProrrateoAlto(cliente, umbralProrrateo) {
  const cicloDia = parseInt(cliente.cicloFacturacion, 10) || null;
  if (!(cicloDia && cliente.montoMensual && cliente.fechaInstalacion >= "2026-09-01")) return false;
  const r = calcularPrimeraFactura(cliente.fechaInstalacion, cicloDia, cliente.montoMensual);
  if (!r || !(Number(r.monto1raFactura) > 0)) return false;
  const pct = (Number(r.monto1raFactura) / Number(cliente.montoMensual)) * 100;
  return pct >= Number(umbralProrrateo ?? 25);
}

function calcularFacturas(cliente, umbralProrrateo) {
  if (!cliente.fechaInstalacion || cliente.penalizado) return [];
  const cicloDia = parseInt(cliente.cicloFacturacion, 10) || null;
  const facturas = [];
  for (let n = 1; n <= 4; n++) {
    const generada =
      n === 1
        ? cliente.fecha1raFactura
        : cicloDia
        ? addMonthsKeepDay(cliente.fecha1raFactura, n - 1, cicloDia)
        : addDays(cliente.fecha1raFactura, 30 * (n - 1));
    const siguienteGenerada = cicloDia
      ? addMonthsKeepDay(generada, 1, cicloDia)
      : addDays(generada, 30);
    const vencimiento = addDays(siguienteGenerada, -1);
    // Solo la 1ra factura (la que decide si el cliente cuenta para tu comisión)
    // mantiene los 3 avisos completos. De la 2da en adelante, con el aviso de
    // 3 días antes alcanza — ya no hace falta la insistencia de D+1 y 15 días.
    const tiposParaEstaFactura = cliente.cancelado ? [] : n === 1 ? MILESTONE_TYPES : MILESTONE_TYPES.filter((mt) => mt.type === "t3");
    const milestones = tiposParaEstaFactura.map((mt) => {
      const key = `f${n}_${mt.type}`;
      const triggerDate =
        mt.type === "d1" ? addDays(generada, 1) :
        mt.type === "t15" ? addDays(vencimiento, -15) :
        addDays(vencimiento, -3);
      const enviado = !!cliente[key];
      const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
      const texto = mt.getTexto({ ...cliente, _venc: vencimiento, plan: planLabelMensaje(cliente) }, n);
      return { ...mt, key, n, triggerDate, enviado, pendienteHoy, texto };
    });

    // Solo para la 1ra factura, de clientes instalados desde septiembre 2026 en
    // adelante: si el prorrateo es igual o mayor al umbral configurado, se agregan
    // dos avisos preventivos (Toque 1 a los 2 días de la instalación, Toque 2 el día
    // ANTES de la fecha de quincena de pago) para que adelante el abono antes de que
    // exista la factura real con el número grande.
    if (n === 1 && !cliente.cancelado && esProrrateoAlto(cliente, umbralProrrateo)) {
        {
          [
            { type: "toque1", tag: "👋", label: "Bienvenida (pedir abono)", getFecha: (cl) => addDays(cl.fechaInstalacion, 2), key: "aviso_toque1", getTexto: textoToque1 },
            { type: "toque2", tag: "🔔", label: "Recordatorio de abono", getFecha: (cl) => { const fp = fechaPagoQuincena(cl); return fp ? addDays(fp, -1) : addDays(cl.fechaInstalacion, 25); }, key: "aviso_toque2", getTexto: textoToque2 },
          ].forEach((t) => {
            const triggerDate = t.getFecha(cliente);
            const enviado = !!cliente[t.key];
            const pendienteHoy = daysFromToday(triggerDate) <= 0 && !enviado;
            const texto = t.getTexto(cliente);
            milestones.push({
              type: t.type,
              tag: t.tag,
              label: t.label,
              color: "#7C3AED",
              bg: "#EDE9FE",
              key: t.key,
              n,
              triggerDate,
              enviado,
              pendienteHoy,
              texto,
            });
          });
        }
    }

    facturas.push({ n, generada, vencimiento, milestones });
  }
  return facturas;
}

function facturaActual(facturas) {
  if (!facturas.length) return null;
  for (let i = facturas.length - 1; i >= 0; i--) {
    if (daysFromToday(facturas[i].generada) <= 0) return facturas[i];
  }
  return facturas[0];
}

// ---------- Selector de rango de fechas en un solo campo (calendario único) ----------
// Usa flatpickr en modo "range": el usuario abre un solo calendario y elige
// primero la fecha inicial y luego la final, sin tener que usar dos campos separados.
function RangoFechasInput({ desde, hasta, onChange, className, style, placeholder = "Seleccionar rango de fechas" }) {
  const inputRef = useRef(null);
  const fpRef = useRef(null);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange;

  useEffect(() => {
    if (!inputRef.current || !window.flatpickr) return;
    fpRef.current = window.flatpickr(inputRef.current, {
      mode: "range",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d/m/Y",
      locale: window.flatpickr.l10ns && window.flatpickr.l10ns.es ? "es" : undefined,
      defaultDate: [desde, hasta].filter(Boolean),
      onChange: (selectedDates) => {
        if (selectedDates.length === 2) {
          onChangeRef.current(fechaLocalISO(selectedDates[0]), fechaLocalISO(selectedDates[1]));
        } else if (selectedDates.length === 0) {
          onChangeRef.current("", "");
        }
      },
    });
    return () => {
      if (fpRef.current) fpRef.current.destroy();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Mantiene el calendario sincronizado si el rango cambia desde afuera (ej. botón "Limpiar").
  useEffect(() => {
    if (fpRef.current) {
      fpRef.current.setDate([desde, hasta].filter(Boolean), false);
    }
  }, [desde, hasta]);

  return (
    <input
      ref={inputRef}
      type="text"
      readOnly
      placeholder={placeholder}
      className={className || "px-3 py-2 rounded-md border text-sm outline-none cursor-pointer"}
      style={style || { borderColor: "#D1D5DB" } }
    />
  );
}

// Resumen de facturas ya emitidas (hasta hoy) y cuántas de esas están pagadas.
function facturasResumen(c) {
  const generadas = (c.facturas || []).filter((f) => daysFromToday(f.generada) <= 0);
  const pagadas = generadas.filter((f) => c[`f${f.n}_estado`] === "pagada");
  return { emitidas: generadas.length, pagadas: pagadas.length };
}

const CAMPOS_EXPORTAR = [
  ["suscriptor", "N° Suscriptor"],
  ["nombre", "Nombre del cliente"],
  ["instalacion", "Fecha de instalación"],
  ["facturasEmitidas", "Facturas emitidas"],
  ["facturasPagadas", "Facturas pagadas hasta la fecha"],
  ["telefono", "Teléfono"],
  ["plan", "Plan"],
  ["monto", "Monto mensual"],
];

function ExportarModal({ clientes, onCerrar }) {
  const [desde, setDesde] = useState("");
  const [hasta, setHasta] = useState("");
  const [campos, setCampos] = useState({
    suscriptor: true,
    nombre: true,
    instalacion: true,
    facturasEmitidas: true,
    facturasPagadas: true,
    telefono: false,
    plan: false,
    monto: false,
  });
  const [copiado, setCopiado] = useState(false);

  const filtrados = useMemo(() => {
    return clientes
      .filter((c) => {
        if (!c.fechaInstalacion) return false;
        if (desde && c.fechaInstalacion < desde) return false;
        if (hasta && c.fechaInstalacion > hasta) return false;
        return true;
      })
      .sort((a, b) => (a.fechaInstalacion < b.fechaInstalacion ? -1 : 1));
  }, [clientes, desde, hasta]);

  function construirTabla() {
    const activos = CAMPOS_EXPORTAR.filter(([key]) => campos[key]);
    const encabezado = activos.map(([, label]) => label);
    const filas = filtrados.map((c) => {
      const r = facturasResumen(c);
      return activos.map(([key]) => {
        switch (key) {
          case "suscriptor":
            return c.numeroSuscriptor || "";
          case "nombre":
            return c.nombre || "";
          case "instalacion":
            return fmtFecha(c.fechaInstalacion);
          case "facturasEmitidas":
            return r.emitidas;
          case "facturasPagadas":
            return r.pagadas;
          case "telefono":
            return c.telefono || "";
          case "plan":
            return planLabel(c);
          case "monto":
            return c.montoMensual || "";
          default:
            return "";
        }
      });
    });
    return { encabezado, filas };
  }

  function descargarCSV() {
    const { encabezado, filas } = construirTabla();
    const csv = [encabezado, ...filas]
      .map((fila) => fila.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `suscriptores_instalados_${desde || "inicio"}_a_${hasta || "hoy"}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function copiarTexto() {
    const { encabezado, filas } = construirTabla();
    const texto = [encabezado, ...filas].map((fila) => fila.join("\t")).join("\n");
    navigator.clipboard?.writeText(texto).catch(() => {});
    setCopiado(true);
    setTimeout(() => setCopiado(false), 1500);
  }

  const hayCampos = CAMPOS_EXPORTAR.some(([key]) => campos[key]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={ { background: "rgba(0,0,0,0.45)" } }>
      <div className="bg-white rounded-lg shadow-lg w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold" style={ { color: "#001E62" } }>⬇️ Exportar suscriptores instalados</h3>
          <button onClick={onCerrar} className="text-sm px-2" style={ { color: "#6B7280" } }>✕</button>
        </div>

        <div className="mb-4">
          <label className="text-xs font-medium block mb-1.5" style={ { color: "#6B7280" } }>
            Rango de fecha de instalación
          </label>
          <RangoFechasInput
            desde={desde}
            hasta={hasta}
            onChange={(d, h) => { setDesde(d); setHasta(h); } }
            className="w-full px-3 py-2 rounded-md border text-sm outline-none cursor-pointer"
          />
        </div>

        <div className="mb-4">
          <label className="text-xs font-medium block mb-2" style={ { color: "#6B7280" } }>Qué incluir</label>
          <div className="grid grid-cols-2 gap-x-3 gap-y-1.5">
            {CAMPOS_EXPORTAR.map(([key, label]) => (
              <label key={key} className="flex items-center gap-2 text-sm">
                <input
                  type="checkbox"
                  checked={!!campos[key]}
                  onChange={(e) => setCampos((prev) => ({ ...prev, [key]: e.target.checked }))}
                />
                {label}
              </label>
            ))}
          </div>
        </div>

        <p className="text-xs mb-4" style={ { color: "#9CA3AF" } }>
          {filtrados.length} cliente{filtrados.length === 1 ? "" : "s"} instalado{filtrados.length === 1 ? "" : "s"}
          {desde || hasta ? " en ese rango." : " en total (no elegiste rango — se exportan todos los instalados)."}
        </p>

        <div className="flex gap-2">
          <button
            onClick={descargarCSV}
            disabled={filtrados.length === 0 || !hayCampos}
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md text-white disabled:opacity-40"
            style={ { background: "#001E62" } }
          >
            ⬇️ Descargar CSV
          </button>
          <button
            onClick={copiarTexto}
            disabled={filtrados.length === 0 || !hayCampos}
            className="flex-1 text-sm font-medium px-3 py-2 rounded-md border disabled:opacity-40"
            style={ { borderColor: "#D1D5DB", color: copiado ? "#0F766E" : "#374151" } }
          >
            {copiado ? "✓ Copiado" : "📋 Copiar"}
          </button>
        </div>
      </div>
    </div>
  );
}

  const [vistaClientesInicial] = useState(leerVistaClientesDelDia);

      );

  const [copiedKey, setCopiedKey] = useState(null);

  // Persiste la pestaña activa para que al refrescar la página quede donde

  useEffect(() => {

  function pedirCambioFactura(clienteId, n, nuevoEstado) {

  }
  function pedirMarcarPagada(clienteId, n) {
    pedirCambioFactura(clienteId, n, "pagada");
  }
  const [clienteDetalleId, setClienteDetalleId] = useState(null);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [mostrarMasMenu, setMostrarMasMenu] = useState(false);
  const [historial, setHistorial] = useState([]);
  const [metas, setMetas] = useState({});
  const [metasLoaded, setMetasLoaded] = useState(false);
  const [convergencias, setConvergencias] = useState([]);
  const [convergenciasLoaded, setConvergenciasLoaded] = useState(false);
  const [eliminados, setEliminados] = useState([]);
  const [eliminadosLoaded, setEliminadosLoaded] = useState(false);
  const [historialCambios, setHistorialCambios] = useState([]);
  const [historialCambiosLoaded, setHistorialCambiosLoaded] = useState(false);
  const [umbralProrrateo, setUmbralProrrateo] = useState(25);
  const [umbralProrrateoLoaded, setUmbralProrrateoLoaded] = useState(false);
  const [columnasClientes, setColumnasClientes] = useState({
    orden: COLUMNAS_CLIENTES_KEYS,
    visibles: Object.fromEntries(COLUMNAS_CLIENTES_KEYS.map((k) => [k, true])),
  });
  const [columnasClientesLoaded, setColumnasClientesLoaded] = useState(false);
  const [mostrarConfig, setMostrarConfig] = useState(false);
  const [saltarAMes, setSaltarAMes] = useState(null);

  const importInputRef = useRef(null);
  const sonidoReproducidoRef = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("clientes-churn");
        if (res && res.value) setClientes(JSON.parse(res.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  // Guarda los clientes en Supabase de a UN guardado a la vez (nunca en paralelo).
  // Si mientras se está guardando llegan más cambios (por ejemplo, marcar 50 alertas
  // seguidas en el envío en cadena), no se disparan 50 guardados sueltos que puedan
  // llegar desordenados y pisarse entre sí — se guarda solo el más reciente en cuanto
  // el guardado anterior termina.
  const guardandoClientesRef = useRef(false);
  const clientesPendienteRef = useRef(null);
  const persistirClientes = useRef(async function persist(json) {
    if (guardandoClientesRef.current) {
      clientesPendienteRef.current = json;
      return;
    }
    guardandoClientesRef.current = true;
    setEstadoGuardado("guardando");
    try {
      const r = await storage.set("clientes-churn", json);
      setEstadoGuardado(r ? "guardado" : "error");
    } catch (e) {
      setEstadoGuardado("error");
    } finally {
      guardandoClientesRef.current = false;
      if (clientesPendienteRef.current !== null) {
        const siguiente = clientesPendienteRef.current;
        clientesPendienteRef.current = null;
        persistirClientes(siguiente);
      }
    }
  }).current;

  useEffect(() => {
    if (!loaded) return;
    persistirClientes(JSON.stringify(clientes));
  }, [clientes, loaded]);

  // Guarda un valor en Supabase de a UNO a la vez (nunca en paralelo), para que un
  // guardado atrasado nunca pise a uno más reciente si llegan desordenados por la
  // red. Devuelve una función persist(valor) para usar dentro de un useEffect.
  function useGuardadoSerie(key) {
    const guardandoRef = useRef(false);
    const pendienteRef = useRef(null);
    return useRef(async function persist(valor) {
      if (guardandoRef.current) {
        pendienteRef.current = valor;
        return;
      }
      guardandoRef.current = true;
      try {
        await storage.set(key, valor);
      } catch (e) {}
      guardandoRef.current = false;
      if (pendienteRef.current !== null) {
        const siguiente = pendienteRef.current;
        pendienteRef.current = null;
        persist(siguiente);
      }
    }).current;
  }

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("metas-mensuales");
        if (res && res.value) setMetas(JSON.parse(res.value));
      } catch (e) {}

  const persistirMetas = useGuardadoSerie("metas-mensuales");

  useEffect(() => {

  const persistirEliminados = useGuardadoSerie("clientes-eliminados");
  useEffect(() => {
    if (!eliminadosLoaded) return;
    persistirEliminados(JSON.stringify(eliminados));
  }, [eliminados, eliminadosLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("historial-cambios-churn");
        if (res && res.value) setHistorialCambios(JSON.parse(res.value));
      } catch (e) {}
      setHistorialCambiosLoaded(true);
    })();
  }, []);

  const persistirHistorial = useGuardadoSerie("historial-cambios-churn");
  useEffect(() => {
    if (!historialCambiosLoaded) return;
    persistirHistorial(JSON.stringify(historialCambios));
  }, [historialCambios, historialCambiosLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("umbral-prorrateo");
        if (res && res.value) setUmbralProrrateo(Number(res.value));
      } catch (e) {}
      setUmbralProrrateoLoaded(true);
    })();
  }, []);

  const persistirUmbral = useGuardadoSerie("umbral-prorrateo");
  useEffect(() => {
    if (!umbralProrrateoLoaded) return;
    persistirUmbral(String(umbralProrrateo));
  }, [umbralProrrateo, umbralProrrateoLoaded]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("clientes-columnas");
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && Array.isArray(parsed.orden) && parsed.visibles) {
            const ordenValido = parsed.orden.filter((k) => COLUMNAS_CLIENTES_KEYS.includes(k));
            const faltantes = COLUMNAS_CLIENTES_KEYS.filter((k) => !ordenValido.includes(k));
            setColumnasClientes({
              orden: [...ordenValido, ...faltantes],
              visibles: { ...Object.fromEntries(COLUMNAS_CLIENTES_KEYS.map((k) => [k, true])), ...parsed.visibles },
            });
          }
        }
      } catch (e) {}
      setColumnasClientesLoaded(true);
    })();
  }, []);

  const persistirColumnas = useGuardadoSerie("clientes-columnas");
  useEffect(() => {
    if (!columnasClientesLoaded) return;
    persistirColumnas(JSON.stringify(columnasClientes));
  }, [columnasClientes, columnasClientesLoaded]);

  const clientesCalc = useMemo(() => {
    return clientes.map((c) => {
      const facturas = calcularFacturas(c, umbralProrrateo);
      return { ...c, facturas, actual: facturaActual(facturas) };
    });
  }, [clientes, umbralProrrateo]);

  // Clientes que sí cuentan (sin penalizados ni cancelados sin 1ra factura pagada).
  const clientesActivos = useMemo(() => clientesCalc.filter((c) => !clienteExcluido(c)), [clientesCalc]);

  const clienteDetalle = useMemo(
    () => clientesCalc.find((c) => c.id === clienteDetalleId) || null,
    [clientesCalc, clienteDetalleId]
  );

  const alertasHoy = useMemo(() => {
    const list = [];
    clientesCalc.forEach((c) => {
      c.facturas.forEach((f) => {
        f.milestones.forEach((m) => {
          if (m.pendienteHoy) list.push({ cliente: c, factura: f, milestone: m });
        });
      });
    });
    const orden = { t3: 0, t15: 1, d1: 2, toque2: 3, toque1: 4 };
    list.sort((a, b) => {
      if (orden[a.milestone.type] !== orden[b.milestone.type])
        return orden[a.milestone.type] - orden[b.milestone.type];
      return daysFromToday(a.milestone.triggerDate) - daysFromToday(b.milestone.triggerDate);
    });
    return list;
  }, [clientesCalc]);

  // Deja una sola alerta por cliente: la más reciente/urgente (T-3 > T-15 > D+1;
  // a igual prioridad, la de fecha de disparo más reciente).
  const alertasPorCliente = useMemo(() => {
    const orden = { t3: 0, t15: 1, d1: 2, toque2: 3, toque1: 4 };
    const porCliente = new Map();
    alertasHoy.forEach(({ cliente, factura, milestone }) => {
      const actual = porCliente.get(cliente.id);
      if (!actual) {
        porCliente.set(cliente.id, { cliente, factura, milestone });
        return;
      }
      const prioridadActual = orden[actual.milestone.type];
      const prioridadNueva = orden[milestone.type];
      const esMasReciente =
        prioridadNueva < prioridadActual ||
        (prioridadNueva === prioridadActual && milestone.triggerDate > actual.milestone.triggerDate);
      if (esMasReciente) porCliente.set(cliente.id, { cliente, factura, milestone });
    });
    return Array.from(porCliente.values());
  }, [alertasHoy]);

  const filteredClientes = useMemo(() => {
    if (!search.trim()) return clientesCalc;
    const q = search.toLowerCase();
    return clientesCalc.filter(
      (c) =>
        c.nombre.toLowerCase().includes(q) ||
        c.numeroSuscriptor.toLowerCase().includes(q) ||
        c.telefono.toLowerCase().includes(q) ||
        planLabel(c).toLowerCase().includes(q)
    );
  }, [clientesCalc, search]);

  const stats = useMemo(() => {
    const total = clientes.filter((c) => !clienteExcluido(c)).length;
    const alHoy = alertasPorCliente.length;
    const proximos7 = clientesCalc.filter((c) =>
      c.facturas.some((f) =>
        f.milestones.some((m) => !m.enviado && daysFromToday(m.triggerDate) > 0 && daysFromToday(m.triggerDate) <= 7)
      )
    ).length;
    const atrasados = clientes.filter((c) => !clienteExcluido(c) && c.estadoPago === "Atrasado").length;
    return { total, alHoy, proximos7, atrasados };
  }, [clientes, alertasPorCliente, clientesCalc]);

  useEffect(() => {
    if (!loaded || stats.alHoy === 0 || sonidoReproducidoRef.current) return;
    sonidoReproducidoRef.current = true;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  }, [loaded, stats.alHoy]);

  useEffect(() => {
    setMostrarMasMenu(false);
  }, [tab]);

  // Oculta la barra superior del celular al bajar, la vuelve a mostrar al subir un
  // poco o al llegar arriba del todo — para aprovechar más pantalla mientras lees.
  const [mostrarBarraSuperior, setMostrarBarraSuperior] = useState(true);
  const ultimoScrollRef = useRef(0);
  useEffect(() => {
    function onScroll() {
      const y = window.scrollY;
      if (y < 10) {
        setMostrarBarraSuperior(true);
      } else if (y > ultimoScrollRef.current + 4) {
        setMostrarBarraSuperior(false);
      } else if (y < ultimoScrollRef.current - 4) {
        setMostrarBarraSuperior(true);
      }
      ultimoScrollRef.current = y;
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  function resetForm() {

    setEditingId(null);

  function irANuevoConSuscriptor(numero) {

  // Desde "Verificar órdenes": abre el formulario con el nombre ya puesto.
  // Si la orden ya está instalada trae la fecha de Tigo; si no, queda marcado como
  // "Pendiente de instalación" (fecha vacía), igual que cuando lo haces a mano.
  function irANuevoDesdeOrden(nombre, fechaInstalacionISO) {

  // Desde "Verificar órdenes": cambia solo la fecha de instalación de un cliente.

  function cambiarFechaInstalacionDesdeOrden(clienteId, fechaISO) {
    const antes = clientes.find((c) => c.id === clienteId);
    if (!antes || !fechaISO) return;
    let despues = { ...antes, fechaInstalacion: fechaISO };
    const r = calcularPrimeraFactura(fechaISO, parseInt(antes.cicloFacturacion, 10), antes.montoMensual);
    if (r && antes.montoMensual !== "" && antes.montoMensual != null) {
      const total = +((Number(antes.montoMensual) || 0) + (Number(r.monto1raFactura) || 0)).toFixed(2);
      despues = { ...despues, fecha1raFactura: r.fecha1raFactura, monto1raFactura: total };
    }
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? despues : c)));

  function cambiarUmbralProrrateo(nuevoValor) {
    const valorAnterior = umbralProrrateo;
    setUmbralProrrateo(nuevoValor);
    const valorNum = nuevoValor === "" ? "" : Number(nuevoValor);
    if (String(valorAnterior ?? "") !== String(valorNum ?? "") && valorNum !== "") {
      registrarCambio({

        tipo: "editar",

        antes: { campo: "umbralProrrateo", valor: valorAnterior },
        despues: { campo: "umbralProrrateo", valor: valorNum },
        cambios: [{ campo: "umbralProrrateo", label: "Umbral de prorrateo", anterior: `${valorAnterior}%`, nuevo: `${valorNum}%` }],
        refId: "umbralProrrateo",
      });
    }
  }

  function actualizarMeta(mes, campo, valor) {
    const nuevoValor = valor === "" ? undefined : Number(valor);
    const actualPrev = typeof metas[mes] === "object" && metas[mes] !== null ? metas[mes] : {};
    const valorAnterior = actualPrev[campo];
    setMetas((prev) => {
      const actual = typeof prev[mes] === "object" && prev[mes] !== null ? prev[mes] : {};
      return { ...prev, [mes]: { ...actual, [campo]: nuevoValor } };
    });
    if (String(valorAnterior ?? "") !== String(nuevoValor ?? "")) {
      const CAMPOS_META = {
        dinero: "Meta de ingresos",
        arpu: "Meta de ARPU",
        clientes: "Meta de clientes",
        clientesHogar: "Meta de clientes hogar",
        clientesMovil: "Meta de clientes móvil",
      };
      registrarCambio({
        entidad: "meta",
        tipo: "editar",
        etiqueta: `${CAMPOS_META[campo] || campo} · ${mesLabel(mes)}`,
        antes: { mes, campo, valor: valorAnterior },
        despues: { mes, campo, valor: nuevoValor },
        cambios: [{ campo, label: CAMPOS_META[campo] || campo, anterior: valorAnterior, nuevo: nuevoValor }],
        refId: `${mes}-${campo}`,
      });
    }
  }

  // Cliente Móvil (Plan Pospago, Convergencia o FULL TIGO). "fullTigo" se guarda además
  // de "tipo" por compatibilidad con la fórmula de comisión anterior a octubre 2026.
  // "extra" trae las dos casillas del esquema nuevo: esPortabilidad y f1_estado ("pagada" o "").
  function agregarConvergencia(nombre, telefono, tipoCliente, montoPlan, fechaActivacion, extra) {
    const pagada = !!extra && extra.f1_estado === "pagada";
    const nueva = {
      id: uid(),
      nombre,
      telefono,
      whatsapp: extra && extra.whatsapp ? extra.whatsapp : "",
      tipo: tipoCliente,
      fullTigo: tipoCliente === "fulltigo",
      montoPlan: montoPlan ? Number(montoPlan) || 0 : null,
      fechaActivacion: fechaActivacion || fechaLocalISO(new Date()),
      esPortabilidad: !!extra && !!extra.esPortabilidad,
      f1_estado: pagada ? "pagada" : "",
      ...(pagada ? { f1_pagadaEn: new Date().toISOString() } : {}),
      creadoEn: new Date().toISOString(),
    };
    setConvergencias((prev) => [...prev, nueva]);
    registrarCambio({ entidad: "convergencia", tipo: "crear", etiqueta: nombre, despues: nueva, cambios: [], refId: nueva.id });
  }

  function editarConvergencia(id, datos) {
    const antes = convergencias.find((c) => c.id === id);
    const normalizados = datos.tipo ? { ...datos, fullTigo: datos.tipo === "fulltigo" } : datos;
    const despues = antes ? { ...antes, ...normalizados } : null;
    setConvergencias((prev) => prev.map((c) => (c.id === id ? { ...c, ...normalizados } : c)));
    if (antes && despues) {
      const cambios = [];
      if (String(antes.nombre ?? "") !== String(despues.nombre ?? ""))
        cambios.push({ campo: "nombre", label: "Nombre", anterior: antes.nombre, nuevo: despues.nombre });
      if (String(antes.telefono ?? "") !== String(despues.telefono ?? ""))
        cambios.push({ campo: "telefono", label: "Teléfono", anterior: antes.telefono, nuevo: despues.telefono });
      if (String(tipoClienteMovil(antes)) !== String(tipoClienteMovil(despues)))
        cambios.push({
          campo: "tipo",
          label: "Tipo",
          anterior: etiquetaTipoMovil(tipoClienteMovil(antes)),
          nuevo: etiquetaTipoMovil(tipoClienteMovil(despues)),
        });
      if (String(antes.montoPlan ?? "") !== String(despues.montoPlan ?? ""))
        cambios.push({ campo: "montoPlan", label: "Monto del plan", anterior: antes.montoPlan, nuevo: despues.montoPlan });
      if (String(fechaActivacionMovil(antes)) !== String(fechaActivacionMovil(despues)))
        cambios.push({
          campo: "fechaActivacion",
          label: "Fecha de activación",
          anterior: fechaActivacionMovil(antes),
          nuevo: fechaActivacionMovil(despues),
        });
      if (!!antes.esPortabilidad !== !!despues.esPortabilidad)
        cambios.push({
          campo: "esPortabilidad",
          label: "Es portabilidad",
          anterior: antes.esPortabilidad ? "sí" : "no",
          nuevo: despues.esPortabilidad ? "sí" : "no",
        });
      if ((antes.f1_estado === "pagada") !== (despues.f1_estado === "pagada"))
        cambios.push({
          campo: "f1_estado",
          label: "1ra factura",
          anterior: etiquetaEstadoFactura(antes.f1_estado),
          nuevo: etiquetaEstadoFactura(despues.f1_estado),
        });
      if (cambios.length > 0) {
        registrarCambio({ entidad: "convergencia", tipo: "editar", etiqueta: despues.nombre, antes, despues, cambios, refId: id });
      }
    }
  }

  function eliminarConvergencia(id) {
    const convergencia = convergencias.find((c) => c.id === id);
    setConvergencias((prev) => prev.filter((c) => c.id !== id));
    if (convergencia) {
      registrarCambio({ entidad: "convergencia", tipo: "eliminar", etiqueta: convergencia.nombre, antes: convergencia, cambios: [], refId: id });
    }
  }

  // Aplica un cambio a la lista de clientes, guardando el estado anterior
  // en el historial para poder deshacerlo.
  function actualizarClientes(updater) {
    setHistorial((h) => [...h, clientes].slice(-20));
    setClientes(updater);
  }

  function deshacerUltimaAccion() {
    setHistorial((h) => {
      if (h.length === 0) return h;
      const anterior = h[h.length - 1];
      setClientes(anterior);
      return h.slice(0, -1);
    });
  }

  // Registra una entrada en la bitácora de cambios.
  // entidad: "cliente" | "convergencia" | "meta" | "factura" | "config"
  // tipo: "crear" | "editar" | "eliminar" | "recuperar"
  // etiqueta: texto que identifica el registro afectado (nombre del cliente, mes de la meta, etc.)
  // antes/despues: snapshot completo para poder revertir. cambios: lista opcional ya calculada de {campo,label,anterior,nuevo}
  function registrarCambio({ entidad, tipo, etiqueta, antes, despues, cambios, refId }) {
    const listaCambios = cambios !== undefined ? cambios : entidad === "cliente" && tipo === "editar" ? diffCliente(antes, despues) : [];
    if (tipo === "editar" && listaCambios.length === 0) return; // nada realmente cambió
    const id = refId ?? (despues && despues.id) ?? (antes && antes.id) ?? null;
    setHistorialCambios((prev) =>
      [
        {
          id: uid(),
          entidad,
          tipo,
          etiqueta,
          refId: id,
          fecha: new Date().toISOString(),
          cambios: listaCambios,
          snapshotAntes: antes ?? null,
          snapshotDespues: despues ?? null,
          deshecho: false,
        },
        ...prev,
      ].slice(0, 400)
    );
  }

  // Revierte una entrada puntual de la bitácora (no depende de que sea la última acción).
  function deshacerCambio(entryId) {
    setHistorialCambios((prev) => {
      const entry = prev.find((h) => h.id === entryId);
      if (!entry || entry.deshecho) return prev;

      if (entry.entidad === "cliente") {
        if (entry.tipo === "crear") {
          actualizarClientes((cs) => cs.filter((c) => c.id !== entry.refId));
        } else if (entry.tipo === "eliminar") {
          if (entry.snapshotAntes) {
            actualizarClientes((cs) => (cs.some((c) => c.id === entry.refId) ? cs : [...cs, entry.snapshotAntes]));
          }
          setEliminados((els) => els.filter((c) => c.id !== entry.refId));
        } else if (entry.tipo === "editar") {
          if (entry.snapshotAntes) {
            actualizarClientes((cs) => cs.map((c) => (c.id === entry.refId ? entry.snapshotAntes : c)));
          }
        } else if (entry.tipo === "recuperar") {
          // Deshacer una recuperación = volver a eliminar ese cliente.
          const cliente = clientes.find((c) => c.id === entry.refId);
          actualizarClientes((cs) => cs.filter((c) => c.id !== entry.refId));
          if (cliente) setEliminados((els) => [...els, { ...cliente, eliminadoEn: new Date().toISOString() }]);
        }
      } else if (entry.entidad === "convergencia") {
        if (entry.tipo === "crear") {
          setConvergencias((prev2) => prev2.filter((c) => c.id !== entry.refId));
        } else if (entry.tipo === "eliminar") {
          if (entry.snapshotAntes) {
            setConvergencias((prev2) => (prev2.some((c) => c.id === entry.refId) ? prev2 : [...prev2, entry.snapshotAntes]));
          }
        } else if (entry.tipo === "editar") {
          if (entry.snapshotAntes) {
            setConvergencias((prev2) => prev2.map((c) => (c.id === entry.refId ? entry.snapshotAntes : c)));
          }
        }
      } else if (entry.entidad === "meta") {
        if (entry.snapshotAntes) {
          const { mes, campo, valor } = entry.snapshotAntes;
          setMetas((prev2) => {
            const actual = typeof prev2[mes] === "object" && prev2[mes] !== null ? prev2[mes] : {};
            return { ...prev2, [mes]: { ...actual, [campo]: valor } };
          });
        }
      } else if (entry.entidad === "factura") {
        if (entry.snapshotAntes) {
          actualizarClientes((cs) => cs.map((c) => (c.id === entry.refId ? entry.snapshotAntes : c)));
        }
      } else if (entry.entidad === "config") {
        if (entry.snapshotAntes && entry.snapshotAntes.campo === "umbralProrrateo") {
          setUmbralProrrateo(entry.snapshotAntes.valor);
        }
      }

      return prev.map((h) => (h.id === entryId ? { ...h, deshecho: true } : h));
    });
  }

  function handleSubmit(e) {
    e.preventDefault();
    const obligatorios = [
      form.numeroSuscriptor,
      form.nombre,
      form.telefono,
      form.cicloFacturacion,
      form.planTipo,
      form.velocidad,
      form.montoMensual,
    ];
    if (form.planTipo === "DOBLE") obligatorios.push(form.planTV);
    if (obligatorios.some((v) => !String(v ?? "").trim())) return;

    const otros = clientes.filter((c) => c.id !== editingId);
    const numSusc = form.numeroSuscriptor.trim();
    const nombreNorm = form.nombre.trim().toLowerCase();
    const telDigits = form.telefono.replace(/\D/g, "");
    const duplicado = otros.find(
      (c) =>
        (c.numeroSuscriptor || "").trim() === numSusc ||
        (c.nombre || "").trim().toLowerCase() === nombreNorm ||
        (c.telefono || "").replace(/\D/g, "") === telDigits
    );
    if (duplicado) {
      const campo =
        (duplicado.numeroSuscriptor || "").trim() === numSusc
          ? "número de suscriptor"
          : (duplicado.nombre || "").trim().toLowerCase() === nombreNorm
          ? "nombre"
          : "teléfono";
      const continuar = window.confirm(
        `Ya existe un cliente con el mismo ${campo}: ${duplicado.nombre} (suscriptor ${duplicado.numeroSuscriptor || "—"}).\n\n¿Quieres guardar este cliente de todas formas?`
      );
      if (!continuar) return;
    }

    if (editingId) {
      const antes = clientes.find((c) => c.id === editingId);
      const camposForm = camposEstadoCliente(form, antes);
      const despues = antes ? { ...antes, ...camposForm } : null;
      actualizarClientes((prev) => prev.map((c) => (c.id === editingId ? { ...c, ...camposForm } : c)));
      if (antes && despues) {
        registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: despues.nombre, antes, despues, refId: editingId });
      }
    } else {
      const nuevo = { id: uid(), ...camposEstadoCliente(form, null), creadoEn: new Date().toISOString() };
      actualizarClientes((prev) => [...prev, nuevo]);
      registrarCambio({ entidad: "cliente", tipo: "crear", etiqueta: nuevo.nombre, despues: nuevo, cambios: [], refId: nuevo.id });
    }
    resetForm();
    setTab(origenFormulario === "precierre" ? "precierre" : "clientes");
  }

  function startEdit(c) {
    setForm({
      nombre: c.nombre,
      numeroSuscriptor: c.numeroSuscriptor,
      telefono: c.telefono,
      cicloFacturacion: c.cicloFacturacion,
      planTipo: c.planTipo,
      velocidad: c.velocidad,
      planTV: c.planTV,
      montoMensual: c.montoMensual,
      fechaInstalacion: c.fechaInstalacion,
      fecha1raFactura: c.fecha1raFactura,
      monto1raFactura: c.monto1raFactura,
      estadoPago: c.estadoPago,
      estadoCliente: c.penalizado ? "penalizado" : c.cancelado ? "cancelado" : "activo",
      fechaCancelacion: c.fechaCancelacion || "",
      motivoCancelacion: c.motivoCancelacion || "",
      motivoPenalizacion: c.motivoPenalizacion || "",
      observaciones: c.observaciones,
    });
    setEditingId(c.id);
    setTab("nuevo");
  }

  function toggleMilestone(clienteId, key) {
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? { ...c, [key]: !c[key] } : c)));
  }

  function marcarFacturaPagada(clienteId, n) {
    const antes = clientes.find((c) => c.id === clienteId);
    actualizarClientes((prev) =>
      prev.map((c) =>
        c.id === clienteId
          ? { ...c, [`f${n}_d1`]: true, [`f${n}_t15`]: true, [`f${n}_t3`]: true, [`f${n}_estado`]: "pagada" }
          : c
      )
    );
    if (antes) {
      const despues = { ...antes, [`f${n}_d1`]: true, [`f${n}_t15`]: true, [`f${n}_t3`]: true, [`f${n}_estado`]: "pagada" };
      const anteriorLabel = etiquetaEstadoFactura(antes[`f${n}_estado`]);
      if (anteriorLabel !== "pagada") {
        registrarCambio({
          entidad: "factura",
          tipo: "editar",
          etiqueta: `Factura ${n} de ${antes.nombre}`,
          antes,
          despues,
          cambios: [{ campo: `f${n}_estado`, label: `Estado factura ${n}`, anterior: anteriorLabel, nuevo: "pagada" }],
          refId: clienteId,
        });
      }
    }
  }

  // Cambia el estado de pago de una factura puntual: "pagada" o "" (no pagada).
  // Al marcar como pagada, silencia sus 3 avisos; al desmarcar, los reactiva por si
  // corresponde que sigan recordándole al cliente.
  // Excepción, solo para la 1ra factura de clientes de prorrateo alto: con
  // opciones.parcial queda "pagada" (cuenta para la comisión) pero con saldo pendiente
  // (f1_saldoPendiente) y SUS AVISOS NO SE SILENCIAN, para seguir cobrando el saldo.
  // Cuando el cliente paga el saldo se vuelve a llamar sin parcial: ahí sí se silencian.
  function actualizarEstadoFactura(clienteId, n, nuevoEstado, opciones = {}) {
    const antes = clientes.find((c) => c.id === clienteId);
    // Al marcarla como pagada se anota sola el día y la hora (sin editar nada);
    // al desmarcarla, esa fecha se borra.
    const ahoraISO = new Date().toISOString();
    const parcial = nuevoEstado === "pagada" && n === 1 && !!(opciones && opciones.parcial);
    const marcarEnviado = nuevoEstado === "pagada" && !parcial;
    const aplicar = (c) => {
      const yaPagada = c[`f${n}_estado`] === "pagada" && c[`f${n}_pagadaEn`];
      const nuevo = {
        ...c,
        [`f${n}_estado`]: nuevoEstado,
        [`f${n}_pagadaEn`]: nuevoEstado === "pagada" ? (yaPagada ? c[`f${n}_pagadaEn`] : ahoraISO) : "",
        [`f${n}_d1`]: parcial ? !!c[`f${n}_d1`] : marcarEnviado,
        [`f${n}_t15`]: parcial ? !!c[`f${n}_t15`] : marcarEnviado,
        [`f${n}_t3`]: parcial ? !!c[`f${n}_t3`] : marcarEnviado,
      };
      if (n === 1) {
        nuevo.f1_saldoPendiente = parcial;
        // La 1ra factura pagada (parcial o completa) ya cubre lo que pedían los
        // mensajes de abono (bienvenida y recordatorio): dejan de salir.
        if (nuevoEstado === "pagada") {
          nuevo.aviso_toque1 = true;
          nuevo.aviso_toque2 = true;
        }
      }
      return nuevo;
    };
    actualizarClientes((prev) => prev.map((c) => (c.id === clienteId ? aplicar(c) : c)));
    if (antes) {
      const despues = aplicar(antes);
      const etiqueta = (c) =>
        n === 1 && c.f1_estado === "pagada" && c.f1_saldoPendiente ? "pagada (pago parcial)" : etiquetaEstadoFactura(c[`f${n}_estado`]);
      const anteriorLabel = etiqueta(antes);
      const nuevoLabel = etiqueta(despues);
      if (anteriorLabel !== nuevoLabel) {
        registrarCambio({
          entidad: "factura",
          tipo: "editar",
          etiqueta: `Factura ${n} de ${antes.nombre}`,
          antes,
          despues,
          cambios: [{ campo: `f${n}_estado`, label: `Estado factura ${n}`, anterior: anteriorLabel, nuevo: nuevoLabel }],
          refId: clienteId,
        });
      }
    }
  }

  function deleteClient(id) {
    const cliente = clientes.find((c) => c.id === id);
    actualizarClientes((prev) => prev.filter((c) => c.id !== id));
    if (cliente) {
      setEliminados((prev) => [...prev, { ...cliente, eliminadoEn: new Date().toISOString() }]);
      registrarCambio({ entidad: "cliente", tipo: "eliminar", etiqueta: cliente.nombre, antes: cliente, cambios: [], refId: id });
    }
    setConfirmDelete(null);
  }

  function cancelarCliente(id, fecha, motivo) {
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = { ...antes, cancelado: true, fechaCancelacion: fecha, motivoCancelacion: motivo };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: antes.nombre, antes, despues, refId: id });
  }

  // Marca o desmarca un cliente como penalizado (no cuenta para nada). Motivo opcional.
  function penalizarCliente(id, penalizado, motivo) {
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = penalizado
      ? { ...antes, penalizado: true, motivoPenalizacion: (motivo || "").trim(), fechaPenalizacion: fechaLocalISO(new Date()) }
      : { ...antes, penalizado: false, motivoPenalizacion: "", fechaPenalizacion: "" };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({
      entidad: "cliente",
      tipo: "editar",
      etiqueta: antes.nombre,
      antes,
      despues,
      cambios: [{ campo: "penalizado", label: "Penalizado", anterior: antes.penalizado ? "Sí" : "No", nuevo: penalizado ? "Sí" : "No" }],
      refId: id,
    });
  }

  function descancelarCliente(id) {
    const antes = clientes.find((c) => c.id === id);
    if (!antes) return;
    const despues = { ...antes, cancelado: false, fechaCancelacion: "", motivoCancelacion: "" };
    actualizarClientes((prev) => prev.map((c) => (c.id === id ? despues : c)));
    registrarCambio({ entidad: "cliente", tipo: "editar", etiqueta: antes.nombre, antes, despues, refId: id });
  }

  // Confirma un rescate del simulador del Dashboard: marca la 1ra factura de cada
  // cliente elegido como pagada (esto ya deja su propio registro en el Historial,
  // como cualquier factura marcada), y además guarda un resumen del rescate en sí
  // (cuánto se cubrió y cuánto subió tu comisión), para tener un
  // registro de si en general te ha convenido usar esto o no.
  function confirmarRescate(periodoKey, clientesSeleccionados, montoInvertido, ganancia) {
    clientesSeleccionados.forEach((c) => {
      // Lo que cubre el rescate es la mitad pendiente del primer mes: en un cliente de
      // prorrateo alto eso equivale a un PAGO PARCIAL (queda saldo de la factura por cobrar).
      const cliente = clientes.find((x) => x.id === c.id) || c;
      actualizarEstadoFactura(c.id, 1, "pagada", { parcial: esProrrateoAlto(cliente, umbralProrrateo) });
    });
    registrarCambio({
      entidad: "rescate",
      tipo: "rescate",
      etiqueta: `Pendientes regularizados en ${mesLabel(periodoKey)} (${clientesSeleccionados.length} cliente${clientesSeleccionados.length === 1 ? "" : "s"})`,
      despues: {
        periodo: periodoKey,
        clientes: clientesSeleccionados.map((c) => c.nombre).join(", "),
        monto: montoInvertido,
        ganancia,
      },
      cambios: [
        { campo: "monto", label: "Pendiente regularizado", anterior: "", nuevo: fmtMonto(montoInvertido) },
        { campo: "ganancia", label: "Impacto en comisión", anterior: "", nuevo: fmtMonto(ganancia) },
        { campo: "clientes", label: "Clientes", anterior: "", nuevo: clientesSeleccionados.map((c) => c.nombre).join(", ") },
      ],
      refId: uid(),
    });
  }

  function recuperarCliente(id) {
    const cliente = eliminados.find((c) => c.id === id);
    if (!cliente) return;
    setEliminados((prev) => prev.filter((c) => c.id !== id));
    const { eliminadoEn, ...resto } = cliente;
    actualizarClientes((prev) => [...prev, resto]);
    registrarCambio({ entidad: "cliente", tipo: "recuperar", etiqueta: resto.nombre, despues: resto, cambios: [], refId: id });
  }

  function exportarRespaldo() {

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importarRespaldo(e) {
    const file = e.target.files && e.target.files[0];

    const reader = new FileReader();

        const importados = JSON.parse(reader.result);

          return;

          const idsExistentes = new Set(prev.map((c) => c.id));

          alert(`Se importaron ${nuevos.length} cliente(s) nuevo(s) de ${importados.length} en el archivo.`);
          return [...prev, ...nuevos];
        });
      } catch (err) {
        alert("No se pudo leer el archivo. Verifica que sea un respaldo válido (.json).");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

// Colores de las barras según el ritmo. Solo azules y ámbar (nunca rojo/verde: se confunden
// con daltonismo) y siempre con un símbolo + palabra además del color.
function estiloBarra(valor, meta, proyectado) {
  if (meta && valor >= meta) return { fill: "#001E62", track: "#D6DEEF", texto: "#001E62", tag: null };
  if (proyectado == null || !meta) return { fill: "#0072CE", track: "#E3EDFA", texto: "#001E62", tag: null };
  const r = proyectado / meta;
  if (r >= 1) return { fill: "#0072CE", track: "#D6E8F8", texto: "#0072CE", tag: "✓ vas en camino" };
  if (r >= 0.8) return { fill: "#D97706", track: "#FCE9C6", texto: "#B45309", tag: "◐ vas cerca" };
  return { fill: "#92400E", track: "#F4D9B0", texto: "#92400E", tag: "⚠ vas lejos" };
}
function BarraMeta({ valor, meta, proyectado, formato }) {
  const fmt = formato || ((x) => x);
  const pct = meta ? (valor / meta) * 100 : 0;
  const e = estiloBarra(valor, meta, proyectado);
  const falta = meta - valor;
  return (
    <React.Fragment>
      <p className="text-sm mb-2" style={ { color: "#374151" } }>
        <span className="font-semibold">{fmt(valor)}</span> de <span className="font-semibold">{fmt(meta)}</span> ·{" "}
        {falta > 0 ? (
          <React.Fragment>faltan <span className="font-bold" style={ { color: e.texto } }>{fmt(falta)}</span></React.Fragment>
        ) : (
          <span className="font-bold" style={ { color: e.texto } }>{falta === 0 ? "✓ meta cumplida" : `✓ meta superada +${fmt(-falta)}`}</span>
        )}
      </p>
      <div className="w-full h-2.5 rounded-full" style={ { background: e.track } }>
        <div className="h-2.5 rounded-full" style={ { width: `${Math.min(100, pct)}%`, background: e.fill } } />
      </div>
      {e.tag && <div className="text-[11px] font-semibold mt-1.5" style={ { color: e.texto } }>{e.tag}</div>}
    </React.Fragment>
  );
}

function LineaProyeccion({ aunEsTemprano, texto, variant }) {

function SimuladorArpuModal({ arpuActual, clientesActuales, dineroActual, metaArpu, metaClientes, metaDinero, bonoFullTigo, onClose }) {
  const [filas, setFilas] = useState([{ id: uid(), cantidad: 1, precio: "" }]);

  function agregarFila() {
    setFilas((prev) => [...prev, { id: uid(), cantidad: 1, precio: "" }]);
  }
  function quitarFila(id) {
    setFilas((prev) => prev.filter((f) => f.id !== id));
  }

    setFilas((prev) => prev.map((f) => (f.id === id ? { ...f, [campo]: valor } : f)));
  }

  const clientesNuevos = filas.reduce((acc, f) => acc + (Number(f.cantidad) || 0), 0);
  const dineroNuevo = filas.reduce((acc, f) => acc + (Number(f.cantidad) || 0) * (Number(f.precio) || 0), 0);

  const dineroSim = dineroActual + dineroNuevo;

  const comisionActual = calcularComision({
    dineroDelPeriodo: dineroActual,
    metaDinero,
    arpuPeriodo: arpuActual,
    metaArpu,
    clientesInstalados: clientesActuales,
    metaClientes,
    bonoFullTigo,
  });
  const comisionSim = calcularComision({
    dineroDelPeriodo: dineroSim,
    metaDinero,
    arpuPeriodo: arpuSim,
    metaArpu,
    clientesInstalados: clientesSim,
    metaClientes,
    bonoFullTigo,
  });

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">

        <div className="flex flex-col gap-2 mb-3">

// Input de meta que solo confirma el cambio (y por lo tanto solo registra en la
// bitácora) al presionar Enter, salir del campo, o tocar el botón ✓ — no en cada
// tecla que se escribe, para no llenar el historial de cambios intermedios.
function MetaInput({ valor, onConfirmar, width, step }) {
  const [editando, setEditando] = useState(false);
  const [valorLocal, setValorLocal] = useState(valor ?? "");

  useEffect(() => {
    if (!editando) setValorLocal(valor ?? "");
  }, [valor, editando]);

  function confirmar() {
    setEditando(false);
    if (String(valorLocal) !== String(valor ?? "")) {
      onConfirmar(valorLocal);
    }
  }

  function cancelar() {
    setValorLocal(valor ?? "");
    setEditando(false);
  }

  const hayCambioPendiente = editando && String(valorLocal) !== String(valor ?? "");

  return (
    <div className="flex items-center gap-1">
      <input
        type="number"
        min="0"
        step={step}
        value={valorLocal}
        onFocus={() => setEditando(true)}
        onChange={(e) => setValorLocal(e.target.value)}
        onBlur={confirmar}
        onKeyDown={(e) => {
          if (e.key === "Enter") e.currentTarget.blur();
          if (e.key === "Escape") { cancelar(); e.currentTarget.blur(); }
        } }
        placeholder="0"
        className={`${width || "w-20"} px-2 py-1 rounded-md border text-sm outline-none`}
        style={ { borderColor: hayCambioPendiente ? "#0072CE" : "#D1D5DB" } }
      />
      {hayCambioPendiente && (
        <button
          type="button"
          onMouseDown={(e) => e.preventDefault()}
          onClick={confirmar}
          title="Confirmar cambio"
          className="text-xs px-1.5 py-1 rounded-md text-white leading-none"
          style={ { background: "#0F766E" } }
        >
          ✓
        </button>
      )}
    </div>
  );
}
