<style>
  body { margin: 0; }
  body, button, input, select, textarea, .font-sans { font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* ===== Estilo nuevo (etapa 2): tarjetas, botones y campos ===== */
  .rounded-lg { border-radius: 16px !important; }
  .rounded-md { border-radius: 12px !important; }
  .rounded-xl { border-radius: 18px !important; }
  button.rounded-md { min-height: 36px; font-weight: 600; }
  button.rounded-md.text-sm { min-height: 44px; }
  input:not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px; }
  input:not([type=checkbox]):not([type=radio]):not(.text-xs).rounded-md,
  select:not(.text-xs).rounded-md, textarea.rounded-md { padding-top: 11px; padding-bottom: 11px; border-width: 2px; }
  input.text-xs.rounded-md, select.text-xs.rounded-md { padding-top: 8px; padding-bottom: 8px; border-width: 2px; }
  .h-2\.5.rounded-full:not(.w-2\.5) { height: 12px; }
  .acciones-orden > * { flex: 1 1 auto; min-height: 42px; font-size: 13px !important; font-weight: 600; padding: 0 14px !important; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; }
  /* ===== Barra de opciones (celular y computadora) ===== */
  /* ===== Animaciones sutiles (se apagan si el teléfono tiene "Reducir movimiento") ===== */
  @keyframes mfAbrir { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes mfSube { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes mfFondo { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mfFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mfLatido { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: no-preference) {
    button, [role="button"], a { transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .12s ease, opacity .18s ease; }
    button:not(:disabled):active, [role="button"]:active, a[href]:active { transform: scale(.97); }
    .mf-abrir { animation: mfAbrir .2s ease-out; }
    .mf-fade { animation: mfFade .18s ease-out; }
    .mf-fade-tab { animation: mfFade .22s ease-out; }
    .mf-aviso { animation: mfSube .25s ease-out; }
    .mf-badge { animation: mfLatido .45s ease-out; }
    .fixed.inset-0 { animation: mfFondo .2s ease-out; }
    .fixed.inset-0 > div { animation: mfSube .25s cubic-bezier(.2,.8,.2,1); }
    div[style*="width"][style*="%"] { transition: width .6s ease; }
    .mf-sale { opacity: 0 !important; transform: translateX(28px); transition: opacity .2s ease, transform .2s ease !important; pointer-events: none; }
  }
  /* Pantalla de inicio */
  .mf-splash { position: fixed; inset: 0; z-index: 9999; background: #001E62; display: flex; align-items: center; justify-content: center; transition: opacity .35s ease-in; }
  .mf-splash-sale { opacity: 0; pointer-events: none; }
  .mf-splash-logo { width: 84px; height: 84px; border-radius: 50%; background: #fff; color: #001E62; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; }
  @keyframes mfLate { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { transform: scale(1.12); box-shadow: 0 0 0 14px rgba(255,255,255,.12); } }
  @media (prefers-reduced-motion: no-preference) { .mf-splash-logo { animation: mfLate .55s ease-in-out 2; } }
  /* Espacio entre tarjetas ajustable (Configuración): escala los márgenes de abajo según --mf-gap. */
  .mf-esp .mb-3 { margin-bottom: calc(var(--mf-gap, 16px) * 0.75) !important; }
  .mf-esp .mb-4 { margin-bottom: var(--mf-gap, 16px) !important; }
  .mf-esp .mb-5 { margin-bottom: calc(var(--mf-gap, 16px) * 1.25) !important; }
  .mf-esp .mb-6 { margin-bottom: calc(var(--mf-gap, 16px) * 1.5) !important; }
  .mf-nav { transition: transform .25s ease; }
  .mf-nav.mf-nav-oculta { transform: translateY(calc(100% + 34px)); }
  @keyframes mfSlideDer { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes mfSlideIzq { from { transform: translateX(-32px); opacity: 0; } to { transform: none; opacity: 1; } }
  .mf-slide-der { animation: mfSlideDer .22s ease-out; }
  .mf-slide-izq { animation: mfSlideIzq .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { .mf-slide-der, .mf-slide-izq { animation: none; } }
  .mf-nav { position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); height: 54px; background: #001E62; border-radius: 27px; box-shadow: 0 8px 20px rgba(0,30,98,0.35); padding: 0 6px; align-items: center; justify-content: space-around; }
  .mf-tab { flex: 1; display: flex; align-items: center; justify-content: center; color: #A9B8D6; font-weight: 500; background: none; border: 0; padding: 0; height: 54px; -webkit-tap-highlight-color: transparent; }
  .mf-tab.on { color: #FFFFFF; font-weight: 700; }
  .mf-tab-ico { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 44px; padding: 0 10px; border-radius: 19px; transition: background .2s; }
  .mf-tab.on .mf-tab-ico { background: rgba(255,255,255,0.18); padding: 0 14px; }
  .mf-tab:active .mf-tab-ico { background: rgba(255,255,255,0.1); }
  .mf-tab-lbl { font-size: 13px; }
  .mf-badge { position: absolute; top: -5px; right: 5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #B45309; color: #fff; border: 2px solid #FFF3DC; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .mf-fab { transition: bottom .25s, opacity .2s, transform .12s; }
  @media (orientation: landscape) { .mf-nav, .mf-fab, .mf-aviso { transition: none; } }
  .mf-fab:active { transform: scale(0.94); }
  .mf-aviso { transition: bottom .25s; background: #FFF3DC; color: #B45309; border: 1px solid #F0D9AE; border-radius: 12px; padding: 9px 12px; font-size: 13px; font-weight: 600; }
  .mf-fila { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; font-size: 15px; color: #A9B8D6; font-weight: 500; padding: 0 12px; height: 52px; border-radius: 14px; text-align: left; }
  .mf-fila.on { background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; }
  .mf-fila:active { background: rgba(255,255,255,0.1); }
  .mf-side-it { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: none; font-size: 14px; color: #A9B8D6; font-weight: 500; height: 42px; padding: 0 12px; border-radius: 12px; text-align: left; transition: background .2s; }
  .mf-side-it.on { background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; }
  .mf-side-it:hover { background: rgba(255,255,255,0.08); }
  .mf-side-it.on:hover { background: rgba(255,255,255,0.14); }
</style>
</head>

<script>
  function mostrarErrorEnPantalla(msg) {
    var box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.textContent = '⚠️ Error al cargar la app:\n\n' + msg + '\n\nToma captura de pantalla de esto y envíasela a Claude.';
  }
  window.addEventListener('error', function (e) {
    mostrarErrorEnPantalla((e.message || 'Error desconocido') + '\nArchivo: ' + (e.filename || '?') + '\nLínea: ' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    mostrarErrorEnPantalla('Promesa no manejada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
